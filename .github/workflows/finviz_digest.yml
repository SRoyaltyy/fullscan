name: Finviz Daily Digest

# Pulls AI Daily Digest column from latest Finviz export + live index
# narratives (SPY/QQQ/DIA/IWM). Feeds news_judge and predictors so
# elevated themes actually reach B1 / sector S1 instead of raw noise.

on:
  schedule:
    # Just before news_parse slots (those fire at :15 past 10/12/14 UTC)
    - cron: "5 10,12 * * 1-5"
  workflow_dispatch:
    inputs:
      run_date:
        description: "YYYY-MM-DD (default: today ET)"
        required: false
        default: ""
      skip_scrape:
        description: "true = export only, skip live index quote scrape"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: finviz-digest
  cancel-in-progress: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install beautifulsoup4 lxml pandas requests || true
      - name: Skip if past 09:25 ET
        if: github.event_name == 'schedule'
        run: |
          ET_HM=$((10#$(TZ=America/New_York date +%H%M)))
          echo "ET_HM=$ET_HM"
          if [ "$ET_HM" -ge 925 ]; then
            echo "past 09:25 ET — skip finviz_digest"
            echo "skip=yes" >> "$GITHUB_ENV"
          fi
      - name: Run Finviz Daily Digest
        if: env.skip != 'yes'
        env:
          FINVIZ_AUTH: ${{ secrets.FINVIZ_AUTH }}
          AUTH_TOKEN_FINVIZ: ${{ secrets.AUTH_TOKEN_FINVIZ }}
        run: |
          set -e
          DATE="${{ github.event.inputs.run_date }}"
          SKIP="${{ github.event.inputs.skip_scrape }}"
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ "$SKIP" = "true" ] && ARGS+=(--skip-scrape)
          python -m src.finviz_digest "${ARGS[@]}"
      - name: Preview
        if: always()
        run: |
          ls -la 01_daily/news/*finviz* 2>/dev/null || true
          latest=$(ls -1t 01_daily/news/*_finviz_digest.md 2>/dev/null | head -1)
          if [ -n "$latest" ]; then
            echo "===== $latest ====="
            head -80 "$latest"
          fi
      - name: Commit
        if: env.skip != 'yes'
        run: |
          bash scripts/safe_git_push.sh "auto: finviz daily digest" 01_daily/news/
