name: OpenClaw OAuth renew + gateway guard

# Keeps OpenClaw on the SuperGrok OAuth login (no XAI_API_KEY, no paid
# inference) and proves the gateway answers a real completion before the
# 05:55 ET Pre-Open. A dead refresh prints a device URL. James
# auto-clicks Allow. Do not DM Cyrus and do not send him the code.
on:
  push:
    branches: [main]
    paths:
      - scripts/openclaw_oauth_guard.py
      - scripts/install_openclaw_oauth_timer.sh
      - scripts/systemd/fullscan-openclaw-oauth.service
      - scripts/systemd/fullscan-openclaw-oauth.timer
  schedule:
    # Do not use 09:40 UTC. That held the only ECS runner at 05:40 ET,
    # fifteen minutes before Pre-Open, and collided with the finviz scrape.
    # 01:10 UTC = 21:10 ET, an hour after the 20:10 ET systemd slot.
    # 08:40 UTC = 04:40 ET, after the 04:10 ET systemd renew and the
    # 04:30 ET canary, and well before the 05:55 Pre-Open.
    # xAI tokens last about 6 hours. Do not share a minute with those timers.
    - cron: "10 1 * * 1-5"
    - cron: "40 8 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "renew | guard | all"
        default: "all"
        type: choice
        options: [all, renew, guard]

permissions:
  contents: write

concurrency:
  group: openclaw-oauth-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: [self-hosted, ecs]
    timeout-minutes: 25
    steps:
      # Shallow fetch + its own timeout so a stalled checkout fails fast
      # (renew 38880024469 hung at checkout on 2026-10-16).
      - name: Clear stale git index.lock (shared ECS workspace)
        shell: bash
        run: |
          # A job killed mid-checkout leaves .git/index.lock; the next checkout then hangs.
          # One ECS runner, so a lock older than 1 minute before checkout is stale.
          W="${GITHUB_WORKSPACE:-.}"
          for L in "$W/.git/index.lock" "$W/.git/shallow.lock" "$W/.git/HEAD.lock"; do
            if [ -n "$(find "$L" -mmin +1 2>/dev/null)" ]; then echo "removing stale $L"; rm -f "$L" || sudo -n rm -f "$L" || true; fi
          done
          if [ "$(git -C "$W" config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::shared ECS workspace is sparse; this checkout re-materializes the full tree"
          fi
      # 2026-10-20: the full checkout of 26.8k files on the shared ECS
      # workspace timed out at 37% (run 39377458959), so the renew never ran.
      # Check out only what this job runs/reads/writes into its own nested
      # directory, so the shared workspace is never made sparse for other
      # jobs, and delete it at the end. A fresh nested clone each run means
      # no stale token origin URL and no missing origin/main (#644 issue).
      - name: Remove leftover guard checkout
        shell: bash
        run: rm -rf "${GITHUB_WORKSPACE}/_oauth_guard_ws" || sudo -n rm -rf "${GITHUB_WORKSPACE}/_oauth_guard_ws" || true
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: main
          path: _oauth_guard_ws
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/openclaw_oauth_guard.py
            /scripts/enable_openclaw_chat.sh
            /scripts/install_openclaw_oauth_timer.sh
            /scripts/systemd/fullscan-openclaw-oauth.service
            /scripts/systemd/fullscan-openclaw-oauth.timer
            /scripts/safe_git_push.sh
            /src/__init__.py
            /src/workflow_progress.py
            /01_daily/_openclaw_oauth_status.json
            /01_daily/_progress/
      - name: Sparse tree has the guard path
        working-directory: _oauth_guard_ws
        run: |
          miss=0
          for f in scripts/openclaw_oauth_guard.py scripts/enable_openclaw_chat.sh \
                   scripts/install_openclaw_oauth_timer.sh \
                   scripts/systemd/fullscan-openclaw-oauth.service \
                   scripts/systemd/fullscan-openclaw-oauth.timer \
                   scripts/safe_git_push.sh src/__init__.py src/workflow_progress.py; do
            test -f "$f" || { echo "::error::sparse checkout missing $f"; miss=1; }
          done
          exit $miss
      - name: Install / refresh ECS timer (fullscan-openclaw-oauth.timer)
        working-directory: _oauth_guard_ws
        run: sudo -n bash scripts/install_openclaw_oauth_timer.sh
      - name: Last ECS timer result (red if it failed)
        run: |
          f=/home/gha/fullscan-logs/openclaw_guard_status.json
          if [ ! -f "$f" ]; then echo "no prior timer run yet"; exit 0; fi
          cat "$f"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if d.get("ok") else "last ECS OAuth/guard run FAILED: %s %s" % (d.get("renew"), d.get("guard")))' "$f" \
            || echo "::warning::previous ECS timer run failed; this run re-checks"
      - name: Renew xAI OAuth + guard gateway (fails red)
        working-directory: _oauth_guard_ws
        env:
          FULLSCAN_HOME: /home/gha
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          DATE=$(TZ=America/New_York date +%F)
          python3 -m src.workflow_progress beat --workflow oauth_guard --date "$DATE" --stages renew,guard --stage "$MODE" >> /tmp/progress_beat.log 2>&1 &
          echo $! > /tmp/progress_beat.pid
          trap 'kill "$(cat /tmp/progress_beat.pid)" 2>/dev/null || true' EXIT
          sudo -n env -u XAI_API_KEY FULLSCAN_HOME=/home/gha \
            python3 scripts/openclaw_oauth_guard.py "$MODE"
          python3 -m src.workflow_progress touch --workflow oauth_guard --date "$DATE" --stage "$MODE" --state ok || true
      - name: Publish OAuth status (no tokens)
        working-directory: _oauth_guard_ws
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULLSCAN_PUSH_TOKEN: ${{ secrets.FULLSCAN_PUSH_TOKEN }}
        run: |
          f=/home/gha/fullscan-logs/openclaw_guard_status.json
          mkdir -p 01_daily
          if [ ! -f "$f" ]; then
            echo "no status file to publish"
            exit 0
          fi
          python3 - "$f" 01_daily/_openclaw_oauth_status.json <<'PY'
          import json, sys
          src, dst = sys.argv[1], sys.argv[2]
          d = json.load(open(src, encoding="utf-8"))
          drop = []
          for k, v in d.items():
              lk = k.lower()
              if lk in ("gateway_token_len", "has_refresh_token"):
                  continue
              if any(w in lk for w in ("token", "secret", "user_code", "password", "authorization")):
                  drop.append(k)
              if isinstance(v, str) and len(v) > 80 and " " not in v:
                  drop.append(k)
          for k in drop:
              d.pop(k, None)
          with open(dst, "w", encoding="utf-8") as fh:
              json.dump(d, fh, indent=2)
              fh.write("\n")
          PY
          bash scripts/safe_git_push.sh \
            "auto: openclaw oauth status" \
            01_daily/_openclaw_oauth_status.json \
            || echo "[oauth-guard] status push failed — local file still on the box"
      - name: Remove guard checkout
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}/_oauth_guard_ws" || sudo -n rm -rf "${GITHUB_WORKSPACE}/_oauth_guard_ws" || true
