name: Staleness canary

# 15:15 UTC weekdays is 10:15 ET during EST and 11:15 ET during EDT, after
# the 09:20 tickets deadline and the 10:00 open_fill deadline.
# 22:00 UTC is the end-of-day pass. Each source's newest date on main and,
# when the source is published, on the live Pages site is compared with
# the session it is due for. Lag 0 except webull_sim days.jsonl and
# jev-train days.json (lag 1). Clock rows are src/staleness_coverage.json
# (h1 and holdup open_fill by 10:00 ET, dated tickets by 09:20 ET).
# Writes data/health/staleness.json and fails when any source is over.
# Read-only. It does not rewrite a ledger or a sealed ticket.

on:
  schedule:
    - cron: "15 15 * * 1-5"
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staleness-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare main and Pages with the latest session
        run: python3 -m src.staleness_canary
      - name: Upload staleness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staleness
          path: data/health/staleness.json
          if-no-files-found: warn
