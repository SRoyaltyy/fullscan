name: buy-sell day audit

# Every trading day, fingerprint sealed buy/sell lists (names, sides,
# sizes, dates) for live fullscan strategies and fail if a past day moved
# versus its first-seal baseline.
#
# Cron is after the US cash close and the Deploy dashboard window
# (deploy-dashboard follows Stock Book / tickets / Factor mine).
# workflow_dispatch session_date is printed as a focus day; every sealed
# day is still checked.
#
# RED means a line starting with DRIFT or NEW:
#   DRIFT <family> <name> <date>: buy/sell fingerprint moved
#     — that strategy's sealed buys/sells are not the first seal.
#       The baseline file is not updated. Do not edit the sealed record
#       to make the job green.
#   DRIFT strategy_tickets <date>: sealed file hash moved
#     — data/day_board/<date>_strategy_tickets.json no longer matches
#       data/past_day_lock.
#   NEW <family> <name> <date>: no first-seal baseline
#     — a newly sealed day. Append it with
#       python3 -m src.buy_sell_audit --seed
#       which refuses to rewrite any existing line.
# MISSING / SKIP lines are gaps in this repo. They do not fail the job.
# Equity marks and sit notes are outside the fingerprint.
# Theme Radar research shorts are checked by a checkout of
# SRoyaltyy/theme-radar main (runner temp only; not committed here) and
#   python research/shadow_log/shadow_log_lock.py audit --json -
# Exit 0 prints PASS theme_radar_research_shorts. Any other exit prints
#   DRIFT theme_radar_research_shorts: FAIL ...
# and fails the job. The checkout is a full clone: that audit exits
# non-zero when git reports a shallow repository.
# How to read a red run: docs/buy_sell_audit.md

on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
    inputs:
      session_date:
        description: "YYYY-MM-DD focus day (empty = all sealed days; all are still checked)"
        required: false
        default: ""
  pull_request:
    paths:
      - "src/buy_sell_audit.py"
      - "src/test_buy_sell_audit.py"
      - ".github/workflows/buy_sell_audit.yml"
      - "docs/buy_sell_audit.md"
      - "data/buy_sell_audit/**"
      - "data/strategy_status/**"
      - "data/day_board/**"
      - "data/past_day_lock/**"
      - "data/webull_sim/days.jsonl"
      - "data/factor_mine/preopen/seals/**"
      - "research/hot_n4_clean_v4/forward_h1/h1_log.jsonl"
      - "research/hot_n4_clean_v4/forward/holdup_log.jsonl"
      - "excel_bot/freeze_manifest.json"
      - "dashboard/h1/log.json"
      - "dashboard/holdup/log.json"
      - "dashboard/factor-mine/preopen.json"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch main for the append-only baseline check
        run: git fetch --depth=1 --no-tags origin main
      - name: Buy/sell audit tests
        run: python3 -m src.test_buy_sell_audit
      - name: Record first-seal baselines for newly sealed days (add-only)
        # Before 10-18 this was a manual `--seed` step; nobody ran it after
        # 10-17, so every later sealed day showed NEW and the job went red.
        # seed() only appends missing strategy-days and refuses (exit 1) to
        # rewrite any existing first seal. Never runs on pull requests.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python3 -m src.buy_sell_audit --seed
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          bash scripts/safe_git_push.sh \
            "chore: buy-sell audit first-seal baselines (add-only)" \
            data/buy_sell_audit/baselines.jsonl
      - name: Checkout Theme Radar main
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/theme-radar"
          # Anonymous clone. This repo's GITHUB_TOKEN cannot read theme-radar.
          # Full history: audit --json exits non-zero on a shallow repository.
          if ! git \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            clone --branch main \
            https://github.com/SRoyaltyy/theme-radar.git \
            "$RUNNER_TEMP/theme-radar"
          then
            echo "DRIFT theme_radar_research_shorts: FAIL could not checkout SRoyaltyy/theme-radar main"
            echo "::error::DRIFT theme_radar_research_shorts: FAIL could not checkout SRoyaltyy/theme-radar main"
            exit 1
          fi
      - name: Buy/sell fingerprint audit
        env:
          SESSION_DATE: ${{ github.event.inputs.session_date }}
        run: |
          python3 -m src.buy_sell_audit --check --check-against origin/main \
            --theme-radar "$RUNNER_TEMP/theme-radar" \
            ${SESSION_DATE:+--date "$SESSION_DATE"}
