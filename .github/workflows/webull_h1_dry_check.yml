name: Webull h1 send dry check (no orders)

# Proves the sealed-h1 send path without placing anything: same secrets and
# same plan_hot4_for_broker as webull_paper.yml, but it never calls
# paper_open, release, place or cancel, and it writes nothing to the repo.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "sealed h1 date (blank = latest sealed plan)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  dry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install webull-openapi-python-sdk pandas numpy pyarrow yfinance requests
      - name: Dry check (no orders)
        env:
          WEBULL_APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
          WEBULL_ACCOUNT_ID: ${{ secrets.WEBULL_ACCOUNT_ID }}
          DRY_DATE: ${{ inputs.date }}
        run: python scripts/webull_h1_dry_check.py ${DRY_DATE:+"$DRY_DATE"}
