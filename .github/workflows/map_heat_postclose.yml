name: Map Heat Captain Research (post-close)

# Heavy research is intentionally outside the pre-open critical path.
# Grok is primary; DeepSeek + web-search is the automatic fallback when
# Grok is unavailable, rate-limited, or out of credits.
# One sector-batched pass researches every liquid SPX/RUT industry captain
# for the NEXT session.
#
# ONE automatic start: this file's nightly cron. Orchestrator must not
# re-dispatch it. Extra workflow_dispatch jobs cancel the older one.
# ECS systemd timer is the same work; this job backs off if that service
# is already active.
#
# Skip-if-good keys off the LAST CLOSED ET session, not calendar today.
# A GH cron that drifts past midnight ET must not start the following
# night's research.
#
# ECS never scrapes Elite HTML (Aliyun 403). Clone today's GH-hosted heat.

on:
  # Clock retired 2026-09-04 — Post-Close ALL owns captain research.
  # ECS 22:00 timer now runs src.run_postclose_all (skip-if-good).
  # schedule:
  #   - cron: "0 2 * * 2-6"
  workflow_dispatch:
    inputs:
      runner:
        description: "ecs (OpenClaw) or ubuntu (GitHub-hosted). ubuntu cannot reach Grok."
        required: false
        default: "ecs"
        type: choice
        options:
          - ecs
          - ubuntu
      source_date:
        description: "Completed session YYYY-MM-DD (default last closed ET session)"
        required: false
        default: ""
      target_date:
        description: "Next session YYYY-MM-DD (default next weekday)"
        required: false
        default: ""
      force:
        description: "Rebuild existing baseline"
        required: false
        default: "false"

permissions:
  contents: write
  actions: read

concurrency:
  group: map-heat-postclose
  cancel-in-progress: false

jobs:
  research:
    runs-on: ${{ github.event.inputs.runner == 'ubuntu' && 'ubuntu-latest' || fromJSON('["self-hosted","ecs"]') }}
    timeout-minutes: 360
    env:
      OPENCLAW_TIMEOUT: "10800"
      MAP_POSTCLOSE_LOCK: /home/gha/fullscan-persist/locks/map-postclose.lock
      GROK_ONLY: "0"
      FINVIZ_SKIP_LIVE: "1"
      PYTHONUNBUFFERED: "1"
      HOME: /home/gha
      FULLSCAN_HOME: /home/gha
    steps:
      - name: Back off if ECS systemd research owns the box
        run: |
          set +e
          echo "uid=$(id -u) user=$(id -un)"
          if command -v systemctl >/dev/null 2>&1 \
             && systemctl is-active --quiet fullscan-map-postclose.service; then
            echo "systemd fullscan-map-postclose.service is active — GH backs off"
            echo "skip=yes" >> "$GITHUB_ENV"
            exit 0
          fi
          if command -v systemctl >/dev/null 2>&1 \
             && systemctl is-active --quiet fullscan-preopen.service; then
            echo "systemd fullscan-preopen.service is active — will not collide"
            echo "skip=yes" >> "$GITHUB_ENV"
            exit 0
          fi
          exit 0
      - uses: actions/checkout@v4
        if: env.skip != 'yes'
        with:
          clean: false
      - name: Skip if last-closed baseline already on disk
        if: env.skip != 'yes' && github.event.inputs.force != 'true'
        run: |
          set -euo pipefail
          SOURCE="${{ github.event.inputs.source_date }}"
          ET_HM=$((10#$(TZ=America/New_York date +%H%M)))
          echo "et_hm=$ET_HM event=${{ github.event_name }} source_in=${SOURCE:-<last-closed>}"
          ARGS=(--job map_heat_postclose)
          [ -n "$SOURCE" ] && ARGS+=(--date "$SOURCE")
          if python3 -m src.skip_if_good "${ARGS[@]}"; then
            echo "baseline already on disk — no Grok"
            echo "skip=yes" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@v5
        if: env.skip != 'yes'
        with:
          python-version: "3.10"
      - name: Install
        if: env.skip != 'yes'
        run: pip install -r requirements.txt
      - name: Ensure OpenClaw chat classroom is open
        if: env.skip != 'yes'
        env:
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
        run: bash scripts/enable_openclaw_chat.sh
      - name: Build next-session tables and exhaustive captain baseline
        if: env.skip != 'yes'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          GROK_ONLY: "0"
          FINVIZ_SKIP_LIVE: "1"
          SOURCE: ${{ github.event.inputs.source_date }}
          TARGET: ${{ github.event.inputs.target_date }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -uo pipefail
          ET_HM=$((10#$(TZ=America/New_York date +%H%M)))
          echo "et_hm=$ET_HM uid=$(id -u) user=$(id -un)"
          if command -v systemctl >/dev/null 2>&1 \
             && systemctl is-active --quiet fullscan-preopen.service; then
            echo "preopen service active — backing off"
            exit 0
          fi
          LOCK="${MAP_POSTCLOSE_LOCK}"
          mkdir -p "$(dirname "$LOCK")" || true
          if exec 9>"$LOCK"; then
            chmod 0666 "$LOCK" 2>/dev/null || true
            if ! flock -n 9; then
              echo "persist lock held — backing off"
              exit 0
            fi
          else
            echo "WARN: cannot open $LOCK — running without flock"
          fi
          if [ -z "${SOURCE:-}" ]; then
            SOURCE=$(python -c "from src.skip_if_good import last_closed_session; print(last_closed_session())")
          fi
          if [ -z "${TARGET:-}" ]; then
            TARGET=$(python -c "from src.map_heat_postclose import next_weekday; print(next_weekday('$SOURCE'))")
          fi
          echo "source=$SOURCE target=$TARGET FORCE=$FORCE OPENCLAW_TIMEOUT=$OPENCLAW_TIMEOUT"
          set -e
          echo "=== clone GH-hosted map_heat (ECS never scrapes Elite HTML) ==="
          export FINVIZ_SKIP_LIVE=1
          if [ -s "01_daily/map_heat/${SOURCE}_map_heat.json" ]; then
            echo "cloning $SOURCE map_heat → $TARGET"
            cp -f "01_daily/map_heat/${SOURCE}_map_heat.json" "01_daily/map_heat/${TARGET}_map_heat.json" || true
            cp -f "01_daily/map_heat/${SOURCE}_map_heat.md" "01_daily/map_heat/${TARGET}_map_heat.md" || true
          elif [ ! -s "01_daily/map_heat/${TARGET}_map_heat.json" ]; then
            echo "WARN: no $SOURCE heat to clone and $TARGET missing"
          fi
          echo "=== Grok captain research ==="
          ARGS=(--source-date "$SOURCE" --target-date "$TARGET")
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          python -u -m src.map_heat_postclose "${ARGS[@]}"
          PERSIST="${FULLSCAN_PERSIST:-/home/gha/fullscan-persist}"
          mkdir -p "$PERSIST/01_daily/map_heat" "$PERSIST/01_daily/_transcripts"
          cp -a 01_daily/map_heat/. "$PERSIST/01_daily/map_heat/" 2>/dev/null || true
          cp -a 01_daily/_transcripts/. "$PERSIST/01_daily/_transcripts/" 2>/dev/null || true

      - name: Commit baseline
        if: always() && env.skip != 'yes'
        run: |
          bash scripts/safe_git_push.sh \
            "auto: post-close captain research [$(date -u +%F_%H%M)]" \
            01_daily/map_heat/ 01_daily/_transcripts/
