name: past-day lock

# Fails the run when a sealed past day changes.
# Does not call OpenClaw or Grok. Stays on GitHub-hosted runners.

on:
  pull_request:
    paths:
      - "src/past_day_lock.py"
      - "src/test_past_day_lock.py"
      - "src/sleeve_merge_live.py"
      - "src/strategy_tickets.py"
      - "src/paper_trade.py"
      - "src/paper_trade_append.py"
      - "src/factor_mine_book.py"
      - "src/factor_mine.py"
      - "src/factor_mine_past_lock.py"
      - "src/test_factor_mine_past_lock.py"
      - "src/factor_mine_preopen.py"
      - "src/test_factor_mine_preopen.py"
      - "src/ohlc_ripper.py"
      - "src/gainer_capture.py"
      - "src/gainer_asof.py"
      - "src/ticker_lookback.py"
      - "src/test_v4_engine_pins.py"
      - "00_grounding/futubull_fees.json"
      - "research/hot_n4_clean_v4/protocol.py"
      - ".github/workflows/factor_mine.yml"
      - "01_daily/*_flatten_card.md"
      - "data/day_board/*_strategy_tickets.json"
      - "data/paper/trades.csv"
      - "data/paper/roundtrips.csv"
      - "data/paper/skipped.csv"
      - "data/paper/equity_curve.csv"
      - "data/sleeve_merge/trades.csv"
      - "data/sleeve_merge/skipped.csv"
      - "data/sleeve_merge/equity_curve.csv"
      - "03_scoreboard/factor_mine/**"
      - "data/past_day_lock/**"
      - ".github/workflows/past_day_lock.yml"
  push:
    branches: [main]
    paths:
      - "src/past_day_lock.py"
      - "src/test_past_day_lock.py"
      - "src/sleeve_merge_live.py"
      - "src/strategy_tickets.py"
      - "src/paper_trade.py"
      - "src/paper_trade_append.py"
      - "src/factor_mine_book.py"
      - "src/factor_mine.py"
      - "src/factor_mine_past_lock.py"
      - "src/test_factor_mine_past_lock.py"
      - "src/factor_mine_preopen.py"
      - "src/test_factor_mine_preopen.py"
      - "src/ohlc_ripper.py"
      - "src/gainer_capture.py"
      - "src/gainer_asof.py"
      - "src/ticker_lookback.py"
      - "src/test_v4_engine_pins.py"
      - "00_grounding/futubull_fees.json"
      - "research/hot_n4_clean_v4/protocol.py"
      - ".github/workflows/factor_mine.yml"
      - "01_daily/*_flatten_card.md"
      - "data/day_board/*_strategy_tickets.json"
      - "data/paper/trades.csv"
      - "data/paper/roundtrips.csv"
      - "data/paper/skipped.csv"
      - "data/paper/equity_curve.csv"
      - "data/sleeve_merge/trades.csv"
      - "data/sleeve_merge/skipped.csv"
      - "data/sleeve_merge/equity_curve.csv"
      - "03_scoreboard/factor_mine/**"
      - "data/past_day_lock/**"
      - ".github/workflows/past_day_lock.yml"

permissions:
  contents: read

# Serialize same-workflow writers of data/factor_mine / data/past_day_lock
# (10-12 overlap incident). Queue, never cancel a land mid-flight.
concurrency:
  group: past-day-lock-writer
  cancel-in-progress: false

jobs:
  append-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 2026-11-04: fetch-depth 0 of the full pack (~16 GB of blobs) filled
      # the runner during checkout ("No space left on device") before
      # check_against ran. Free the unused toolchains, then a blobless
      # clone. git show origin/main:<manifest> still fetches that blob,
      # and check_manifest still hashes every sealed file in the tree.
      - name: Free runner disk (github-hosted only)
        if: runner.environment == 'github-hosted'
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the base branch
        run: git fetch --no-tags --filter=blob:none origin main
      - name: Past-day lock
        run: |
          python3 -m src.past_day_lock --check-against origin/main
          python3 -m src.test_past_day_lock
          python3 -m src.test_v4_engine_pins
      - name: Install the Factor Mine wrapper test
        run: pip install pandas numpy
      - name: Factor Mine past-day wrapper
        run: |
          python3 -m src.test_factor_mine_past_lock
          python3 -m src.test_factor_mine_preopen
