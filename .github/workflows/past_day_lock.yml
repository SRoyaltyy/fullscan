name: past-day lock

# Fails the run when a sealed past day changes.
# Does not call OpenClaw or Grok. Stays on GitHub-hosted runners.

on:
  pull_request:
    paths:
      - "src/past_day_lock.py"
      - "src/test_past_day_lock.py"
      - "src/sleeve_merge_live.py"
      - "src/strategy_tickets.py"
      - "src/paper_trade.py"
      - "src/paper_trade_append.py"
      - "src/factor_mine_book.py"
      - "src/factor_mine.py"
      - "src/factor_mine_past_lock.py"
      - "src/test_factor_mine_past_lock.py"
      - "src/ohlc_ripper.py"
      - "src/gainer_capture.py"
      - "src/gainer_asof.py"
      - "src/ticker_lookback.py"
      - "src/test_v4_engine_pins.py"
      - "00_grounding/futubull_fees.json"
      - "research/hot_n4_clean_v4/protocol.py"
      - ".github/workflows/factor_mine.yml"
      - "01_daily/*_flatten_card.md"
      - "data/day_board/*_strategy_tickets.json"
      - "data/paper/trades.csv"
      - "data/paper/roundtrips.csv"
      - "data/paper/skipped.csv"
      - "data/paper/equity_curve.csv"
      - "data/sleeve_merge/trades.csv"
      - "data/sleeve_merge/skipped.csv"
      - "data/sleeve_merge/equity_curve.csv"
      - "03_scoreboard/factor_mine/**"
      - "data/past_day_lock/**"
      - ".github/workflows/past_day_lock.yml"
  push:
    branches: [main]
    paths:
      - "src/past_day_lock.py"
      - "src/test_past_day_lock.py"
      - "src/sleeve_merge_live.py"
      - "src/strategy_tickets.py"
      - "src/paper_trade.py"
      - "src/paper_trade_append.py"
      - "src/factor_mine_book.py"
      - "src/factor_mine.py"
      - "src/factor_mine_past_lock.py"
      - "src/test_factor_mine_past_lock.py"
      - "src/ohlc_ripper.py"
      - "src/gainer_capture.py"
      - "src/gainer_asof.py"
      - "src/ticker_lookback.py"
      - "src/test_v4_engine_pins.py"
      - "00_grounding/futubull_fees.json"
      - "research/hot_n4_clean_v4/protocol.py"
      - ".github/workflows/factor_mine.yml"
      - "01_daily/*_flatten_card.md"
      - "data/day_board/*_strategy_tickets.json"
      - "data/paper/trades.csv"
      - "data/paper/roundtrips.csv"
      - "data/paper/skipped.csv"
      - "data/paper/equity_curve.csv"
      - "data/sleeve_merge/trades.csv"
      - "data/sleeve_merge/skipped.csv"
      - "data/sleeve_merge/equity_curve.csv"
      - "03_scoreboard/factor_mine/**"
      - "data/past_day_lock/**"
      - ".github/workflows/past_day_lock.yml"

permissions:
  contents: read

jobs:
  append-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the base branch
        run: git fetch --no-tags origin main
      - name: Past-day lock
        run: |
          python3 -m src.past_day_lock --check-against origin/main
          python3 -m src.test_past_day_lock
          python3 -m src.test_v4_engine_pins
      - name: Install the Factor Mine wrapper test
        run: pip install pandas numpy
      - name: Factor Mine past-day wrapper
        run: python3 -m src.test_factor_mine_past_lock
