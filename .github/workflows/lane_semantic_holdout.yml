name: Lane frozen semantic holdout
on:
  push:
    branches: [codex/lane-provider-repair-20261014]
    paths: ['.github/workflows/lane_semantic_holdout.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lane-semantic-holdout-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[grok-only]') && 'grok' || 'glm' }}
  cancel-in-progress: false
jobs:
  glm:
    if: ${{ !contains(github.event.head_commit.message, '[grok-only]') && !contains(github.event.head_commit.message, '[skip provider validation]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /tests/fixtures/
            /data/exports/finviz_latest.csv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate contracts and regression repairs
        run: PYTHONPATH=.:scripts python -m unittest discover -s scripts -p 'test_semantic*.py' && PYTHONPATH=.:scripts python -m unittest discover -s scripts -p 'test_provider_repairs.py'
      - name: Program-only GLM frozen 100-title holdout
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
          MODELSCOPE_SDK_TOKEN: ${{ secrets.MODELSCOPE_SDK_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TOKENHUB_API_KEY: ${{ secrets.TOKENHUB_API_KEY }}
          TENCENT_API_KEY: ${{ secrets.TENCENT_API_KEY }}
          HUNYUAN_API_KEY: ${{ secrets.HUNYUAN_API_KEY }}
          TOKENHUB_BASE_URL: ${{ secrets.TOKENHUB_BASE_URL }}
          TENCENT_BASE_URL: ${{ secrets.TENCENT_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          LANE_ALLOW_PAID_DEEPSEEK: ${{ vars.LANE_ALLOW_PAID_DEEPSEEK }}
        run: |
          PYTHONPATH=. python scripts/run_semantic_headlines.py \
            --input tests/fixtures/semantic_frozen_20261014/batch_02.json \
            --output provider_results/glm_program_outputs.json \
            --limit 100 --budget-seconds 3600 --headline-timeout 450 \
            --batch-size 10 --batch-interval-seconds 5 --require-catalog --no-review --sector-review --action-review \
            --providers zhipu,gemini,qwen \
            --models glm-5.3-flash,gemini-2.5-flash,qwen-flash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-glm-provider-100
          path: provider_results/
  grok:
    if: ${{ contains(github.event.head_commit.message, '[grok-only]') && !contains(github.event.head_commit.message, '[skip provider validation]') }}
    runs-on: [self-hosted, ecs]
    timeout-minutes: 65
    env:
      FULLSCAN_HOME: /home/gha
      OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
      OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
      OPENCLAW_BACKEND_MODEL: xai/grok-4.3
      OPENCLAW_GUARD_CALL_TIMEOUT: '45'
      OPENCLAW_LANE_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - name: Clear inherited sparse checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git sparse-checkout disable || true
          test -f requirements.txt || { echo "requirements.txt missing after full checkout"; exit 1; }
      - name: Diagnose timer, OAuth and both Grok model paths
        id: diagnose
        run: PYTHONPATH=.:scripts python3 scripts/diagnose_openclaw_lane.py --output provider_results/grok_diagnostic.json
      - name: Program-only Grok frozen 100-title holdout when healthy and idle
        if: steps.diagnose.outputs.ready == 'true'
        run: |
          PYTHONPATH=. python3 scripts/run_semantic_headlines.py \
            --input tests/fixtures/semantic_frozen_20261014/batch_02.json \
            --output provider_results/grok_program_outputs.json \
            --limit 100 --budget-seconds 3600 --headline-timeout 450 \
            --batch-size 10 --batch-interval-seconds 5 --require-catalog --no-review --sector-review --action-review \
            --providers openclaw --models xai/grok-4.3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-grok-diagnosis-and-100
          path: provider_results/


      - name: Leave full checkout for shared ECS runner
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git sparse-checkout disable || true
          test -f requirements.txt || { echo "requirements.txt missing after full checkout"; exit 1; }

  grade_holdout:
    needs: glm
    if: ${{ always() && needs.glm.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/evaluate_semantic_acceptance.py
            /docs/benchmarks/references_20261014/
            /tests/fixtures/semantic_frozen_20261014/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: lane-glm-provider-100
          path: holdout
      - name: Download frozen candidate development output
        uses: actions/download-artifact@v4
        with:
          name: lane-glm-provider-100
          run-id: 38607393547
          github-token: ${{ github.token }}
          path: baseline
      - name: Verify frozen candidate and score without model calls
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json,pathlib,hashlib
          from evaluate_semantic_acceptance import compare,acceptance_candidate
          ip=pathlib.Path('tests/fixtures/semantic_frozen_20261014/batch_02.json')
          rp=pathlib.Path('docs/benchmarks/references_20261014/batch_02.json')
          raw_path=next(pathlib.Path('holdout').rglob('glm_program_outputs.json'))
          raw=json.loads(raw_path.read_text())
          baseline=json.loads(next(pathlib.Path('baseline').rglob('glm_program_outputs.json')).read_text())
          ref=json.loads(rp.read_text())
          digest=hashlib.sha256(ip.read_bytes()).hexdigest()
          assert raw['input_sha256']==ref['input_sha256']==digest, 'Input identity mismatch'
          assert digest!=baseline['input_sha256'], 'Development batch reused as holdout'
          assert ref['frozen_before_program_execution'] and ref['frozen_at']<raw['generated_at'], 'Reference not frozen before execution'
          candidate=acceptance_candidate(ref,raw)
          assert candidate==acceptance_candidate({},baseline), 'Frozen runtime/configuration/catalog changed'
          report=compare(json.loads(ip.read_text()),ref,raw)
          report.update(acceptance_eligible=True,reserve_batch=2,candidate=candidate,reference_sha256=hashlib.sha256(rp.read_bytes()).hexdigest(),raw_sha256=hashlib.sha256(raw_path.read_bytes()).hexdigest(),input_sha256=digest,reference_frozen_at=ref['frozen_at'],program_started_at=raw['generated_at'],best_consecutive_passes=1 if report['pass'] else 0,target_consecutive_passes=10)
          pathlib.Path('scores').mkdir()
          pathlib.Path('scores/batch_02_comparison.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k not in ('samples','candidate')}))
          for key in ('action','lane','sectors'):
              print(key.upper()+'_MISSES='+json.dumps([(r['n'],r['title'],r['program'],r['reference']) for r in report['samples'] if not r['checks'][key]],ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-frozen-holdout-score-02
          path: scores/
