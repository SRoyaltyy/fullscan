name: Collect unseen JEV benchmark headlines
on:
  push:
    branches: [codex/jev-lane-hop0]
    paths: ['.github/workflows/jev_lane_harvest.yml']
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            01_daily/news
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect source evidence without teacher or JEV labels
        run: |
          python - <<'PY'
          import json,datetime
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          from src.jev_eval import parse_rss_xml
          import urllib.request,urllib.parse
          from src.jev_acceptance import identity
          queries=['stock market','earnings','IPO','federal reserve','interest rates','inflation','GDP','oil prices','gold prices','commodities','tariffs','sanctions','trade war','geopolitical risk','FDA approval','clinical trial results','merger acquisition','stock buyback','bankruptcy restructuring','corporate debt financing','strike airport port','plant factory shutdown','cyberattack company','court ruling company','antitrust investigation','company CEO resigns appointed','semiconductor data center investment','retail sales payrolls','stock picks price targets','earnings preview','market wrap','personal finance retirement']
          def collect(pair):
              i,q=pair
              url='https://news.google.com/rss/search?q='+urllib.parse.quote_plus(q+' when:7d')+'&hl=en-US&gl=US&ceid=US:en'
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'fullscan-jev-benchmark/1'})
                  with urllib.request.urlopen(req,timeout=20) as response:return parse_rss_xml(response.read(),'training_rss_week_'+str(i))
              except Exception as exc:
                  print(q,type(exc).__name__);return []
          with ThreadPoolExecutor(max_workers=12) as pool:
              rows=[r for part in pool.map(collect,enumerate(queries)) for r in part]
          unique={identity(r):r for r in rows}
          now=datetime.datetime.now(datetime.timezone.utc)
          report={'generated_at':now.isoformat(),'source':'Google News RSS, US edition, 32 declared queries, when:7d','queries':queries,'ungraded':True,'all_items':list(unique.values())}
          if len(unique)<100:raise SystemExit('Source harvest too small; no synthetic replacement')
          p=Path('01_daily/news')/(now.strftime('%Y-%m-%d')+'_training_rss_week_parsed.json')
          p.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('Collected',len(unique),'unique source headlines without grading',p)
          PY
      - name: Save fresh evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 01_daily/news/*_training_rss_week_parsed.json
          git commit -m 'Collect fresh ungraded RSS evidence for JEV benchmark [skip ci]'
          git push origin HEAD:codex/jev-lane-hop0
