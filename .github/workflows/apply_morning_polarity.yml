name: Apply morning polarity board

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply polarity patches
        run: |
          set -euo pipefail
          patch -p1 < patches/morning_polarity/factor_mine_sim.js.patch
          patch -p1 < patches/morning_polarity/factor_mine_dash.html.patch
          patch -p1 < patches/morning_polarity/strategy_tickets.py.patch
          python3 -m py_compile src/strategy_tickets.py src/book_suggestions.py
          node --check src/factor_mine_sim.js
          grep -n "polarityPredict" src/factor_mine_sim.js
          grep -n "function polLine" src/factor_mine_dash.html
          grep -n "def _tag_polarity" src/strategy_tickets.py
      - name: Commit patched sources
        run: |
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add src/factor_mine_sim.js src/factor_mine_dash.html src/strategy_tickets.py
          git commit -m "feat: morning board Side + polarity Pred tally" || echo No changes
          git push origin HEAD
