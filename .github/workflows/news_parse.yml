name: News Parse (Supabase)

# NO schedule cron: Pre-Open ALL (06:00 ET) runs the morning parse.
# Dispatch-only — orchestrator last-chance fallback after 08:00 ET.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Lookback hours"
        required: false
        default: "24"
      limit:
        description: "Max rows"
        required: false
        default: "200"
      run_date:
        description: "YYYY-MM-DD label for output files"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: news-parse
  cancel-in-progress: true

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary || true
      - name: Skip if past 09:25 ET
        if: github.event_name == 'schedule'
        run: |
          ET_HM=$((10#$(TZ=America/New_York date +%H%M)))
          echo "ET_HM=$ET_HM"
          if [ "$ET_HM" -ge 925 ]; then
            echo "past 09:25 ET — skip news_parse"
            echo "skip=yes" >> "$GITHUB_ENV"
          fi
      - name: Run news parse
        if: env.skip != 'yes'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -e
          HOURS="${{ github.event.inputs.hours }}"
          LIMIT="${{ github.event.inputs.limit }}"
          DATE="${{ github.event.inputs.run_date }}"
          HOURS=${HOURS:-24}
          LIMIT=${LIMIT:-200}
          ARGS=(--hours "$HOURS" --limit "$LIMIT")
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          python -m src.news_parse "${ARGS[@]}"
      - name: Show summary
        if: always()
        run: |
          ls -la 01_daily/news/ || true
          latest=$(ls -1t 01_daily/news/*_parsed.md 2>/dev/null | head -1)
          if [ -n "$latest" ]; then
            echo "===== $latest ====="
            head -80 "$latest"
          fi
      - name: Commit
        if: env.skip != 'yes'
        run: |
          bash scripts/safe_git_push.sh "auto: news parse" 01_daily/news/
