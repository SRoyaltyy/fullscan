name: holdup append-only

on:
  pull_request:
    paths:
      - "research/hot_n4_clean_v4/forward/**"
      - "research/hot_n4_clean_v4/forward_h1/**"
      - "research/hot_n4_clean_v4/days/**"
      - "research/hot_n4_clean_v4/returns/**"
      - "dashboard/holdup/**"
      - "dashboard/h1/**"
      - ".github/workflows/holdup_append_only.yml"
      - ".github/workflows/holdup_forward.yml"
      - ".github/workflows/holdup_fill.yml"
      - ".github/workflows/holdup_open_fill.yml"
      - ".github/workflows/h1_forward.yml"
      - ".github/workflows/h1_open_fill.yml"
      - ".github/workflows/h1_fill.yml"
      - ".github/workflows/correct_open.yml"
  push:
    branches: [main]
    paths:
      - "research/hot_n4_clean_v4/forward/**"
      - "research/hot_n4_clean_v4/forward_h1/**"
      - "research/hot_n4_clean_v4/days/**"
      - "research/hot_n4_clean_v4/returns/**"
      - "dashboard/holdup/**"
      - "dashboard/h1/**"
      - ".github/workflows/holdup_append_only.yml"
      - ".github/workflows/holdup_forward.yml"
      - ".github/workflows/holdup_fill.yml"
      - ".github/workflows/holdup_open_fill.yml"
      - ".github/workflows/h1_forward.yml"
      - ".github/workflows/h1_open_fill.yml"
      - ".github/workflows/h1_fill.yml"
      - ".github/workflows/correct_open.yml"

permissions:
  contents: read

jobs:
  append-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 2026-11-04 runs 41857307250 and 41866271908: checkout of the merge
      # ref died at 20 min, before any sealed-log test. Same sparse pattern
      # as the updown o2c test job. The tests read these paths and git-show
      # the tip of origin/main. They do not walk history. No ledger is written.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src
            .github/workflows
            research/__init__.py
            research/concentration_cap_v1/protocol.py
            research/concentration_cap_v2/protocol.py
            research/concentration_cap_v3/protocol.py
            research/factor_mine_recipe_search_v4/protocol.py
            research/hot_n4_clean_v1/protocol.py
            research/hot_n4_clean_v2/protocol.py
            research/hot_n4_clean_v3/protocol.py
            research/hot_n4_clean_v4/protocol.py
            research/hot_n4_clean_v4/run_study.py
            research/hot_n4_clean_v4/forward
            research/hot_n4_clean_v4/forward_h1
            research/hot_n4_clean_v4/days
            research/hot_n4_clean_v4/returns
            dashboard/index.html
            dashboard/h1
            dashboard/holdup
            data/prices/ohlc.parquet
            data/past_day_lock/manifest.jsonl
            00_grounding/futubull_fees.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bar dependencies
        run: pip install numpy pandas pyarrow
      - name: Fetch the base ref
        run: |
          set -euo pipefail
          # Sealed-log tests call git show origin/main:<path>. One commit,
          # no blobs yet; each compared path is fetched when the test reads it.
          BASE="${{ github.base_ref }}"
          BASE="${BASE:-main}"
          git fetch --no-tags --depth 1 --filter=blob:none origin "$BASE"
          if [ "$BASE" != "main" ]; then
            git fetch --no-tags --depth 1 --filter=blob:none origin main
          fi
      - name: Sealed log, seed match, and prefix
        run: |
          PYTHONHASHSEED=0 python3 research/hot_n4_clean_v4/forward/test_append_only.py
          PYTHONHASHSEED=0 python3 research/hot_n4_clean_v4/forward/test_plan_fill.py
          PYTHONHASHSEED=0 python3 research/hot_n4_clean_v4/forward/test_open_fill.py
          PYTHONHASHSEED=0 python3 research/hot_n4_clean_v4/forward/test_open_fill_correction.py
          PYTHONHASHSEED=0 python3 research/hot_n4_clean_v4/forward/test_snapshot_plan.py
          PYTHONHASHSEED=0 python3 research/hot_n4_clean_v4/forward/test_close_mark_guard.py
          PYTHONHASHSEED=0 python3 research/hot_n4_clean_v4/forward/test_price_revision_acks.py
          PYTHONHASHSEED=0 python3 research/hot_n4_clean_v4/forward/test_holdup_restart.py
