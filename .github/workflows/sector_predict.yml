name: Sector Environment Predict

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "YYYY-MM-DD (default today ET)"
        required: false
        default: ""
      sectors:
        description: "Comma-separated subset or empty for all 11"
        required: false
        default: ""
      no_llm:
        description: "true = ETF channel only (no DeepSeek)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  schedule:
    # After general predict window — weekdays 14:30 UTC (~10:30 ET)
    - cron: "30 14 * * 1-5"

permissions:
  contents: write

jobs:
  sector:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install yfinance || true

      - name: Run sector predict
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
        run: |
          set -e
          DATE="${{ github.event.inputs.run_date }}"
          SECTORS="${{ github.event.inputs.sectors }}"
          NO_LLM="${{ github.event.inputs.no_llm }}"
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ -n "$SECTORS" ] && ARGS+=(--sectors "$SECTORS")
          [ "$NO_LLM" = "true" ] && ARGS+=(--no-llm)
          echo "python -m src.run_sector_predict ${ARGS[*]}"
          python -m src.run_sector_predict "${ARGS[@]}"

      - name: Show summary
        run: |
          ls -la 01_daily/sectors/ || true
          for d in 01_daily/sectors/*/; do
            [ -f "${d}_summary.md" ] && echo "===== ${d}_summary.md =====" && cat "${d}_summary.md"
          done

      - name: Commit
        run: |
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add 01_daily/sectors/ 01_daily/_transcripts/ || true
          git commit -m "auto: sector environment predict" || echo "No changes"
          git pull --rebase origin main || true
          git push origin main
