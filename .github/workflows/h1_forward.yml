name: h1 append-only forward

# Same clock as the holdup plan. Weekdays after Pre-Open ALL (09:55 UTC)
# has had time to land the morning files, and before the US cash open.
# 13:05 UTC = 9:05 AM ET during EDT (UTC-4, through 2026-11-01) and 8:05 AM
# ET during EST (UTC-5, from 2026-11-01). Hong Kong Time is 9:05 PM
# year-round (UTC+8, no DST). GitHub cron does not follow DST.
# This run seals a PLAN for session D only. It does not read D's prices.
# Session 2026-09-28 uses the frozen Theme Radar record (trade date 09-28).
# This 13:05 UTC run seals that plan for h1 when it is on main before 09:30 ET
# (13:30 UTC during EDT). A workflow_dispatch must commit before 13:25 UTC
# (09:25 ET) to count. The run refuses at or after 09:30 ET and writes nothing.
# 09-28 is marked missing only when no plan was committed before that open.
# Holdup is a different book: this job sets FORWARD_BOOK=h1 and does not
# append a second holdup plan.
# From 2026-09-29 the Finviz universe is theme-radar
# data/snapshots/<previous session>.csv at the last commit before 09:30 ET.
# A missing file or a commit that is not before the open skips Finviz names
# and fills no new buy, the same as 2026-08-28.
# The page is published by deploy-dashboard.yml on the same overlay route
# as dashboard/factor-mine (copy from main, then the site-root mirror).

on:
  schedule:
    - cron: "5 13 * * 1-5"
  workflow_dispatch:
    inputs:
      session_date:
        description: "Session D (YYYY-MM-DD). Empty seals the next session. Refuses at or after 09:30 ET."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: h1-forward
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bar dependencies
        run: pip install numpy pandas pyarrow yfinance
      - name: Theme Radar history for the pre-open panel
        run: |
          set -euo pipefail
          if ! git clone --filter=blob:none --no-checkout \
              https://github.com/SRoyaltyy/theme-radar.git vendor/theme-radar; then
            echo "theme-radar clone failed; the forward step will log the missing panel"
            exit 0
          fi
          git -C vendor/theme-radar sparse-checkout init --cone
          git -C vendor/theme-radar sparse-checkout set research/lever_panel data/snapshots
          git -C vendor/theme-radar checkout main \
            || echo "theme-radar checkout failed"
      - name: Refresh forward prices
        id: prices
        env:
          FORWARD_BOOK: h1
        run: PYTHONHASHSEED=0 python3 research/hot_n4_clean_v4/forward/prices.py
      - name: Seal the pre-open plan
        id: plan
        if: success()
        env:
          FORWARD_BOOK: h1
          HOLDUP_GIT_REF: origin/main
          HOLDUP_MODE: plan
          PLAN_SESSION: ${{ github.event.inputs.session_date }}
        run: PYTHONHASHSEED=0 python3 research/hot_n4_clean_v4/forward/forward.py
      - name: Refresh the h1 close display
        id: closes
        if: success()
        env:
          FORWARD_BOOK: h1
        run: PYTHONHASHSEED=0 python3 research/hot_n4_clean_v4/forward/h1_closes.py
      - name: Commit the append
        if: always()
        run: |
          set -euo pipefail
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          files=(
            research/hot_n4_clean_v4/forward_h1/h1_log.jsonl
            research/hot_n4_clean_v4/forward_h1/LEDGER.jsonl
            research/hot_n4_clean_v4/forward_h1/skips.jsonl
            research/hot_n4_clean_v4/forward_h1/prices.jsonl
            research/hot_n4_clean_v4/forward_h1/PRICE_LEDGER.jsonl
            research/hot_n4_clean_v4/forward_h1/price_revisions.jsonl
            dashboard/h1/log.json
            dashboard/h1/status.json
            dashboard/h1/closes.json
          )
          for path in "${files[@]}"; do
            if [ -f "$path" ]; then
              git add -- "$path"
            fi
          done
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Seal the next h1 plan."
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail the job when the book halted
        if: steps.prices.outcome == 'failure' || steps.plan.outcome == 'failure' || steps.closes.outcome == 'failure'
        run: exit 1
