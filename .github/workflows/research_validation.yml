name: Research validation
on:
  pull_request:
    paths: ['src/**', '00_grounding/futubull_fees.json', '.github/workflows/research_validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas pyarrow pytest requests pandas_market_calendars
      - run: python -m pytest -q src/test_research_validation.py src/test_lesson_exec.py src/test_open_bell_slip.py src/test_book_fill_reality.py
      - run: node --check src/factor_mine_sim.js
      - if: github.event_name == 'workflow_dispatch'
        run: python -m src.strategy_validation --starts all
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: strategy-validation
          path: |
            03_scoreboard/validation/
            dashboard/validation/
