name: Daily Orchestrator (missed-job guard)

# Does NOT own the two ALL clocks (ECS 05:55 pre-open / 16:10+22:00 post-close).
# Only re-dispatches when today's file is missing AND nothing is already running.
# Three workflows only: scrape, Pre-Open ALL, Post-Close ALL.

on:
  schedule:
    - cron: "50 11 * * 1-5"
    - cron: "15 21 * * 1-5"
    - cron: "30 16 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-dispatch even if today's file exists"
        required: false
        default: "false"

permissions:
  actions: write
  contents: read

concurrency:
  group: daily-orchestrator
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Re-dispatch only the two ALL jobs (plus scrape)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TODAY=$(TZ=America/New_York date +%F)
          ET_HM=$((10#$(TZ=America/New_York date +%H%M)))
          echo "Orchestrator date (ET): $TODAY et_hm=$ET_HM force=$FORCE"

          repo_file() {
            gh api "repos/${REPO}/contents/${1}?ref=main" --jq .sha >/dev/null 2>&1
          }
          repo_file_size() {
            gh api "repos/${REPO}/contents/${1}?ref=main" --jq '.size // 0' 2>/dev/null || echo 0
          }

          artifact_ok() {
            local WF="$1"
            case "$WF" in
              finviz_preopen_scrape.yml)
                local sz
                sz=$(repo_file_size "01_daily/news/${TODAY}_finviz_digest.json")
                [ "${sz:-0}" -gt 200 ]
                ;;
              preopen_all.yml)
                repo_file "data/stock_book/${TODAY}_stock_book.json" \
                  || repo_file "01_daily/${TODAY}_stock_book.md"
                ;;
              postclose_all.yml)
                local sz
                sz=$(repo_file_size "01_daily/general/${TODAY}_outcome.md")
                [ "${sz:-0}" -gt 400 ]
                ;;
              *)
                return 1
                ;;
            esac
          }

          dispatch_wf() {
            local WF="$1"
            echo "MISSING for $TODAY → dispatching $WF"
            gh api --method POST "repos/${REPO}/actions/workflows/${WF}/dispatches" \
              -f ref=main || true
          }

          already_running() {
            local WF="$1"
            local RAW HAS_ACTIVE=""
            RAW=$(gh api "repos/${REPO}/actions/workflows/$WF/runs?per_page=10" \
              --jq '.workflow_runs[] | {id, status, conclusion, created_at}' || echo "")
            [ -n "$RAW" ] || return 1
            while IFS=$'\t' read -r id status conclusion created; do
              [ -n "$id" ] || continue
              et=$(TZ=America/New_York date -d "$created" +%F 2>/dev/null || true)
              [ "$et" = "$TODAY" ] || continue
              if [ "$status" = "in_progress" ] || [ "$status" = "queued" ] \
                 || [ "$status" = "waiting" ] || [ "$status" = "pending" ]; then
                HAS_ACTIVE="$id"
              fi
            done < <(echo "$RAW" | jq -r '[.id, .status, (.conclusion // ""), .created_at] | @tsv')
            [ -n "$HAS_ACTIVE" ]
          }

          maybe() {
            local WF="$1"
            echo ""
            echo "======== $WF ========"
            if already_running "$WF"; then
              echo "OK — already running"
              return 0
            fi
            if [ "$FORCE" != "true" ] && artifact_ok "$WF"; then
              echo "OK — today's file is on main"
              return 0
            fi
            dispatch_wf "$WF"
          }

          if [ "$FORCE" = "true" ] || [ "$ET_HM" -lt 925 ]; then
            maybe finviz_preopen_scrape.yml
            maybe preopen_all.yml
          else
            echo "skip morning ALL — past 09:25 ET"
          fi

          if [ "$FORCE" = "true" ] || [ "$ET_HM" -ge 1600 ]; then
            maybe postclose_all.yml
          else
            echo "skip Post-Close ALL until 16:00 ET"
          fi

          echo "Orchestrator pass complete at $(date -u +%F_%H%M) UTC"
