name: Daily Orchestrator (missed-job guard)

# Does NOT own the two ALL clocks (ECS 05:55 pre-open / 16:10+22:00 post-close).
# Only re-dispatches when skip-if-good says the pack is incomplete AND
# nothing is already running. Morning: scrape + Pre-Open ALL. After 09:00
# ET: Stock Book ALL on ubuntu-latest heals weather/join/AB/green/book
# (no Grok, does not wait for a hung ECS pre-open). Evening: Post-Close
# ALL on ubuntu/DeepSeek — 16:10/23:30 crons are new and may skip day 1;
# a dead ECS runner must not stall the pack. systemd 22:00 still uses Grok.

on:
  schedule:
    - cron: "50 11 * * 1-5"
    - cron: "20 13 * * 1-5"   # ~09:20 ET EDT — book heal if pre-open died
    - cron: "15 21 * * 1-5"   # ~17:15 ET — first Post-Close ALL fire (16:10 cron is new)
    - cron: "30 16 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-dispatch even if today's file exists"
        required: false
        default: "false"

permissions:
  actions: write
  contents: read

concurrency:
  group: daily-orchestrator
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Re-dispatch ALL jobs (plus scrape / book heal)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TODAY=$(TZ=America/New_York date +%F)
          ET_HM=$((10#$(TZ=America/New_York date +%H%M)))
          echo "Orchestrator date (ET): $TODAY et_hm=$ET_HM force=$FORCE"

          artifact_ok() {
            local WF="$1"
            # || return 1: skip-if-good exits 1 meaning RUN. set -e must
            # not abort the evening pass before we dispatch Post-Close ALL.
            case "$WF" in
              finviz_preopen_scrape.yml)
                python3 -m src.skip_if_good --job finviz_preopen_scrape --date "$TODAY" || return 1
                ;;
              preopen_all.yml)
                python3 -m src.skip_if_good --job preopen_full --date "$TODAY" || return 1
                ;;
              stock_book_all.yml)
                python3 -m src.skip_if_good --job stock_book_all --date "$TODAY" || return 1
                ;;
              postclose_all.yml)
                python3 -m src.skip_if_good --job postclose_all || return 1
                ;;
              *)
                return 1
                ;;
            esac
          }

          dispatch_wf() {
            local WF="$1"
            echo "MISSING for $TODAY → dispatching $WF"
            gh api --method POST "repos/${REPO}/actions/workflows/${WF}/dispatches" \
              -f ref=main || true
          }

          dispatch_book_ubuntu() {
            echo "MISSING book for $TODAY → stock_book_all.yml ubuntu skip-llm"
            gh api --method POST "repos/${REPO}/actions/workflows/stock_book_all.yml/dispatches" \
              -f ref=main \
              -f "inputs[runner]=ubuntu" \
              -f "inputs[skip_llm]=true" \
              -f "inputs[skip_extras]=true" \
              -f "inputs[run_date]=$TODAY" \
              || true
          }

          dispatch_postclose_ubuntu() {
            echo "MISSING night pack → postclose_all.yml ubuntu/DeepSeek"
            gh api --method POST "repos/${REPO}/actions/workflows/postclose_all.yml/dispatches" \
              -f ref=main \
              -f "inputs[runner]=ubuntu" \
              -f "inputs[llm_backend]=deepseek" \
              || true
          }

          already_running() {
            local WF="$1"
            local RAW HAS_ACTIVE=""
            RAW=$(gh api "repos/${REPO}/actions/workflows/$WF/runs?per_page=10" \
              --jq '.workflow_runs[] | {id, status, conclusion, created_at}' || echo "")
            [ -n "$RAW" ] || return 1
            while IFS=$'\t' read -r id status conclusion created; do
              [ -n "$id" ] || continue
              # 18h Post-Close ALL spans midnight. A 16:10 fire still
              # running at the next 17:15 must not get a second dispatch.
              if [ "$WF" != "postclose_all.yml" ]; then
                et=$(TZ=America/New_York date -d "$created" +%F 2>/dev/null || true)
                [ "$et" = "$TODAY" ] || continue
              fi
              if [ "$status" = "in_progress" ] || [ "$status" = "queued" ] \
                 || [ "$status" = "waiting" ] || [ "$status" = "pending" ]; then
                HAS_ACTIVE="$id"
              fi
            done < <(echo "$RAW" | jq -r '[.id, .status, (.conclusion // ""), .created_at] | @tsv')
            [ -n "$HAS_ACTIVE" ]
          }

          maybe() {
            local WF="$1"
            echo ""
            echo "======== $WF ========"
            if already_running "$WF"; then
              echo "OK — already running"
              return 0
            fi
            if [ "$WF" = "stock_book_all.yml" ] && already_running "preopen_all.yml"; then
              echo "Pre-Open ALL still on ECS — book heal stays on ubuntu"
            fi
            if [ "$FORCE" != "true" ] && artifact_ok "$WF"; then
              echo "OK — skip-if-good: pack already on disk"
              return 0
            fi
            if [ "$WF" = "stock_book_all.yml" ]; then
              dispatch_book_ubuntu
              return 0
            fi
            if [ "$WF" = "postclose_all.yml" ]; then
              dispatch_postclose_ubuntu
              return 0
            fi
            dispatch_wf "$WF"
          }

          if [ "$FORCE" = "true" ] || [ "$ET_HM" -lt 900 ]; then
            maybe finviz_preopen_scrape.yml
            maybe preopen_all.yml
          elif [ "$ET_HM" -lt 1600 ]; then
            echo "past 09:00 ET — heal ranker on ubuntu (ECS may still be in Grok)"
            maybe stock_book_all.yml
          else
            echo "skip morning ALL — session already open"
          fi

          if [ "$FORCE" = "true" ] || [ "$ET_HM" -ge 1600 ]; then
            maybe postclose_all.yml
          else
            echo "skip Post-Close ALL until 16:00 ET"
          fi

          echo "Orchestrator pass complete at $(date -u +%F_%H%M) UTC"
