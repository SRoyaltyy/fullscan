name: Daily Orchestrator (pre-market guard)

# Watches the critical pre-US-open workflows and re-dispatches any that
# missed their cron, failed, OR went green without writing a QUALITY
# artifact (existence is not enough: timeout stubs and carry-forwards
# used to look like success).
#
# Predictive jobs (everything except weather / AB / stock-book / outcome
# / reflect) MUST land before 09:30 ET. This guard will NOT dispatch
# predictive workflows after 09:25 ET unless force=true.
#
# Targets (predict-side — outcome/reflect have their own windows):
#   finviz_digest   ~10:05 / 12:05 UTC
#   events_daily    ~10:10 UTC
#   news_parse      10/12:15 UTC
#   news_judge      10/12:25 UTC
#   news_actions    ~11:20 UTC
#   daily_pipeline  predict ~10:45 UTC
#   sector_daily    predict ~11:10 UTC (weekdays)
#   label_weather   ~15:17 UTC          (NOT predictive)
#   ab_checklist    15:00 UTC + 21:30   (NOT predictive)
#   stock_book_all  17:00 UTC           (NOT predictive)
#
# Runs several times in the pre-market window so a single delayed cron
# does not leave the day without inputs. Force=true re-dispatches all.
# 18:15 UTC pass: if the book exists but AB is missing, re-dispatch ALL
# so s_ab actually scores.

on:
  schedule:
    # ~06:50 ET, ~07:50 ET, ~08:20 ET (was 12:50 UTC — jitter put it after the bell)
    - cron: "50 10 * * 1-5"
    - cron: "50 11 * * 1-5"
    - cron: "20 12 * * 1-5"
    # after Stock Book ALL (17:00 UTC) — catch a missed book / book-without-AB
    - cron: "15 18 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-dispatch even if a successful run already exists today"
        required: false
        default: "false"

permissions:
  actions: write
  contents: read

concurrency:
  group: daily-orchestrator
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check artifacts + re-dispatch missing/failed/green-empty
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          TODAY=$(TZ=America/New_York date +%F)
          HOUR=$((10#$(date -u +%H)))
          ET_HM=$((10#$(TZ=America/New_York date +%H%M)))
          echo "Orchestrator date (ET): $TODAY  utc_hour=$HOUR  et_hm=$ET_HM  force=$FORCE"

          repo_file() {
            gh api "repos/${REPO}/contents/${1}?ref=main" --jq .sha >/dev/null 2>&1
          }
          repo_file_size() {
            gh api "repos/${REPO}/contents/${1}?ref=main" --jq '.size // 0' 2>/dev/null || echo 0
          }
          repo_decode() {
            local raw
            raw=$(gh api "repos/${REPO}/contents/${1}?ref=main" --jq .content 2>/dev/null) || return 1
            echo "$raw" | tr -d '\n' | base64 -d 2>/dev/null
          }
          repo_predict_quality_n() {
            gh api "repos/${REPO}/contents/${1}?ref=main" \
              --jq '[.[]? | select(.type=="file" and (.name | endswith("_predict.md")) and (.size >= 3000))] | length' \
              2>/dev/null || echo 0
          }

          is_predictive() {
            case "$1" in
              finviz_digest.yml|events_daily.yml|news_parse.yml|news_judge.yml|news_actions.yml|daily_pipeline.yml|sector_daily.yml)
                return 0 ;;
              *) return 1 ;;
            esac
          }

          artifact_ok() {
            local WF="$1"
            case "$WF" in
              finviz_digest.yml)
                local sz
                sz=$(repo_file_size "01_daily/news/${TODAY}_finviz_digest.json")
                [ "${sz:-0}" -gt 200 ] \
                  || repo_file "01_daily/news/${TODAY}_finviz_digest.md"
                ;;
              events_daily.yml)
                local content
                content=$(repo_decode "01_daily/events/${TODAY}_events.json") || return 1
                echo "$content" | python3 -c '
          import json,sys
          try:
              d=json.load(sys.stdin)
          except Exception:
              sys.exit(1)
          ev=d.get("events") or []
          if d.get("carried_from"):
              print("    events CARRIED — not quality-ok")
              sys.exit(1)
          if not ev:
              print("    events n=0")
              sys.exit(1)
          if all((e.get("status")=="carried") for e in ev if isinstance(e, dict)):
              print("    events all status=carried — not quality-ok")
              sys.exit(1)
          print("    events n=%d quality-ok" % len(ev))
          '
                ;;
              news_parse.yml)
                local sz
                sz=$(repo_file_size "01_daily/news/${TODAY}_parsed.json")
                [ "${sz:-0}" -gt 200 ]
                ;;
              news_judge.yml)
                local content
                content=$(repo_decode "01_daily/news/${TODAY}_judge.md") || return 1
                echo "$content" | python3 -c '
          import sys
          t=sys.stdin.read()
          if len(t) < 400:
              sys.exit(1)
          low=t.lower()
          if "llm request timed out" in low or "idle timeout" in low:
              sys.exit(1)
          if "NEWS_PARSE_BEGIN" not in t:
              sys.exit(1)
          sys.exit(0)
          '
                ;;
              news_actions.yml)
                local sz
                sz=$(repo_file_size "01_daily/news/${TODAY}_actions.json")
                [ "${sz:-0}" -gt 200 ]
                ;;
              daily_pipeline.yml)
                local content
                content=$(repo_decode "01_daily/general/${TODAY}_predict.md") || return 1
                echo "$content" | python3 -c '
          import sys
          t=sys.stdin.read()
          if len(t) < 2000:
              sys.exit(1)
          low=t.lower()
          if "llm request timed out" in low or "idle timeout" in low:
              sys.exit(1)
          if "MEMORY_CONFIRM" not in t or "SCORES_BEGIN" not in t:
              sys.exit(1)
          sys.exit(0)
          '
                ;;
              sector_daily.yml)
                local n
                n=$(repo_predict_quality_n "01_daily/sectors/${TODAY}")
                echo "    sector quality-sized (>=3k) predict files=$n/11"
                [ "${n:-0}" -ge 8 ]
                ;;
              label_weather.yml)
                repo_file "01_daily/weather/${TODAY}_weather.json"
                ;;
              ab_checklist.yml)
                local sz
                if repo_file "data/ab_checklist/${TODAY}_ab_checklist_enriched.csv"; then
                  return 0
                fi
                sz=$(repo_file_size "data/ab_checklist/${TODAY}_ab_checklist.csv")
                echo "    ab raw size=$sz"
                [ "${sz:-0}" -gt 10000 ]
                ;;
              stock_book_all.yml)
                repo_file "data/stock_book/${TODAY}_stock_book.json" \
                  || repo_file "01_daily/${TODAY}_stock_book.md"
                ;;
              *)
                return 1
                ;;
            esac
          }

          dispatch_wf() {
            local WF="$1"
            echo "MISSING/FAILED/GREEN-EMPTY for $TODAY → dispatching $WF"
            local ok=0
            case "$WF" in
              daily_pipeline.yml)
                if gh api --method POST "repos/${REPO}/actions/workflows/${WF}/dispatches" \
                    -f ref=main -f "inputs[stage]=predict" 2>/dev/null; then
                  ok=1
                elif gh workflow run "$WF" --ref main -f stage=predict 2>/dev/null; then
                  ok=1
                fi
                ;;
              sector_daily.yml)
                if gh api --method POST "repos/${REPO}/actions/workflows/${WF}/dispatches" \
                    -f ref=main -f "inputs[stage]=predict" 2>/dev/null; then
                  ok=1
                elif gh workflow run "$WF" --ref main -f stage=predict 2>/dev/null; then
                  ok=1
                fi
                ;;
              *)
                if gh api --method POST "repos/${REPO}/actions/workflows/${WF}/dispatches" \
                    -f ref=main 2>/dev/null; then
                  ok=1
                elif gh workflow run "$WF" --ref main 2>/dev/null; then
                  ok=1
                fi
                ;;
            esac
            if [ "$ok" -eq 1 ]; then
              echo "Dispatched $WF"
            else
              echo "WARN: failed to dispatch $WF — continuing"
            fi
          }

          WORKFLOWS=(
            finviz_digest.yml
            events_daily.yml
            news_parse.yml
            news_judge.yml
            news_actions.yml
            daily_pipeline.yml
            sector_daily.yml
            label_weather.yml
            ab_checklist.yml
            stock_book_all.yml
          )

          for WF in "${WORKFLOWS[@]}"; do
            echo ""
            echo "======== $WF ========"

            # Hard skip predictive dispatches after 09:25 ET (unless force).
            if is_predictive "$WF" && [ "$FORCE" != "true" ] && [ "$ET_HM" -ge 925 ]; then
              echo "skip $WF — past 09:25 ET predictive cutoff (et_hm=$ET_HM)"
              continue
            fi

            RAW=$(gh api "repos/${REPO}/actions/workflows/$WF/runs?per_page=20" \
              --jq '.workflow_runs[] | {id, status, conclusion, event, created_at, html_url}' || echo "")

            HAS_ACTIVE=""
            HAS_SUCCESS=""
            LATEST="none"
            if [ -n "$RAW" ]; then
              LATEST=$(echo "$RAW" | jq -s -r '.[0] // empty | "\(.status)/\(.conclusion // "-") @ \(.created_at) \(.html_url)"' 2>/dev/null || true)
              while IFS=$'\t' read -r id status conclusion created url; do
                [ -n "$id" ] || continue
                et=$(TZ=America/New_York date -d "$created" +%F 2>/dev/null || true)
                [ "$et" = "$TODAY" ] || continue
                if [ "$status" = "in_progress" ] || [ "$status" = "queued" ] || [ "$status" = "waiting" ] || [ "$status" = "pending" ]; then
                  HAS_ACTIVE="$id"
                elif [ "$conclusion" = "success" ]; then
                  HAS_SUCCESS="$id"
                fi
              done < <(echo "$RAW" | jq -r '[.id, .status, (.conclusion // ""), .created_at, .html_url] | @tsv')
            fi
            echo "latest: ${LATEST:-none}"
            echo "today active=${HAS_ACTIVE:--} success=${HAS_SUCCESS:--}"

            ART_OK="no"
            if artifact_ok "$WF"; then
              ART_OK="yes"
            fi
            echo "artifact_ok=$ART_OK"

            if [ "$WF" = "stock_book_all.yml" ] && [ "$FORCE" != "true" ] && [ "$HOUR" -lt 16 ]; then
              echo "skip ALL until 16:00 UTC (prereqs still landing)"
              continue
            fi

            if [ "$WF" = "stock_book_all.yml" ] && [ "$ART_OK" = "yes" ] && [ "$FORCE" != "true" ]; then
              AB_OK="no"
              if artifact_ok "ab_checklist.yml"; then AB_OK="yes"; fi
              echo "book present; ab_ok=$AB_OK"
              if [ "$AB_OK" = "no" ] && [ "$HOUR" -ge 16 ]; then
                if [ -n "$HAS_ACTIVE" ]; then
                  echo "ALL already running — let it pick up AB"
                  continue
                fi
                echo "book exists but AB missing → re-dispatch ALL so s_ab is scored"
                dispatch_wf "$WF"
                continue
              fi
            fi

            if [ "$FORCE" = "true" ]; then
              dispatch_wf "$WF"
              continue
            fi
            if [ -n "$HAS_ACTIVE" ]; then
              echo "OK — in progress/queued (id=$HAS_ACTIVE). Skipping."
              continue
            fi
            if [ "$ART_OK" = "yes" ]; then
              echo "OK — today's quality artifact is on main. Skipping."
              continue
            fi
            if [ -n "$HAS_SUCCESS" ]; then
              echo "GREEN-EMPTY/GREEN-BAD — GH success id=$HAS_SUCCESS but artifact missing or low-quality. Re-dispatching."
            else
              echo "MISSING or FAILED for $TODAY."
            fi
            dispatch_wf "$WF"
          done

          echo ""
          echo "Orchestrator pass complete at $(date -u +%F_%H%M) UTC"
