name: Webull paper (OpenAPI sandbox)

# Warm well BEFORE the bell. Hosted cron is a fallback, not a punctual clock.
# After "h1 append-only forward" succeeds on main, workflow_run starts this
# job immediately. Before 09:30 ET that run places the standing sandbox
# batch (--submit --ready, PAPER_OPEN_SENDER=seal). At or after 09:30 it
# keeps the bell path, which records missed_deadline and places nothing.
# The 12:07/13:07 UTC cron and workflow_dispatch exit before paper_open.
# They do not submit and they do not write the day's paper_open files.
# They do not share a concurrency group with the seal run: the 08:07 ET
# cron holds webull-paper until 09:30, and queueing the seal behind it is
# how 2026-10-06 missed the open.
# ECS fullscan-paper-backstop.timer (09:12 America/New_York) is the on-box
# backstop when this hosted run is still queued. It is the other sender.
# A ticket republish or a stock-book rebuild must not submit on its own.
# Readiness retry (2026-10-16 miss): the seal run fails closed when the
# decision ticket is not ready yet ("required inputs are not validated").
# A successful "Publish strategy tickets" run on main re-wakes this job,
# and it sends ONLY when all hold: before 09:25 ET, today's sealed h1
# plan is on main, and no submit journal / locked status exists for today.
# It then runs exactly the seal path (same sealed h1 set, same sender,
# same fail-closed validate_payload, journal and client_order_id guards).
# Both paths send the sealed h1 new-buy set for that session (picks the
# open fill would buy, not names the book already holds), not a Factor Mine
# HOT4 pick_day rebuild. Published tickets are the readiness signal only.
# This job must not twin-submit: it uses --owner actions (no-ops if
# owner≠actions) and paper_open journal + stable client_order_id.
# Do not add another delayed cron.
# 2026-10-19 retry chain (src/webull_seal_gate.py). 10-09..10-16 the seal
# run fired before the ticket was ready, failed closed, and nothing ran
# again before 09:25 (10-13: the seal run itself ended "failure" so the
# success-only workflow_run never fired). Now every sender trigger
# (h1 forward completion of ANY conclusion, a successful ticket publish,
# and a */10 cron 07:00-09:25 ET as the skipped-trigger fallback) goes
# through one gate: session day, before 09:25, sealed h1 plan for today
# on main, no submit journal and no locked status. A run that passes
# waits in-job (polling main every 2 min) for the ticket to be ready,
# refreshes main, re-checks the gate, then runs the unchanged seal send.
# All senders share ONE concurrency group, so only one waits/sends at a
# time; the next queued run sees the journal and stops. Dispatch never
# sends.
on:
  schedule:
    - cron: '*/10 11-14 * * 1-5'
  workflow_run:
    workflows: ["h1 append-only forward", "Publish strategy tickets"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'webull-paper' || 'webull-paper-seal' }}
  cancel-in-progress: false
jobs:
  paper:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.name == 'h1 append-only forward'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Shallow sparse checkout (pattern of #620). A full fetch-depth 1
      # checkout of this repo took 9-12 min; with the 09:25 ET seal gate a
      # late start could miss the window. List exactly what this job reads.
      # src/test_webull_paper_sparse.py checks every module and file the
      # sender gate, seal gate, paper_open send path and the land touch is
      # inside this list. Add a path there AND here when the job needs it.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /requirements.txt
            /src/
            /collectors/
            /db/
            /gemini_catcher.py
            /scripts/safe_git_push.sh
            /00_grounding/
            /research/hot_n4_clean_v4/forward_h1/
            /data/day_board/
            /data/paper_open/
            /data/sleeve_merge/
            /data/factor_mine/strategy_tickets.json
            /dashboard/factor-mine/
            /01_daily/_progress/
      - name: Sparse tree has the send path
        run: |
          set -euo pipefail
          for f in src/webull_seal_gate.py src/paper_open.py src/webull_exec.py src/h1_sealed_exec.py \
                   src/workflow_progress.py scripts/safe_git_push.sh \
                   research/hot_n4_clean_v4/forward_h1/h1_log.jsonl; do
            test -f "$f" || { echo "::error::sparse checkout is missing $f"; exit 1; }
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sender gate
        id: gate
        env:
          SEAL_EVENT: ${{ github.event_name }}
          WR_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          ET_HM=$((10#$(TZ=America/New_York date +%H%M)))
          echo "bell=false" >> "$GITHUB_OUTPUT"
          if [ "$SEAL_EVENT" = "workflow_dispatch" ]; then
            echo "manual dispatch is not a sender"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$SEAL_EVENT" = "workflow_run" ] && [ "$WR_NAME" = "h1 append-only forward" ] && [ "$ET_HM" -ge 930 ] && [ "$ET_HM" -lt 1600 ]; then
            # Late seal: keep the bell path, which records missed_deadline and places nothing.
            echo "bell=true" >> "$GITHUB_OUTPUT"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 -m src.webull_seal_gate check
      - name: Wait for ready ticket (until 09:25 ET)
        id: wait
        if: steps.gate.outputs.go == 'true'
        run: python3 -m src.webull_seal_gate wait --interval 120
      - name: Report a sealed day with no ready ticket by 09:25
        if: steps.gate.outputs.go == 'true' && steps.wait.outputs.go != 'true'
        env:
          WHY: ${{ steps.wait.outputs.why }}
        run: echo "::error::sealed h1 day but no send — $WHY (fail closed, nothing placed)"
      - name: Refresh main and re-check gate
        id: final
        if: steps.wait.outputs.go == 'true'
        run: |
          set -euo pipefail
          git fetch --depth 1 origin main
          git reset --hard origin/main
          python3 -m src.webull_seal_gate check
      - name: Install client
        if: steps.final.outputs.go == 'true' || steps.gate.outputs.bell == 'true'
        run: pip install webull-openapi-python-sdk pandas numpy pyarrow yfinance requests
      - name: Seal send (standing sandbox batch) or late bell record
        id: send
        if: steps.final.outputs.go == 'true' || steps.gate.outputs.bell == 'true'
        env:
          WEBULL_APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
          WEBULL_ACCOUNT_ID: ${{ secrets.WEBULL_ACCOUNT_ID }}
          PAPER_OPEN_SENDER: seal
          BELL: ${{ steps.gate.outputs.bell }}
        run: |
          set -euo pipefail
          DATE=$(TZ=America/New_York date +%F)
          python3 -m src.workflow_progress beat --workflow webull_paper --date "$DATE" --stages preflight --stage preflight >> /tmp/progress_beat.log 2>&1 &
          echo $! > /tmp/progress_beat.pid
          trap 'kill "$(cat /tmp/progress_beat.pid)" 2>/dev/null || true' EXIT
          if [ "$BELL" = true ]; then
            echo "seal at or after 09:30 ET — bell path, missed_deadline, no order"
            python -m src.paper_open --owner actions --submit
          else
            echo "gate passed, ticket ready, before 09:25 ET — standing sandbox batch"
            python -m src.paper_open --owner actions --submit --ready
          fi
          python3 -m src.workflow_progress touch --workflow webull_paper --date "$DATE" --stage preflight --state ok || true
      - name: Preserve preflight, submission and acknowledgment evidence
        if: always() && steps.send.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: paper-open-evidence
          path: data/paper_open/
          if-no-files-found: warn
      - name: Land outcome, including failed attempts
        if: always() && steps.send.conclusion != 'skipped'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/safe_git_push.sh "auto: paper open evidence" data/paper_open/ data/sleeve_merge/webull_last.json
