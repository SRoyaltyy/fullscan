name: Webull paper (OpenAPI sandbox)

# Warm well BEFORE the bell. Hosted cron is a fallback, not a punctual clock.
# Primary send is publish_strategy_tickets.yml on decision_ready (standing
# MARKET/CORE/DAY, --owner actions). This job must not twin-submit: it uses
# --owner actions (no-ops if owner≠actions) and paper_open journal + stable
# client_order_id. Do not add another delayed cron.
on:
  schedule:
    - cron: '7 12,13 * * 1-5'
  workflow_dispatch:
    inputs:
      submit:
        description: Place sandbox orders at the next 09:30 ET (late starts fail)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: webull-paper
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install before preflight and clock wait
        run: pip install webull-openapi-python-sdk pandas numpy pyarrow yfinance requests
      - name: Preflight, arm and release sandbox batch at 09:30 ET
        env:
          WEBULL_APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
          WEBULL_ACCOUNT_ID: ${{ secrets.WEBULL_ACCOUNT_ID }}
          WANT_SUBMIT: ${{ github.event_name == 'schedule' || inputs.submit }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$WANT_SUBMIT" = true ]; then ARGS+=(--submit); fi
          python -m src.paper_open --owner actions "${ARGS[@]}"
      - name: Preserve preflight, submission and acknowledgment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-open-evidence
          path: data/paper_open/
          if-no-files-found: warn
      - name: Land outcome, including failed attempts
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/safe_git_push.sh "auto: paper open evidence" data/paper_open/ data/sleeve_merge/webull_last.json
