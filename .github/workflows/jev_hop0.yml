name: Jev hop-0 net

# Code first (dup / junk-shape / source / reprint clock), then one
# Jev pack per leftover title. Does not classify the 52 event types
# or pick bullish/bearish. Does not touch flatten / Webull / factor-mine.
# Sparse checkout: a full clone of this repo takes minutes and the job
# was being cancelled mid-fetch while other bots land on main.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jev_hop0.yml"
      - ".github/workflows/jev_gate.yml"
      - "src/jev_gate.py"
      - "src/test_jev_gate.py"
      - "00_grounding/jev_chokepoint_state.json"
      - "00_grounding/jev_gold.json"
      - "00_grounding/jev_junk_shapes.json"
      - "00_grounding/jev_closed_lists.json"
  schedule:
    - cron: "25 11 * * 1-6"
  workflow_dispatch:
    inputs:
      date:
        description: YYYY-MM-DD, latest, all, or gold
        required: false
        default: "latest"
        type: string
      limit:
        description: Max harvest titles after gold (0 = all that day)
        required: false
        default: "200"
        type: string
      code_only:
        description: "1 = skip Jev HTTP (code hops only)"
        required: false
        default: "0"
        type: string
      mine:
        description: "1 = also mine junk shapes from the parsed archive"
        required: false
        default: "0"
        type: string

permissions:
  contents: write

concurrency:
  group: jev-hop0-${{ github.sha }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            src
            00_grounding
            01_daily/news
            01_daily/events
            03_scoreboard
            scripts
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (no key)
        run: PYTHONPATH=. python3 -m src.test_jev_gate
      - name: Gold + capped harvest
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: |
          set -euo pipefail
          CODE=""
          if [ "${{ github.event.inputs.code_only }}" = "1" ]; then
            CODE="--code-only"
          fi
          if [ -z "${JEV_API_KEY}" ]; then
            echo "JEV_API_KEY empty — gold --code-only only"
            PYTHONPATH=. python3 -m src.jev_gate --gold --code-only
            exit 1
          fi
          PYTHONPATH=. python3 -m src.jev_gate --gold $CODE
          DATE="${{ github.event.inputs.date }}"
          DATE="${DATE:-latest}"
          LIMIT="${{ github.event.inputs.limit }}"
          LIMIT="${LIMIT:-200}"
          if [ "$DATE" != "gold" ]; then
            PYTHONPATH=. python3 -m src.jev_gate --date "$DATE" --limit "$LIMIT" $CODE
          fi
          if [ "${{ github.event.inputs.mine }}" = "1" ]; then
            PYTHONPATH=. python3 -m src.jev_gate --mine
          fi
      - name: Preview
        if: always()
        run: |
          head -80 03_scoreboard/JEV_GATE.md || true
          ls -lh 01_daily/news/*jev_keep* 01_daily/news/*jev_junk* || true
      # Do not safe_git_push from a sparse clone — it fights every other
      # main lander and the job gets cancelled mid-fetch. Artifact is
      # the keep list; a later full land can copy it.
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-gate
          if-no-files-found: warn
          path: |
            01_daily/news/*jev_keep*
            01_daily/news/*jev_junk*
            03_scoreboard/JEV_GATE.md
