name: Publish existing completed stock parser
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-completed-parser.yml'
      - 'scripts/export_completed_parser.py'
      - 'scripts/test_export_completed_parser.py'
      - 'src/specific_filing_records.py'
      - 'src/test_specific_filing_records.py'
      - 'dashboard/scanner-backtest/completed/index.html'
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh scanner test page]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/export_completed_parser.py
            scripts/test_export_completed_parser.py
            scripts/materialize_filing_texts.py
            scripts/resilient_filing_texts.py
            src/specific_filing_records.py
            src/test_specific_filing_records.py
            eval/nflx-specific-disclosure-cases.json
            dashboard/scanner-backtest/completed/index.html
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact quotation, paragraph and Unicode projection
        run: python -m unittest scripts.test_export_completed_parser src.test_specific_filing_records -v
      - name: Package existing decisions without SEC downloads or spaCy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u scripts/export_completed_parser.py --saved-zip --out completed-view
          cp dashboard/scanner-backtest/completed/index.html completed-view/index.html
          cp scripts/export_completed_parser.py completed-view/export_completed_parser.py
      - uses: actions/upload-artifact@v4
        with:
          name: completed-stock-parser-page
          path: completed-view/
          retention-days: 30
  publish:
    needs: build
    if: always() && (needs.build.result == 'success' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      pages: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success'
        with:
          name: completed-stock-parser-page
          path: ${{ runner.temp }}/completed-view
      - name: Publish all saved decisions and link them from the testing page
        env:
          INCOMING: ${{ runner.temp }}/completed-view
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" = 'success' ]; then
            python "$INCOMING/export_completed_parser.py" --profiles unused --out "$INCOMING" --publish-assets
          fi
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          targets=[Path(p)/'completed' for p in ('dashboard/scanner-backtest','scanner-backtest')]
          target=targets[0]
          incoming=Path(os.environ['INCOMING'])
          if os.environ['BUILD_RESULT']=='success':
              manifest=json.loads((incoming/'manifest.json').read_text())
              assert manifest['complete'] and manifest['published']['tickers']==2032 and manifest['published']['relationships']==754258
              outside=sum(p.stat().st_size for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and not any(p.is_relative_to(t) for t in targets))
              names=('index.html','manifest.json')
              size=sum((incoming/name).stat().st_size for name in names)*len(targets)
              assert outside+size<1_073_741_824, 'Complete saved review exceeds Pages budget; retain previous site'
              for target in targets:
                  target.mkdir(parents=True,exist_ok=True)
                  for name in names:shutil.copyfile(incoming/name,target/name)
              target=targets[0]
          if not (target/'manifest.json').is_file():
              print('Completed view has not finished its initial publication; preserving the current page')
          else:
              index=Path('dashboard/scanner-backtest/index.html')
              html=index.read_text()
              if 'id="completed-stock-results"' not in html:
                  link='<p id="completed-stock-results"><a href="completed/">Browse the completed 2,032-stock extraction — 754,258 saved relationships with source paragraphs</a></p>'
                  assert '<h1>Scanner backtest</h1>' in html
                  index.write_text(html.replace('<h1>Scanner backtest</h1>','<h1>Scanner backtest</h1>\n'+link,1))
          PY
          git config user.name 'Completed parser page publisher'
          git config user.email 'bot@users.noreply.github.com'
          if [ -d dashboard/scanner-backtest/completed ]; then
            git add dashboard/scanner-backtest/completed
          fi
          if [ -d scanner-backtest/completed ]; then
            git add scanner-backtest/completed
          fi
          git add dashboard/scanner-backtest/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish existing completed stock parser results"
            git push origin HEAD:gh-pages
          fi
      - name: Request normal Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
      - name: Verify the served all-stock manifest and testing-page link
        if: needs.build.result == 'success'
        env:
          INCOMING: ${{ runner.temp }}/completed-view
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          from pathlib import Path
          expected=json.loads((Path(os.environ['INCOMING'])/'manifest.json').read_text())
          base='https://sroyaltyy.github.io/fullscan/dashboard/scanner-backtest/'
          for attempt in range(36):
              try:
                  with urllib.request.urlopen(base+'completed/manifest.json?run=39522456843',timeout=20) as response: manifest=json.load(response)
                  with urllib.request.urlopen(base+'?completed=39522456843',timeout=20) as response: page=response.read().decode()
                  if manifest['complete'] and manifest['viewer_revision']==expected['viewer_revision'] and manifest['published']==expected['published'] and 'id="completed-stock-results"' in page:
                      print('Verified all 2,032 stock associations and 754,258 saved decisions on the public page');break
              except (OSError,ValueError,KeyError):pass
              time.sleep(10)
          else:raise SystemExit('The completed all-stock view is not verified live')
          PY
