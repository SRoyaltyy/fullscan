name: Hard-red exceptions (daily investigator list)

# Rank every 09:30 looker with the investigator card, even on S≤−3 sit
# mornings. Live flatten_robust / Webull sit is untouched.

on:
  schedule:
    # ~16:45 ET, after the close. Weekdays only. GitHub-hosted ubuntu-latest.
    - cron: "45 21 * * 1-5"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Factor strategy mine"
      - "Pre-Open ALL (predictive one-shot)"
    types: [completed]
  pull_request:
    paths:
      - "src/hard_red_exceptions.py"
      - "src/day_movers.py"
      - "src/test_hard_red_exceptions.py"
      - "src/test_day_movers.py"
      - "src/staleness_coverage.py"
      - "src/staleness_coverage.json"
      - "src/test_staleness_coverage.py"
      - ".github/workflows/hard_red_exceptions.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: hard-red-exceptions
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pandas pyarrow pytest
      - name: Test
        run: python -m pytest -q src/test_hard_red_exceptions.py src/test_day_movers.py src/test_staleness_coverage.py

  refuse-skip:
    # A parent that did not succeed used to skip this whole workflow
    # (2026-11-04 runs 41817206147 and the rest that day). That is a
    # failure, not a green skip. The weekday schedule still writes.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A skipped hard-red run is a failure
        run: |
          echo "ERROR: Hard-red exceptions did not rank."
          echo "Trigger: ${{ github.event.workflow_run.name }} run ${{ github.event.workflow_run.id }} concluded ${{ github.event.workflow_run.conclusion }}."
          echo "A skipped hard-red run is a failure. The page is not updated."
          exit 1

  rank:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pandas pyarrow pytest yfinance
      - name: Test
        run: python -m pytest -q src/test_hard_red_exceptions.py src/test_day_movers.py
      - name: Rank lookers
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m src.hard_red_exceptions --write
          test -s data/hard_red_exceptions/latest.json
          test -s dashboard/hard-red-exceptions/index.html
          test -s dashboard/hard-red-exceptions/tickers.json
          test -s dashboard/day-movers/index.html
          test -s dashboard/day-movers/days.json
      - name: Commit
        run: |
          bash scripts/safe_git_push.sh \
            "auto: hard-red exception investigator list" \
            data/hard_red_exceptions/latest.json \
            dashboard/hard-red-exceptions/index.html \
            dashboard/hard-red-exceptions/latest.json \
            dashboard/hard-red-exceptions/tickers.json \
            dashboard/hard-red-exceptions/t \
            dashboard/day-movers/days.json \
            dashboard/day-movers/index.html \
            03_scoreboard/HARD_RED_EXCEPTIONS.md
      - name: Refresh Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-dashboard.yml --ref main || true
