name: Pipeline health

# Audits every step: missing, empty, garbled, timeout stub, carry-forward,
# wrong date, skipped — plus book chain, outcomes, learning loop, Pages.
# With fix=true it re-dispatches the workflow that owns each required FAIL
# (guarded: <=1 dispatch/step/day, never when busy, never itself).

on:
  schedule:
    - cron: "15 14 * * 1-5"   # 10:15 ET — morning packet should already exist
    - cron: "30 4 * * 2-6"    # 00:30 ET — post-close should have landed
  workflow_dispatch:
    inputs:
      job:
        description: "all | runtime | preopen | postclose | scrape | afternoon"
        required: false
        default: "all"
      date:
        description: "pre-open session YYYY-MM-DD (empty = today ET)"
        required: false
        default: ""
      source_date:
        description: "post-close night (completed session); empty = previous weekday"
        required: false
        default: ""
      target_date:
        description: "post-close file date (next session); empty = --date"
        required: false
        default: ""
      fix:
        description: "true = re-dispatch owning workflow for each required FAIL"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write

concurrency:
  group: pipeline-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: [self-hosted, ecs]
    timeout-minutes: 12
    env:
      HOME: /home/gha
      FULLSCAN_HOME: /home/gha
      GROK_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        run: pip install -r requirements.txt

      - name: Audit pre-open + post-close artifacts
        env:
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROK_ONLY: "1"
        run: |
          set -uo pipefail
          export HOME=/home/gha
          JOB="${{ github.event.inputs.job }}"
          JOB="${JOB:-all}"
          DATE="${{ github.event.inputs.date }}"
          SOURCE="${{ github.event.inputs.source_date }}"
          TARGET="${{ github.event.inputs.target_date }}"
          ARGS=(--job "$JOB" --write)
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ -n "$SOURCE" ] && ARGS+=(--source-date "$SOURCE")
          [ -n "$TARGET" ] && ARGS+=(--target-date "$TARGET")
          [ "${{ github.event.inputs.fix }}" = "true" ] && ARGS+=(--fix)
          echo "CMD: python -m src.pipeline_health ${ARGS[*]}"
          python -m src.pipeline_health "${ARGS[@]}"

      - name: Show report
        if: always()
        run: |
          D="${{ github.event.inputs.date }}"
          D="${D:-$(TZ=America/New_York date +%F)}"
          echo "======== $D ========"
          ls -la 01_daily/${D}_pipeline_health.* 2>/dev/null || true
          cat "01_daily/${D}_pipeline_health.md" 2>/dev/null || true

      - name: Commit health report
        if: always()
        run: |
          export HOME=/home/gha
          bash scripts/safe_git_push.sh \
            "chore: pipeline health audit [$(date -u +%F_%H%M)]" \
            01_daily/*_pipeline_health.md \
            01_daily/*_pipeline_health.json \
            data/health/
