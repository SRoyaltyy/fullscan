name: Pipeline health

# One-stop diagnose + heal. Two clocks:
#   07:00 ET  --job preopen    door, GH scrape, last-night baseline, morning essays
#   00:30 ET  --job postclose  door, captain research, yesterday's book/outcomes
#
# Each run: audit → fix OpenClaw door / timers on this box → start systemd
# or spawn the owning ECS job (ubuntu scrape/weather/AB/Pages are
# GH-dispatched with force=true) → wait for files → re-audit, until
# required FAILs are gone or the heal budget is spent.
# Finviz HTML is never scraped here (Aliyun 403). xAI OAuth is human-only.
# Never GH-dispatches another ECS workflow (would queue behind this job).

on:
  # schedule disabled 2026-08-29 — not in live pipeline
  # schedule:
  #   # 07:00 EDT (06:00 EST). Packet should be landing; still before 09:25.
  #   - cron: "0 11 * * 1-5"
  #   # 00:30 ET Tue–Sat. Thursday 22:00 research should have started.
  #   - cron: "30 4 * * 2-6"
  workflow_dispatch:
    inputs:
      job:
        description: "auto (clock) | preopen | postclose | all | scrape | afternoon"
        required: false
        default: "auto"
      date:
        description: "pre-open session YYYY-MM-DD (empty = today ET)"
        required: false
        default: ""
      source_date:
        description: "completed session (post-close night / book date)"
        required: false
        default: ""
      target_date:
        description: "post-close file date (next session); empty = --date"
        required: false
        default: ""
      no_fix:
        description: "true = audit only (default). false = try to heal (holds ECS)."
        required: false
        default: "true"

permissions:
  contents: write
  actions: write

concurrency:
  group: pipeline-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: [self-hosted, ecs]
    timeout-minutes: 180
    env:
      HOME: /home/gha
      FULLSCAN_HOME: /home/gha
      GROK_ONLY: "0"
      HEALTH_HEAL_ROUNDS: "1"
    steps:
      - name: Clear stale git index.lock (shared ECS workspace)
        shell: bash
        run: |
          # A job killed mid-checkout leaves .git/index.lock; the next checkout then hangs.
          # One ECS runner, so a lock older than 1 minute before checkout is stale.
          W="${GITHUB_WORKSPACE:-.}"
          for L in "$W/.git/index.lock" "$W/.git/shallow.lock" "$W/.git/HEAD.lock"; do
            if [ -n "$(find "$L" -mmin +1 2>/dev/null)" ]; then echo "removing stale $L"; rm -f "$L" || sudo -n rm -f "$L" || true; fi
          done
          if [ "$(git -C "$W" config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::shared ECS workspace is sparse; this checkout re-materializes the full tree"
          fi
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0

      - name: Full tree after leftover sparse-checkout
        run: |
          # Shared ECS work dir keeps a prior job's sparse-checkout.
          git sparse-checkout disable || true
          test -f requirements.txt || {
            echo "ERROR: requirements.txt missing. A prior job left git sparse-checkout enabled on this self-hosted runner."
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        run: pip install -r requirements.txt

      - name: Diagnose + heal
        env:
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_ONLY: "0"
        run: |
          set -uo pipefail
          export HOME=/home/gha
          DATE_P="${{ github.event.inputs.date }}"
          DATE_P="${DATE_P:-$(TZ=America/New_York date +%F)}"
          python3 -m src.workflow_progress beat --workflow pipeline_health --date "$DATE_P" --stages audit --stage audit >> /tmp/progress_beat.log 2>&1 &
          echo $! > /tmp/progress_beat.pid
          trap 'kill "$(cat /tmp/progress_beat.pid)" 2>/dev/null || true' EXIT
          chmod +x scripts/enable_openclaw_chat.sh scripts/ecs_preopen.sh scripts/ecs_map_postclose.sh || true

          JOB="${{ github.event.inputs.job }}"
          if [ -z "$JOB" ] || [ "$JOB" = "auto" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            ET_HM=$((10#$(TZ=America/New_York date +%H%M)))
            if [ "$ET_HM" -ge 500 ] && [ "$ET_HM" -lt 1200 ]; then
              JOB=preopen
            else
              JOB=postclose
            fi
          fi
          DATE="${{ github.event.inputs.date }}"
          SOURCE="${{ github.event.inputs.source_date }}"
          TARGET="${{ github.event.inputs.target_date }}"
          ARGS=(--job "$JOB" --write --no-fix)
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ -n "$SOURCE" ] && ARGS+=(--source-date "$SOURCE")
          [ -n "$TARGET" ] && ARGS+=(--target-date "$TARGET")
          if [ "${{ github.event.inputs.no_fix }}" = "false" ]; then
            ARGS=(--job "$JOB" --write --fix)
            [ -n "$DATE" ] && ARGS+=(--date "$DATE")
            [ -n "$SOURCE" ] && ARGS+=(--source-date "$SOURCE")
            [ -n "$TARGET" ] && ARGS+=(--target-date "$TARGET")
          fi
          echo "CMD: python -m src.pipeline_health ${ARGS[*]}"
          echo "JOB=$JOB ET_HM=$(TZ=America/New_York date +%H%M)"
          python -m src.pipeline_health "${ARGS[@]}"
          python3 -m src.workflow_progress touch --workflow pipeline_health --date "$DATE_P" --stage audit --state ok || true

      - name: Show report
        if: always()
        run: |
          D="${{ github.event.inputs.date }}"
          D="${D:-$(TZ=America/New_York date +%F)}"
          echo "======== $D ========"
          ls -la 01_daily/${D}_pipeline_health* 2>/dev/null || true
          cat "01_daily/${D}_pipeline_health.md" 2>/dev/null || true

      - name: Commit health report
        if: always()
        run: |
          export HOME=/home/gha
          bash scripts/safe_git_push.sh \
            "chore: pipeline health heal [$(date -u +%F_%H%M)]" \
            01_daily/*_pipeline_health.md \
            01_daily/*_pipeline_health.json \
            01_daily/_xai_reauth.json \
            data/health/
