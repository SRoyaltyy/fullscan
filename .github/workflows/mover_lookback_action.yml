name: Mover Lookback Action

# For every session since 2026-08-13, take names knowable at 09:30
# (last completed Finviz: mcap > $100M, ADV > 500K, ATR% ≥ 2.5),
# paint ticker lookback, stamp BUY / SELL / NO BUY / HOLD, and score
# catch on forward +1d/+3d/+1w. Same-day Change% does not pick the list.

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "First session YYYY-MM-DD"
        required: false
        default: "2026-08-13"
      to_date:
        description: "Last session YYYY-MM-DD (empty = latest tape)"
        required: false
        default: ""
      preset:
        description: "featured | strict | setups | lane | loose"
        required: false
        default: "featured"

permissions:
  contents: write
  actions: write

concurrency:
  group: mover-lookback-action
  cancel-in-progress: true

jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pandas pyarrow openpyxl
      - name: Score liquid movers
        env:
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
          PRESET: ${{ inputs.preset }}
        run: |
          set -euo pipefail
          ARGS=(--from-date "${FROM_DATE:-2026-08-13}" --write)
          [ -n "${TO_DATE:-}" ] && ARGS+=(--to-date "$TO_DATE")
          [ -n "${PRESET:-}" ] && ARGS+=(--preset "$PRESET")
          python -m src.mover_lookback_action "${ARGS[@]}" | tee /tmp/mover-lookback-action.md
          test -s 03_scoreboard/MOVER_LOOKBACK_ACTION.md
          test -s 03_scoreboard/mover_lookback_action.json
          test -s dashboard/mover-lookback/index.html
      - name: Publish scoreboard to main
        run: |
          bash scripts/safe_git_push.sh \
            "chore: mover lookback action ${FROM_DATE:-2026-08-13}" \
            01_daily/mover_lookback_action.md \
            03_scoreboard/MOVER_LOOKBACK_ACTION.md \
            03_scoreboard/mover_lookback_action.json \
            dashboard/mover-lookback/
        env:
          FROM_DATE: ${{ inputs.from_date }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mover-lookback-action
          path: |
            03_scoreboard/MOVER_LOOKBACK_ACTION.md
            03_scoreboard/mover_lookback_action.json
            dashboard/mover-lookback/index.html
      - name: Add links to run summary
        run: |
          {
            echo "## Mover lookback action"
            echo
            echo "- [Markdown](https://github.com/${GITHUB_REPOSITORY}/blob/main/03_scoreboard/MOVER_LOOKBACK_ACTION.md)"
            echo "- [Phone page](https://SRoyaltyy.github.io/fullscan/dashboard/mover-lookback/)"
            echo
            awk '/^# Mover lookback/,/^## Called mornings/' 03_scoreboard/MOVER_LOOKBACK_ACTION.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-dashboard.yml --ref main
