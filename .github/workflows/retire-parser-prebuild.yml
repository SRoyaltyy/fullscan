# User-approved temporary cleanup; remove after the exact run is stopped.
name: Retire obsolete parser prebuild
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-parser-prebuild.yml']
permissions:
  actions: write
  contents: read
jobs:
  retire:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Stop only the superseded catalog rebuild
        uses: actions/github-script@v8
        with:
          script: |
            const run_id=40078301600;
            const run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id})).data;
            if(run.path!=='.github/workflows/stock-catalog-rollout.yml'||
               run.head_branch!=='codex/cumulative-scanner-validation'||
               run.head_sha!=='6a3fd0cedeedd61404e4d6a823f82780cc9a540e')
              throw new Error('Refusing to cancel a different workflow or revision.');
            if(run.status==='completed'){core.info('Superseded prebuild already completed.');return;}
            await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel',{...context.repo,run_id});
            core.info('Stopped obsolete prebuild; source artifacts and checkpoints are retained.');
