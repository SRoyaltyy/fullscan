name: Autonomous Daily Market Pipeline

on:
  schedule:
    # 8:17 PM HKT (12:17 UTC) - prediction - runs every day
    - cron: '34 11 * * 0-6'
    # 5:03 AM HKT (21:03 UTC previous day) - outcome - runs every day
    - cron: '3 21 * * 0-6'
  workflow_dispatch:
    inputs:
      stage:
        description: 'predict | outcome | reflect | all'
        required: true
        default: 'all'
      run_date:
        description: 'YYYY-MM-DD (default: today ET)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests yfinance pandas openai ddgs psycopg2-binary

      - name: Decide stage
        id: stage
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DOW=$(TZ=Asia/Hong_Kong date +%u)      # 1=Mon ... 6=Sat, 7=Sun
            HKT_HOUR=$(TZ=Asia/Hong_Kong date +%H)
            PLAN="none"

            # Determine base plan by time window
            if [ "$HKT_HOUR" -ge 19 ] && [ "$HKT_HOUR" -lt 24 ]; then
              PLAN="predict"
            elif [ "$HKT_HOUR" -ge 3 ] && [ "$HKT_HOUR" -lt 10 ]; then
              PLAN="outcome_reflect"
            fi

            # --- Weekend rule: skip ONLY prediction, allow outcome/reflection ---
            if [ "$PLAN" = "predict" ] && [ "$DOW" -ge 6 ]; then
              PLAN="none"
              echo "Weekend — prediction skipped (heartbeat only)."
            fi

            echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          else
            echo "plan=${{ github.event.inputs.stage }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Heartbeat (idle or weekend prediction skip)
        if: steps.stage.outputs.plan == 'none'
        run: echo "✅ Pipeline cron fired at $(TZ=Asia/Hong_Kong date) — no execution scheduled."

      - name: Run prediction stage
        if: steps.stage.outputs.plan == 'predict' || steps.stage.outputs.plan == 'all'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_KEY: ${{ secrets.DATABASE_KEY }}
          DATE: ${{ github.event.inputs.run_date }}
        run: python -m src.run_predict ${DATE:+--date "$DATE"}

      - name: Run outcome stage
        if: steps.stage.outputs.plan == 'outcome_reflect' || steps.stage.outputs.plan == 'outcome' || steps.stage.outputs.plan == 'all'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_KEY: ${{ secrets.DATABASE_KEY }}
          DATE: ${{ github.event.inputs.run_date }}
        run: python -m src.run_outcome ${DATE:+--date "$DATE"}

      - name: Run horizon grader (multi-timeframe T+h grades)
        if: steps.stage.outputs.plan == 'outcome_reflect' || steps.stage.outputs.plan == 'outcome' || steps.stage.outputs.plan == 'all'
        run: python -m src.horizon_grade ${DATE:+--date "$DATE"}

      - name: Wait 5 minutes before reflection (if outcome/reflect is planned)
        if: steps.stage.outputs.plan == 'outcome_reflect' || steps.stage.outputs.plan == 'all'
        run: sleep 300

      - name: Run reflection stage
        if: steps.stage.outputs.plan == 'outcome_reflect' || steps.stage.outputs.plan == 'reflect' || steps.stage.outputs.plan == 'all'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATE: ${{ github.event.inputs.run_date }}
        run: python -m src.run_reflect ${DATE:+--date "$DATE"}

      - name: Commit updated logs & scoreboard
        run: |
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          bash scripts/unstage_growth_blobs.sh
          git commit -m "auto: pipeline run [$(date -u +%F_%H%M)]" || echo "No changes"
          git pull --rebase origin main || true
          git push origin main
