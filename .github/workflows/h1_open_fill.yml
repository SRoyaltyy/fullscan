name: h1 open fill

# Same clock as the holdup open-fill.
# 13:35 UTC = 09:35 ET during EDT (UTC-4, through 2026-11-01) and 08:35 ET
# during EST (UTC-5, from 2026-11-01). Hong Kong Time is 9:35 PM the same
# calendar day (UTC+8, no DST). GitHub cron does not follow DST. During EST
# this is before the 09:30 open. A buy or sell leg whose bar is missing
# or dated another session writes nothing and exits non-zero. The 21:30
# UTC fill writes the trades. A sealed-bar reprint follows the post-close
# rule: the stored bar stays, and only two OHLC fields that each moved by
# more than one cent stop the run.
# Reads the h1 plan sealed at 13:05 UTC for today's session. No plan for
# today, including 2026-09-28, appends nothing.

on:
  schedule:
    - cron: "35 13 * * 1-5"
    # Backup ~10 min later. GitHub can drop or delay a scheduled run; the gate
    # job below makes either cron a no-op once today's open_fill is sealed.
    - cron: "45 13 * * 1-5"
    # EST (from 2026-11-01): 09:35/09:45 ET. The gate skips any run before
    # 09:35 New York time, so the off-season pair is a no-op.
    - cron: "35 14 * * 1-5"
    - cron: "45 14 * * 1-5"
    # 2026-11-04: no scheduled run was created at all. 11-02 and 11-03 fired
    # hours late or were cancelled while pending in the shared h1-forward
    # group. Every 10 minutes 14:00-15:50 UTC is the fallback. The gate
    # makes a repeat a no-op and refuses anything before 09:35 ET.
    - cron: "*/10 14-15 * * 1-5"
  # Plan seal and the paper workflow are the punctual start. A repeat is
  # a no-op (same gate). This does not place an order. webull_paper.yml
  # is the only sender and it refuses at 09:25 ET.
  workflow_run:
    workflows:
      - "h1 append-only forward"
      - "Holdup append-only forward"
      - "Webull paper (OpenAPI sandbox)"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Own group. Sharing h1-forward let a later plan-seal or post-close fill
# cancel the pending open fill (GitHub drops the previous pending run in
# a group even when cancel-in-progress is false). cancel-in-progress stays
# false so the running attempt is kept. A newer open-fill run may replace
# an older one that is still only pending; the survivor is still an open
# fill, and the gate no-ops it once today's row exists.
concurrency:
  group: h1-open-fill
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    # 2026-11-02: a full checkout hung in `git fetch main` past 5 min
    # (41464776218, 41464784743, 41465774154, 41465782037). The gate reads
    # one script and one ledger, so fetch only those, shallow and sparse.
    timeout-minutes: 12
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/open_fill_gate.py
            /research/hot_n4_clean_v4/forward_h1/h1_log.jsonl
            /research/hot_n4_clean_v4/forward_h1/skips.jsonl
            /research/hot_n4_clean_v4/forward_h1/fill_missing_notes.jsonl
            /data/paper_open/*_status.json
      - name: Today's plan sealed and open fill not yet sealed (America/New_York)
        id: gate
        run: >-
          python3 scripts/open_fill_gate.py research/hot_n4_clean_v4/forward_h1/h1_log.jsonl
          --skips research/hot_n4_clean_v4/forward_h1/skips.jsonl
          --notes research/hot_n4_clean_v4/forward_h1/fill_missing_notes.jsonl
          --paper-status-dir data/paper_open

  open-fill:
    needs: gate
    # A manual dispatch always runs. schedule and workflow_run run only
    # when the gate says so: before 09:35 ET, or once today's open_fill
    # row exists, this writes nothing. No Webull order.
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bar dependencies
        run: pip install numpy pandas pyarrow yfinance
      - name: Theme Radar history for the frozen panel
        run: |
          set -euo pipefail
          if ! git clone --filter=blob:none --no-checkout \
              https://github.com/SRoyaltyy/theme-radar.git vendor/theme-radar; then
            echo "theme-radar clone failed; the price refresh will fetch held names and IWM only"
            exit 0
          fi
          git -C vendor/theme-radar sparse-checkout init --cone
          git -C vendor/theme-radar sparse-checkout set research/lever_panel
          git -C vendor/theme-radar checkout main \
            || echo "theme-radar checkout failed"
      - name: Refresh forward prices
        id: prices
        env:
          FORWARD_BOOK: h1
        run: PYTHONHASHSEED=0 python3 research/hot_n4_clean_v4/forward/h1_fill_missing.py research/hot_n4_clean_v4/forward/prices.py
      - name: Seal the open fill
        id: open_fill
        if: success()
        env:
          FORWARD_BOOK: h1
          HOLDUP_GIT_REF: origin/main
          HOLDUP_MODE: open_fill
        run: PYTHONHASHSEED=0 python3 research/hot_n4_clean_v4/forward/h1_fill_missing.py research/hot_n4_clean_v4/forward/forward.py
      - name: Refresh the h1 close display
        id: closes
        if: success()
        env:
          FORWARD_BOOK: h1
        run: PYTHONHASHSEED=0 python3 research/hot_n4_clean_v4/forward/h1_fill_missing.py research/hot_n4_clean_v4/forward/h1_closes.py
      - name: Commit the append
        if: always()
        run: |
          set -euo pipefail
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          files=(
            research/hot_n4_clean_v4/forward_h1/h1_log.jsonl
            research/hot_n4_clean_v4/forward_h1/LEDGER.jsonl
            research/hot_n4_clean_v4/forward_h1/skips.jsonl
            research/hot_n4_clean_v4/forward_h1/prices.jsonl
            research/hot_n4_clean_v4/forward_h1/PRICE_LEDGER.jsonl
            research/hot_n4_clean_v4/forward_h1/price_revisions.jsonl
            dashboard/h1/log.json
            dashboard/h1/status.json
            dashboard/h1/closes.json
          )
          for path in "${files[@]}"; do
            if [ -f "$path" ]; then
              git add -- "$path"
            fi
          done
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Seal the h1 open fill."
          # Race-safe, add-only push (see the script header). Conflicts in
          # append-only price/skip logs keep every upstream line and append ours;
          # a conflict in LEDGER / *_log.jsonl still fails, never forces.
          bash scripts/append_only_rebase_push.sh 8
      - name: Fail the job when the book halted
        if: steps.prices.outcome == 'failure' || steps.open_fill.outcome == 'failure' || steps.closes.outcome == 'failure'
        run: exit 1
