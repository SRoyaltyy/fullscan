name: updown shadow freeze (paper, rel1_hv_v1 + expmove_v1)

# PAPER ONLY - updown_rel1_hv_v1 failed the multiple-testing haircut (t 2.02 vs 3.37). No broker wiring, no orders.
#
# Freezes, per trading day N, BEFORE 09:20 ET (written) / 09:24 ET (pushed) / 09:25 ET (lock deadline):
#   research/updown_rel1_hv_v1/days/<N>/  (picks, scores, frozen feature matrix, earnings used, manifest) + LOCKS.jsonl line
#   dashboard/updown/data/expmove/days/<N>.json (updown_expmove_v1 risk rank)                             + LOCKS.jsonl line
# Inputs are only data knowable before 09:30 ET on N (Yahoo daily bars dated < N, SPY/VIX closes < N, Nasdaq earnings
# calendar); no same-day open. So the freeze runs from 17:15 ET on the previous session (final bars) onwards; the
# morning runs are backstops. After the close it writes the separate realized ledger (pick files are never edited).
#
# Isolation from the 09:30 path: own concurrency group, ubuntu-latest, writes only its own three folders, never writes
# between 09:20 and 09:45 ET on a session day, pushes with GITHUB_TOKEN (starts no workflows), rebase-retry on push.
# Cron on this repo runs late, so workflow_run triggers after post-close / pre-open jobs are the main path; every
# trigger simply re-gates and exits in seconds when nothing is due.

on:
  schedule:
    - cron: "40 21 * * 1-5"   # 17:40 EDT / 16:40 EST
    - cron: "45 22 * * 1-5"   # 18:45 EDT / 17:45 EST
    - cron: "30 0 * * 2-6"    # 20:30 EDT / 19:30 EST (prev day)
    - cron: "0 9 * * 1-5"     # 05:00 EDT / 04:00 EST
    - cron: "15 11 * * 1-5"   # 07:15 EDT / 06:15 EST
    - cron: "35 12 * * 1-5"   # 08:35 EDT / 07:35 EST
    - cron: "0 20 * * 6,0"    # weekend catch-up (Mon freeze can run Sat/Sun)
  workflow_run:
    workflows:
      - "h1 post-close fill"
      - "Post-Close ALL (grade + learn + next captains)"
      - "Finviz pre-open scrape (GH-hosted Elite)"
      - "Pre-Open ALL (predictive one-shot)"
      - "h1 append-only forward"
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = full freeze for `date` into a temp dir; nothing committed"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      date:
        description: "dry run only: YYYY-MM-DD (empty = next due day)"
        required: false
        default: ""
  pull_request:
    paths:
      - "research/updown_rel1_hv_v1/**"
      - "dashboard/updown/data/expmove/**"
      - "dashboard/updown-shadow/**"
      - ".github/workflows/updown_shadow.yml"
  push:
    branches: [main]
    paths:
      - "research/updown_rel1_hv_v1/**"
      - "dashboard/updown/data/expmove/**"
      - ".github/workflows/updown_shadow.yml"

permissions:
  contents: read

env:
  # same versions the frozen models were trained/validated with
  PIP_PKGS: "pandas==3.0.6 numpy==2.5.3 lightgbm==4.7.0 yfinance==1.7.0 pyarrow==25.0.1 requests"
  GATE_PKGS: "pandas==3.0.6 numpy==2.5.3"
  T: research/updown_rel1_hv_v1/ushadow.py

jobs:
  check:
    name: Lock check (append-only) + tests + verify
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            research/updown_rel1_hv_v1
            dashboard/updown/data/expmove
            dashboard/updown-shadow
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -q $PIP_PKGS pytest
      - name: Unit tests
        run: python -m pytest -q research/updown_rel1_hv_v1/test_ushadow.py
      - name: IRONCLAD - fail if any locked day or lock line changed (base vs head)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then python $T check; exit $?; fi
          git fetch --no-tags --filter=blob:none origin "$BASE" || true
          python $T check --base-ref "$BASE"
      - name: Restart check - re-score locked days from frozen features
        run: python $T verify

  run:
    name: Freeze (before 09:20 ET) / realize (after close)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: updown-shadow
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            research/updown_rel1_hv_v1
            dashboard/updown/data/expmove
            dashboard/updown-shadow
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Gate
        id: gate
        run: |
          pip install -q $GATE_PKGS
          python $T gate | tee "$RUNNER_TEMP/gate.json"
          python3 - "$RUNNER_TEMP/gate.json" >> "$GITHUB_OUTPUT" <<'EOF'
          import json, sys
          g = json.load(open(sys.argv[1]))
          print('work=' + ('true' if g['work'] else 'false'))
          EOF
      - name: Install
        if: steps.gate.outputs.work == 'true' || github.event.inputs.dry_run == 'true'
        run: pip install -q $PIP_PKGS
      - name: Dry run (dispatch; writes nothing to the repo)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        env:
          D: ${{ github.event.inputs.date }}
        run: |
          python $T check
          if [ -n "$D" ]; then python $T dryrun --date "$D" --out "$RUNNER_TEMP/dry"; else python $T dryrun --out "$RUNNER_TEMP/dry"; fi
          find "$RUNNER_TEMP/dry" -type f | sort
          cat "$RUNNER_TEMP"/dry/research/updown_rel1_hv_v1/LOCKS.jsonl
          git status --porcelain | tee /dev/stderr | (! grep -q .)
          echo "dry run OK - nothing written to the repo"
      - name: Run (freeze if due, realize, dashboard data) and push
        if: steps.gate.outputs.work == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          python $T run
          P="research/updown_rel1_hv_v1 dashboard/updown/data/expmove dashboard/updown-shadow"
          git add -A -- $P
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          FROZE=$(git diff --cached --name-only -- research/updown_rel1_hv_v1/days | sed -n 's#research/updown_rel1_hv_v1/days/\([0-9-]*\)/.*#\1#p' | sort -u | tail -1)
          git commit -q -m "auto: updown shadow ${FROZE:+freeze $FROZE + }realized/dashboard (paper only)"
          for i in 1 2 3 4 5 6 7 8; do
            if [ -n "$FROZE" ]; then python $T pushok --date "$FROZE" || { echo "past 09:24 ET for $FROZE - dropping the unpushed freeze"; exit 1; }; fi
            git fetch --no-tags --filter=blob:none origin +refs/heads/main:refs/remotes/origin/main
            if ! git rebase -q origin/main; then git rebase --abort || true; echo "rebase conflict on own paths"; exit 1; fi
            python $T check --base-ref origin/main
            if git push origin HEAD:main; then echo "pushed $(git rev-parse --short HEAD)"; exit 0; fi
            sleep $((i * 4))
          done
          echo "push failed after retries"; exit 1
