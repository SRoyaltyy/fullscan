name: JEV day score for the site

on:
  workflow_dispatch:
    inputs:
      date:
        description: YYYY-MM-DD
        required: true
        default: "2026-10-01"
        type: string
      limit:
        description: Max headlines
        required: false
        default: "200"
        type: string

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Score the day
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.JEV_API_KEY }}
          JEV_GATE_POLICY: candidate-v2
          JEV_MODEL: jev-1.13.0
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m src.jev_gate --date "${{ github.event.inputs.date }}" --limit "${{ github.event.inputs.limit }}"
      - name: Publish scores onto the site
        env:
          DATE: ${{ github.event.inputs.date }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json, os
          from pathlib import Path
          date = os.environ["DATE"]
          src = Path(f"01_daily/news/{date}_jev_keep.json")
          doc = json.loads(src.read_text())
          found = []
          def walk(node):
              if isinstance(node, list):
                  for x in node:
                      walk(x)
                  return
              if not isinstance(node, dict):
                  return
              title = node.get("title") or node.get("headline") or node.get("name")
              decision = str(node.get("decision") or node.get("jev") or node.get("verdict") or "").upper()
              if title and decision in {"KEEP", "DROP"}:
                  found.append({"title": title, "decision": decision, "reason": node.get("reason") or node.get("why") or ""})
              for key in ("items", "rows", "keeps", "dropped", "decisions", "all_items"):
                  if isinstance(node.get(key), list):
                      walk(node[key])
          walk(doc)
          if not found:
              raise SystemExit(f"no verdicts in {src}")
          out = Path(f"dashboard/news-dir/scores/{date}.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({"date": date, "items": found}, ensure_ascii=False, indent=2))
          print(f"site scores {len(found)} -> {out}")
          PY
          git config user.name "SRoyaltyy"
          git config user.email "104515113+SRoyaltyy@users.noreply.github.com"
          git add -f "01_daily/news/${DATE}_jev_keep.json" "dashboard/news-dir/scores/${DATE}.json"
          git diff --cached --stat
          git commit -m "Publish ${DATE} JEV scores on the news directory"
          git push
