name: Open 09:30 tests

# Gates the bell contract on PRs. No secrets. No flatten_robust. No REAL.

on:
  pull_request:
    paths:
      - ".github/workflows/open_0930.yml"
      - ".github/workflows/open_0930_test.yml"
      - ".github/workflows/webull_paper.yml"
      - ".github/workflows/daily_orchestrator.yml"
      - ".github/workflows/publish_strategy_tickets.yml"
      - ".github/workflows/deploy-dashboard.yml"
      - "src/open_0930_clock.py"
      - "src/test_open_0930.py"
      - "src/webull_exec.py"
      - "src/combo_broker.py"
      - "src/strategy_tickets.py"
      - "src/skip_if_good.py"
      - "src/test_skip_if_good.py"
      - "src/elite_live_px.py"
      - "src/test_elite_live_px.py"
      - "src/publish_live_boards.py"
      - "src/day_board.py"
      - "src/test_day_board.py"
      - "src/book_suggestions.py"
      - "src/test_book_suggestions.py"
      - "src/overlay_live_strip.py"
      - "src/factor_mine_dash.html"
      - "src/paper_dash.html"
      - "dashboard/index.html"
      - "dashboard/day-board/index.html"
      - "dashboard/factor-mine/index.html"
      - "dashboard/strategy-board/index.html"
      - "data/day_board/today.json"
      - "data/day_board/today_strategies.json"
      - "data/day_board/*_open_0930.json"
      - "scripts/publish_open_pack.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/open_0930.yml"
      - ".github/workflows/open_0930_test.yml"
      - ".github/workflows/webull_paper.yml"
      - "src/open_0930_clock.py"
      - "src/test_open_0930.py"
      - "scripts/publish_open_pack.sh"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pandas numpy pyarrow openpyxl
      - name: Clock + pack + paper contract
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m src.test_open_0930
          PYTHONPATH=. python3 -m src.test_strategy_tickets
          PYTHONPATH=. python3 -m src.test_webull_exec
          PYTHONPATH=. python3 -m src.test_combo_broker
          PYTHONPATH=. python3 -m src.test_skip_if_good
          PYTHONPATH=. python3 -m src.test_elite_live_px
          PYTHONPATH=. python3 -m src.test_book_suggestions
          PYTHONPATH=. python3 -c "
          from src.test_day_board import (
              test_write_json_keeps_open_0930_lock_over_ranker_scores,
              test_write_json_keeps_last_closed_elite_before_next_bell,
              test_write_json_drops_yesterday_lock_after_bell,
              test_day_board_html_has_raw_poll,
          )
          test_write_json_keeps_open_0930_lock_over_ranker_scores()
          test_write_json_keeps_last_closed_elite_before_next_bell()
          test_write_json_drops_yesterday_lock_after_bell()
          test_day_board_html_has_raw_poll()
          print('day_board lock+html ok')
          "
