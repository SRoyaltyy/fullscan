name: AB Backfill (PIT daily, up to 6m)

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Optional single ticker (recommended first). Blank = full liquid (heavy)"
        required: false
        default: "AAPL"
      months:
        description: "Lookback months"
        required: false
        default: "6"
      start:
        description: "Optional start YYYY-MM-DD (overrides months)"
        required: false
        default: ""
      end:
        description: "Optional end YYYY-MM-DD"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pyarrow

      - name: PIT backfill
        run: |
          set -euo pipefail
          ARGS=(--months "${{ inputs.months }}")
          [ -n "${{ inputs.start }}" ] && ARGS+=(--start "${{ inputs.start }}")
          [ -n "${{ inputs.end }}" ] && ARGS+=(--end "${{ inputs.end }}")
          T="${{ inputs.ticker }}"
          T=$(echo "$T" | tr '[:lower:]' '[:upper:]' | tr -d ' ')
          if [ -n "$T" ]; then ARGS+=(--ticker "$T"); fi
          echo "CMD: python -m src.ab_backfill ${ARGS[*]}"
          python -m src.ab_backfill "${ARGS[@]}"
          ls -la data/ab_backfill/ | tail

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-backfill
          path: data/ab_backfill/
          if-no-files-found: warn

      - name: Commit
        if: always()
        run: |
          set -euo pipefail
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/ab_backfill/ || true
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: AB PIT backfill $(date -u +%F)"
          git pull --rebase origin main || true
          git push origin HEAD:main
