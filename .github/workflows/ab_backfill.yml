name: AB Backfill (PIT daily)

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker (blank = full liquid — heavy)"
        required: false
        default: "AAPL"
      months:
        description: "Lookback months from end (e.g. 24) — OHLC covers full window"
        required: false
        default: "24"
      start:
        description: "Optional start YYYY-MM-DD (overrides months)"
        required: false
        default: ""
      end:
        description: "Optional end YYYY-MM-DD"
        required: false
        default: ""
      bootstrap_days:
        description: "yfinance history calendar days (800≈26m, 1000≈33m)"
        required: false
        default: "900"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pyarrow

      - name: Ensure price history
        run: |
          set -euo pipefail
          DAYS="${{ inputs.bootstrap_days }}"
          DAYS="${DAYS:-900}"
          T="${{ inputs.ticker }}"
          T=$(echo "$T" | tr '[:lower:]' '[:upper:]' | tr -d ' ')
          if [ -n "$T" ]; then
            python -m src.price_store bootstrap --days "$DAYS" --tickers "$T"
          else
            python -m src.price_store bootstrap --days "$DAYS"
          fi

      - name: PIT backfill
        run: |
          set -euo pipefail
          ARGS=()
          M="${{ inputs.months }}"
          if [ -n "$M" ]; then ARGS+=(--months "$M"); fi
          [ -n "${{ inputs.start }}" ] && ARGS+=(--start "${{ inputs.start }}")
          [ -n "${{ inputs.end }}" ] && ARGS+=(--end "${{ inputs.end }}")
          T="${{ inputs.ticker }}"
          T=$(echo "$T" | tr '[:lower:]' '[:upper:]' | tr -d ' ')
          if [ -n "$T" ]; then ARGS+=(--ticker "$T"); fi
          echo "CMD: python -m src.ab_backfill ${ARGS[*]}"
          python -m src.ab_backfill "${ARGS[@]}"
          echo "==== MD head ===="
          ls -la data/ab_backfill/
          head -30 data/ab_backfill/*.md 2>/dev/null | head -40 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-backfill
          path: data/ab_backfill/
          if-no-files-found: warn

      - name: Commit
        if: always()
        run: |
          set -euo pipefail
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/ab_backfill/ data/prices/meta.json || true
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: AB PIT backfill $(date -u +%F)"
          git pull --rebase origin main || true
          git push origin HEAD:main
