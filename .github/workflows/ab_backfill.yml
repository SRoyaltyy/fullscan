name: AB Backfill (PIT daily)

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker (blank = full liquid universe)"
        required: false
        default: ""
      months:
        description: "Lookback months from end (12 matches the universe resume checkpoint)"
        required: false
        default: "12"
      start:
        description: "Optional start YYYY-MM-DD (overrides months)"
        required: false
        default: ""
      end:
        description: "Optional end YYYY-MM-DD"
        required: false
        default: ""
      bootstrap_days:
        description: "yfinance history calendar days (800≈26m, 1000≈33m)"
        required: false
        default: "900"
      skip_bootstrap:
        description: "Skip price_store bootstrap (use data/prices/ohlc.parquet as-is)"
        type: boolean
        required: false
        default: false
      skip_events:
        description: "Skip yfinance E/R prefetch (required for universe to finish in 6h)"
        type: boolean
        required: false
        default: true
      md_only:
        description: "Skip PIT scoring; rebuild BB-style MD from existing parquet"
        type: boolean
        required: false
        default: false
      md_path:
        description: "Parquet for md_only (blank = newest *_universe.parquet, not resume)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pyarrow

      - name: Ensure price history
        if: ${{ inputs.skip_bootstrap != true && inputs.md_only != true }}
        run: |
          set -euo pipefail
          DAYS="${{ inputs.bootstrap_days }}"
          DAYS="${DAYS:-900}"
          T="${{ inputs.ticker }}"
          T=$(echo "$T" | tr '[:lower:]' '[:upper:]' | tr -d ' ')
          if [ -n "$T" ]; then
            python -m src.price_store bootstrap --days "$DAYS" --tickers "$T"
          else
            python -m src.price_store bootstrap --days "$DAYS"
          fi

      - name: Price store status
        if: ${{ inputs.md_only != true }}
        run: python -m src.price_store status || true

      - name: PIT backfill
        if: ${{ inputs.md_only != true }}
        run: |
          set -euo pipefail
          ARGS=()
          M="${{ inputs.months }}"
          if [ -n "$M" ]; then ARGS+=(--months "$M"); fi
          [ -n "${{ inputs.start }}" ] && ARGS+=(--start "${{ inputs.start }}")
          [ -n "${{ inputs.end }}" ] && ARGS+=(--end "${{ inputs.end }}")
          T="${{ inputs.ticker }}"
          T=$(echo "$T" | tr '[:lower:]' '[:upper:]' | tr -d ' ')
          if [ -n "$T" ]; then ARGS+=(--ticker "$T"); fi
          if [ "${{ inputs.skip_events }}" != "false" ]; then
            ARGS+=(--skip-events)
          else
            ARGS+=(--events)
          fi
          echo "CMD: python -u -m src.ab_backfill ${ARGS[*]}"
          python -u -m src.ab_backfill "${ARGS[@]}"
          echo "==== outputs ===="
          ls -lah data/ab_backfill/ | tail -30
          LATEST_MD=$(ls -1t data/ab_backfill/*universe*.md data/ab_backfill/*.md 2>/dev/null | head -1 || true)
          if [ -n "$LATEST_MD" ]; then
            echo "===== $LATEST_MD ====="
            head -80 "$LATEST_MD"
          fi

      - name: Rebuild MD from parquet
        if: ${{ inputs.md_only == true }}
        run: |
          set -euo pipefail
          P="${{ inputs.md_path }}"
          if [ -z "$P" ]; then
            # largest non-resume universe parquet (12m > 6m slice); else resume checkpoint
            P=$(ls -1S data/ab_backfill/*_universe.parquet 2>/dev/null | head -1 || true)
          fi
          if [ -z "$P" ]; then
            P=$(ls -1t data/ab_backfill/*universe*.resume.parquet 2>/dev/null | head -1 || true)
          fi
          if [ -z "$P" ] || [ ! -f "$P" ]; then
            echo "No universe parquet found for --md-only"
            ls -lah data/ab_backfill/ || true
            exit 1
          fi
          echo "CMD: python -u -m src.ab_backfill --md-only $P"
          python -u -m src.ab_backfill --md-only "$P"
          echo "==== outputs ===="
          ls -lah data/ab_backfill/*.md | tail -20
          for f in data/ab_backfill/*universe*.md; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            head -40 "$f"
            echo "----- audit -----"
            grep -A 80 '^## Pattern correlation audit' "$f" | head -90
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-backfill
          path: data/ab_backfill/
          if-no-files-found: warn

      - name: Commit
        if: always()
        run: |
          set -euo pipefail
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/ab_backfill/ data/prices/ || true
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: AB PIT backfill $(date -u +%F)"
          git pull --rebase origin main || true
          git push origin HEAD:main
