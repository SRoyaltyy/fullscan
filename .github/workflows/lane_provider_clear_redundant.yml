name: Clear superseded provider diagnostic
on:
  push:
    branches: [codex/lane-provider-repair-20261014]
    paths: ['.github/workflows/lane_provider_clear_redundant.yml']
permissions:
  actions: write
  contents: read
jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          base='https://api.github.com/repos/SRoyaltyy/fullscan/actions/runs/38431474235'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          with urllib.request.urlopen(urllib.request.Request(base,headers=headers)) as response:run=json.load(response)
          assert run['head_sha']=='e9d95a773986bc1010e916c56da092ed0439a6cb'
          assert run['head_branch']=='codex/lane-provider-repair-20261014'
          assert run['path']=='.github/workflows/lane_provider_validation.yml'
          if run['status']!='completed':
              with urllib.request.urlopen(urllib.request.Request(base+'/cancel',headers=headers,data=b'',method='POST')) as response:print('Cancelled superseded diagnostic:',response.status)
          PY
