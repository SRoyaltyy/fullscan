name: Excel Bot (cluster signals daily)

# The local 18:30 Windows pipeline, moved to GitHub. Zero tokens.
# Fetch (Yahoo v8 HTTPS, incremental) -> Excel-replica engine (same formulas,
# same colors) -> strategy signals -> on a final run, append to ONE
# suggestions.csv and refresh tracking -> daily MD summary. A draft run
# writes the draft note only.
# From 2026-10-06, excel_bot/freeze_manifest.json fingerprints each signal
# day after that session has closed. A run before 16:00 ET writes the
# draft markdown only: it does not append suggestions.csv and does not
# write the manifest. signal_freeze.py --verify fails closed before the
# commit if a locked day changed. Days before 2026-10-06 are pre-lock
# and are not hashed.
#
# State (the 3,603-ticker price cache) lives on the orphan branch
# `excel-state` as state/rows.tar.gz, squashed every run so it never grows.

on:
  schedule:
    # Draft. Tue-Sat 10:30 UTC. GitHub usually starts this before the
    # 16:00 ET cash close, so that run writes the draft only.
    - cron: "30 10 * * 2-6"
    # Final. Mon-Fri 21:17 UTC = 17:17 EDT / 16:17 EST, after the close
    # in both DST states. The same job as a manual dispatch left on
    # limit=0 and signals_only=false. A late start (even after midnight
    # UTC) stamps the last completed NYSE session in America/New_York,
    # not the UTC date. Weekend/holiday and pre-close runs do not create
    # a final for a session that has not closed.
    - cron: "17 21 * * 1-5"
  pull_request:
    paths:
      - "excel_bot/engine/gh_summary.py"
      - "excel_bot/engine/test_gh_summary.py"
      - "excel_bot/engine/signal_freeze.py"
      - "excel_bot/engine/test_signal_freeze.py"
      - "excel_bot/engine/daily_run.py"
      - "excel_bot/freeze_manifest.json"
      - "src/factor_mine_freeze.py"
      - "src/test_factor_mine_freeze.py"
      - ".github/workflows/excel_bot.yml"
  workflow_dispatch:
    inputs:
      limit:
        description: "only first N tickers (0 = all 3,603)"
        required: false
        default: "0"
      signals_only:
        description: "true = skip fetch, re-derive signals from cached grids"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pandas
      - name: Draft vs final dated signal, and signal-day lock
        run: |
          python excel_bot/engine/test_gh_summary.py
          # test_pre_close_run_does_not_write_suggestions_csv_or_freeze_manifest
          # fails if a New York session before 16:00 ET writes
          # excel_bot/suggestions/suggestions.csv or excel_bot/freeze_manifest.json.
          python excel_bot/engine/test_signal_freeze.py

  run:
    if: github.event_name != 'pull_request'
    concurrency:
      group: excel-bot
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install openpyxl

      - name: Restore price-cache state (excel-state branch)
        run: |
          set -euo pipefail
          mkdir -p excel_bot/data/rows
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/excel-state/state/rows.tar.gz" -o /tmp/rows.tar.gz
          tar -xzf /tmp/rows.tar.gz -C excel_bot/data/rows
          echo "restored $(ls excel_bot/data/rows | wc -l) ticker caches"

      - name: Run fetch + engine + signals + tracking
        working-directory: excel_bot
        env:
          LIMIT: ${{ github.event.inputs.limit }}
          SIGNALS_ONLY: ${{ github.event.inputs.signals_only }}
        run: |
          set -euo pipefail
          # schedule has no workflow_dispatch inputs. Same full path as
          # Run workflow left on the defaults: all tickers, fetch on.
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            LIMIT=0
            SIGNALS_ONLY=false
          fi
          ARGS=""
          if [ -n "${LIMIT:-}" ] && [ "${LIMIT:-0}" != "0" ]; then ARGS="--limit $LIMIT"; fi
          if [ "${SIGNALS_ONLY:-false}" = "true" ]; then ARGS="$ARGS --signals-only"; fi
          echo "event=${GITHUB_EVENT_NAME} limit=${LIMIT:-0} signals_only=${SIGNALS_ONLY:-false}"
          echo "CMD: python engine/daily_run.py --workers 4 $ARGS"
          python engine/daily_run.py --workers 4 $ARGS
          # Locked signal days must already match freeze_manifest.json.
          python engine/signal_freeze.py --verify
          # Session date is America/New_York, never the UTC date.
          # Before 16:00 ET on a session day this writes the draft only.
          # At/after 16:00 ET, or on a weekend/holiday for the previous
          # completed session, it creates the final once, then REFUSE.
          python engine/gh_summary.py

      - name: Save price-cache state (squash excel-state)
        if: always()
        run: |
          set -euo pipefail
          git config user.name "excel-bot"
          git config user.email "excel-bot@users.noreply.github.com"
          git fetch origin excel-state
          git worktree add --detach /tmp/state FETCH_HEAD
          tar -czf /tmp/state/state/rows.tar.gz -C excel_bot/data/rows .
          cd /tmp/state
          git add state/rows.tar.gz
          git commit -q --amend -m "excel-state: rows cache after $(date -u +%F) run"
          git push -q -f origin HEAD:excel-state
          echo "state saved"

      - name: Commit suggestions + daily summary to main
        if: always()
        run: |
          set -euo pipefail
          if ! python excel_bot/engine/signal_freeze.py --verify; then
            echo "[freeze] FAIL CLOSED — committing nothing"
            exit 1
          fi
          # Before 16:00 ET this run is a draft. Do not commit
          # suggestions.csv or freeze_manifest.json even if they changed.
          # The draft note under excel_bot/daily/ is the only land.
          if python -c 'import sys; sys.path.insert(0, "excel_bot/engine"); import gh_summary; sys.exit(0 if gh_summary.resolve_session().write_final else 1)'; then
            bash scripts/safe_git_push.sh \
              "excel-bot: daily signals [$(date -u +%F)]" \
              excel_bot/suggestions/suggestions.csv \
              excel_bot/freeze_manifest.json \
              excel_bot/daily/ || echo "nothing to commit"
          else
            echo "[draft] before 16:00 ET: not committing suggestions.csv or freeze_manifest.json"
            bash scripts/safe_git_push.sh \
              "excel-bot: draft note [$(date -u +%F)]" \
              excel_bot/daily/ || echo "nothing to commit"
          fi
