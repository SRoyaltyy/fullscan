name: Excel Bot (cluster signals daily)

# The local 18:30 Windows pipeline, moved to GitHub. Zero tokens.
# Fetch (Yahoo v8 HTTPS, incremental) -> Excel-replica engine (same formulas,
# same colors) -> strategy signals -> append to ONE suggestions.csv ->
# refresh tracking on all past suggestions -> daily MD summary.
# From 2026-10-06, excel_bot/freeze_manifest.json fingerprints each signal
# day. signal_freeze.py --verify fails closed before the commit if a
# locked day changed. Days before that are pre-lock and are not hashed.
#
# State (the 3,603-ticker price cache) lives on the orphan branch
# `excel-state` as state/rows.tar.gz, squashed every run so it never grows.

on:
  schedule:
    # Tue-Sat 10:30 UTC. GitHub often starts it around 15:00 UTC (~11:00 ET),
    # before the cash close. That run and the after-close dispatch share
    # engine/gh_summary.py. The writer uses 16:00 ET: draft only before
    # the close, the dated final once at or after the close.
    - cron: "30 10 * * 2-6"
  pull_request:
    paths:
      - "excel_bot/engine/gh_summary.py"
      - "excel_bot/engine/test_gh_summary.py"
      - "excel_bot/engine/signal_freeze.py"
      - "excel_bot/engine/test_signal_freeze.py"
      - "excel_bot/engine/daily_run.py"
      - "excel_bot/freeze_manifest.json"
      - "src/factor_mine_freeze.py"
      - "src/test_factor_mine_freeze.py"
      - ".github/workflows/excel_bot.yml"
  workflow_dispatch:
    inputs:
      limit:
        description: "only first N tickers (0 = all 3,603)"
        required: false
        default: "0"
      signals_only:
        description: "true = skip fetch, re-derive signals from cached grids"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pandas
      - name: Draft vs final dated signal, and signal-day lock
        run: |
          python excel_bot/engine/test_gh_summary.py
          python excel_bot/engine/test_signal_freeze.py

  run:
    if: github.event_name != 'pull_request'
    concurrency:
      group: excel-bot
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install openpyxl

      - name: Restore price-cache state (excel-state branch)
        run: |
          set -euo pipefail
          mkdir -p excel_bot/data/rows
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/excel-state/state/rows.tar.gz" -o /tmp/rows.tar.gz
          tar -xzf /tmp/rows.tar.gz -C excel_bot/data/rows
          echo "restored $(ls excel_bot/data/rows | wc -l) ticker caches"

      - name: Run fetch + engine + signals + tracking
        working-directory: excel_bot
        env:
          LIMIT: ${{ github.event.inputs.limit }}
          SIGNALS_ONLY: ${{ github.event.inputs.signals_only }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${LIMIT:-}" ] && [ "${LIMIT:-0}" != "0" ]; then ARGS="--limit $LIMIT"; fi
          if [ "${SIGNALS_ONLY:-false}" = "true" ]; then ARGS="$ARGS --signals-only"; fi
          echo "CMD: python engine/daily_run.py --workers 4 $ARGS"
          python engine/daily_run.py --workers 4 $ARGS
          # Locked signal days must already match freeze_manifest.json.
          python engine/signal_freeze.py --verify
          # Before 16:00 ET this writes *_excel_bot_draft.md only.
          # At/after 16:00 ET it creates *_excel_bot.md once, then refuses.
          python engine/gh_summary.py

      - name: Save price-cache state (squash excel-state)
        if: always()
        run: |
          set -euo pipefail
          git config user.name "excel-bot"
          git config user.email "excel-bot@users.noreply.github.com"
          git fetch origin excel-state
          git worktree add --detach /tmp/state FETCH_HEAD
          tar -czf /tmp/state/state/rows.tar.gz -C excel_bot/data/rows .
          cd /tmp/state
          git add state/rows.tar.gz
          git commit -q --amend -m "excel-state: rows cache after $(date -u +%F) run"
          git push -q -f origin HEAD:excel-state
          echo "state saved"

      - name: Commit suggestions + daily summary to main
        if: always()
        run: |
          set -euo pipefail
          if ! python excel_bot/engine/signal_freeze.py --verify; then
            echo "[freeze] FAIL CLOSED — committing nothing"
            exit 1
          fi
          bash scripts/safe_git_push.sh \
            "excel-bot: daily signals [$(date -u +%F)]" \
            excel_bot/suggestions/suggestions.csv \
            excel_bot/freeze_manifest.json \
            excel_bot/daily/ || echo "nothing to commit"
