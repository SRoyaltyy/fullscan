name: A+B1 Checklist (liquid universe)

# Part A = OHLC chart features · Part B1 = Finviz export snapshot + day-over-day deltas
# Gate: Market Cap > $80M and Average Volume > 500k shares

on:
  workflow_dispatch:
    inputs:
      date:
        description: "As-of YYYY-MM-DD (blank = latest finviz export date)"
        required: false
        default: ""
      skip_price_update:
        description: "Skip price_store update (use existing OHLC only)"
        type: boolean
        required: false
        default: false
  schedule:
    # 11:00 ET — before Stock Book ALL (17:00 UTC / 13:00 ET) so s_ab is on disk
    - cron: "0 15 * * 1-5"
    # 17:30 ET — post-close refresh (full tape for the day)
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

jobs:
  ab-checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pyarrow yfinance openpyxl

      - name: Update price store
        if: ${{ inputs.skip_price_update != true }}
        run: |
          set -e
          python -m src.price_store update || echo "[warn] price update soft-failed"

      - name: Run A+B1 checklist
        run: |
          set -e
          AS_OF="${{ inputs.date }}"
          AS_OF="${AS_OF//+/-}"
          ARGS=()
          if [ -n "$AS_OF" ]; then
            ARGS+=(--date "$AS_OF")
          fi
          echo "CMD: python -m src.ab_checklist ${ARGS[*]}"
          python -m src.ab_checklist "${ARGS[@]}"
          echo "=== outputs ==="
          ls -la data/ab_checklist/ || true
          wc -l data/ab_checklist/*_ab_checklist.csv || true

      - name: Enrich (P01–P04 peers + industry/sector)
        if: always()
        run: |
          set -euo pipefail
          AS_OF="${{ inputs.date }}"
          AS_OF="${AS_OF//+/-}"
          ARGS=()
          if [ -n "$AS_OF" ]; then
            ARGS+=(--date "$AS_OF")
          fi
          echo "CMD: python -m src.ab_enrich ${ARGS[*]}"
          python -m src.ab_enrich "${ARGS[@]}" || echo "[warn] enrich soft-failed — raw checklist still usable"
          ls -la data/ab_checklist/*enriched* 2>/dev/null || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-checklist
          path: data/ab_checklist/
          if-no-files-found: warn

      - name: Commit + push outputs to main
        if: always()
        run: |
          set -uo pipefail
          if [ ! -d data/ab_checklist ]; then
            echo "No data/ab_checklist directory — nothing to commit"
            exit 0
          fi
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"

          # price_store dirties ohlc.parquet / meta.json. Unstaged changes
          # block `git pull --rebase` and then the push fails the whole job
          # even though the checklist already succeeded (2026-08-20 failure).
          git checkout -- data/prices 2>/dev/null || true
          git clean -fd data/prices 2>/dev/null || true
          git clean -fd --exclude=data/ab_checklist 2>/dev/null || true

          git add -f data/ab_checklist/*.csv data/ab_checklist/*.md data/ab_checklist/*.json || true
          git status
          if git diff --staged --quiet; then
            echo "Nothing staged — outputs may already be on main"
            exit 0
          fi
          git commit -m "chore: ab checklist $(date -u +%F)" || {
            echo "[warn] commit failed (nothing to commit?)"
            exit 0
          }

          # Rebase + push with one retry. Never fail the job on push races —
          # the artifact upload already preserved the CSV.
          if ! git pull --rebase origin main; then
            echo "[warn] pull --rebase failed; trying pull --no-rebase"
            git pull origin main || true
          fi
          if git push origin HEAD:main; then
            echo "Pushed checklist outputs to main"
          else
            echo "[warn] first push rejected — rebase and retry"
            git pull --rebase origin main || git pull origin main || true
            if git push origin HEAD:main; then
              echo "Pushed checklist outputs to main (retry)"
            else
              echo "[warn] push still failed — artifact is uploaded; orchestrator can re-dispatch if needed"
            fi
          fi
          exit 0
