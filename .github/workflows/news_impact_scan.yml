name: News impact router

# Classify every harvested article by event mechanism, then family
# winner/loser analysis. Backtest is offline (no keys). Live hops use
# SuperGrok through OpenClaw on the ECS box (cheapest general model
# >30B). Lane is a leftover fallback only. Does not touch flatten /
# Webull / factor-mine.

on:
  workflow_dispatch:
    inputs:
      date:
        description: YYYY-MM-DD or all
        required: true
        default: "all"
        type: string
      limit:
        description: Max articles (0 = every unique headline)
        required: false
        default: "0"
        type: string
      mode:
        description: backtest (parsed news, no hops) or live (OpenClaw SuperGrok)
        required: false
        default: "backtest"
        type: string
      openclaw:
        description: "1 to hop SuperGrok through OpenClaw (live mode, ECS)"
        required: false
        default: "1"
        type: string
      lane:
        description: "1 to also try the leftover $0 Lane stack"
        required: false
        default: "0"
        type: string
      search:
        description: "1 to use Google AI Overview + web parse (live mode)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write

jobs:
  scan:
    if: ${{ github.event.inputs.mode != 'live' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: News impact
        env:
          LANE_URL: ${{ vars.LANE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL || vars.OLLAMA_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
          MODELSCOPE_SDK_TOKEN: ${{ secrets.MODELSCOPE_SDK_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TOKENHUB_API_KEY: ${{ secrets.TOKENHUB_API_KEY }}
          TENCENT_API_KEY: ${{ secrets.TENCENT_API_KEY }}
          HUNYUAN_API_KEY: ${{ secrets.HUNYUAN_API_KEY }}
          TOKENHUB_BASE_URL: ${{ secrets.TOKENHUB_BASE_URL }}
          TENCENT_BASE_URL: ${{ secrets.TENCENT_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          LIMIT="${{ github.event.inputs.limit }}"
          MODE="${{ github.event.inputs.mode }}"
          EXTRA=""
          if [ "${{ github.event.inputs.lane }}" = "1" ]; then EXTRA="$EXTRA --lane"; fi
          if [ "${{ github.event.inputs.openclaw }}" = "1" ]; then EXTRA="$EXTRA --openclaw"; fi
          if [ "${{ github.event.inputs.search }}" = "1" ]; then EXTRA="$EXTRA --search"; fi
          PYTHONPATH=. python3 -m src.news_impact_scan --date "$DATE" --limit "$LIMIT" --mode "$MODE" $EXTRA
      - name: Commit impact artifacts
        run: |
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add 01_daily/news/*_news_impact*.json 01_daily/news/*_news_impact*.md 02_lessons/lane/outbox_impact 02_lessons/lane/scratch_impact || true
          if git diff --staged --quiet; then
            echo "No impact artifacts"
            exit 0
          fi
          git commit -m "auto: news impact ${{ github.event.inputs.mode }} ${{ github.event.inputs.date }}"
          git pull --rebase origin main || true
          git push origin main

  live:
    if: ${{ github.event.inputs.mode == 'live' }}
    runs-on: [self-hosted, ecs]
    timeout-minutes: 180
    env:
      FULLSCAN_HOME: "/home/gha"
      HOME: "/home/gha"
      OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
      OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
      OPENCLAW_AGENT: "openclaw/default"
      OPENCLAW_NEWS_MODEL: "xai/grok-4.3"
      GROK_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Enable classroom then hop SuperGrok
        run: |
          set -euo pipefail
          export HOME="${FULLSCAN_HOME:-/home/gha}"
          chmod +x scripts/enable_openclaw_chat.sh scripts/safe_git_push.sh || true
          bash scripts/enable_openclaw_chat.sh || true
          DATE="${{ github.event.inputs.date }}"
          LIMIT="${{ github.event.inputs.limit }}"
          EXTRA="--openclaw"
          if [ "${{ github.event.inputs.lane }}" = "1" ]; then EXTRA="$EXTRA --lane"; fi
          if [ "${{ github.event.inputs.search }}" = "1" ]; then EXTRA="$EXTRA --search"; fi
          PYTHONPATH=. python3 -m src.news_impact_scan --date "$DATE" --limit "$LIMIT" --mode live $EXTRA
      - name: Push impact artifacts
        if: always()
        run: |
          export HOME="${FULLSCAN_HOME:-/home/gha}"
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          bash scripts/safe_git_push.sh \
            "auto: news impact live ${{ github.event.inputs.date }}" \
            01_daily/news \
            02_lessons/lane/outbox_impact \
            02_lessons/lane/scratch_impact
