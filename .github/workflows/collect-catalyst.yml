name: "Catalyst Analysis Engine"

# Bounded daily dossiers via src.catalyst_daily.
# Engine is Grok 4.6 on OpenClaw (native web/X search). SearXNG is not used.
# collectors/catalyst_analysis.py is left untouched; the runtime overlay
# swaps search + verdict + catcher onto Grok before analyze_stock runs.
# Called from Collect: ALL and dispatchable on its own.

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "YYYY-MM-DD (empty = today ET)"
        required: false
        default: ""
      max_tickers:
        description: "Max dossiers this run"
        required: false
        default: "8"
      tickers:
        description: "Optional extra tickers (comma-separated)"
        required: false
        default: ""
      force:
        description: "true = ignore skip-if-good"
        required: false
        default: "false"
  workflow_call:
    inputs:
      run_date:
        description: "YYYY-MM-DD (empty = today ET)"
        required: false
        type: string
        default: ""
      max_tickers:
        required: false
        type: string
        default: "8"
      tickers:
        required: false
        type: string
        default: ""
      force:
        required: false
        type: string
        default: "false"

permissions:
  contents: write

concurrency:
  group: collect-catalyst
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: [self-hosted, ecs]
    timeout-minutes: 120
    steps:
      - name: Clear stale git index.lock (shared ECS workspace)
        shell: bash
        run: |
          # A job killed mid-checkout leaves .git/index.lock; the next checkout then hangs.
          # One ECS runner, so a lock older than 1 minute before checkout is stale.
          W="${GITHUB_WORKSPACE:-.}"
          for L in "$W/.git/index.lock" "$W/.git/shallow.lock" "$W/.git/HEAD.lock"; do
            if [ -n "$(find "$L" -mmin +1 2>/dev/null)" ]; then echo "removing stale $L"; rm -f "$L" || sudo -n rm -f "$L" || true; fi
          done
          if [ "$(git -C "$W" config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::shared ECS workspace is sparse; this checkout re-materializes the full tree"
          fi
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary pandas openai yfinance || true

      - name: Run catalyst daily (Grok native search)
        env:
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_BACKEND_MODEL: xai/grok-4.6
          OPENCLAW_TIMEOUT: "3600"
          GROK_ONLY: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FULLSCAN_DB_OPTIONAL: "1"
          FINVIZ_AUTH: ${{ secrets.FINVIZ_AUTH }}
          FINVIZ_EMAIL: ${{ secrets.FINVIZ_EMAIL }}
          FINVIZ_PASSWORD: ${{ secrets.FINVIZ_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          DATE="${{ github.event.inputs.run_date }}"
          MAX="${{ github.event.inputs.max_tickers }}"
          TICKERS="${{ github.event.inputs.tickers }}"
          FORCE="${{ github.event.inputs.force }}"
          MAX="${MAX:-8}"
          FORCE="${FORCE:-false}"
          ARGS=(--max "$MAX")
          [ -n "${DATE:-}" ] && ARGS+=(--date "$DATE")
          [ -n "${TICKERS:-}" ] && ARGS+=(--tickers "$TICKERS")
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          echo "CMD: python -m src.catalyst_daily ${ARGS[*]}"
          python -m src.catalyst_daily "${ARGS[@]}"

      - name: Preview
        if: always()
        run: |
          latest=$(ls -1t 01_daily/catalyst/*_dossiers.md 2>/dev/null | head -1 || true)
          if [ -n "${latest:-}" ]; then head -80 "$latest"; fi

      - name: Commit
        if: always()
        run: |
          bash scripts/safe_git_push.sh "auto: catalyst daily dossiers" \
            01_daily/catalyst/ 01_daily/news/ data/catalyst/ || true
