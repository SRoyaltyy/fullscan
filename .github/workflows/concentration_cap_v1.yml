name: concentration cap v1
on:
  pull_request:
    paths:
      - "research/concentration_cap_v1/**"
      - ".github/workflows/concentration_cap_v1.yml"
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Protocol lock
        run: PYTHONHASHSEED=0 python3 research/concentration_cap_v1/test_protocol.py
