name: Restore catalyst_analysis.py

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore file from known-good commit and patch JSON save
        run: |
          set -euo pipefail
          # Last known good full file before placeholder overwrite
          git show 7cbf1a9842e107957b6a2cdca5b4f7ed82c86c49:collectors/catalyst_analysis.py > collectors/catalyst_analysis.py
          python3 << 'PY'
          from pathlib import Path
          p = Path("collectors/catalyst_analysis.py")
          text = p.read_text()
          if "Saved catalyst JSON" in text:
              print("already patched")
          else:
              old = '''        if "error" in result:
            print(f"\u274c Error: {result['error']}")
        else:
            grid = result.get("catalyst_grid", [])
            positive_hits = [c for c in grid if c.get("status")=="HIT" and c.get("type")=="positive"]
            negative_hits = [c for c in grid if c.get("status")=="HIT" and c.get("type")=="negative"]
            print(f"\u2705 Net signal: {result.get('net_signal')} (conviction {result.get('conviction')})")
'''
              # Use actual emoji-free anchors matching file
              old = (
                  '        if "error" in result:\n'
                  '            print(f"\u274c Error: {result[\'error\']}")\n'
                  '        else:\n'
                  '            grid = result.get("catalyst_grid", [])\n'
              )
              # Simpler unique anchor
              anchor = '        if "error" in result:\n            print(f"\u274c Error: {result[\'error\']}")\n        else:\n            grid = result.get("catalyst_grid", [])'
              # File uses emoji - read exact bytes
              print("file has error block", 'if "error" in result' in text)
              idx = text.find('if "error" in result:')
              print("idx", idx)
              # Find the else: grid = result.get block and insert before grid =
              needle = '            grid = result.get("catalyst_grid", [])'
              insert = '''            # Persist for catalyst_chart overlays\n            try:\n                from pathlib import Path as _P\n                from datetime import date as _date\n                out_dir = _P("data/catalyst")\n                out_dir.mkdir(parents=True, exist_ok=True)\n                stamp = _date.today().isoformat()\n                out_path = out_dir / f"{ticker.upper()}_{stamp}.json"\n                payload = dict(result)\n                payload["ticker"] = ticker.upper()\n                payload["generated_at"] = stamp\n                payload["cutoff_date"] = CUTOFF_DATE\n                out_path.write_text(json.dumps(payload, indent=2, default=str), encoding="utf-8")\n                print(f"Saved catalyst JSON -> {out_path}")\n            except Exception as _e:\n                print(f"  warn: could not save catalyst JSON: {_e}")\n            grid = result.get("catalyst_grid", [])'''
              if needle not in text:
                  raise SystemExit("needle not found")
              # only replace the first occurrence in main block (last occurrence is safer)
              pos = text.rfind(needle)
              text = text[:pos] + insert + text[pos+len(needle):]
              p.write_text(text)
              print("patched ok", p.stat().st_size)
          PY
          wc -l collectors/catalyst_analysis.py
          head -5 collectors/catalyst_analysis.py
          rg -n "Saved catalyst JSON|catalyst_grid" collectors/catalyst_analysis.py | head

      - name: Commit restore
        run: |
          set -euo pipefail
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add collectors/catalyst_analysis.py
          git commit -m "fix: restore catalyst_analysis.py + persist JSON for charts"
          git pull --rebase origin main || true
          git push origin HEAD:main
