name: Restore catalyst_analysis.py

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/catalyst_b64/**"
      - ".github/workflows/restore_catalyst_analysis.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble catalyst_analysis.py from b64 parts (or git history)
        run: |
          set -euo pipefail
          if ls scripts/catalyst_b64/part_*.b64 >/dev/null 2>&1; then
            echo "Assembling from scripts/catalyst_b64/"
            cat scripts/catalyst_b64/part_*.b64 | tr -d '\n' | base64 -d > collectors/catalyst_analysis.py
          else
            echo "Falling back to git history"
            git show 7cbf1a9842e107957b6a2cdca5b4f7ed82c86c49:collectors/catalyst_analysis.py > collectors/catalyst_analysis.py
            python3 << 'PY'
          from pathlib import Path
          p = Path("collectors/catalyst_analysis.py")
          text = p.read_text()
          needle = '            grid = result.get("catalyst_grid", [])'
          insert = '''            # Persist for catalyst_chart overlays
            try:
                from pathlib import Path as _P
                from datetime import date as _date
                out_dir = _P("data/catalyst")
                out_dir.mkdir(parents=True, exist_ok=True)
                stamp = _date.today().isoformat()
                out_path = out_dir / f"{ticker.upper()}_{stamp}.json"
                payload = dict(result)
                payload["ticker"] = ticker.upper()
                payload["generated_at"] = stamp
                payload["cutoff_date"] = CUTOFF_DATE
                out_path.write_text(json.dumps(payload, indent=2, default=str), encoding="utf-8")
                print(f"Saved catalyst JSON -> {out_path}")
            except Exception as _e:
                print(f"  warn: could not save catalyst JSON: {_e}")
            grid = result.get("catalyst_grid", [])'''
          if "Saved catalyst JSON" not in text:
              pos = text.rfind(needle)
              if pos < 0:
                  raise SystemExit("needle not found")
              text = text[:pos] + insert + text[pos+len(needle):]
              p.write_text(text)
          print("size", p.stat().st_size)
          PY
          fi
          wc -l collectors/catalyst_analysis.py
          head -3 collectors/catalyst_analysis.py
          grep -n "Saved catalyst JSON\|Catalyst Analysis Engine" collectors/catalyst_analysis.py | head

      - name: Commit restore
        run: |
          set -euo pipefail
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add collectors/catalyst_analysis.py
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "fix: restore catalyst_analysis.py + JSON persistence for charts"
          git pull --rebase origin main || true
          git push origin HEAD:main
