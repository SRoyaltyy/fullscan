name: Finviz homepage market digest

# Capture-only homepage $MARKET prose (NOT quote-page ticker blurbs).
#
# Two files per NYSE session — they coexist; close never clobbers morning:
#   (1) Pre-09:30 same_morning warm-up
#       01_daily/news/<date>_finviz_market_digest.{md,json}
#       Primary: finviz_preopen_scrape.yml (cron 09:40 UTC = 05:40 ET)
#       Last chance: this workflow ~08:00 ET
#   (2) ~16:05 ET post-close answer-key (clock_use=next_open only)
#       01_daily/news/<date>_finviz_market_digest_close.{md,json}
#       clock_legal_for = next NYSE session. Never same_morning.
#
# GH Actions cron is UTC by default. Close uses on.schedule.timezone
# (America/New_York) — the IANA equivalent of CRON_TZ — so 16:05 stays
# 16:05 across EDT/EST. Morning last-chance cron is unchanged UTC.
# ubuntu-latest only (Finviz 403 on ECS). Capture only — not wired into
# tape_anchor / predict / #210 / Pre-Open selection.

on:
  schedule:
    # 12:00 UTC = 08:00 EDT. Last chance in the 05:40–08:00 ET window.
    # After the fall EST change this is 07:00 ET — still pre-09:30.
    - cron: "0 12 * * 1-5"
    # Post-close answer-key. timezone field (Mar 2026+) follows ET DST.
    - cron: "5 16 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      run_date:
        description: "YYYY-MM-DD live capture (empty = today ET)"
        required: false
        default: ""
      force:
        description: "true = rewrite even if morning-ok / close-ok file exists"
        required: false
        default: "false"
      close:
        description: "true = post-close answer-key (*_close, clock_use=next_open)"
        required: false
        default: "false"
      backfill_from:
        description: "Optional CDX/archive.ph backfill start YYYY-MM-DD"
        required: false
        default: ""
      backfill_to:
        description: "Optional backfill end YYYY-MM-DD (empty = today ET)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: finviz-market-digest
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FULLSCAN_LAND: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install beautifulsoup4 lxml requests || true

      - name: Pick capture slot (morning last-chance vs close)
        if: github.event.inputs.backfill_from == ''
        run: |
          set -euo pipefail
          DATE="${{ github.event.inputs.run_date }}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          ET_HM=$((10#$(TZ=America/New_York date +%H%M)))
          DOW=$(TZ=America/New_York date +%u)
          CLOSE_IN="${{ github.event.inputs.close }}"
          FORCE="${{ github.event.inputs.force }}"
          echo "DATE=$DATE ET_HM=$ET_HM DOW=$DOW close_in=$CLOSE_IN"
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          HOLIDAY=$(python3 -c "from datetime import date; from src.skip_if_good import is_nyse_holiday; d=date.fromisoformat('$DATE'); print('yes' if is_nyse_holiday(d) else 'no')")
          echo "HOLIDAY=$HOLIDAY"
          if [ "$DOW" -ge 6 ] || [ "$HOLIDAY" = "yes" ]; then
            echo "Weekend/holiday — skip live market digest"
            echo "slot=skip" >> "$GITHUB_ENV"
          elif [ "$CLOSE_IN" = "true" ] || [ "$ET_HM" -ge 1600 ]; then
            echo "slot=close (post-close answer-key, next_open)"
            echo "slot=close" >> "$GITHUB_ENV"
          elif [ "$ET_HM" -ge 925 ] && [ "$FORCE" != "true" ]; then
            echo "midday — not morning last-chance, not close"
            echo "slot=skip" >> "$GITHUB_ENV"
          else
            echo "slot=morning (pre-09:30 last-chance warm-up)"
            echo "slot=morning" >> "$GITHUB_ENV"
          fi

      - name: Live homepage market digest (morning warm-up)
        if: env.slot == 'morning' && github.event.inputs.backfill_from == ''
        env:
          FINVIZ_EMAIL: ${{ secrets.FINVIZ_EMAIL }}
          FINVIZ_PASSWORD: ${{ secrets.FINVIZ_PASSWORD }}
          FINVIZ_AUTH: ${{ secrets.FINVIZ_AUTH }}
          AUTH_TOKEN_FINVIZ: ${{ secrets.AUTH_TOKEN_FINVIZ }}
        run: |
          set -euo pipefail
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          ARGS=(--date "$DATE")
          [ "${{ github.event.inputs.force }}" = "true" ] && ARGS+=(--force)
          echo "CMD: python -m src.finviz_market_digest ${ARGS[*]}"
          python -m src.finviz_market_digest "${ARGS[@]}"

      - name: Live homepage market digest (close answer-key)
        if: env.slot == 'close' && github.event.inputs.backfill_from == ''
        env:
          FINVIZ_EMAIL: ${{ secrets.FINVIZ_EMAIL }}
          FINVIZ_PASSWORD: ${{ secrets.FINVIZ_PASSWORD }}
          FINVIZ_AUTH: ${{ secrets.FINVIZ_AUTH }}
          AUTH_TOKEN_FINVIZ: ${{ secrets.AUTH_TOKEN_FINVIZ }}
        run: |
          set -euo pipefail
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          ARGS=(--date "$DATE" --close)
          [ "${{ github.event.inputs.force }}" = "true" ] && ARGS+=(--force)
          echo "CMD: python -m src.finviz_market_digest ${ARGS[*]}"
          python -m src.finviz_market_digest "${ARGS[@]}"

      - name: Wayback / archive.ph backfill
        if: github.event.inputs.backfill_from != ''
        run: |
          set -euo pipefail
          FROM="${{ github.event.inputs.backfill_from }}"
          TO="${{ github.event.inputs.backfill_to }}"
          TO="${TO:-$(TZ=America/New_York date +%F)}"
          ARGS=(--backfill --from "$FROM" --to "$TO")
          [ "${{ github.event.inputs.force }}" = "true" ] && ARGS+=(--force)
          echo "CMD: python -m src.finviz_market_digest ${ARGS[*]}"
          python -m src.finviz_market_digest "${ARGS[@]}"

      - name: Preview
        if: always()
        run: |
          D="${{ github.event.inputs.run_date }}"
          D="${D:-${DATE:-$(TZ=America/New_York date +%F)}}"
          echo "======== market digest $D (morning) ========"
          ls -la 01_daily/news/${D}_finviz_market_digest.* 2>/dev/null || true
          head -60 "01_daily/news/${D}_finviz_market_digest.md" 2>/dev/null || true
          echo "======== market digest $D (close) ========"
          ls -la 01_daily/news/${D}_finviz_market_digest_close.* 2>/dev/null || true
          head -60 "01_daily/news/${D}_finviz_market_digest_close.md" 2>/dev/null || true

      - name: Leftover sweep
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/safe_git_push.sh \
            "auto: finviz homepage market digest [$(date -u +%F_%H%M)]" \
            01_daily/news/ data/day_board/ \
            || echo "[market_digest] leftover sweep failed — lands already on main"
