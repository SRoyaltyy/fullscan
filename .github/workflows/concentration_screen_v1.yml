name: Concentration screen v1
on:
  pull_request:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Screen lock
      run: PYTHONHASHSEED=0 python3 research/concentration_screen_v1/test_screen.py
