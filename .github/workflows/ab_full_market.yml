name: AB Full Market (checklist + peers + backfill)

# Full liquid-universe version of AB One Button.
# Always runs the complete pipeline across every name that passes
# Market Cap > $80M and ADV > 500k shares — no single-ticker default trap.
#
# Steps (same as One Button, universe-wide):
#   0) price_store bootstrap
#   1) ab_checklist          (liquid gate ON)
#   2) peer_rs + ab_enrich   (P01–P04 context)
#   3) ab_backfill           (PIT 1d/3d/1w/2m 🟢🔴 + score-bucket audit)
#
# Heavy: expect 1–6 hours depending on months / price coverage.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "As-of YYYY-MM-DD (blank = latest finviz export)"
        required: false
        default: ""
      months:
        description: "PIT backfill lookback months"
        required: false
        default: "24"
      bootstrap_days:
        description: "Price history calendar days to ensure"
        required: false
        default: "900"
      skip_bootstrap:
        description: "Skip price bootstrap (use existing store)"
        type: boolean
        default: false
      skip_checklist:
        description: "Skip checklist (reuse existing CSV for as-of)"
        type: boolean
        default: false
      skip_enrich:
        description: "Skip peer RS + enrich"
        type: boolean
        default: false
      skip_backfill:
        description: "Skip PIT backfill"
        type: boolean
        default: false
  schedule:
    # After US close — full liquid audit once on weekdays
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: ab-full-market
  cancel-in-progress: false

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install openpyxl pyarrow beautifulsoup4 lxml

      - name: Resolve as-of (always FULL liquid universe)
        id: meta
        run: |
          set -euo pipefail
          D="${{ inputs.date }}"
          D="${D//+/-}"
          if [ -z "$D" ]; then
            LATEST=$(ls -1 data/exports/finviz_????-??-??.csv 2>/dev/null | sort | tail -1 || true)
            if [ -n "$LATEST" ]; then
              D=$(basename "$LATEST" | sed 's/finviz_//;s/.csv//')
            else
              D=$(TZ=America/New_York date +%F)
            fi
          fi
          echo "asof=$D" >> "$GITHUB_OUTPUT"
          echo "========================================"
          echo "  AB FULL MARKET"
          echo "  asof=$D  mode=LIQUID_UNIVERSE"
          echo "  months=${{ inputs.months || '24' }}"
          echo "  bootstrap_days=${{ inputs.bootstrap_days || '900' }}"
          echo "========================================"
          ls -la data/exports/finviz_????-??-??.csv 2>/dev/null | tail -5 || echo "(no exports yet)"

      - name: 0) Price history (universe)
        if: ${{ github.event_name == 'schedule' || (inputs.skip_bootstrap != true && inputs.skip_bootstrap != 'true') }}
        run: |
          set -euo pipefail
          DAYS="${{ inputs.bootstrap_days }}"
          DAYS="${DAYS:-900}"
          echo "=== price_store bootstrap --days $DAYS (full universe) ==="
          python -m src.price_store bootstrap --days "$DAYS"

      - name: 1) AB checklist — liquid universe
        if: ${{ github.event_name == 'schedule' || (inputs.skip_checklist != true && inputs.skip_checklist != 'true') }}
        run: |
          set -euo pipefail
          ASOF="${{ steps.meta.outputs.asof }}"
          echo "=== ab_checklist --date $ASOF  (liquid gate ON: mcap>$80M adv>500k) ==="
          python -m src.ab_checklist --date "$ASOF" --top 30
          CSV="data/ab_checklist/${ASOF}_ab_checklist.csv"
          if [ ! -f "$CSV" ]; then
            echo "ERROR: checklist CSV not written"
            ls -la data/ab_checklist/ || true
            exit 1
          fi
          python - <<PY
          import pandas as pd
          df = pd.read_csv("$CSV")
          print(f"liquid_names={len(df):,}  score_range={df['score'].min():+d}..{df['score'].max():+d}")
          print(df.sort_values("score", ascending=False)[["Ticker","score","n_good","n_bad"]].head(15).to_string(index=False))
          PY

      - name: 2) Peer RS + industry/sector enrich (universe)
        if: ${{ github.event_name == 'schedule' || (inputs.skip_enrich != true && inputs.skip_enrich != 'true') }}
        run: |
          set -euo pipefail
          ASOF="${{ steps.meta.outputs.asof }}"
          echo "=== peer_rs --date $ASOF ==="
          python -m src.peer_rs --date "$ASOF" || true
          echo "=== ab_enrich --date $ASOF  (no --ticker → full checklist) ==="
          python -m src.ab_enrich --date "$ASOF"
          echo "==== enriched top ===="
          head -40 "data/ab_checklist/${ASOF}_ab_checklist_enriched.md" 2>/dev/null || true

      - name: 3) PIT backfill — liquid universe (1d/3d/1w/2m + pattern audit)
        if: ${{ github.event_name == 'schedule' || (inputs.skip_backfill != true && inputs.skip_backfill != 'true') }}
        run: |
          set -euo pipefail
          ASOF="${{ steps.meta.outputs.asof }}"
          M="${{ inputs.months }}"
          M="${M:-24}"
          echo "=== ab_backfill --months $M --end $ASOF  (no --ticker → liquid universe) ==="
          python -m src.ab_backfill --months "$M" --end "$ASOF"
          echo "==== backfill outputs ===="
          ls -lah data/ab_backfill/ | tail -20
          # surface the pattern-audit section if present
          LATEST_MD=$(ls -1t data/ab_backfill/*universe*.md data/ab_backfill/*.md 2>/dev/null | head -1 || true)
          if [ -n "$LATEST_MD" ]; then
            echo "===== $LATEST_MD (audit tail) ====="
            # print from Pattern correlation audit onward if present
            awk '/^## Pattern correlation audit/{p=1} p' "$LATEST_MD" | head -80 || head -60 "$LATEST_MD"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-full-market-${{ steps.meta.outputs.asof }}
          path: |
            data/ab_checklist/
            data/ab_backfill/
            data/peers/
          if-no-files-found: warn

      - name: Commit outputs
        if: always()
        run: |
          set -euo pipefail
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/ab_checklist/ data/ab_backfill/ data/peers/ data/prices/ 01_daily/*peer_rs* || true
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: AB full market ${{ steps.meta.outputs.asof }} (checklist+peers+backfill)"
          git pull --rebase origin main || true
          git push origin HEAD:main
