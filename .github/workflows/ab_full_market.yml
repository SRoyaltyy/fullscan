name: AB Full Market (checklist + peers + backfill)

# Full liquid-universe version of AB One Button.
# Prerequisites (auto-run if missing):
#   - data/exports/finviz_*.csv
#   - data/prices/ohlc.parquet (price_store bootstrap)
#
# Steps:
#   0) price_store bootstrap (always unless skip_bootstrap)
#   1) ab_checklist          (liquid gate ON)
#   2) peer_rs + ab_enrich   (P01–P04 context)
#   3) ab_backfill           (PIT 1d/3d/1w/2m + pattern audit)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "As-of YYYY-MM-DD (blank = latest finviz export)"
        required: false
        default: ""
      months:
        description: "PIT backfill lookback months"
        required: false
        default: "24"
      bootstrap_days:
        description: "Price history calendar days to ensure"
        required: false
        default: "900"
      skip_bootstrap:
        description: "Skip price bootstrap (use existing store)"
        type: boolean
        default: false
      skip_checklist:
        description: "Skip checklist (reuse existing CSV for as-of)"
        type: boolean
        default: false
      skip_enrich:
        description: "Skip peer RS + enrich"
        type: boolean
        default: false
      skip_backfill:
        description: "Skip PIT backfill"
        type: boolean
        default: false
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: ab-full-market
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install openpyxl pyarrow beautifulsoup4 lxml yfinance

      - name: Resolve as-of + verify Finviz export
        id: meta
        run: |
          set -euo pipefail
          D="${{ inputs.date }}"
          D="${D//+/-}"
          if [ -z "$D" ]; then
            LATEST=$(ls -1 data/exports/finviz_????-??-??.csv 2>/dev/null | sort | tail -1 || true)
            if [ -n "$LATEST" ]; then
              D=$(basename "$LATEST" | sed 's/finviz_//;s/.csv//')
            else
              D=$(TZ=America/New_York date +%F)
            fi
          fi
          echo "asof=$D" >> "$GITHUB_OUTPUT"
          echo "========================================"
          echo "  AB FULL MARKET"
          echo "  asof=$D  mode=LIQUID_UNIVERSE"
          echo "  months=${{ inputs.months || '24' }}"
          echo "  bootstrap_days=${{ inputs.bootstrap_days || '900' }}"
          echo "========================================"
          EXP="data/exports/finviz_${D}.csv"
          if [ ! -f "$EXP" ]; then
            LATEST=$(ls -1 data/exports/finviz_????-??-??.csv 2>/dev/null | sort | tail -1 || true)
            if [ -z "$LATEST" ]; then
              echo "FATAL: no finviz exports under data/exports/ — run collect-finviz / Finviz Digest first"
              exit 1
            fi
            echo "WARN: $EXP missing, falling back to $LATEST"
            D=$(basename "$LATEST" | sed 's/finviz_//;s/.csv//')
            echo "asof=$D" >> "$GITHUB_OUTPUT"
            EXP="$LATEST"
          fi
          python3 - <<PY
          import pandas as pd
          df = pd.read_csv("$EXP", low_memory=False)
          print(f"export={ '$EXP' } rows={len(df):,} cols={len(df.columns)}")
          if len(df) < 100:
              raise SystemExit(f"FATAL: export only {len(df)} rows — not a full-market dump")
          print("sample tickers:", df.iloc[:5, 0].tolist())
          PY

      - name: 0) Price history prerequisite (universe bootstrap)
        if: ${{ github.event_name == 'schedule' || (inputs.skip_bootstrap != true && inputs.skip_bootstrap != 'true') }}
        run: |
          set -euo pipefail
          DAYS="${{ inputs.bootstrap_days }}"
          DAYS="${DAYS:-900}"
          echo "=== prerequisite: price_store bootstrap --days $DAYS ==="
          python -m src.price_store bootstrap --days "$DAYS"
          python -m src.price_store status

      - name: 0b) Ensure price store non-empty even if bootstrap skipped
        run: |
          set -euo pipefail
          if [ ! -f data/prices/ohlc.parquet ]; then
            DAYS="${{ inputs.bootstrap_days }}"
            DAYS="${DAYS:-900}"
            echo "price store missing — auto bootstrap --days $DAYS"
            python -m src.price_store bootstrap --days "$DAYS"
          fi
          python -m src.price_store status

      - name: 1) AB checklist — liquid universe
        if: ${{ github.event_name == 'schedule' || (inputs.skip_checklist != true && inputs.skip_checklist != 'true') }}
        run: |
          set -euo pipefail
          ASOF="${{ steps.meta.outputs.asof }}"
          CSV="data/ab_checklist/${ASOF}_ab_checklist.csv"
          rm -f "$CSV" \
                "data/ab_checklist/${ASOF}_ab_checklist_universe.csv" \
                "data/ab_checklist/${ASOF}_ab_checklist.md" \
                "data/ab_checklist/${ASOF}_ab_checklist.json" || true
          # Drop stale loader cache so patches always apply
          rm -f src/_ab_checklist_cached.py || true
          echo "=== ab_checklist --date $ASOF ==="
          # Prefer explicit run() call so loader __name__ bugs cannot no-op
          python -u - <<PY
          import sys
          from src import ab_checklist as ab
          print(f"ab_checklist loaded: has_run={hasattr(ab, 'run')} has_main={hasattr(ab, 'main')}")
          if not hasattr(ab, "run"):
              raise SystemExit("FATAL: ab_checklist.run missing after load")
          out = ab.run(date="$ASOF", top=30)
          print(f"run() returned rows={len(out)}")
          PY
          if [ ! -f "$CSV" ]; then
            echo "ERROR: checklist CSV still missing after ab.run()"
            ls -la data/ab_checklist/ || true
            exit 1
          fi
          cp -f "$CSV" "data/ab_checklist/${ASOF}_ab_checklist_universe.csv"
          python - <<PY
          import pandas as pd
          df = pd.read_csv("$CSV")
          n = len(df)
          print(f"liquid_names={n:,}  score_range={df['score'].min():+d}..{df['score'].max():+d}")
          print(df.sort_values("score", ascending=False)[["Ticker","score","n_good","n_bad"]].head(20).to_string(index=False))
          if n < 50:
              raise SystemExit(
                  f"FATAL: liquid universe only {n} names (expected ~2000+)."
              )
          print(f"OK: full-market checklist has {n:,} liquid names")
          PY

      - name: 2) Peer RS + industry/sector enrich (universe)
        if: ${{ github.event_name == 'schedule' || (inputs.skip_enrich != true && inputs.skip_enrich != 'true') }}
        run: |
          set -euo pipefail
          ASOF="${{ steps.meta.outputs.asof }}"
          if [ -f "data/ab_checklist/${ASOF}_ab_checklist_universe.csv" ]; then
            cp -f "data/ab_checklist/${ASOF}_ab_checklist_universe.csv" \
                  "data/ab_checklist/${ASOF}_ab_checklist.csv"
            echo "restored universe checklist before enrich"
          fi
          echo "=== peer_rs --date $ASOF ==="
          python -m src.peer_rs --date "$ASOF" || true
          echo "=== ab_enrich --date $ASOF ==="
          python -m src.ab_enrich --date "$ASOF"
          head -40 "data/ab_checklist/${ASOF}_ab_checklist_enriched.md" 2>/dev/null || true
          python - <<PY
          from pathlib import Path
          import pandas as pd
          p = Path("data/ab_checklist/${ASOF}_ab_checklist_enriched.csv")
          if not p.exists():
              raise SystemExit("enriched CSV missing")
          df = pd.read_csv(p)
          print(f"enriched_rows={len(df):,}")
          if len(df) < 50:
              raise SystemExit(f"FATAL: enriched only {len(df)} rows")
          PY

      - name: 3) PIT backfill — liquid universe
        if: ${{ github.event_name == 'schedule' || (inputs.skip_backfill != true && inputs.skip_backfill != 'true') }}
        run: |
          set -euo pipefail
          ASOF="${{ steps.meta.outputs.asof }}"
          M="${{ inputs.months }}"
          M="${M:-24}"
          if [ -f "data/ab_checklist/${ASOF}_ab_checklist_universe.csv" ]; then
            cp -f "data/ab_checklist/${ASOF}_ab_checklist_universe.csv" \
                  "data/ab_checklist/${ASOF}_ab_checklist.csv"
          fi
          echo "=== ab_backfill --months $M --end $ASOF ==="
          echo "NOTE: after last asof day log, pattern-audit + parquet write can take minutes."
          python -u -m src.ab_backfill --months "$M" --end "$ASOF"
          ls -lah data/ab_backfill/ | tail -20
          LATEST_MD=$(ls -1t data/ab_backfill/*universe*.md data/ab_backfill/*.md 2>/dev/null | head -1 || true)
          if [ -n "$LATEST_MD" ]; then
            echo "===== $LATEST_MD ====="
            awk '/^## Pattern correlation audit/{p=1} p' "$LATEST_MD" | head -80 || head -60 "$LATEST_MD"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-full-market-${{ steps.meta.outputs.asof }}
          path: |
            data/ab_checklist/
            data/ab_backfill/
            data/peers/
          if-no-files-found: warn

      - name: Commit outputs
        if: always()
        run: |
          set -euo pipefail
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/ab_checklist/ data/ab_backfill/ data/peers/ data/prices/ 01_daily/*peer_rs* || true
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: AB full market ${{ steps.meta.outputs.asof }} (checklist+peers+backfill)"
          git pull --rebase origin main || true
          git push origin HEAD:main
