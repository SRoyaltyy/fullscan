name: AB Full Market (checklist + peers + backfill)

# Full liquid-universe version of AB One Button.
# Always runs the complete pipeline across every name that passes
# Market Cap > 80M USD and ADV > 500k shares — no single-ticker default trap.
#
# Steps (same as One Button, universe-wide):
#   0) price_store bootstrap
#   1) ab_checklist          (liquid gate ON)
#   2) peer_rs + ab_enrich   (P01–P04 context)
#   3) ab_backfill           (PIT 1d/3d/1w/2m green/red + score-bucket audit)
#
# Heavy: expect 1–6 hours depending on months / price coverage.
# Note: do NOT run AB One Button with a single ticker on the same asof while this
# is running — ab_one overwrites {asof}_ab_checklist.csv with a 1-row file.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "As-of YYYY-MM-DD (blank = latest finviz export)"
        required: false
        default: ""
      months:
        description: "PIT backfill lookback months"
        required: false
        default: "24"
      bootstrap_days:
        description: "Price history calendar days to ensure"
        required: false
        default: "900"
      skip_bootstrap:
        description: "Skip price bootstrap (use existing store)"
        type: boolean
        default: false
      skip_checklist:
        description: "Skip checklist (reuse existing CSV for as-of)"
        type: boolean
        default: false
      skip_enrich:
        description: "Skip peer RS + enrich"
        type: boolean
        default: false
      skip_backfill:
        description: "Skip PIT backfill"
        type: boolean
        default: false
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: ab-full-market
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install openpyxl pyarrow beautifulsoup4 lxml

      - name: Resolve as-of (always FULL liquid universe)
        id: meta
        run: |
          set -euo pipefail
          D="${{ inputs.date }}"
          D="${D//+/-}"
          if [ -z "$D" ]; then
            LATEST=$(ls -1 data/exports/finviz_????-??-??.csv 2>/dev/null | sort | tail -1 || true)
            if [ -n "$LATEST" ]; then
              D=$(basename "$LATEST" | sed 's/finviz_//;s/.csv//')
            else
              D=$(TZ=America/New_York date +%F)
            fi
          fi
          echo "asof=$D" >> "$GITHUB_OUTPUT"
          echo "========================================"
          echo "  AB FULL MARKET"
          echo "  asof=$D  mode=LIQUID_UNIVERSE (NOT single-ticker)"
          echo "  months=${{ inputs.months || '24' }}"
          echo "  bootstrap_days=${{ inputs.bootstrap_days || '900' }}"
          echo "========================================"
          EXP="data/exports/finviz_${D}.csv"
          if [ -f "$EXP" ]; then
            python3 - <<PY
          import pandas as pd
          df = pd.read_csv("$EXP", low_memory=False)
          print(f"export={ '$EXP' } rows={len(df):,} cols={len(df.columns)}")
          print("sample tickers:", df.iloc[:5,0].tolist() if len(df) else [])
          PY
          else
            echo "WARN: $EXP missing — will use latest available"
            ls -la data/exports/finviz_????-??-??.csv 2>/dev/null | tail -5 || true
          fi

      - name: 0) Price history (universe)
        if: ${{ github.event_name == 'schedule' || (inputs.skip_bootstrap != true && inputs.skip_bootstrap != 'true') }}
        run: |
          set -euo pipefail
          DAYS="${{ inputs.bootstrap_days }}"
          DAYS="${DAYS:-900}"
          echo "=== price_store bootstrap --days $DAYS (FULL UNIVERSE — not AAPL-only) ==="
          python -m src.price_store bootstrap --days "$DAYS"
          python -m src.price_store status || true

      - name: 1) AB checklist — liquid universe
        if: ${{ github.event_name == 'schedule' || (inputs.skip_checklist != true && inputs.skip_checklist != 'true') }}
        run: |
          set -euo pipefail
          ASOF="${{ steps.meta.outputs.asof }}"
          echo "=== ab_checklist --date $ASOF  (liquid gate ON: mcap>80M USD, adv>500k) ==="
          python -m src.ab_checklist --date "$ASOF" --top 30
          CSV="data/ab_checklist/${ASOF}_ab_checklist.csv"
          if [ ! -f "$CSV" ]; then
            echo "ERROR: checklist CSV not written"
            ls -la data/ab_checklist/ || true
            exit 1
          fi
          # Snapshot universe copy so a later single-ticker ab_one cannot erase evidence
          cp -f "$CSV" "data/ab_checklist/${ASOF}_ab_checklist_universe.csv"
          python - <<PY
          import pandas as pd
          df = pd.read_csv("$CSV")
          n = len(df)
          print(f"liquid_names={n:,}  score_range={df['score'].min():+d}..{df['score'].max():+d}")
          print(df.sort_values("score", ascending=False)[["Ticker","score","n_good","n_bad"]].head(20).to_string(index=False))
          if n < 50:
              print("WARNING: liquid universe is suspiciously small (<50).")
              print("If you expected full market, check: (1) finviz export row count,")
              print(" (2) whether ab_one overwrote this CSV after a prior full run,")
              print(" (3) liquid gate logs above for mcap/ADV parse failures.")
          else:
              print(f"OK: full-market checklist has {n:,} liquid names")
          PY

      - name: 2) Peer RS + industry/sector enrich (universe)
        if: ${{ github.event_name == 'schedule' || (inputs.skip_enrich != true && inputs.skip_enrich != 'true') }}
        run: |
          set -euo pipefail
          ASOF="${{ steps.meta.outputs.asof }}"
          # Prefer universe snapshot if present
          if [ -f "data/ab_checklist/${ASOF}_ab_checklist_universe.csv" ]; then
            cp -f "data/ab_checklist/${ASOF}_ab_checklist_universe.csv" \
                  "data/ab_checklist/${ASOF}_ab_checklist.csv"
            echo "restored universe checklist before enrich"
          fi
          echo "=== peer_rs --date $ASOF ==="
          python -m src.peer_rs --date "$ASOF" || true
          echo "=== ab_enrich --date $ASOF  (no --ticker → full checklist) ==="
          python -m src.ab_enrich --date "$ASOF"
          echo "==== enriched top ===="
          head -40 "data/ab_checklist/${ASOF}_ab_checklist_enriched.md" 2>/dev/null || true
          python - <<PY
          from pathlib import Path
          import pandas as pd
          p = Path("data/ab_checklist/${ASOF}_ab_checklist_enriched.csv")
          if p.exists():
              df = pd.read_csv(p)
              print(f"enriched_rows={len(df):,}")
          else:
              print("WARN: enriched CSV missing")
          PY

      - name: 3) PIT backfill — liquid universe (1d/3d/1w/2m + pattern audit)
        if: ${{ github.event_name == 'schedule' || (inputs.skip_backfill != true && inputs.skip_backfill != 'true') }}
        run: |
          set -euo pipefail
          ASOF="${{ steps.meta.outputs.asof }}"
          M="${{ inputs.months }}"
          M="${M:-24}"
          # Ensure universe checklist is the one backfill sees
          if [ -f "data/ab_checklist/${ASOF}_ab_checklist_universe.csv" ]; then
            cp -f "data/ab_checklist/${ASOF}_ab_checklist_universe.csv" \
                  "data/ab_checklist/${ASOF}_ab_checklist.csv"
          fi
          echo "=== ab_backfill --months $M --end $ASOF  (no --ticker → liquid universe) ==="
          echo "NOTE: after the last asof day log, pattern-audit + parquet write can take"
          echo "      several more minutes with no new lines — that is not a hang."
          python -u -m src.ab_backfill --months "$M" --end "$ASOF"
          echo "==== backfill outputs ===="
          ls -lah data/ab_backfill/ | tail -20
          LATEST_MD=$(ls -1t data/ab_backfill/*universe*.md data/ab_backfill/*.md 2>/dev/null | head -1 || true)
          if [ -n "$LATEST_MD" ]; then
            echo "===== $LATEST_MD (audit tail) ====="
            awk '/^## Pattern correlation audit/{p=1} p' "$LATEST_MD" | head -80 || head -60 "$LATEST_MD"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-full-market-${{ steps.meta.outputs.asof }}
          path: |
            data/ab_checklist/
            data/ab_backfill/
            data/peers/
          if-no-files-found: warn

      - name: Commit outputs
        if: always()
        run: |
          set -euo pipefail
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/ab_checklist/ data/ab_backfill/ data/peers/ data/prices/ 01_daily/*peer_rs* || true
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: AB full market ${{ steps.meta.outputs.asof }} (checklist+peers+backfill)"
          git pull --rebase origin main || true
          git push origin HEAD:main
