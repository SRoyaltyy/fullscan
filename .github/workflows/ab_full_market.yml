name: AB Full Market (checklist + peers + backfill)

# Full liquid-universe version of AB One Button.
# Prerequisites (auto-run if missing; auto-reuse if already present):
#   - data/exports/finviz_*.csv or data/finviz/latest.csv
#   - data/prices/ohlc.parquet (price_store bootstrap)
#
# Steps:
#   0) price_store bootstrap  — skip if parquet has enough history
#   1) ab_checklist           — skip if as-of CSV has ≥50 liquid rows
#   2) peer_rs + ab_enrich    — skip if enriched CSV has ≥50 rows
#   3) ab_backfill            — skip if a *universe* PIT file covers asof+months
#                               (AAPL/BB/BBAI single-ticker files do NOT count)
#
# skip_* inputs: true = force skip; false/schedule = auto-reuse if present.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "As-of YYYY-MM-DD (blank = latest finviz export)"
        required: false
        default: ""
      months:
        description: "PIT backfill lookback months"
        required: false
        default: "12"
      bootstrap_days:
        description: "Price history calendar days to ensure"
        required: false
        default: "400"
      skip_bootstrap:
        description: "Force skip price bootstrap (true) or auto-reuse (false)"
        type: boolean
        default: false
      skip_checklist:
        description: "Force skip checklist (true) or auto-reuse if CSV exists (false)"
        type: boolean
        default: false
      skip_enrich:
        description: "Force skip enrich (true) or auto-reuse if enriched CSV exists (false)"
        type: boolean
        default: false
      skip_backfill:
        description: "Force skip PIT backfill (true) or auto-reuse universe file (false)"
        type: boolean
        default: false
  schedule:
    # Primary evening liquid-universe AB job. hit_board is 23:00;
    # ab_full_scan is 05:00 UTC Tue–Sat. Do not move these back together.
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: ab-full-market
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install openpyxl pyarrow beautifulsoup4 lxml yfinance

      - name: Resolve as-of + verify Finviz export
        id: meta
        run: |
          set -euo pipefail
          D="${{ inputs.date }}"
          D="${D//+/-}"
          if [ -z "$D" ]; then
            LATEST=$(ls -1 data/exports/finviz_????-??-??.csv 2>/dev/null | sort | tail -1 || true)
            if [ -n "$LATEST" ]; then
              D=$(basename "$LATEST" | sed 's/finviz_//;s/.csv//')
            else
              D=$(TZ=America/New_York date +%F)
            fi
          fi
          echo "asof=$D" >> "$GITHUB_OUTPUT"
          echo "========================================"
          echo "  AB FULL MARKET"
          echo "  asof=$D  mode=LIQUID_UNIVERSE"
          echo "  months=${{ inputs.months || '12' }}"
          echo "  bootstrap_days=${{ inputs.bootstrap_days || '400' }}"
          echo "========================================"
          EXP="data/exports/finviz_${D}.csv"
          if [ ! -f "$EXP" ]; then
            LATEST=$(ls -1 data/exports/finviz_????-??-??.csv 2>/dev/null | sort | tail -1 || true)
            if [ -z "$LATEST" ] && [ -f data/finviz/latest.csv ]; then
              echo "WARN: no dated exports; using data/finviz/latest.csv"
              mkdir -p data/exports
              cp -f data/finviz/latest.csv "data/exports/finviz_${D}.csv"
              LATEST="data/exports/finviz_${D}.csv"
            fi
            if [ -z "$LATEST" ]; then
              echo "FATAL: no finviz exports under data/exports/ and no data/finviz/latest.csv"
              exit 1
            fi
            echo "WARN: $EXP missing, falling back to $LATEST"
            D=$(basename "$LATEST" | sed 's/finviz_//;s/.csv//')
            echo "asof=$D" >> "$GITHUB_OUTPUT"
            EXP="$LATEST"
          fi
          python3 - <<PY
          import pandas as pd
          df = pd.read_csv("$EXP", low_memory=False)
          print(f"export={ '$EXP' } rows={len(df):,} cols={len(df.columns)}")
          if len(df) < 100:
              raise SystemExit(f"FATAL: export only {len(df)} rows — not a full-market dump")
          print("sample tickers:", df.iloc[:5, 0].tolist())
          PY

      - name: Decide auto-reuse
        id: reuse
        env:
          ASOF: ${{ steps.meta.outputs.asof }}
          MONTHS: ${{ inputs.months || '12' }}
          BOOT_DAYS: ${{ inputs.bootstrap_days || '400' }}
          SKIP_BOOT: ${{ inputs.skip_bootstrap }}
          SKIP_CHECK: ${{ inputs.skip_checklist }}
          SKIP_ENR: ${{ inputs.skip_enrich }}
          SKIP_BF: ${{ inputs.skip_backfill }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from datetime import date, timedelta
          from pathlib import Path

          import pandas as pd

          asof = os.environ["ASOF"].strip()
          months = int(os.environ.get("MONTHS") or "12")
          boot_days = int(os.environ.get("BOOT_DAYS") or "400")

          def force_skip(raw: str) -> bool:
              return str(raw).strip().lower() in {"true", "1", "yes"}

          def csv_rows(path: Path) -> int:
              if not path.exists() or path.stat().st_size < 200:
                  return 0
              try:
                  return int(len(pd.read_csv(path, usecols=[0], low_memory=False)))
              except Exception as e:
                  print(f"warn: pandas read {path}: {e}")
              try:
                  with path.open("rb") as fh:
                      return max(sum(1 for _ in fh) - 1, 0)
              except Exception as e:
                  print(f"warn: could not read {path}: {e}")
                  return 0

          def decide(force: bool, reusable: bool, label: str) -> str:
              if force:
                  print(f"{label}: FORCE skip")
                  return "skip"
              if reusable:
                  print(f"{label}: REUSE existing artifact")
                  return "reuse"
              print(f"{label}: RUN")
              return "run"

          asof_d = date.fromisoformat(asof)
          need_start = (pd.Timestamp(asof_d) - pd.DateOffset(months=months)).date()
          need_px_start = (pd.Timestamp(asof_d) - pd.Timedelta(days=max(boot_days, months * 31))).date()

          # --- parquet ---
          meta_p = Path("data/prices/meta.json")
          pq = Path("data/prices/ohlc.parquet")
          px_ok = False
          first = last = None
          n_tickers = 0
          if pq.exists() and pq.stat().st_size > 1_000_000:
              if meta_p.exists():
                  try:
                      meta = json.loads(meta_p.read_text())
                      first = date.fromisoformat(str(meta.get("first_date"))[:10])
                      last = date.fromisoformat(str(meta.get("last_date"))[:10])
                      n_tickers = int(meta.get("n_tickers") or 0)
                  except Exception as e:
                      print(f"warn: meta.json: {e}")
              if not (first and last and n_tickers >= 50):
                  try:
                      import pyarrow.parquet as papq
                      names = set(papq.read_schema(pq).names)
                      cols = [c for c in ("date", "ticker") if c in names]
                      pdf = papq.read_table(pq, columns=cols).to_pandas()
                      first = pd.to_datetime(pdf["date"]).min().date()
                      last = pd.to_datetime(pdf["date"]).max().date()
                      n_tickers = int(pdf["ticker"].nunique()) if "ticker" in pdf.columns else 0
                      print(f"parquet inspected via pyarrow tickers={n_tickers}")
                  except Exception as e:
                      print(f"warn: parquet inspect: {e}")
              # last may trail asof by a session; bootstrap is the expensive full rebuild
              last_ok = bool(last) and last >= (asof_d - timedelta(days=7))
              if first and last and n_tickers >= 50 and first <= need_px_start and last_ok:
                  px_ok = True
                  print(f"parquet OK {first}→{last} tickers={n_tickers} size={pq.stat().st_size/1e6:.1f}MB")
              else:
                  print(f"parquet present but not enough history (first={first} last={last} n={n_tickers} need_start={need_px_start})")
          else:
              print("parquet missing or tiny")

          # --- checklist ---
          chk = Path(f"data/ab_checklist/{asof}_ab_checklist.csv")
          uni = Path(f"data/ab_checklist/{asof}_ab_checklist_universe.csv")
          n_chk = csv_rows(chk)
          n_uni = csv_rows(uni)
          chk_ok = max(n_chk, n_uni) >= 50
          print(f"checklist rows csv={n_chk} universe={n_uni} reusable={chk_ok}")

          # --- enrich ---
          enr = Path(f"data/ab_checklist/{asof}_ab_checklist_enriched.csv")
          n_enr = csv_rows(enr)
          enr_ok = n_enr >= 50
          print(f"enriched rows={n_enr} reusable={enr_ok}")

          # --- universe PIT backfill (single-ticker AAPL/BB/BBAI do NOT count) ---
          bf_ok = False
          pat = re.compile(r"^(\d{4}-\d{2}-\d{2})_(\d{4}-\d{2}-\d{2})_universe\.(parquet|csv)$")
          for p in sorted(Path("data/ab_backfill").glob("*_universe.*")):
              m = pat.match(p.name)
              if not m:
                  continue
              start_d = date.fromisoformat(m.group(1))
              end_d = date.fromisoformat(m.group(2))
              if start_d <= need_start and end_d >= asof_d and p.stat().st_size > 100_000:
                  bf_ok = True
                  print(f"universe backfill OK {p.name} {p.stat().st_size/1e6:.1f}MB")
                  break
          if not bf_ok:
              singles = [p.name for p in Path("data/ab_backfill").glob("*") if p.is_file()]
              print(f"no covering *_universe backfill (asof={asof} months={months} need_start={need_start})")
              print("existing backfill files:", singles[:20])

          out = {
              "bootstrap": decide(force_skip(os.environ.get("SKIP_BOOT", "")), px_ok, "bootstrap"),
              "checklist": decide(force_skip(os.environ.get("SKIP_CHECK", "")), chk_ok, "checklist"),
              "enrich": decide(force_skip(os.environ.get("SKIP_ENR", "")), enr_ok, "enrich"),
              "backfill": decide(force_skip(os.environ.get("SKIP_BF", "")), bf_ok, "backfill"),
          }
          github = os.environ.get("GITHUB_OUTPUT")
          if github:
              with open(github, "a", encoding="utf-8") as fh:
                  for k, v in out.items():
                      fh.write(f"{k}={v}\n")
          print("DECISION", out)
          PY

      - name: 0) Price history prerequisite (universe bootstrap)
        if: ${{ steps.reuse.outputs.bootstrap == 'run' }}
        run: |
          set -euo pipefail
          DAYS="${{ inputs.bootstrap_days }}"
          DAYS="${DAYS:-400}"
          echo "=== prerequisite: price_store bootstrap --days $DAYS ==="
          python -m src.price_store bootstrap --days "$DAYS"
          python -m src.price_store status

      - name: 0b) Price store status (honor force-skip)
        run: |
          set -euo pipefail
          if [ ! -f data/prices/ohlc.parquet ]; then
            if [ "${{ steps.reuse.outputs.bootstrap }}" = "skip" ]; then
              echo "parquet missing and skip_bootstrap=true — not rebuilding"
              python -m src.price_store status || true
              exit 1
            fi
            DAYS="${{ inputs.bootstrap_days }}"
            DAYS="${DAYS:-400}"
            echo "price store missing — auto bootstrap --days $DAYS"
            python -m src.price_store bootstrap --days "$DAYS"
          fi
          python -m src.price_store status

      - name: 1) AB checklist — liquid universe
        if: ${{ steps.reuse.outputs.checklist == 'run' }}
        run: |
          set -euo pipefail
          ASOF="${{ steps.meta.outputs.asof }}"
          CSV="data/ab_checklist/${ASOF}_ab_checklist.csv"
          # Do NOT rm existing checklist CSVs — reuse logic lives in Decide auto-reuse.
          rm -f src/_ab_checklist_cached.py || true
          echo "=== ab_checklist --date $ASOF ==="
          python -u - <<PY
          from src import ab_checklist as ab
          print(f"ab_checklist loaded: has_run={hasattr(ab, 'run')} has_main={hasattr(ab, 'main')}")
          if not hasattr(ab, "run"):
              raise SystemExit("FATAL: ab_checklist.run missing after load")
          out = ab.run(date="$ASOF", top=30)
          print(f"run() returned rows={len(out)}")
          PY
          if [ ! -f "$CSV" ]; then
            echo "ERROR: checklist CSV still missing after ab.run()"
            ls -la data/ab_checklist/ || true
            exit 1
          fi
          cp -f "$CSV" "data/ab_checklist/${ASOF}_ab_checklist_universe.csv"
          python - <<PY
          import pandas as pd
          df = pd.read_csv("$CSV")
          n = len(df)
          print(f"liquid_names={n:,}  score_range={df['score'].min():+d}..{df['score'].max():+d}")
          print(df.sort_values("score", ascending=False)[["Ticker","score","n_good","n_bad"]].head(20).to_string(index=False))
          if n < 50:
              raise SystemExit(
                  f"FATAL: liquid universe only {n} names (expected ~2000+)."
              )
          print(f"OK: full-market checklist has {n:,} liquid names")
          PY

      - name: 1b) Keep universe checklist copy when reusing
        if: ${{ steps.reuse.outputs.checklist != 'run' }}
        run: |
          set -euo pipefail
          ASOF="${{ steps.meta.outputs.asof }}"
          CSV="data/ab_checklist/${ASOF}_ab_checklist.csv"
          UNI="data/ab_checklist/${ASOF}_ab_checklist_universe.csv"
          if [ -f "$CSV" ] && [ ! -f "$UNI" ]; then
            cp -f "$CSV" "$UNI"
            echo "copied $CSV → $UNI"
          elif [ -f "$UNI" ] && [ ! -f "$CSV" ]; then
            cp -f "$UNI" "$CSV"
            echo "copied $UNI → $CSV"
          fi
          ls -lah "$CSV" "$UNI" 2>/dev/null || true

      - name: 2) Peer RS + industry/sector enrich (universe)
        if: ${{ steps.reuse.outputs.enrich == 'run' }}
        run: |
          set -euo pipefail
          ASOF="${{ steps.meta.outputs.asof }}"
          if [ -f "data/ab_checklist/${ASOF}_ab_checklist_universe.csv" ]; then
            cp -f "data/ab_checklist/${ASOF}_ab_checklist_universe.csv" \
                  "data/ab_checklist/${ASOF}_ab_checklist.csv"
            echo "restored universe checklist before enrich"
          fi
          echo "=== peer_rs --date $ASOF ==="
          python -m src.peer_rs --date "$ASOF" || true
          echo "=== ab_enrich --date $ASOF ==="
          python -m src.ab_enrich --date "$ASOF"
          head -40 "data/ab_checklist/${ASOF}_ab_checklist_enriched.md" 2>/dev/null || true
          python - <<PY
          from pathlib import Path
          import pandas as pd
          p = Path("data/ab_checklist/${ASOF}_ab_checklist_enriched.csv")
          if not p.exists():
              raise SystemExit("enriched CSV missing")
          df = pd.read_csv(p)
          print(f"enriched_rows={len(df):,}")
          if len(df) < 50:
              raise SystemExit(f"FATAL: enriched only {len(df)} rows")
          PY

      - name: 3) PIT backfill — liquid universe
        if: ${{ steps.reuse.outputs.backfill == 'run' }}
        run: |
          set -euo pipefail
          ASOF="${{ steps.meta.outputs.asof }}"
          M="${{ inputs.months }}"
          M="${M:-12}"
          if [ -f "data/ab_checklist/${ASOF}_ab_checklist_universe.csv" ]; then
            cp -f "data/ab_checklist/${ASOF}_ab_checklist_universe.csv" \
                  "data/ab_checklist/${ASOF}_ab_checklist.csv"
          fi
          echo "=== ab_backfill --months $M --end $ASOF ==="
          echo "NOTE: after last asof day log, pattern-audit + parquet write can take minutes."
          python -u -m src.ab_backfill --months "$M" --end "$ASOF"
          ls -lah data/ab_backfill/ | tail -20
          LATEST_MD=$(ls -1t data/ab_backfill/*universe*.md data/ab_backfill/*.md 2>/dev/null | head -1 || true)
          if [ -n "$LATEST_MD" ]; then
            echo "===== $LATEST_MD ====="
            awk '/^## Pattern correlation audit/{p=1} p' "$LATEST_MD" | head -80 || head -60 "$LATEST_MD"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-full-market-${{ steps.meta.outputs.asof }}
          path: |
            data/ab_checklist/
            data/ab_backfill/
            data/peers/
          if-no-files-found: warn

      - name: Commit outputs
        if: always()
        run: |
          set -euo pipefail
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/ab_checklist/ data/ab_backfill/ data/peers/ data/prices/meta.json 01_daily/*peer_rs* || true
          # Persist a rebuilt store so the next run can auto-reuse. Skip the 77MB
          # blob when bootstrap was reused or force-skipped.
          if [ "${{ steps.reuse.outputs.bootstrap }}" = "run" ]; then
            git add -f data/prices/ohlc.parquet || true
          fi
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: AB full market ${{ steps.meta.outputs.asof }} (checklist+peers+backfill)"
          git pull --rebase origin main || true
          git push origin HEAD:main
