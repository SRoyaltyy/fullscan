name: Top Gainer As-Of

# For every session since the dashboard start, take realized gainers
# at/above a Change% floor (default 2,5), liquid losers ≤-2%, and the
# morning 1d BUY/SELL sleeves. Color the 12 cameras + 6 coaches +
# hall-pass lane from the 09:30 ET packet. Same-day RelVol and
# same-day stock book never color a cell. Missing-as-of prints grey.
#
# This is not Stock Book Backtest (that grades the book's own picks)
# and not Ticker Lookback (that is one name at a time).
#
# Code comes from the ref that triggered the run. Daily artifacts are
# overlaid from main so the walk sees the live tape.

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "First session YYYY-MM-DD"
        required: false
        default: "2026-08-13"
      to_date:
        description: "Last session YYYY-MM-DD (empty = latest tape)"
        required: false
        default: ""
      floors:
        description: "Change% floors to walk, comma-separated (default 2,5)"
        required: false
        default: "2,5"
      liquid:
        description: "Only mcap ≥ $100M and adv ≥ 500k (skip penny spikes)"
        required: false
        default: true
        type: boolean
      method:
        description: "same-day = D morning boxes + same-day Change%. lag-3d = yesterday + 2-session-prior snapshots, grade on close 3 sessions later."
        required: false
        default: "same-day"
        type: choice
        options:
          - same-day
          - lag-3d

permissions:
  contents: read
  actions: read

concurrency:
  group: gainer-asof
  cancel-in-progress: true

jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Overlay live daily files from main
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- 01_daily data \
            || echo "overlay skipped (already on main or paths missing)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pandas pyarrow

      - name: Walk every gainer at/above the floor
        env:
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
          FLOORS: ${{ inputs.floors }}
          LIQUID: ${{ inputs.liquid }}
          METHOD: ${{ inputs.method }}
        run: |
          set -euo pipefail
          FROM_DATE="${FROM_DATE:-2026-08-13}"
          FLOORS="${FLOORS:-2,5}"
          METHOD="${METHOD:-same-day}"
          ARGS=(--from "$FROM_DATE" --floors "$FLOORS" --all --buys --sells --losers --write --min-mcap 100)
          [ -n "${TO_DATE:-}" ] && ARGS+=(--to "$TO_DATE")
          if [ "${LIQUID}" = "false" ]; then
            ARGS+=(--no-liquid)
          fi
          if [ "$METHOD" = "lag-3d" ]; then
            ARGS+=(--snapshots 1,2 --horizon 3 --write-suffix LAG3D)
          fi
          python -m src.gainer_asof "${ARGS[@]}" | tee /tmp/gainer-asof.md
          if [ "$METHOD" = "lag-3d" ]; then
            test -s 03_scoreboard/TOP_GAINER_ASOF_LAG3D.md
            test -s 03_scoreboard/top_gainer_asof_lag3d.json
          else
            test -s 03_scoreboard/TOP_GAINER_ASOF.md
            test -s 03_scoreboard/top_gainer_asof.json
          fi

      - name: Show hit-rate table
        if: always()
        run: |
          echo "======== TOP GAINER AS-OF ========"
          if [ -f 03_scoreboard/TOP_GAINER_ASOF_LAG3D.md ]; then
            awk '/^# Top gainers/,/^## Per session/' 03_scoreboard/TOP_GAINER_ASOF_LAG3D.md
          elif [ -f 03_scoreboard/TOP_GAINER_ASOF.md ]; then
            awk '/^# Top gainers/,/^## Per session/' 03_scoreboard/TOP_GAINER_ASOF.md
          else
            echo "NO SCOREBOARD — walk did not write"
          fi

      - name: Upload scoreboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top-gainer-asof
          path: |
            03_scoreboard/TOP_GAINER_ASOF.md
            03_scoreboard/top_gainer_asof.json
            03_scoreboard/TOP_GAINER_ASOF_LAG3D.md
            03_scoreboard/top_gainer_asof_lag3d.json

      - name: Add links to run summary
        if: always()
        run: |
          {
            echo "## Top Gainer As-Of"
            echo
            echo "Method **${{ inputs.method }}**. Gainers at floors ${{ inputs.floors }} plus losers, 1d BUY and 1d SELL, since ${{ inputs.from_date }}."
            if [ "${{ inputs.method }}" = "lag-3d" ]; then
              echo
              echo "Lag test: cameras/coaches from yesterday (D-1) and two sessions prior (D-2). Price % is close 3 sessions later, not same-day Change%."
            fi
            echo
            echo "Download the **top-gainer-asof** artifact for the full per-name table."
            echo
            BOARD=03_scoreboard/TOP_GAINER_ASOF.md
            [ -f 03_scoreboard/TOP_GAINER_ASOF_LAG3D.md ] && BOARD=03_scoreboard/TOP_GAINER_ASOF_LAG3D.md
            if [ -f "$BOARD" ]; then
              awk '/^## What the boxes/,/^## Per session/' "$BOARD"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
