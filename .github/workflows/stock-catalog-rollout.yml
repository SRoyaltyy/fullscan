# Individual stock comparisons now execute on demand. Retain existing immutable
# rollout checkpoints, but stop the superseded market-wide rebuild and its
# obsolete comparison-page publisher from occupying runners or replacing the UI.
name: Catalog-wide stock parser and same-stock comparison
on:
  pull_request:
    paths:
      - '.github/workflows/stock-catalog-rollout.yml'
permissions:
  contents: read
concurrency:
  group: stock-catalog-rollout
  cancel-in-progress: true
jobs:
  superseded:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/cumulative-scanner-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Use the merged single-stock request workflow
        run: |
          echo 'Catalog-wide output rebuilding is superseded by stock-parser-request.yml.'
          echo 'All existing stored source artifacts and rollout checkpoints are retained.'
          echo 'Select any catalog stock on the comparison page and press Enter.'
          echo 'This status does not certify extraction accuracy or completed catalog rebuilding.'
