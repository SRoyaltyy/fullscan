name: Patch factor-mine new-vs-held calendar

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-fm-ovcal
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Inject calendar into live factor-mine page
        run: |
          set -euo pipefail
          python3 main/scripts/patch_fm_ovcal.py pages/dashboard/factor-mine/index.html
          if [ -f pages/factor-mine/index.html ]; then
            python3 main/scripts/patch_fm_ovcal.py pages/factor-mine/index.html
          fi

      - name: Commit gh-pages
        working-directory: pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/factor-mine/index.html factor-mine/index.html || true
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Add new-buy vs held calendar to factor-mine dash."
          git push origin HEAD:gh-pages
