name: Event Scanner

# Daily TWO-PASS scan of market-moving events (past 2 weeks / today /
# next 2 weeks) across all major regions and sectors.
#   Pass 1 (run_events):          primary scan (skip-if-good, QC+retry)
#   Pass 2 (run_events_catcher):  gap hunt — emphasis on government
#                                 actions (executive orders, legislation,
#                                 judicial, agency regulatory)
#   Pass 3 (events_fallback):     last-ditch carry; NOT treated as quality-ok
# Runs FIRST on the ECS runner (~06:10 ET) so predict/sectors are not
# blocked, and so 01_daily/events/latest.md is fresh for downstream.

on:
  schedule:
    - cron: "10 10 * * 1-5"   # 06:10 ET weekdays (was 10:43 UTC)
  workflow_dispatch:
    inputs:
      run_date:
        description: "YYYY-MM-DD (default: today ET)"
        required: false
        default: ""
      force:
        description: "Ignore 09:25 ET cutoff and skip-if-good"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: event-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: [self-hosted, ecs]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests ddgs

      - name: Pass 1 — primary event scan
        continue-on-error: true
        id: primary
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          DATE: ${{ github.event.inputs.run_date }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          python -m src.run_events "${ARGS[@]}"

      - name: Pass 2 — catcher (gap hunt / replacement)
        continue-on-error: true
        id: catcher
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          DATE: ${{ github.event.inputs.run_date }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          python -m src.run_events_catcher "${ARGS[@]}"

      # Pass 3 — last-ditch only: carry is NOT artifact_ok. Orchestrator
      # will re-dispatch a real scan before 09:25 ET.
      - name: Pass 3 — carry-forward fallback (never zero events)
        continue-on-error: true
        env:
          DATE: ${{ github.event.inputs.run_date }}
        run: python -m src.events_fallback ${DATE:+--date "$DATE"}

      - name: Self-read QC
        if: always()
        env:
          DATE: ${{ github.event.inputs.run_date }}
        run: |
          D="${DATE:-$(TZ=America/New_York date +%F)}"
          python -m src.output_qc --kind events --path "01_daily/events/${D}_events.json" \
            || echo "QC FAIL — orchestrator must not treat this as success"

      - name: Commit event scan outputs
        if: always()
        run: |
          bash scripts/safe_git_push.sh \
            "auto: event scan + catcher [$(date -u +%F)]" \
            01_daily/events 01_daily/_transcripts
