name: Post-Close ALL (grade + learn + next captains)

# One evening button: outcome → sector grades → learn → tomorrow's
# captain notebook. Skip-if-good on every LLM step.
# CLOCK: GH cron ~16:10 ET + ECS 22:00 timer (second fire spends $0).

on:
  schedule:
    - cron: "10 20 * * 1-5"
  workflow_dispatch:
    inputs:
      runner:
        description: "ecs (OpenClaw) or ubuntu. ubuntu cannot reach Grok."
        required: false
        default: "ecs"
        type: choice
        options:
          - ecs
          - ubuntu
      run_date:
        description: "Closed session YYYY-MM-DD (empty = last closed ET)"
        required: false
        default: ""
      force:
        description: "true = rewrite even if files exist"
        required: false
        default: "false"
      llm_backend:
        description: "auto = Grok then DeepSeek · grok = Grok only · deepseek = no Grok"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - grok
          - deepseek

permissions:
  contents: write
  actions: write

concurrency:
  group: postclose-all
  cancel-in-progress: false

jobs:
  postclose:
    runs-on: ${{ github.event.inputs.runner == 'ubuntu' && 'ubuntu-latest' || fromJSON('["self-hosted","ecs"]') }}
    # Two closed sessions × 11 sector grades + reflects + captains.
    # 12h died mid-pack when several Grok calls each burned the 900s cap.
    timeout-minutes: 1080
    env:
      OPENCLAW_TIMEOUT: "900"
      FULLSCAN_HOME: "/home/gha"
      HOME: "/home/gha"
      FINVIZ_SKIP_LIVE: "1"
      FULLSCAN_PERSIST: "/home/gha/fullscan-persist"
      MAP_POSTCLOSE_LOCK: "/home/gha/fullscan-persist/locks/map-postclose.lock"
    steps:
      - name: Wait if ECS systemd post-close owns the box
        run: |
          echo "skip=" >> "$GITHUB_ENV"
          LOCK="${MAP_POSTCLOSE_LOCK:-/home/gha/fullscan-persist/locks/map-postclose.lock}"
          if mkdir -p "$(dirname "$LOCK")" 2>/dev/null; then
            exec 9>"$LOCK"
            if flock -n 9; then
              echo "lock is free"
              flock -u 9 || true
            else
              echo "ECS systemd job holds the lock — backing off"
              echo "skip=yes" >> "$GITHUB_ENV"
            fi
          else
            echo "no persist lock dir (ubuntu) — continue"
          fi

      - uses: actions/checkout@v4
        if: env.skip != 'yes'
        with:
          clean: false

      - name: Match origin/main (leftover ECS files must not fake SKIP)
        if: env.skip != 'yes'
        run: |
          git fetch origin main
          git reset --hard origin/main
          # Gate files only. Keep 01_daily/_transcripts so a hung Grok
          # call can write *_outcome.md / *_reflect.md on retry (no LLM).
          git clean -fd -- 01_daily/general 01_daily/sectors \
            01_daily/map_heat 01_daily/news 02_lessons 03_scoreboard || true
          git ls-files -o --exclude-standard -- '01_daily/*_learnings.md' \
            | xargs -r rm -f

      - name: Skip if post-close pack already on disk (no LLM)
        if: env.skip != 'yes' && github.event.inputs.force != 'true'
        run: |
          DATE="${{ github.event.inputs.run_date }}"
          if [ -z "$DATE" ]; then
            if python3 -m src.skip_if_good --job postclose_all; then
              echo "skip_python=yes" >> "$GITHUB_ENV"
            fi
          elif python3 -m src.skip_if_good --job postclose_all --date "$DATE"; then
            echo "skip_python=yes" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: env.skip != 'yes' && env.skip_python != 'yes'
        with:
          python-version: "3.10"

      - name: Install
        if: env.skip != 'yes' && env.skip_python != 'yes'
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary yfinance pandas requests openai ddgs || true

      - name: Post-Close ALL
        if: env.skip != 'yes' && env.skip_python != 'yes'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_KEY: ${{ secrets.DATABASE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCLAW_TIMEOUT: "900"
          GROK_ONLY: "0"
          LLM_BACKEND: ${{ github.event.inputs.llm_backend || 'auto' }}
          FINVIZ_SKIP_LIVE: "1"
        run: |
          set -e
          export HOME="${FULLSCAN_HOME:-/home/gha}"
          LOCK="${MAP_POSTCLOSE_LOCK:-/home/gha/fullscan-persist/locks/map-postclose.lock}"
          if mkdir -p "$(dirname "$LOCK")" 2>/dev/null; then
            exec 9>"$LOCK"
            if ! flock -n 9; then
              echo "ECS systemd job grabbed the lock — backing off"
              exit 0
            fi
          fi
          DATE="${{ github.event.inputs.run_date }}"
          FORCE="${{ github.event.inputs.force }}"
          FORCE="${FORCE:-false}"
          BACKEND="${LLM_BACKEND:-auto}"
          ARGS=(--llm-backend "$BACKEND")
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          echo "CMD: python -m src.run_postclose_all ${ARGS[*]}"
          python -m src.run_postclose_all "${ARGS[@]}"

      - name: Commit post-close artifacts
        if: always() && env.skip != 'yes' && env.skip_python != 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export HOME="${FULLSCAN_HOME:-/home/gha}"
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          bash scripts/safe_git_push.sh \
            "auto: post-close ALL [$(date -u +%F_%H%M)]" \
            01_daily/general/ 01_daily/sectors/ 01_daily/map_heat/ \
            01_daily/news/ 01_daily/_transcripts/ 01_daily/_channel1/ \
            01_daily/*_learnings.md \
            02_lessons/ 03_scoreboard/ \
            00_grounding/mutable_policy.md \
            00_grounding/book_policy.json \
            00_grounding/weather_rules_proposals.json
