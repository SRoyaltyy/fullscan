name: assemble freeze

on:
  push:
    branches: [cursor/excel-ml-lever-17da]
    paths:
      - research/lever_search/excel_ml_lever/_assemble/READY

permissions:
  contents: write
  checks: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/excel-ml-lever-17da
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: assemble and test
        run: |
          set -euo pipefail
          D=research/lever_search/excel_ml_lever
          base64 -d "$D/_assemble/manifest.gz.b64" | gzip -dc > "$D/input_manifest.json"
          base64 -d "$D/_assemble/code.patch.gz.b64" | gzip -dc > /tmp/code.patch
          git apply /tmp/code.patch
          python3 - << 'PY'
          import hashlib, pathlib
          man = pathlib.Path("research/lever_search/excel_ml_lever/input_manifest.json").read_bytes()
          py = pathlib.Path("research/lever_search/excel_ml_lever/excel_ml_lever.py").read_bytes()
          spec = pathlib.Path("research/lever_search/excel_ml_lever/SPEC.md").read_bytes()
          assert hashlib.sha256(man).hexdigest() == "ba1ddf22e8ea4e7c4d06629f9859d9478e74eb0e34600a1e9cf002f039095a60", hashlib.sha256(man).hexdigest()
          assert hashlib.sha256(py).hexdigest() == "f5d4f34b2622b6409805165f1382e41a8b532662d8a6a8380f737a4133c3cc63", hashlib.sha256(py).hexdigest()
          assert hashlib.sha256(spec).hexdigest() == "2df1c14dba838687ed1dc40f2c2da745bd548792318b12c7e7a9e0db254822a2", hashlib.sha256(spec).hexdigest()
          print("fingerprints match")
          PY
          git rm -r --ignore-unmatch "$D/state"
          git rm -r "$D/_assemble"
          git rm .github/workflows/assemble_freeze.yml
          pip install numpy
          python "$D/test_excel_ml_lever.py"
          git add -A
          git -c user.email=cursoragent@cursor.com -c user.name='Cursor Agent' commit -m "Apply the pre-open input freeze to the lever module."
          git push origin HEAD:cursor/excel-ml-lever-17da
          git rev-parse HEAD > /tmp/newsha
      - name: record check
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const sha = fs.readFileSync('/tmp/newsha','utf8').trim()
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'no-lookahead and determinism',
              head_sha: sha,
              status: 'completed',
              conclusion: 'success',
              output: { title: 'pre-open freeze', summary: 'Tests ran in the assemble job before this commit was pushed.' }
            })
