name: News Actions (event edges → tickers)

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Lookback hours"
        required: false
        default: "48"
      limit:
        description: "Max news rows"
        required: false
        default: "300"
      run_date:
        description: "YYYY-MM-DD"
        required: false
        default: ""
      force:
        description: "Ignore 09:25 ET cutoff and skip-if-good"
        required: false
        default: "false"
  # Pre-Open ALL (06:00 ET) runs morning news actions. When that Pre-Open
  # is cancelled or fails (2026-10-16: actions.json only landed 08:45 ET,
  # so the decision ticket was not ready for the 08:05 h1 seal send),
  # these early fallbacks keep news actions from being the bottleneck.
  # UTC 10:35/11:35 = 06:35/07:35 ET (EDT), 05:35/06:35 ET (EST).
  # src.news_actions skip-if-good no-ops when today's actions are landed.
  schedule:
    - cron: '35 10,11 * * 1-5'

permissions:
  actions: write
  contents: write

concurrency:
  group: news-actions
  # A fallback cron never cancels an in-flight dispatched run.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FULLSCAN_LAND: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary pandas || true
      - name: Skip if past 09:25 ET
        if: github.event_name == 'schedule'
        run: |
          ET_HM=$((10#$(TZ=America/New_York date +%H%M)))
          echo "ET_HM=$ET_HM"
          if [ "$ET_HM" -ge 925 ]; then
            echo "past 09:25 ET — skip news_actions"
            echo "skip=yes" >> "$GITHUB_ENV"
          fi
      - name: Ensure finviz csv
        env:
          FINVIZ_EXPORT: ${{ secrets.FINVIZ_EXPORT }}
        run: |
          mkdir -p data/finviz
          if [ -n "$FINVIZ_EXPORT" ]; then
            # Reuse elite export URL if present (same secret theme-radar uses)
            curl -fsSL -o data/finviz/latest.csv "$FINVIZ_EXPORT" || true
          fi
          if [ ! -f data/finviz/latest.csv ]; then
            # fallback: copy any committed csv
            ls data/finviz/*.csv 2>/dev/null | head -1 | xargs -I{} cp {} data/finviz/latest.csv || true
          fi
          ls -la data/finviz/ || true
          wc -l data/finviz/latest.csv 2>/dev/null || echo "NO FINVIZ CSV — ticker expand will be empty"
      - name: Run news actions
        if: env.skip != 'yes'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINVIZ_CSV: data/finviz/latest.csv
        run: |
          set -e
          HOURS="${{ github.event.inputs.hours }}"; HOURS=${HOURS:-48}
          LIMIT="${{ github.event.inputs.limit }}"; LIMIT=${LIMIT:-300}
          DATE="${{ github.event.inputs.run_date }}"
          FORCE="${{ github.event.inputs.force }}"
          ARGS=(--hours "$HOURS" --limit "$LIMIT")
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          python -m src.news_actions "${ARGS[@]}"
      - name: Preview
        if: always()
        run: |
          latest=$(ls -1t 01_daily/news/*_actions.md 2>/dev/null | head -1)
          if [ -n "$latest" ]; then head -100 "$latest"; fi
      - name: Commit
        if: env.skip != 'yes'
        run: |
          bash scripts/safe_git_push.sh "auto: news actions" \
            01_daily/news/ data/finviz/latest.csv
