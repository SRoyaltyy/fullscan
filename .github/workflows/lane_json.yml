name: Lane JSON wire

# Official free APIs only. No browser, no Gemini website, no DeepSeek chat,
# no CAPTCHA, no cloakbrowser.
#
# Inbox:  02_lessons/lane/inbox.json
# Outbox: 02_lessons/lane/outbox/YYYY-MM-DD.json
# Router: src/lane_route.py
# Examples: 02_lessons/lane/inbox.examples.json
#
# Templates (see src/lane_route.py for prompt builders):
#   key_people / key_products / revenue_mix / custom  — ticker required
#   news_to_tickers  — articles[{title,body,known_at?}]. No ticker required.
#                      Hoppers: glm-4.7-flash → SF Qwen3-8B → OR :free → qwen-flash
#   company_dig      — ticker + brief/questions. Longer context, still $0.
#                      Hoppers: SF Qwen/DeepSeek non-Pro → DeepSeek → OR :free
#                      → Zhipu Flash
# #290 Grok-news overlay can enqueue news_to_tickers later (do not rewrite here).
#
# Variable: LANE_URL = Lane app after publish (https://….grok.me)
#
# Secrets / vars (any subset — missing hoppers skip, they do not fail the job):
#   OPENROUTER_API_KEY          — PRIMARY. :free / openrouter/free only. Never paid IDs.
#   GITHUB_MODELS_TOKEN         — GitHub Models (models.github.ai). Prefer this PAT.
#   GITHUB_TOKEN                — fallback if it can call models.github.ai (retired
#                                 2026-07-30; hopper tries once and skips on 401/403/410).
#   CLOUDFLARE_API_TOKEN        — Workers AI free allocation. Requires ACCOUNT_ID too.
#   CLOUDFLARE_ACCOUNT_ID       — Cloudflare account id (skip hopper if either missing).
#   SAMBANOVA_API_KEY           — SambaNova Cloud free tier. Skip if missing.
#   HF_TOKEN                    — Hugging Face Inference router, free providers only.
#   DEEPSEEK_API_KEY            — official api.deepseek.com (after OpenRouter; skip 402).
#   DASHSCOPE_API_KEY           — Qwen / DashScope free quota (or QWEN_API_KEY).
#   DASHSCOPE_BASE_URL          — optional compatible-mode/v1 base (secret).
#                                 Tried first; /chat/completions appended if
#                                 missing. Public dashscope*.aliyuncs.com next.
#                                 Never print this value.
#   QWEN_API_KEY                — alias for DashScope.
#   SILICONFLOW_API_KEY         — SiliconFlow free models only (no Pro/ prefix).
#   ZHIPU_API_KEY               — Zhipu GLM official (or GLM_API_KEY). Free Flash only.
#   GLM_API_KEY                 — alias for Zhipu.
#   MOONSHOT_API_KEY            — Moonshot Kimi official. Skip if missing / 402.
#   MODELSCOPE_API_KEY          — ModelScope API-Inference (or MODELSCOPE_API_TOKEN /
#                                 MODELSCOPE_SDK_TOKEN). Skip if missing.
#   OLLAMA_URL                  — optional US-box offline/batch (secret or var).
#                                 Skip if unset. Not required on this ubuntu job.
#   TOKENHUB_API_KEY            — Tencent TokenHub CN (or TENCENT_API_KEY).
#   TENCENT_API_KEY             — alias for TokenHub Bearer.
#   HUNYUAN_API_KEY             — optional extra alias (key only; no Hunyuan URL).
#   TOKENHUB_BASE_URL           — optional OpenAI-compatible /v1 base (secret).
#                                 Tried first; /chat/completions appended if
#                                 missing. Default tokenhub.tencentmaas.com/v1.
#                                 Never print this value.
#   TENCENT_BASE_URL            — alias base, after TOKENHUB_BASE_URL.
#   GROQ_API_KEY                — last-resort only (dead for HK). Do not prefer.
#   GEMINI_API_KEY
#
# Direct hopper order (rotate to next model/provider on 429/5xx):
#   OpenRouter free (CN-origin :free first) → DeepSeek → Qwen/DashScope
#   → Zhipu GLM → Moonshot Kimi → SiliconFlow → ModelScope
#   → TokenHub overflow (flash / flashx then hy3; behind true $0)
#   → GitHub Models → Cloudflare → SambaNova
#   → Ollama (if OLLAMA_URL) → HF free router → Groq (last-resort) → Gemini
# news_to_tickers / company_dig reorder the same $0 allowlist (never Pro/paid).

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "20 10 * * 1-5"

permissions:
  contents: write

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Route inbox
        env:
          LANE_URL: ${{ vars.LANE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL || vars.OLLAMA_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
          MODELSCOPE_SDK_TOKEN: ${{ secrets.MODELSCOPE_SDK_TOKEN }}
          TOKENHUB_API_KEY: ${{ secrets.TOKENHUB_API_KEY }}
          TENCENT_API_KEY: ${{ secrets.TENCENT_API_KEY }}
          HUNYUAN_API_KEY: ${{ secrets.HUNYUAN_API_KEY }}
          TOKENHUB_BASE_URL: ${{ secrets.TOKENHUB_BASE_URL }}
          TENCENT_BASE_URL: ${{ secrets.TENCENT_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: PYTHONPATH=. python3 -m src.lane_route
      - name: Commit outbox
        run: |
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add 02_lessons/lane/outbox || true
          if git diff --staged --quiet; then
            echo "No answers to commit"
            exit 0
          fi
          git commit -m "auto: lane json [$(date -u +%F)]"
          git pull --rebase origin main || true
          git push origin main
