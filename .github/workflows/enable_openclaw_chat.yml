name: Enable OpenClaw chat classroom

on:
  workflow_dispatch:
    inputs:
      force_restart:
        description: "true = always bounce gateway even if short PONG works (hung sessions)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  enable:
    runs-on: [self-hosted, ecs]
    timeout-minutes: 15
    steps:
      - name: Clear stale git index.lock (shared ECS workspace)
        shell: bash
        run: |
          # A job killed mid-checkout leaves .git/index.lock; the next checkout then hangs.
          # One ECS runner, so a lock older than 1 minute before checkout is stale.
          W="${GITHUB_WORKSPACE:-.}"
          for L in "$W/.git/index.lock" "$W/.git/shallow.lock" "$W/.git/HEAD.lock"; do
            if [ -n "$(find "$L" -mmin +1 2>/dev/null)" ]; then echo "removing stale $L"; rm -f "$L" || sudo -n rm -f "$L" || true; fi
          done
          if [ "$(git -C "$W" config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::shared ECS workspace is sparse; this checkout re-materializes the full tree"
          fi
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Full tree after leftover sparse-checkout
        run: |
          # Shared ECS work dir keeps a prior job's sparse-checkout.
          git sparse-checkout disable || true
          test -f requirements.txt || {
            echo "ERROR: requirements.txt missing. A prior job left git sparse-checkout enabled on this self-hosted runner."
            exit 1
          }
      - name: Enable chatCompletions, start gateway if dead, ping Grok
        env:
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_FORCE_RESTART: ${{ github.event.inputs.force_restart || 'true' }}
        run: bash scripts/enable_openclaw_chat.sh
