name: Jev trainer repo-only draws
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Stop false secret trips and live RSS
        run: |
          set -euo pipefail
          python3 scripts/apply_jev_repo_draw.py
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add src/jev_train.py .github/workflows/jev_train.yml
          git diff --staged --quiet && echo nochange && exit 0
          git commit -m "jev-train: repo news only; stop headline sk- false secrets"
          git pull --rebase origin main
          git push origin HEAD:main
