name: Sector Pipeline (per-sector sequential)

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "predict | outcome | reflect | all"
        required: true
        default: "predict"
      run_date:
        description: "YYYY-MM-DD (default today ET)"
        required: false
        default: ""
      sectors:
        description: "Comma-separated subset, or empty for all 11 (one LLM run each)"
        required: false
        default: ""

permissions:
  actions: write
  contents: write

concurrency:
  group: sector-pipeline
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  sector-loop:
    runs-on: [self-hosted, ecs]
    # 11 sectors × long tool loops; allow hours
    timeout-minutes: 360
    env:
      FULLSCAN_HOME: "/home/gha"
      HOME: "/home/gha"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install yfinance pandas requests ddgs openai || true

      - name: Predict (one sector at a time)
        # Same runner as sector_daily / sector_predict: mid-commit lives in
        # src.run_sector_predict (land_file.land_one_sector), not a 2nd loop.
        if: ${{ github.event.inputs.stage == 'predict' || github.event.inputs.stage == 'all' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -e
          DATE="${{ github.event.inputs.run_date }}"
          SECTORS="${{ github.event.inputs.sectors }}"
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ -n "$SECTORS" ] && ARGS+=(--sectors "$SECTORS")
          echo "=== sector PREDICT sequential ==="
          python -m src.run_sector_predict "${ARGS[@]}"

      - name: Outcome (one sector at a time)
        if: ${{ github.event.inputs.stage == 'outcome' || github.event.inputs.stage == 'all' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
        run: |
          set -e
          DATE="${{ github.event.inputs.run_date }}"
          SECTORS="${{ github.event.inputs.sectors }}"
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ -n "$SECTORS" ] && ARGS+=(--sectors "$SECTORS")
          # Stage outcome writes per-sector markdown and leaves the
          # scoreboard to Post-Close ALL. Stage all keeps the full path.
          if [ "${{ github.event.inputs.stage }}" = "outcome" ]; then
            ARGS+=(--skip-scoreboard)
          fi
          echo "=== sector OUTCOME sequential ==="
          python -m src.run_sector_outcome "${ARGS[@]}"

      - name: Reflect (one sector at a time)
        if: ${{ github.event.inputs.stage == 'reflect' || github.event.inputs.stage == 'all' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
        run: |
          set -e
          DATE="${{ github.event.inputs.run_date }}"
          SECTORS="${{ github.event.inputs.sectors }}"
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ -n "$SECTORS" ] && ARGS+=(--sectors "$SECTORS")
          echo "=== sector REFLECT sequential ==="
          python -m src.run_sector_reflect "${ARGS[@]}"

      - name: Commit
        # Stage outcome may add only per-sector outcome markdown.
        # Predict, reflect, and all keep the broad pack.
        run: |
          if [ "${{ github.event.inputs.stage }}" = "outcome" ]; then
            bash scripts/safe_git_push.sh \
              "auto: sector pipeline outcome" \
              "01_daily/sectors/*/*_outcome.md"
          else
            bash scripts/safe_git_push.sh \
              "auto: sector pipeline ${{ github.event.inputs.stage }}" \
              01_daily/sectors/ 01_daily/_transcripts/ 02_lessons/ 03_scoreboard/ \
              01_daily/*_preopen_qc.json
          fi
