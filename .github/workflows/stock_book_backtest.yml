name: Stock Book Backtest

# Grades every saved stock_book JSON for 1d/3d/1w/2w/1m using yfinance forwards.

on:
  workflow_dispatch:
    inputs:
      top:
        description: "Top N per side to grade"
        required: false
        default: "25"
      max_books:
        description: "Max historical books to grade"
        required: false
        default: "30"
  # schedule disabled 2026-08-29 — not in live pipeline
  # schedule:
  #   # After stock book
  #   - cron: "20 17 * * 1-5"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Backtest suggestions
        run: |
          set -e
          TOP="${{ github.event.inputs.top }}"
          MAX="${{ github.event.inputs.max_books }}"
          TOP="${TOP:-25}"
          MAX="${MAX:-30}"
          python -m src.stock_book_backtest --top "$TOP" --max-books "$MAX"
          echo "======== backtest ========"
          head -100 03_scoreboard/STOCK_BOOK_BACKTEST.md || true
      - name: Commit
        run: |
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add 03_scoreboard/STOCK_BOOK_BACKTEST.md \
                  03_scoreboard/stock_book_backtest.json \
                  01_daily/*_stock_book_backtest.md || true
          git commit -m "auto: stock book backtest" || echo "No changes"
          git pull --rebase origin main || true
          git push origin main
