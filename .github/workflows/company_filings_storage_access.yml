name: Filing archive storage access check
on:
  push:
    branches: [cursor/company-filing-parser-9b60]
    paths: ['.github/workflows/company_filings_storage_access.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check existing documented Cloudflare deployment credential without revealing it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json,os,pathlib,urllib.request,urllib.error
          token=os.environ.get('CLOUDFLARE_API_TOKEN','').strip()
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID','').strip()
          result={'documented_cloudflare_token_present':bool(token),'account_id_present':bool(account),'objects_written':0,'resources_created':0}
          if token:
              request=urllib.request.Request('https://api.cloudflare.com/client/v4/user/tokens/verify',headers={'Authorization':'Bearer '+token})
              try:
                  with urllib.request.urlopen(request,timeout=30) as response:data=json.load(response)
                  result['token_active']=bool(data.get('success') and data.get('result',{}).get('status')=='active')
              except urllib.error.HTTPError as exc:result['verification_http_status']=exc.code
              if account:
                  request=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/'+account+'/r2/buckets',headers={'Authorization':'Bearer '+token})
                  try:
                      with urllib.request.urlopen(request,timeout=30) as response:data=json.load(response)
                      result['r2_buckets_readable']=bool(data.get('success'))
                      result['r2_bucket_count']=len(data.get('result',{}).get('buckets',[]))
                  except urllib.error.HTTPError as exc:result['r2_http_status']=exc.code
          pathlib.Path('storage_access.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-filings-storage-access
          path: storage_access.json
          retention-days: 14
