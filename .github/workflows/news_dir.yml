name: News directory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "01_daily/news/*_parsed.json"
      - "01_daily/news/*_actions.json"
      - "01_daily/events/*_events.json"
      - "src/news_dir.py"
      - "dashboard/news-dir/index.html"
      - ".github/workflows/news_dir.yml"

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build article index
        run: PYTHONPATH=. python3 -m src.news_dir
      - name: Commit index
        run: |
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add dashboard/news-dir/index.json dashboard/news-dir/days.json
          git diff --staged --quiet && exit 0
          git commit -m "news dir: refresh index [skip ci]"
          git push origin HEAD:main
      - name: Overlay news-dir onto gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$TMP" || {
              echo "WARN: gh-pages clone failed"
              exit 0
            }
          mkdir -p "$TMP/dashboard/news-dir" "$TMP/news-dir"
          cp -a dashboard/news-dir/. "$TMP/dashboard/news-dir/"
          cp -a dashboard/news-dir/. "$TMP/news-dir/"
          touch "$TMP/.nojekyll"
          git -C "$TMP" config user.name "Market-Bot-Automaton"
          git -C "$TMP" config user.email "bot@users.noreply.github.com"
          git -C "$TMP" add dashboard/news-dir news-dir .nojekyll
          if git -C "$TMP" diff --cached --quiet; then
            echo "gh-pages already has current news-dir"
            exit 0
          fi
          git -C "$TMP" commit -m "deploy news-dir ${GITHUB_SHA}"
          git -C "$TMP" push origin gh-pages
          echo "Published https://sroyaltyy.github.io/fullscan/dashboard/news-dir/"
