name: Recover scanner page publication
on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_scanner_snapshot.py'
      - '.github/workflows/scanner-publication-recover.yml'
  workflow_run:
    workflows: [Refresh scanner test page]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: scanner-publication-recovery
  cancel-in-progress: false
jobs:
  retain:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    outputs:
      commit: ${{ steps.retain.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src
            scripts
            eval/scanner-failures
            dashboard/scanner-backtest/index.html
            requirements-filing-parser.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require cumulative and fresh-issuer methodology validation
        run: python -m scripts.check_scanner_methodology --out cumulative-validation.json --require-pass
      - name: Resolve a complete page artifact from a trusted main workflow
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=scanner-test-page&per_page=50" > artifacts.json
          python - <<'PY'
          import json,os,subprocess
          candidates=[a for a in json.load(open('artifacts.json'))['artifacts'] if not a['expired'] and a.get('workflow_run',{}).get('head_branch')=='main']
          allowed={'Refresh scanner test page','Recover scanner page publication'}
          selected=None
          for a in sorted(candidates,key=lambda a:a['created_at'],reverse=True):
              run=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{a['workflow_run']['id']}"],text=True))
              if run['event']!='pull_request' and run['head_branch']=='main' and run['head_repository']['full_name']==os.environ['GITHUB_REPOSITORY'] and run['name'] in allowed:
                  selected=a;break
          assert selected,'No trusted completed page artifact is available'
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:stream.write('run='+str(selected['workflow_run']['id'])+'\n')
          print('Reuse completed page artifact from run',selected['workflow_run']['id'])
          PY
      - uses: actions/download-artifact@v4
        with:
          name: scanner-test-page
          path: generated-scanner
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
      - name: Identify the original scoring source
        run: |
          python - <<'PY'
          import json,os
          meta=json.load(open('generated-scanner/meta.json'))
          with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('SCORING_SOURCE_SHA='+meta['snapshot']['source_revision']+'\n')
          PY
      - name: Retain the already-scored snapshot with current publication code
        id: retain
        run: |
          git fetch --depth=1 origin "$SCORING_SOURCE_SHA"
          python -u scripts/publish_scanner_snapshot.py --directory generated-scanner --source-sha "$SCORING_SOURCE_SHA" > publication-result.json
          cp scripts/publish_scanner_snapshot.py generated-scanner/publication-helper.py
          python - <<'PY'
          import json,os
          result=json.load(open('publication-result.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:stream.write('commit='+result['published_commit']+'\n')
          print('Retained verified snapshot',result['published_commit'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-test-page
          path: generated-scanner/
          retention-days: 30
  publish:
    needs: retain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      pages: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: scanner-test-page
          path: ${{ runner.temp }}/scanner-test-page
      - name: Publish only the parser page through the normal Pages process
        env:
          SNAPSHOT_DIRECTORY: ${{ runner.temp }}/scanner-test-page
          SNAPSHOT_COMMIT: ${{ needs.retain.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch dashboard/scanner-backtest/scoring-profiles dashboard/scanner-backtest/filing-profiles dashboard/scanner-backtest/keyword-index
          python - <<'PY'
          import os,runpy
          from pathlib import Path
          source=Path(os.environ['SNAPSHOT_DIRECTORY'])
          outside=sum(p.stat().st_size for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and not p.is_relative_to(Path('dashboard/scanner-backtest')) and not p.is_relative_to(Path('scanner-backtest')))
          stage=runpy.run_path(str(source/'publication-helper.py'))['stage_page']
          print(stage(source,Path('dashboard/scanner-backtest'),snapshot_commit=os.environ['SNAPSHOT_COMMIT'],outside_bytes=outside))
          PY
          mkdir -p scanner-backtest
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=../dashboard/scanner-backtest/"><a href="../dashboard/scanner-backtest/">Open the SEC parser test page</a>' > scanner-backtest/index.html
          git config user.name 'Scanner page publisher'
          git config user.email 'bot@users.noreply.github.com'
          git add dashboard/scanner-backtest scanner-backtest
          if ! git diff --cached --quiet; then
            git commit -m "Recover scanner test page publication for $GITHUB_SHA"
            git push origin HEAD:gh-pages
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
      - name: Verify the deployed snapshot
        env:
          SNAPSHOT_DIRECTORY: ${{ runner.temp }}/scanner-test-page
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          from pathlib import Path
          expected=json.loads((Path(os.environ['SNAPSHOT_DIRECTORY'])/'meta.json').read_text())['snapshot']['snapshot_id']
          for attempt in range(36):
              try:
                  with urllib.request.urlopen('https://sroyaltyy.github.io/fullscan/dashboard/scanner-backtest/meta.json?snapshot='+expected,timeout=20) as response:actual=json.load(response)
                  if actual.get('snapshot',{}).get('snapshot_id')==expected:print('Verified deployed snapshot',expected);break
              except (OSError,ValueError):pass
              time.sleep(10)
          else:raise SystemExit('The public page has not served the expected snapshot')
          PY
