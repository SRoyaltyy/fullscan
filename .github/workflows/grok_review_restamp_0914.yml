name: Grok review restamp 2026-09-14

# One-shot only. Does NOT run preopen_all or Stock Book.
# Force-restamp grok_review now that map_heat.md is same-day.

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/grok-review-restamp-fc66
    paths:
      - ".github/workflows/grok_review_restamp_0914.yml"

permissions:
  contents: write

concurrency:
  group: grok-review-restamp-0914
  cancel-in-progress: true

jobs:
  restamp:
    name: python -m src.grok_review --restamp
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATE: "2026-09-14"
      FULLSCAN_HOME: "/home/runner"
      HOME: "/home/runner"
      FINVIZ_SKIP_LIVE: "1"
      FULLSCAN_DB_OPTIONAL: "1"
      LLM_BACKEND: deepseek
      GROK_ONLY: "0"
      OPENCLAW_TIMEOUT: "10800"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: cursor/grok-review-restamp-fc66

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary openai requests || true

      - name: grok_review --date 2026-09-14 --restamp
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENCLAW_TIMEOUT: "10800"
          LLM_BACKEND: deepseek
          GROK_ONLY: "0"
        run: |
          set +e
          echo "CMD: python -m src.grok_review --date ${DATE} --restamp"
          python -m src.grok_review --date "${DATE}" --restamp
          echo "RESTAMP_RC=$?"
          echo "===== 01_daily/${DATE}_grok_review.json ====="
          cat "01_daily/${DATE}_grok_review.json" || true
          python3 - <<'PY'
          import json
          g = json.load(open("01_daily/2026-09-14_grok_review.json"))
          print("ok", g.get("ok"), "fails", g.get("fails"))
          print("notes", (g.get("notes") or "")[:400])
          p = json.load(open("01_daily/2026-09-14_preopen_status.json"))
          print("status all_ok", p.get("all_ok"), "grok_ok", p.get("grok_ok"),
                "qc_all_ok", p.get("qc_all_ok"))
          PY
          exit 0

      - name: Commit restamped stamps
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export HOME="${HOME:-${FULLSCAN_HOME:-/home/runner}}"
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add \
            "01_daily/${DATE}_grok_review.json" \
            "01_daily/${DATE}_grok_review.md" \
            "01_daily/${DATE}_preopen_status.json" \
            "01_daily/${DATE}_preopen_status.md" \
            "01_daily/${DATE}_preopen_qc.json"
          git status
          if git diff --cached --quiet; then
            echo "no restamp changes"
            exit 0
          fi
          git commit -m "chore: restamp 2026-09-14 grok_review after same-day map_heat.md"
          git push origin HEAD:cursor/grok-review-restamp-fc66
