name: Grok auth canary (pre-05:00 ET)

# Read-only: one small real Grok completion (or, with long=true, one
# long completion >75s, still writing nothing) through the ECS OpenClaw gateway.
# Red with "DEVICE LOGIN NEEDED" when xAI wants an interactive device login,
# so it is seen before the 05:49 ET Pre-Open. No renew, no restart, no
# XAI_API_KEY, no paid inference.
on:
  schedule:
    # 08:30 UTC = 04:30 EDT / 03:30 EST, Mon-Fri.
    - cron: "30 8 * * 1-5"
  workflow_dispatch:
    inputs:
      long:
        description: "true = one long real Grok call (>75s). Still no-write."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: grok-auth-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: [self-hosted, ecs]
    timeout-minutes: 30
    steps:
      # Self-hosted ECS: keep the full tree (the next step disables sparse
      # for later jobs), but shallow fetch and its own timeout so a stalled
      # fetch fails fast and visibly instead of eating the job budget.
      - name: Clear stale git index.lock (shared ECS workspace)
        shell: bash
        run: |
          # A job killed mid-checkout leaves .git/index.lock; the next checkout then hangs.
          # One ECS runner, so a lock older than 1 minute before checkout is stale.
          W="${GITHUB_WORKSPACE:-.}"
          for L in "$W/.git/index.lock" "$W/.git/shallow.lock" "$W/.git/HEAD.lock"; do
            if [ -n "$(find "$L" -mmin +1 2>/dev/null)" ]; then echo "removing stale $L"; rm -f "$L" || sudo -n rm -f "$L" || true; fi
          done
          if [ "$(git -C "$W" config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::shared ECS workspace is sparse; this checkout re-materializes the full tree"
          fi
          # 2026-10-18: keep the warm workspace warm. safe_git_push.sh pins origin
          # to a token URL; checkout then sees a "different" repo, deletes the
          # 6.9 GB workspace and re-clones (10-16 22:40, 10-17 04:28/05:24: 8-13
          # min). A bare-SHA checkout also leaves no origin/main, so the next
          # depth-1 fetch has no common commit and re-downloads the whole tree
          # (10-18 canary 8m53s). Plain URL + an origin/main hint keep it a delta.
          if [ -d "$W/.git" ]; then
            GH_TMP_HOME="$(mktemp -d)"
            printf '[safe]\n\tdirectory = %s\n' "$(cd "$W" && pwd)" > "$GH_TMP_HOME/.gitconfig"
            g() { HOME="$GH_TMP_HOME" git -C "$W" "$@"; }
            U="$(g config --get remote.origin.url 2>/dev/null || true)"
            if [ -n "$U" ] && [ "$U" != "https://github.com/${GITHUB_REPOSITORY}" ]; then
              echo "origin URL was not the plain checkout URL; resetting so checkout keeps the warm tree"
              g remote set-url origin "https://github.com/${GITHUB_REPOSITORY}" || echo "::warning::could not reset origin URL"
            fi
            if ! g rev-parse -q --verify refs/remotes/origin/main >/dev/null 2>&1; then
              echo "no origin/main ref; pointing it at HEAD so the shallow fetch negotiates a delta"
              g update-ref refs/remotes/origin/main HEAD 2>/dev/null || echo "::warning::could not seed origin/main"
            fi
            rm -rf "$GH_TMP_HOME"
          fi
      - uses: actions/checkout@v4
        timeout-minutes: 20
        with:
          clean: false
          fetch-depth: 1
      - name: Full tree after leftover sparse-checkout
        run: |
          git sparse-checkout disable || true
          test -f requirements.txt || {
            echo "ERROR: requirements.txt missing. A prior job left git sparse-checkout enabled on this self-hosted runner."
            exit 1
          }
      - name: Real Grok completion through the gateway
        env:
          CANARY_LONG: ${{ github.event.inputs.long || 'false' }}
        run: |
          DATE=$(TZ=America/New_York date +%F)
          python3 -m src.workflow_progress beat --workflow supergrok_canary --date "$DATE" --stages ping --stage ping >> /tmp/progress_beat.log 2>&1 &
          echo $! > /tmp/progress_beat.pid
          trap 'kill "$(cat /tmp/progress_beat.pid)" 2>/dev/null || true' EXIT
          sudo -n env -u XAI_API_KEY -u OPENCLAW_XAI_API_KEY -u GROK_API_KEY \
            FULLSCAN_HOME=/home/gha GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" CANARY_LONG="$CANARY_LONG" \
            python3 scripts/grok_auth_canary.py
          python3 -m src.workflow_progress touch --workflow supergrok_canary --date "$DATE" --stage ping --state ok || true
