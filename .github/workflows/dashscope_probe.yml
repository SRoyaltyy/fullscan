name: DashScope probe

# Manual one-shot check of the DashScope compatible-mode key.
# workflow_dispatch only. Reads three secrets, sends one qwen-flash
# chat/completions POST, prints lengths and status, then exits 0.
# No checkout, no commit, no push. Never prints secret values.
# Model is qwen-flash, the first ID in QWEN_MODELS (src/lane_route.py).
# Default base is the public intl compatible-mode/v1 host. A set
# DASHSCOPE_BASE_URL is used instead and labeled "secret", never printed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe qwen-flash once
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
        run: |
          set +x
          set +e
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          from urllib.parse import quote, urlsplit

          sys.tracebacklimit = 0

          PUBLIC_BASE = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
          MODEL = "qwen-flash"
          LINES = []

          def emit(line):
              LINES.append(line)
              print(line, flush=True)

          def variants(value):
              raw = value or ""
              found = []
              for item in (raw, raw.strip()):
                  if len(item) >= 6 and item not in found:
                      found.append(item)
              if len(raw.strip()) >= 6:
                  encoded = quote(raw.strip(), safe="")
                  if len(encoded) >= 6 and encoded not in found:
                      found.append(encoded)
                  try:
                      parts = urlsplit(raw.strip())
                  except ValueError:
                      parts = None
                  if parts is not None and parts.netloc and len(parts.netloc) >= 6:
                      host = parts.netloc
                      if host not in found:
                          found.append(host)
                      if "@" in host:
                          userinfo, hostname = host.rsplit("@", 1)
                          for piece in (userinfo, hostname):
                              if len(piece) >= 6 and piece not in found:
                                  found.append(piece)
              return found

          def redact(text, secrets):
              out = "" if text is None else str(text)
              for secret in secrets:
                  for piece in variants(secret):
                      out = out.replace(piece, "[redacted]")
              out = re.sub(
                  r"(?i)bearer\s+[A-Za-z0-9._\-+/=]{6,}",
                  "Bearer [redacted]",
                  out,
              )
              out = re.sub(r"sk-[A-Za-z0-9_\-]{6,}", "[redacted]", out)
              # Only a token that contains a digit. Leaves "API-key provided." intact.
              out = re.sub(
                  r"(?i)(api[_-]?key[\"'\s:=]+)(?=[A-Za-z0-9._\-]*\d)[A-Za-z0-9._\-]{8,}",
                  r"\1[redacted]",
                  out,
              )
              out = re.sub(r"\b[A-Za-z0-9_\-]{32,}\b", "[redacted]", out)
              return out

          def one_line(text, limit, secrets):
              cleaned = redact(text, secrets)
              cleaned = re.sub(r"\s+", " ", cleaned).strip()
              return cleaned[:limit]

          def as_text(value):
              if isinstance(value, bool) or value is None:
                  return ""
              if isinstance(value, (str, int, float)):
                  return str(value).strip()
              return ""

          def first_text(obj, keys):
              if not isinstance(obj, dict):
                  return ""
              for key in keys:
                  text = as_text(obj.get(key))
                  if text:
                      return text
              return ""

          def content_text(body):
              choices = body.get("choices") if isinstance(body, dict) else None
              if not isinstance(choices, list) or not choices:
                  return ""
              message = choices[0].get("message") if isinstance(choices[0], dict) else None
              if not isinstance(message, dict):
                  return ""
              content = message.get("content")
              if isinstance(content, list):
                  bits = []
                  for part in content:
                      if isinstance(part, str):
                          bits.append(part)
                      elif isinstance(part, dict):
                          bits.append(str(part.get("text") or part.get("content") or ""))
                  return "".join(bits)
              if content is None:
                  return ""
              return str(content)

          def chat_url(base):
              root = (base or "").strip().rstrip("/")
              if root.endswith("/chat/completions"):
                  return root
              return root + "/chat/completions"

          class _NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def write_summary():
              path = os.environ.get("GITHUB_STEP_SUMMARY") or ""
              if not path:
                  return
              try:
                  with open(path, "a", encoding="utf-8") as handle:
                      handle.write("\n".join(LINES) + "\n")
              except OSError:
                  print("summary_write=failed", flush=True)

          def main():
              ds_key = os.environ.get("DASHSCOPE_API_KEY") or ""
              qw_key = os.environ.get("QWEN_API_KEY") or ""
              base_raw = os.environ.get("DASHSCOPE_BASE_URL") or ""
              secrets = [ds_key, qw_key, base_raw]
              emit("DASHSCOPE_API_KEY length=%s" % len(ds_key))
              emit("QWEN_API_KEY length=%s" % len(qw_key))
              emit("DASHSCOPE_BASE_URL length=%s" % len(base_raw))

              key = ds_key.strip()
              key_source = "DASHSCOPE_API_KEY"
              if not key:
                  key = qw_key.strip()
                  key_source = "QWEN_API_KEY" if key else "none"
              base = base_raw.strip()
              if base:
                  base_label = "secret"
              else:
                  base = PUBLIC_BASE
                  base_label = "public-intl"
              emit("base_url_source=%s" % base_label)
              emit("key_source=%s" % key_source)

              url = chat_url(base)
              payload = {
                  "model": MODEL,
                  "messages": [
                      {"role": "user", "content": "Reply with exactly OK."},
                  ],
                  "max_tokens": 8,
                  "temperature": 0,
              }
              data = json.dumps(payload).encode("utf-8")
              headers = {"Content-Type": "application/json"}
              if key:
                  headers["Authorization"] = "Bearer " + key
              request = urllib.request.Request(
                  url, data=data, headers=headers, method="POST"
              )
              opener = urllib.request.build_opener(_NoRedirect)
              status = 0
              raw = ""
              try:
                  with opener.open(request, timeout=60) as response:
                      status = int(response.status)
                      raw = response.read(65536).decode("utf-8", "replace")
              except urllib.error.HTTPError as exc:
                  status = int(exc.code)
                  try:
                      raw = exc.read(65536).decode("utf-8", "replace")
                  except Exception:
                      raw = ""
              except Exception:
                  status = 0
                  raw = ""

              body = {}
              parse_note = ""
              if raw:
                  try:
                      parsed = json.loads(raw)
                  except Exception:
                      parsed = None
                      parse_note = "invalid json"
                  if isinstance(parsed, dict):
                      body = parsed
                  elif parsed is not None:
                      parse_note = "non-object json"
              elif status == 0:
                  parse_note = "request failed"

              model_field = ""
              if isinstance(body, dict):
                  model_field = as_text(body.get("model"))
              err_obj = body.get("error") if isinstance(body, dict) else None
              err_code = ""
              err_type = ""
              err_message = ""
              if isinstance(err_obj, dict):
                  err_code = first_text(err_obj, ("code",))
                  err_type = first_text(err_obj, ("type",))
                  err_message = first_text(err_obj, ("message", "msg"))
              elif isinstance(err_obj, str):
                  err_message = err_obj.strip()
              if isinstance(body, dict):
                  if not err_code:
                      err_code = first_text(body, ("code",))
                  if not err_type:
                      err_type = first_text(body, ("type",))
                  if not err_message:
                      err_message = first_text(body, ("message", "msg"))
              if parse_note and not err_message:
                  snippet = one_line(raw, 120, secrets) if raw else ""
                  err_message = parse_note if not snippet else "%s: %s" % (parse_note, snippet)
                  if not err_code:
                      err_code = parse_note

              emit("http_status=%s" % status)
              emit("model=%s" % one_line(model_field, 80, secrets))
              emit("content=%s" % one_line(content_text(body), 40, secrets))
              failed = status != 200 or bool(err_code or err_type or err_message)
              if failed:
                  emit("error_code=%s" % one_line(err_code, 80, secrets))
                  emit("error_type=%s" % one_line(err_type, 80, secrets))
                  emit("error_message=%s" % one_line(err_message, 240, secrets))

          try:
              main()
          except Exception:
              emit("http_status=0")
              emit("model=")
              emit("content=")
              emit("error_code=probe_failed")
              emit("error_type=")
              emit("error_message=probe failed before a readable response")
          finally:
              write_summary()
          PY
          exit 0
