name: Learn Cycle

# After outcomes exist: mine wins+losses → hypotheses → promote lessons →
# rewrite mutable_policy.md (injected into every PREDICT).

on:
  workflow_dispatch:
    inputs:
      lookback:
        description: "How many graded general runs to mine"
        required: false
        default: "15"
  schedule:
    # After typical outcome/reflect window (UTC)
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run learn_cycle
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -e
          LB="${{ github.event.inputs.lookback }}"
          LB="${LB:-15}"
          python -m src.learn_cycle --lookback "$LB"
          echo "======== mutable_policy ========"
          head -120 00_grounding/mutable_policy.md || true
          echo "======== hypotheses (latest) ========"
          ls -lt 02_lessons/hypotheses 2>/dev/null | head -15 || true

      - name: Commit policy + hypotheses
        run: |
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add 00_grounding/mutable_policy.md \
                  00_grounding/weather_rules_proposals.json \
                  02_lessons/hypotheses/ \
                  02_lessons/active/ \
                  02_lessons/candidate/ || true
          git commit -m "auto: learn_cycle (hypotheses + mutable policy)" || echo "No changes"
          git pull --rebase origin main || true
          git push origin main
