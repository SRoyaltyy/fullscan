name: Learn Cycle

# After outcomes exist: mine wins+losses → hypotheses → promote lessons →
# rewrite mutable_policy.md + LEARNINGS.md.

on:
  workflow_dispatch:
    inputs:
      lookback:
        description: "Graded runs per topic to mine"
        required: false
        default: "15"
  # Clock retired 2026-09-04 — Post-Close ALL owns learn.
  # schedule:
  #   - cron: "30 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: learn-cycle
  cancel-in-progress: false

jobs:
  learn:
    runs-on: [self-hosted, ecs]
    timeout-minutes: 180
    env:
      FULLSCAN_HOME: "/home/gha"
      HOME: "/home/gha"
    steps:
      - name: Clear stale git index.lock (shared ECS workspace)
        shell: bash
        run: |
          # A job killed mid-checkout leaves .git/index.lock; the next checkout then hangs.
          # One ECS runner, so a lock older than 1 minute before checkout is stale.
          W="${GITHUB_WORKSPACE:-.}"
          for L in "$W/.git/index.lock" "$W/.git/shallow.lock" "$W/.git/HEAD.lock"; do
            if [ -n "$(find "$L" -mmin +1 2>/dev/null)" ]; then echo "removing stale $L"; rm -f "$L" || sudo -n rm -f "$L" || true; fi
          done
          if [ "$(git -C "$W" config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::shared ECS workspace is sparse; this checkout re-materializes the full tree"
          fi
      - uses: actions/checkout@v4

      - name: Skip if closed-session learnings already on disk (no LLM)
        run: |
          DATE="$(python3 -c 'from src.skip_if_good import last_closed_session; print(last_closed_session())')"
          echo "closed_session=$DATE" >> "$GITHUB_ENV"
          if python3 -m src.skip_if_good --job learn_cycle --date "$DATE"; then
            echo "Learnings already on disk — skip LLM"
            echo "skip=yes" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        if: env.skip != 'yes'
        run: pip install -r requirements.txt

      - name: Run learn_cycle
        if: env.skip != 'yes'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_TIMEOUT: "900"
        run: |
          set -e
          LB="${{ github.event.inputs.lookback }}"
          LB="${LB:-15}"
          python -m src.learn_cycle --lookback "$LB" --date "${closed_session}"
          echo "======== LEARNINGS.md (digest) ========"
          head -160 03_scoreboard/LEARNINGS.md || true

      - name: Lesson efficacy (did promoted lessons change outcomes?)
        if: env.skip != 'yes'
        continue-on-error: true
        run: |
          python -m src.lesson_efficacy
          head -40 03_scoreboard/LESSON_EFFICACY.md || true

      - name: Commit policy + learnings + hypotheses
        if: env.skip != 'yes'
        run: |
          export HOME="${HOME:-/home/gha}"
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          cd "${GITHUB_WORKSPACE:-.}"
          bash scripts/safe_git_push.sh \
            "auto: learn_cycle (LEARNINGS + policy + hypotheses)" \
            00_grounding/mutable_policy.md \
            00_grounding/weather_rules_proposals.json \
            03_scoreboard/LEARNINGS.md \
            03_scoreboard/LESSON_EFFICACY.md \
            03_scoreboard/lesson_efficacy.json \
            01_daily/ \
            02_lessons/
