name: Learn Cycle

# After outcomes exist: mine wins+losses → hypotheses → promote lessons →
# rewrite mutable_policy.md + LEARNINGS.md.

on:
  workflow_dispatch:
    inputs:
      lookback:
        description: "Graded runs per topic to mine"
        required: false
        default: "15"
  schedule:
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: learn-cycle
  cancel-in-progress: true

jobs:
  learn:
    runs-on: [self-hosted, ecs]
    timeout-minutes: 180
    env:
      FULLSCAN_HOME: "/home/gha"
      HOME: "/home/gha"
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today's learnings already on disk (no LLM)
        run: |
          DATE="$(TZ=America/New_York date +%F)"
          if python3 -m src.skip_if_good --job learn_cycle --date "$DATE"; then
            echo "Learnings already on disk — skip LLM"
            echo "skip=yes" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        if: env.skip != 'yes'
        run: pip install -r requirements.txt

      - name: Run learn_cycle
        if: env.skip != 'yes'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_TIMEOUT: "10800"
        run: |
          set -e
          LB="${{ github.event.inputs.lookback }}"
          LB="${LB:-15}"
          python -m src.learn_cycle --lookback "$LB"
          echo "======== LEARNINGS.md (digest) ========"
          head -160 03_scoreboard/LEARNINGS.md || true

      - name: Lesson efficacy (did promoted lessons change outcomes?)
        if: env.skip != 'yes'
        continue-on-error: true
        run: |
          python -m src.lesson_efficacy
          head -40 03_scoreboard/LESSON_EFFICACY.md || true

      - name: Commit policy + learnings + hypotheses
        if: env.skip != 'yes'
        run: |
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add 00_grounding/mutable_policy.md \
                  00_grounding/weather_rules_proposals.json \
                  03_scoreboard/LEARNINGS.md \
                  03_scoreboard/LESSON_EFFICACY.md \
                  03_scoreboard/lesson_efficacy.json \
                  01_daily/*_learnings.md \
                  02_lessons/hypotheses/ \
                  02_lessons/active/ \
                  02_lessons/candidate/ || true
          git commit -m "auto: learn_cycle (LEARNINGS + policy + hypotheses)" || echo "No changes"
          git pull --rebase origin main || true
          git push origin main
