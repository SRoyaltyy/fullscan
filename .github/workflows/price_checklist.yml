name: Price store + checklist (1/3/4/5)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "bootstrap | update | checklist | update_and_checklist | backfill"
        required: true
        default: update_and_checklist
        type: choice
        options:
          - bootstrap
          - update
          - checklist
          - update_and_checklist
          - backfill
      date:
        description: "as-of date for single-day checklist (blank = latest)"
        required: false
        default: ""
      backfill_from:
        description: "backfill start YYYY-MM-DD (mode=backfill)"
        required: false
        default: "2026-03-01"
      backfill_to:
        description: "backfill end YYYY-MM-DD (blank = last bar in price store)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pyarrow yfinance openpyxl

      - name: Show whether price store exists
        run: |
          if [ -f data/prices/ohlc.parquet ]; then
            ls -lh data/prices/
            python -m src.price_store status || true
          else
            echo "NO local data/prices/ohlc.parquet yet"
          fi

      - name: Bootstrap OHLC (long history, resume-safe)
        if: ${{ inputs.mode == 'bootstrap' }}
        run: python -m src.price_store bootstrap --days 400

      - name: Daily price update (append recent bars)
        if: ${{ inputs.mode == 'update' || inputs.mode == 'update_and_checklist' }}
        run: |
          if [ ! -f data/prices/ohlc.parquet ]; then
            echo "::error::No price store. Run bootstrap first."
            exit 1
          fi
          python -m src.price_store update

      - name: Status
        if: ${{ inputs.mode != 'checklist' && inputs.mode != 'backfill' }}
        run: python -m src.price_store status
        continue-on-error: true

      - name: Checklist single day
        if: ${{ inputs.mode == 'checklist' || inputs.mode == 'update_and_checklist' }}
        run: |
          set -e
          if [ ! -f data/prices/ohlc.parquet ]; then
            echo "::error::Price store empty."
            exit 1
          fi
          ARGS=()
          if [ -n "${{ inputs.date }}" ]; then
            ARGS+=(--date "${{ inputs.date }}")
          fi
          python -m src.ticker_checklist "${ARGS[@]}"

      - name: Checklist BACKFILL (all sessions from backfill_from)
        if: ${{ inputs.mode == 'backfill' }}
        run: |
          set -e
          if [ ! -f data/prices/ohlc.parquet ]; then
            echo "::error::Price store empty. Run bootstrap first."
            exit 1
          fi
          FROM="${{ inputs.backfill_from }}"
          TO="${{ inputs.backfill_to }}"
          ARGS=(--backfill-from "$FROM")
          if [ -n "$TO" ]; then
            ARGS+=(--backfill-to "$TO")
          fi
          echo "Backfill args: ${ARGS[*]}"
          python -m src.ticker_checklist "${ARGS[@]}"

      - name: Upload price-store artifact
        if: ${{ always() && hashFiles('data/prices/ohlc.parquet') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: price-store
          path: data/prices/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload checklist history artifact
        if: ${{ always() && hashFiles('data/checklist/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: checklist-history
          path: data/checklist/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit artifacts to main
        if: ${{ hashFiles('data/prices/ohlc.parquet') != '' || hashFiles('data/checklist/**') != '' }}
        run: |
          set -e
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          # history CSV can be huge — prefer parquet in git if CSV > 90MB
          if [ -f data/checklist/checklist_history.csv ]; then
            CSIZE=$(stat -c%s data/checklist/checklist_history.csv)
            echo "checklist_history.csv size=$CSIZE"
            if [ "$CSIZE" -gt 90000000 ]; then
              echo "::warning::history CSV >90MB — committing parquet only"
              git add -f data/checklist/checklist_history.parquet data/checklist/*_checklist.csv data/checklist/*_checklist.json 2>/dev/null || true
            else
              git add -f data/checklist 2>/dev/null || true
            fi
          else
            git add -f data/checklist 2>/dev/null || true
          fi
          git add -f data/prices 01_daily/*checklist* 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No staged changes"
          else
            git commit -m "chore: price/checklist $(date -u +%F)"
            git push origin HEAD:main
          fi
