name: AB Enrich (peers + industry/sector)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "As-of YYYY-MM-DD (blank = latest checklist)"
        required: false
        default: ""
      ticker:
        description: "Optional single ticker"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install openpyxl pyarrow

      - name: Enrich
        run: |
          set -euo pipefail
          ARGS=()
          [ -n "${{ inputs.date }}" ] && ARGS+=(--date "${{ inputs.date }}")
          T="${{ inputs.ticker }}"
          T=$(echo "$T" | tr '[:lower:]' '[:upper:]' | tr -d ' ')
          [ -n "$T" ] && ARGS+=(--ticker "$T")
          echo "CMD: python -m src.ab_enrich ${ARGS[*]}"
          python -m src.ab_enrich "${ARGS[@]}"
          ls -la data/ab_checklist/*enriched* data/peers/*peer_rs* 2>/dev/null | tail -20
          echo "==== MD ===="
          head -60 data/ab_checklist/*_ab_checklist_enriched.md 2>/dev/null | head -80

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-enriched
          path: |
            data/ab_checklist/*enriched*
            data/peers/*peer_rs*
          if-no-files-found: warn

      - name: Commit
        if: always()
        run: |
          set -euo pipefail
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/ab_checklist/ data/peers/ 01_daily/*peer_rs* || true
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: AB enrich peers+sector $(date -u +%F)"
          git pull --rebase origin main || true
          git push origin HEAD:main
