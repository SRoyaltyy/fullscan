name: Lane news sector scan

# Harvest every unique on-disk article for DATE, then one Lane hop each.
# Watermarks lane + model on every row. $0 hoppers only.
# Does not touch flatten / Webull / factor-mine live.

on:
  workflow_dispatch:
    inputs:
      date:
        description: Session date YYYY-MM-DD (Finviz export + 01_daily/news)
        required: true
        type: string
      limit:
        description: Max articles (0 = all unique headlines that day)
        required: false
        default: "0"
        type: string

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Harvest + Lane sector scan
        env:
          LANE_URL: ${{ vars.LANE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL || vars.OLLAMA_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
          MODELSCOPE_SDK_TOKEN: ${{ secrets.MODELSCOPE_SDK_TOKEN }}
          TOKENHUB_API_KEY: ${{ secrets.TOKENHUB_API_KEY }}
          TENCENT_API_KEY: ${{ secrets.TENCENT_API_KEY }}
          HUNYUAN_API_KEY: ${{ secrets.HUNYUAN_API_KEY }}
          TOKENHUB_BASE_URL: ${{ secrets.TOKENHUB_BASE_URL }}
          TENCENT_BASE_URL: ${{ secrets.TENCENT_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          LIMIT="${{ github.event.inputs.limit }}"
          PYTHONPATH=. python3 -m src.lane_news_scan --date "$DATE" --limit "$LIMIT"
      - name: Commit sector scan
        run: |
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add 01_daily/news/*_lane_sectors*.json 01_daily/news/*_lane_sectors.md 02_lessons/lane/outbox_sectors || true
          if git diff --staged --quiet; then
            echo "No sector scan artifacts"
            exit 0
          fi
          git commit -m "auto: lane sector scan ${{ github.event.inputs.date }}"
          git pull --rebase origin main || true
          git push origin main
