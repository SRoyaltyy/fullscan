name: Ticker Lookback (any stock)

# Phone-friendly manual backtest. Same method as Stock Book readiness:
# 12 cameras + yΔ from the 09:30 ET packet (last completed tape +
# morning pre-open; never same-day book / post-close Finviz), then the
# 6 domain coaches, hall-pass lane, marks, Cond, and BUY PROBABLE /
# HARD_RED copy from that day's book when it exists (else as-of
# coaches). Enter any ticker(s), or check Random for 50 liquid names
# (mcap > $100M, avg volume > 500K, ATR% ≥ 2.5). Featured setups still overlay
# the camera sheet.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Ticker(s), comma-separated (example: AAPL,TEM,BRK-B). Leave blank if using Random."
        required: false
        default: ""
        type: string
      random:
        description: "Pick 50 random stocks (mcap > $100M, avg vol > 500K, ATR% ≥ 2.5)"
        required: false
        default: false
        type: boolean
      from_date:
        description: "Optional first date YYYY-MM-DD"
        required: false
        default: ""
        type: string
      to_date:
        description: "Optional last date YYYY-MM-DD"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: ticker-lookback
  cancel-in-progress: false

jobs:
  lookback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pandas pyarrow openpyxl
      - name: Run ticker-first backtest
        env:
          TICKERS: ${{ inputs.tickers }}
          RANDOM_PICK: ${{ inputs.random }}
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${RANDOM_PICK}" = "true" ] || [ "${TICKERS}" = "random" ]; then
            ARGS+=(--random)
          elif [ -n "${TICKERS}" ]; then
            ARGS+=(--tickers "$TICKERS")
          else
            echo "No tickers entered — defaulting to 50 random liquid names"
            ARGS+=(--random)
          fi
          [ -n "$FROM_DATE" ] && ARGS+=(--from-date "$FROM_DATE")
          [ -n "$TO_DATE" ] && ARGS+=(--to-date "$TO_DATE")
          python -m src.ticker_lookback_run "${ARGS[@]}" | tee /tmp/ticker-lookback.log
          slug=$(awk '/^\[ticker-lookback\] slug /{print $3}' /tmp/ticker-lookback.log | tail -1)
          names=$(awk '/^\[ticker-lookback\] names /{sub(/^\[ticker-lookback\] names /,""); print}' /tmp/ticker-lookback.log | tail -1)
          echo "SLUG=$slug" >> "$GITHUB_ENV"
          echo "LOOKBACK_TICKERS=$names" >> "$GITHUB_ENV"
          test -n "$slug"
          test -s "dashboard/ticker-lookback/${slug}.html"
          test -s "03_scoreboard/ticker_lookback/${slug}.md"
      - name: Publish result to main
        run: |
          bash scripts/safe_git_push.sh \
            "chore: ticker lookback ${LOOKBACK_TICKERS:-${{ inputs.tickers }}}" \
            01_daily/ticker_lookback.md \
            03_scoreboard/TICKER_LOOKBACK.md \
            03_scoreboard/ticker_lookback/ \
            data/stock_book/ticker_lookback.json \
            data/stock_book/ticker_lookback/ \
            dashboard/ticker-lookback/
      - name: Upload phone page + data
        uses: actions/upload-artifact@v4
        with:
          name: ticker-lookback-${{ env.SLUG }}
          path: |
            03_scoreboard/ticker_lookback/${{ env.SLUG }}.xlsx
            dashboard/ticker-lookback/${{ env.SLUG }}.html
            03_scoreboard/ticker_lookback/${{ env.SLUG }}.md
            data/stock_book/ticker_lookback/${{ env.SLUG }}.json
      - name: Add links to run summary
        run: |
          {
            echo "## Ticker lookback: ${LOOKBACK_TICKERS:-${{ inputs.tickers }}}"
            echo
            echo "- [Phone page](https://SRoyaltyy.github.io/fullscan/dashboard/ticker-lookback/${SLUG}.html)"
            echo "- [Markdown on GitHub](https://github.com/${GITHUB_REPOSITORY}/blob/main/03_scoreboard/ticker_lookback/${SLUG}.md)"
            echo "- The artifact above contains the colored XLSX, HTML, Markdown and JSON immediately."
            echo "- Featured setups (dates + market-wide edge) are in the job summary above and at the top of the phone page / XLSX Setups sheet."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-dashboard.yml --ref main
