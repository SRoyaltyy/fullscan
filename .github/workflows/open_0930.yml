name: Open 09:30 pack

# Compatibility entry point for existing callers. Decision publication is
# readiness-driven; paper submission has a single independent clock owner.
on:
  workflow_dispatch:
    inputs:
      run_date:
        description: YYYY-MM-DD (empty means today ET)
        required: false
        default: ''
permissions:
  actions: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Request readiness evaluation and immediate publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_DATE: ${{ inputs.run_date }}
        run: gh workflow run publish_strategy_tickets.yml --ref main -f "run_date=${RUN_DATE}"
