name: ECS warm-up (refresh shared checkout before Pre-Open)

# 2026-10-18: the 10-18 canary checkout took 8m53s on ECS (3s on 10-16).
# Pre-Open's preflight checkout used to give up at 5 min. This job only
# refreshes the runner's persistent workspace (clean: false, depth 1, main)
# at ~02:30 ET so Pre-Open (05:55 ET) fetches a few hours of delta.
# Read-only: no commit, no push, no book/ledger writes, no secrets beyond
# the read-only job token used by actions/checkout.
on:
  schedule:
    # 06:30 UTC = 02:30 EDT / 01:30 EST, Mon-Fri.
    - cron: "30 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecs-warmup
  cancel-in-progress: false

jobs:
  gate:
    # Hosted cron can run hours late. A late warm-up must never hold the
    # single ECS runner when the canary / OAuth guard / Pre-Open need it.
    name: Clock gate (only 00:30-04:00 ET on schedule)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        run: |
          HM=$((10#$(TZ=America/New_York date +%H%M)))
          DOW=$(TZ=America/New_York date +%u)
          EVENT="${{ github.event_name }}"
          GO=no
          if [ "$EVENT" = "schedule" ]; then
            if [ "$HM" -ge 30 ] && [ "$HM" -lt 400 ]; then GO=yes; fi
          else
            # Manual: refused 04:00-10:00 ET on weekdays (canary, guard, Pre-Open).
            if [ "$DOW" -ge 6 ] || [ "$HM" -lt 400 ] || [ "$HM" -ge 1000 ]; then GO=yes; fi
          fi
          echo "event=$EVENT ET_HM=$HM DOW=$DOW go=$GO"
          echo "go=$GO" >> "$GITHUB_OUTPUT"

  warm:
    needs: gate
    if: ${{ needs.gate.outputs.go == 'yes' }}
    runs-on: [self-hosted, ecs]
    timeout-minutes: 25
    steps:
      - name: Clear stale git index.lock (shared ECS workspace)
        shell: bash
        run: |
          # A job killed mid-checkout leaves .git/index.lock; the next checkout then hangs.
          # One ECS runner, so a lock older than 1 minute before checkout is stale.
          W="${GITHUB_WORKSPACE:-.}"
          for L in "$W/.git/index.lock" "$W/.git/shallow.lock" "$W/.git/HEAD.lock"; do
            if [ -n "$(find "$L" -mmin +1 2>/dev/null)" ]; then echo "removing stale $L"; rm -f "$L" || sudo -n rm -f "$L" || true; fi
          done
          if [ "$(git -C "$W" config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::shared ECS workspace is sparse; this checkout re-materializes the full tree"
          fi
          # 2026-10-18: keep the warm workspace warm. safe_git_push.sh pins origin
          # to a token URL; checkout then sees a "different" repo, deletes the
          # 6.9 GB workspace and re-clones (10-16 22:40, 10-17 04:28/05:24: 8-13
          # min). A bare-SHA checkout also leaves no origin/main, so the next
          # depth-1 fetch has no common commit and re-downloads the whole tree
          # (10-18 canary 8m53s). Plain URL + an origin/main hint keep it a delta.
          if [ -d "$W/.git" ]; then
            GH_TMP_HOME="$(mktemp -d)"
            printf '[safe]\n\tdirectory = %s\n' "$(cd "$W" && pwd)" > "$GH_TMP_HOME/.gitconfig"
            g() { HOME="$GH_TMP_HOME" git -C "$W" "$@"; }
            U="$(g config --get remote.origin.url 2>/dev/null || true)"
            if [ -n "$U" ] && [ "$U" != "https://github.com/${GITHUB_REPOSITORY}" ]; then
              echo "origin URL was not the plain checkout URL; resetting so checkout keeps the warm tree"
              g remote set-url origin "https://github.com/${GITHUB_REPOSITORY}" || echo "::warning::could not reset origin URL"
            fi
            if ! g rev-parse -q --verify refs/remotes/origin/main >/dev/null 2>&1; then
              echo "no origin/main ref; pointing it at HEAD so the shallow fetch negotiates a delta"
              g update-ref refs/remotes/origin/main HEAD 2>/dev/null || echo "::warning::could not seed origin/main"
            fi
            rm -rf "$GH_TMP_HOME"
          fi
      - name: Workspace state before fetch
        shell: bash
        run: |
          W="${GITHUB_WORKSPACE:-.}"
          T="$(mktemp -d)"; printf '[safe]\n\tdirectory = %s\n' "$(cd "$W" && pwd)" > "$T/.gitconfig"
          g() { HOME="$T" git -C "$W" "$@"; }
          {
            echo "## ECS warm-up $(TZ=America/New_York date '+%F %T ET')"
            echo "- HEAD: $(g rev-parse --short HEAD 2>/dev/null || echo none)"
            echo "- origin/main: $(g rev-parse --short refs/remotes/origin/main 2>/dev/null || echo missing)"
            echo "- shallow lines: $(wc -l < "$W/.git/shallow" 2>/dev/null || echo 0)"
            echo "- packs: $(ls "$W"/.git/objects/pack/*.pack 2>/dev/null | wc -l)"
            echo '```'; g count-objects -vH 2>/dev/null || true; echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          rm -rf "$T"
          echo "WARM_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        timeout-minutes: 20
        with:
          ref: main
          fetch-depth: 1
          clean: false
          persist-credentials: false
      - name: Full tree after leftover sparse-checkout
        run: |
          echo "checkout took $(( $(date +%s) - WARM_T0 ))s, HEAD $(git log -1 --format=%h 2>/dev/null)" | tee -a "$GITHUB_STEP_SUMMARY"
          git sparse-checkout disable || true
          test -f requirements.txt || {
            echo "ERROR: requirements.txt missing. A prior job left git sparse-checkout enabled on this self-hosted runner."
            exit 1
          }
