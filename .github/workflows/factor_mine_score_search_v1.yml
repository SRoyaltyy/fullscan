name: Factor Mine score search v1
on:
  pull_request:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Fetch the PR base
      run: git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
    - name: Protocol lock
      run: PYTHONHASHSEED=0 python3 research/factor_mine_score_search_v1/test_protocol.py
