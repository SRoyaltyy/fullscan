name: Deploy dashboard to GitHub Pages

# Backup path: when Stock Book ALL finishes, republish the uploaded
# "dashboard" artifact to gh-pages. Primary publish is now inside
# stock_book_all.yml itself; this remains for resilience.

on:
  workflow_run:
    workflows: ["Stock Book ALL (one-shot)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download dashboard artifact (from triggering run or latest on main)
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p pages_out/dashboard
          touch pages_out/.nojekyll

          if [ -n "${RUN_ID:-}" ] && [ "$RUN_ID" != "" ]; then
            echo "Run ID: $RUN_ID"
            artifacts_url="https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/artifacts"
            curl -s -H "Authorization: token ${TOKEN}" "$artifacts_url" > artifacts.json || true
            url=$(jq -r '.artifacts[]? | select(.name=="dashboard" or .name=="stock-book-all") | .archive_download_url' artifacts.json 2>/dev/null | head -1 || true)
            if [ -n "${url:-}" ] && [ "$url" != "null" ]; then
              curl -L -H "Authorization: token ${TOKEN}" -o artifact.zip "$url"
              mkdir -p dashboard_artifact
              unzip -o artifact.zip -d dashboard_artifact
              if [ -f dashboard_artifact/index.html ]; then
                cp -a dashboard_artifact/. pages_out/dashboard/
                cp dashboard_artifact/index.html pages_out/index.html
              elif [ -f dashboard_artifact/dashboard/index.html ]; then
                cp -a dashboard_artifact/dashboard/. pages_out/dashboard/
                cp dashboard_artifact/dashboard/index.html pages_out/index.html
              fi
            fi
          fi

          # Fallback: use dashboard committed on main
          if [ ! -f pages_out/dashboard/index.html ] && [ -f dashboard/index.html ]; then
            cp -a dashboard/. pages_out/dashboard/
            cp dashboard/index.html pages_out/index.html
            echo "Used dashboard/index.html from main"
          fi

          if [ ! -f pages_out/dashboard/index.html ]; then
            echo "ERROR: no dashboard index.html to publish"
            exit 1
          fi
          ls -la pages_out pages_out/dashboard

      - name: Publish to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages_out
          force_orphan: true
          enable_jekyll: false

      - name: Show Pages URL
        run: |
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/"
          echo "https://SRoyaltyy.github.io/fullscan/"
          echo "If 404: Settings → Pages → Deploy from branch → gh-pages / root"
