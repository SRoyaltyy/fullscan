name: Deploy dashboard to GitHub Pages

# Backup path: when Stock Book ALL finishes, republish the uploaded
# "dashboard" artifact to gh-pages. Primary publish is now inside
# stock_book_all.yml itself; this remains for resilience.
# Always overlay dashboard/boring-winners and dashboard/ticker-lookback
# from main so force-orphan deploys cannot 404 those pages.

on:
  workflow_run:
    workflows:
      - "Stock Book ALL (one-shot)"
      - "Pre-Open ALL (predictive one-shot)"
    types: [completed]
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "data/stock_book/**"
      - "01_daily/*_stock_book.md"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download dashboard artifact (from triggering run or latest on main)
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p pages_out/dashboard
          touch pages_out/.nojekyll

          if [ -n "${RUN_ID:-}" ] && [ "$RUN_ID" != "" ]; then
            echo "Run ID: $RUN_ID"
            artifacts_url="https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/artifacts"
            curl -s -H "Authorization: token ${TOKEN}" "$artifacts_url" > artifacts.json || true
            url=$(jq -r '.artifacts[]? | select(.name=="dashboard" or .name=="stock-book-all") | .archive_download_url' artifacts.json 2>/dev/null | head -1 || true)
            if [ -n "${url:-}" ] && [ "$url" != "null" ]; then
              curl -L -H "Authorization: token ${TOKEN}" -o artifact.zip "$url"
              mkdir -p dashboard_artifact
              unzip -o artifact.zip -d dashboard_artifact
              if [ -f dashboard_artifact/index.html ]; then
                cp -a dashboard_artifact/. pages_out/dashboard/
                cp dashboard_artifact/index.html pages_out/index.html
              elif [ -f dashboard_artifact/dashboard/index.html ]; then
                cp -a dashboard_artifact/dashboard/. pages_out/dashboard/
                cp dashboard_artifact/dashboard/index.html pages_out/index.html
              fi
            fi
          fi

          # Fallback: use dashboard committed on main
          if [ ! -f pages_out/dashboard/index.html ] && [ -f dashboard/index.html ]; then
            cp -a dashboard/. pages_out/dashboard/
            cp dashboard/index.html pages_out/index.html
            echo "Used dashboard/index.html from main"
          fi

          # Overlay sub-dashboards from this checkout so orphan deploys keep them.
          if [ -f dashboard/boring-winners/index.html ]; then
            mkdir -p pages_out/dashboard/boring-winners
            cp -a dashboard/boring-winners/. pages_out/dashboard/boring-winners/
            echo "Overlayed dashboard/boring-winners from main"
          fi
          if [ -f dashboard/ticker-lookback/index.html ]; then
            mkdir -p pages_out/dashboard/ticker-lookback
            cp -a dashboard/ticker-lookback/. pages_out/dashboard/ticker-lookback/
            echo "Overlayed dashboard/ticker-lookback from main"
          fi
          if [ -f dashboard/gainer-lookback/index.html ]; then
            mkdir -p pages_out/dashboard/gainer-lookback
            cp -a dashboard/gainer-lookback/. pages_out/dashboard/gainer-lookback/
            echo "Overlayed dashboard/gainer-lookback from main"
          fi
          if [ -f dashboard/mover-lookback/index.html ]; then
            mkdir -p pages_out/dashboard/mover-lookback
            cp -a dashboard/mover-lookback/. pages_out/dashboard/mover-lookback/
            echo "Overlayed dashboard/mover-lookback from main"
          fi
          if [ -f dashboard/sleeve-combine/index.html ]; then
            mkdir -p pages_out/dashboard/sleeve-combine
            cp -a dashboard/sleeve-combine/. pages_out/dashboard/sleeve-combine/
            echo "Overlayed dashboard/sleeve-combine from main"
          fi
          if [ -f dashboard/sleeve-merge/index.html ]; then
            mkdir -p pages_out/dashboard/sleeve-merge
            cp -a dashboard/sleeve-merge/. pages_out/dashboard/sleeve-merge/
            echo "Overlayed dashboard/sleeve-merge from main"
          fi
          if [ -f dashboard/mover-paper/index.html ]; then
            mkdir -p pages_out/dashboard/mover-paper
            cp -a dashboard/mover-paper/. pages_out/dashboard/mover-paper/
            echo "Overlayed dashboard/mover-paper from main"
          fi
          if [ -f dashboard/book-paper/index.html ]; then
            mkdir -p pages_out/dashboard/book-paper
            cp -a dashboard/book-paper/. pages_out/dashboard/book-paper/
            echo "Overlayed dashboard/book-paper from main"
          fi

          # The paper book is also copied to the site root. Mirror every
          # sub-dash there so homepage links like sleeve-merge/ resolve.
          for sub in boring-winners ticker-lookback gainer-lookback mover-lookback \
                     sleeve-combine sleeve-merge mover-paper book-paper; do
            if [ -d "pages_out/dashboard/${sub}" ]; then
              mkdir -p "pages_out/${sub}"
              cp -a "pages_out/dashboard/${sub}/." "pages_out/${sub}/"
              echo "Root copy pages_out/${sub}"
            fi
          done

          if [ ! -f pages_out/dashboard/index.html ]; then
            echo "ERROR: no dashboard index.html to publish"
            exit 1
          fi
          ls -la pages_out pages_out/dashboard
          ls -la pages_out/dashboard/boring-winners 2>/dev/null || echo "WARN: boring-winners still missing"

      - name: Publish to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages_out
          force_orphan: true
          enable_jekyll: false

      - name: Show Pages URL
        run: |
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/"
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/boring-winners/"
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/gainer-lookback/"
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/mover-lookback/"
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/sleeve-combine/"
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/sleeve-merge/"
          echo "https://SRoyaltyy.github.io/fullscan/sleeve-merge/"
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/mover-paper/"
          echo "https://SRoyaltyy.github.io/fullscan/"
          echo "If 404: Settings → Pages → Deploy from branch → gh-pages / root"
