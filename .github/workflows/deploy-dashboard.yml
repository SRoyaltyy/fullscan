name: Deploy dashboard to GitHub Pages

# Backup path: when Stock Book ALL / Pre-Open / tickets / Open 09:30 /
# Factor mine finish, republish to gh-pages if day-board required roles
# for stock_book + publish + factor-mine today.json / tickets are OK.
# Catalyst FAIL / sector LLM / OpenClaw do not block. Primary publish
# is often inside stock_book_all.yml; this remains for resilience.
# Always overlay dashboard/boring-winners and dashboard/ticker-lookback
# from main so force-orphan deploys cannot 404 those pages.

on:
  workflow_run:
    workflows:
      - "Stock Book ALL (one-shot)"
      - "Pre-Open ALL (predictive one-shot)"
      - "Publish strategy tickets"
      - "Open 09:30 pack"
      - "Factor strategy mine"
    types: [completed]
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "data/day_board/**"
      - "data/stock_book/**"
      - "01_daily/*_stock_book.md"
  workflow_dispatch:
    inputs:
      session_date:
        description: "YYYY-MM-DD (empty = today ET)"
        required: false
        default: ""
      force:
        description: "Publish even if day-board required-files gate fails"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

# 2026-09-10: two deploys force-pushing gh-pages in the same second →
# `cannot lock ref 'refs/heads/gh-pages'`. Serialize this workflow with
# itself; the in-job publish script retries against the other writers.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Day-board required-files gate
        id: pages_gate
        env:
          SESSION_DATE: ${{ github.event.inputs.session_date }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          DATE="${SESSION_DATE:-}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          if [ "${FORCE}" = "true" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
            echo "force=true — publish even if required roles are missing"
            exit 0
          fi
          # stock_book + publish required roles + factor-mine today.json / tickets.
          # catalyst FAIL / sector LLM / OpenClaw do not block.
          if python3 -m src.pages_publish_gate --date "$DATE"; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "required files not OK — skip Pages (catalyst FAIL alone is not a blocker)"
          fi

      - name: Download dashboard artifact (from triggering run or latest on main)
        if: steps.pages_gate.outputs.ready == 'yes'
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p pages_out/dashboard
          touch pages_out/.nojekyll

          if [ -n "${RUN_ID:-}" ] && [ "$RUN_ID" != "" ]; then
            echo "Run ID: $RUN_ID"
            artifacts_url="https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/artifacts"
            curl -s -H "Authorization: token ${TOKEN}" "$artifacts_url" > artifacts.json || true
            url=$(jq -r '.artifacts[]? | select(.name=="dashboard" or .name=="stock-book-all") | .archive_download_url' artifacts.json 2>/dev/null | head -1 || true)
            if [ -n "${url:-}" ] && [ "$url" != "null" ]; then
              curl -L -H "Authorization: token ${TOKEN}" -o artifact.zip "$url"
              mkdir -p dashboard_artifact
              unzip -o artifact.zip -d dashboard_artifact
              if [ -f dashboard_artifact/index.html ]; then
                cp -a dashboard_artifact/. pages_out/dashboard/
                cp dashboard_artifact/index.html pages_out/index.html
              elif [ -f dashboard_artifact/dashboard/index.html ]; then
                cp -a dashboard_artifact/dashboard/. pages_out/dashboard/
                cp dashboard_artifact/dashboard/index.html pages_out/index.html
              fi
            fi
          fi

          # Fallback: use dashboard committed on main
          if [ ! -f pages_out/dashboard/index.html ] && [ -f dashboard/index.html ]; then
            cp -a dashboard/. pages_out/dashboard/
            cp dashboard/index.html pages_out/index.html
            echo "Used dashboard/index.html from main"
          fi

          # Overlay paper + sub-dashes from this checkout. A Stock Book
          # artifact can carry last night's paper HTML; without this
          # overlay, .io liveBook stays on a stale poller after 09:30.
          if [ -f dashboard/index.html ]; then
            mkdir -p pages_out/dashboard
            cp dashboard/index.html pages_out/dashboard/index.html
            cp dashboard/index.html pages_out/index.html
            echo "Overlayed dashboard/index.html (paper) from main"
          fi
          # Overlay sub-dashboards from this checkout so orphan deploys keep them.
          if [ -f dashboard/boring-winners/index.html ]; then
            mkdir -p pages_out/dashboard/boring-winners
            cp -a dashboard/boring-winners/. pages_out/dashboard/boring-winners/
            echo "Overlayed dashboard/boring-winners from main"
          fi
          if [ -f dashboard/ticker-lookback/index.html ]; then
            mkdir -p pages_out/dashboard/ticker-lookback
            cp -a dashboard/ticker-lookback/. pages_out/dashboard/ticker-lookback/
            echo "Overlayed dashboard/ticker-lookback from main"
          fi
          if [ -f dashboard/gainer-lookback/index.html ]; then
            mkdir -p pages_out/dashboard/gainer-lookback
            cp -a dashboard/gainer-lookback/. pages_out/dashboard/gainer-lookback/
            echo "Overlayed dashboard/gainer-lookback from main"
          fi
          if [ -f dashboard/flatten-lookback/index.html ]; then
            mkdir -p pages_out/dashboard/flatten-lookback
            cp -a dashboard/flatten-lookback/. pages_out/dashboard/flatten-lookback/
            echo "Overlayed dashboard/flatten-lookback from main"
          fi
          if [ -f dashboard/mover-lookback/index.html ]; then
            mkdir -p pages_out/dashboard/mover-lookback
            cp -a dashboard/mover-lookback/. pages_out/dashboard/mover-lookback/
            echo "Overlayed dashboard/mover-lookback from main"
          fi
          if [ -f dashboard/sleeve-combine/index.html ]; then
            mkdir -p pages_out/dashboard/sleeve-combine
            cp -a dashboard/sleeve-combine/. pages_out/dashboard/sleeve-combine/
            echo "Overlayed dashboard/sleeve-combine from main"
          fi
          if [ -f dashboard/sleeve-merge/index.html ]; then
            mkdir -p pages_out/dashboard/sleeve-merge
            cp -a dashboard/sleeve-merge/. pages_out/dashboard/sleeve-merge/
            echo "Overlayed dashboard/sleeve-merge from main"
          fi
          if [ -f dashboard/mover-paper/index.html ]; then
            mkdir -p pages_out/dashboard/mover-paper
            cp -a dashboard/mover-paper/. pages_out/dashboard/mover-paper/
            echo "Overlayed dashboard/mover-paper from main"
          fi
          if [ -f dashboard/strategy-board/index.html ]; then
            mkdir -p pages_out/dashboard/strategy-board
            cp -a dashboard/strategy-board/. pages_out/dashboard/strategy-board/
            echo "Overlayed dashboard/strategy-board from main"
          fi
          if [ -f dashboard/book-paper/index.html ]; then
            mkdir -p pages_out/dashboard/book-paper
            cp -a dashboard/book-paper/. pages_out/dashboard/book-paper/
            echo "Overlayed dashboard/book-paper from main"
          fi
          if [ -f dashboard/factor-mine/index.html ]; then
            mkdir -p pages_out/dashboard/factor-mine
            cp -a dashboard/factor-mine/. pages_out/dashboard/factor-mine/
            echo "Overlayed dashboard/factor-mine from main"
          fi
          if [ -f dashboard/down-day-mine/index.html ]; then
            mkdir -p pages_out/dashboard/down-day-mine
            cp -a dashboard/down-day-mine/. pages_out/dashboard/down-day-mine/
            echo "Overlayed dashboard/down-day-mine from main"
          fi
          if [ -f dashboard/day-board/index.html ]; then
            mkdir -p pages_out/dashboard/day-board
            cp -a dashboard/day-board/. pages_out/dashboard/day-board/
            echo "Overlayed dashboard/day-board from main"
          fi
          if [ -f dashboard/hard-red-exceptions/index.html ]; then
            mkdir -p pages_out/dashboard/hard-red-exceptions
            cp -a dashboard/hard-red-exceptions/. pages_out/dashboard/hard-red-exceptions/
            echo "Overlayed dashboard/hard-red-exceptions from main"
          fi

          # The paper book is also copied to the site root. Mirror every
          # sub-dash there so homepage links like sleeve-merge/ resolve.
          for sub in boring-winners ticker-lookback gainer-lookback flatten-lookback \
                     mover-lookback sleeve-combine sleeve-merge mover-paper book-paper \
                     strategy-board factor-mine day-board down-day-mine hard-red-exceptions; do
            if [ -d "pages_out/dashboard/${sub}" ]; then
              mkdir -p "pages_out/${sub}"
              cp -a "pages_out/dashboard/${sub}/." "pages_out/${sub}/"
              echo "Root copy pages_out/${sub}"
            fi
          done

          # Paper / strategy-board firstOk looks for today.json and
          # today_strategies.json next to the HTML. Those 404 today on
          # .io (only factor-mine/ has copies). A later ranker today.json
          # on raw main then wins and paints scores without Elite px.
          # Last-write-wins copy is wrong: factor-mine tickets can be a
          # stripped 200 (no quote) that clobbers the day_board slim.
          PYTHONPATH=. python3 -m src.overlay_live_strip --dest pages_out
          echo "Overlayed live strip"

          if [ ! -f pages_out/dashboard/index.html ]; then
            echo "ERROR: no dashboard index.html to publish"
            exit 1
          fi
          ls -la pages_out pages_out/dashboard
          ls -la pages_out/dashboard/boring-winners 2>/dev/null || echo "WARN: boring-winners still missing"

      - name: Publish to GitHub Pages (gh-pages, retried)
        if: steps.pages_gate.outputs.ready == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_OUT_DIR: pages_out
        run: |
          chmod +x scripts/publish_dashboard.sh || true
          bash scripts/publish_dashboard.sh

      - name: Show Pages URL
        if: steps.pages_gate.outputs.ready == 'yes'
        run: |
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/"
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/boring-winners/"
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/gainer-lookback/"
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/flatten-lookback/"
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/mover-lookback/"
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/sleeve-combine/"
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/sleeve-merge/"
          echo "https://SRoyaltyy.github.io/fullscan/sleeve-merge/"
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/mover-paper/"
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/strategy-board/"
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/factor-mine/"
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/day-board/"
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/hard-red-exceptions/"
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/down-day-mine/"
          echo "https://SRoyaltyy.github.io/fullscan/"
          echo "If 404: Settings → Pages → Deploy from branch → gh-pages / root"
