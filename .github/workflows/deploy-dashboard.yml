name: Deploy dashboard to GitHub Pages

# Backup path: when Stock Book ALL / Pre-Open / tickets / Open 09:30 /
# Factor mine finish, republish to gh-pages if day-board required roles
# for stock_book + publish + factor-mine today.json / tickets are OK.
# Catalyst FAIL / sector LLM / OpenClaw do not block. Primary publish
# is often inside stock_book_all.yml; this remains for resilience.
# Always overlay named dashboard folders from main so force-orphan deploys cannot 404 those pages.
# No session_date: the gate uses the latest completed NYSE session
# (before 09:30 ET, or a weekend/holiday, that is the previous session).
# A gate block fails the job. A skipped Download/Publish is never green.

on:
  workflow_run:
    workflows:
      - "Stock Book ALL (one-shot)"
      - "Pre-Open ALL (predictive one-shot)"
      - "Publish strategy tickets"
      - "Open 09:30 pack"
      - "Factor strategy mine"
    types: [completed]
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "data/stock_book/**"
      - "01_daily/*_stock_book.md"
  workflow_dispatch:
    inputs:
      session_date:
        description: "YYYY-MM-DD (empty = latest completed NYSE session)"
        required: false
        default: ""
      force:
        description: "Publish even if day-board required-files gate fails"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Day-board required-files gate
        id: pages_gate
        env:
          SESSION_DATE: ${{ github.event.inputs.session_date }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          DATE="${SESSION_DATE:-}"
          if [ "${FORCE}" = "true" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
            echo "force=true — publish even if required roles are missing"
            exit 0
          fi
          args=()
          if [ -n "$DATE" ]; then
            args+=(--date "$DATE")
          fi
          set +e
          log=$(python3 -m src.pages_publish_gate "${args[@]}")
          status=$?
          set -e
          printf '%s\n' "$log"
          if [ "$status" -ne 0 ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "ERROR: Pages publish refused (gate exit ${status}). Download and Publish are skipped. This workflow fails on purpose: a green run must not leave stale Pages live."
            printf '%s\n' "$log" | tail -n 5
            exit 1
          fi
          echo "ready=yes" >> "$GITHUB_OUTPUT"

      - name: Fail closed when Pages publish did not run
        if: always() && steps.pages_gate.outputs.ready != 'yes'
        run: |
          echo "ERROR: Download and Publish did not run (pages_gate.ready='${{ steps.pages_gate.outputs.ready }}'). A skipped Pages publish is a failed deploy, not a green no-op."
          exit 1

      - name: Download dashboard artifact (from triggering run or latest on main)
        if: steps.pages_gate.outputs.ready == 'yes'
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p pages_out/dashboard
          touch pages_out/.nojekyll

          if [ -n "${RUN_ID:-}" ] && [ "$RUN_ID" != "" ]; then
            echo "Run ID: $RUN_ID"
            artifacts_url="https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/artifacts"
            curl -s -H "Authorization: token ${TOKEN}" "$artifacts_url" > artifacts.json || true
            url=$(jq -r '.artifacts[]? | select(.name=="dashboard" or .name=="stock-book-all") | .archive_download_url' artifacts.json 2>/dev/null | head -1 || true)
            if [ -n "${url:-}" ] && [ "$url" != "null" ]; then
              curl -L -H "Authorization: token ${TOKEN}" -o artifact.zip "$url"
              mkdir -p dashboard_artifact
              unzip -o artifact.zip -d dashboard_artifact
              if [ -f dashboard_artifact/index.html ]; then
                cp -a dashboard_artifact/. pages_out/dashboard/
                cp dashboard_artifact/index.html pages_out/index.html
              elif [ -f dashboard_artifact/dashboard/index.html ]; then
                cp -a dashboard_artifact/dashboard/. pages_out/dashboard/
                cp dashboard_artifact/dashboard/index.html pages_out/index.html
              fi
            fi
          fi

          if [ ! -f pages_out/dashboard/index.html ] && [ -f dashboard/index.html ]; then
            cp -a dashboard/. pages_out/dashboard/
            cp dashboard/index.html pages_out/index.html
            echo "Used dashboard/index.html from main"
          fi

          overlay() {
            local sub="$1"
            if [ -f "dashboard/${sub}/index.html" ]; then
              mkdir -p "pages_out/dashboard/${sub}"
              cp -a "dashboard/${sub}/." "pages_out/dashboard/${sub}/"
              echo "Overlayed dashboard/${sub} from main"
            fi
          }
          for sub in boring-winners ticker-lookback gainer-lookback flatten-lookback \
                     mover-lookback sleeve-combine sleeve-merge mover-paper strategy-board \
                     book-paper paper-book factor-mine down-day-mine day-board \
                     hard-red-exceptions day-movers holdup h1 jev-train news-dir news-intake \
                     webull-sim updown updown-shadow; do
            overlay "$sub"
          done
          if [ -f dashboard/factor-mine/index.html ]; then
            python3 scripts/patch_fm_ovcal.py pages_out/dashboard/factor-mine/index.html
            python3 scripts/patch_fm_holdup.py pages_out/dashboard/factor-mine/index.html
            python3 scripts/patch_fm_preopen_labels.py pages_out/dashboard/factor-mine/index.html dashboard/factor-mine/replay_preopen.json
          fi

          for sub in boring-winners ticker-lookback gainer-lookback flatten-lookback \
                     mover-lookback sleeve-combine sleeve-merge mover-paper book-paper paper-book \
                     strategy-board factor-mine day-board down-day-mine hard-red-exceptions day-movers holdup h1 jev-train news-dir news-intake webull-sim; do
            if [ -d "pages_out/dashboard/${sub}" ]; then
              mkdir -p "pages_out/${sub}"
              cp -a "pages_out/dashboard/${sub}/." "pages_out/${sub}/"
              echo "Root copy pages_out/${sub}"
            fi
          done

          if [ ! -f pages_out/dashboard/index.html ]; then
            echo "ERROR: no dashboard index.html to publish"
            exit 1
          fi
          test -f pages_out/dashboard/news-dir/index.html
          ls -la pages_out/dashboard/news-dir

      - name: Publish to GitHub Pages (gh-pages, retried)
        if: steps.pages_gate.outputs.ready == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_OUT_DIR: pages_out
        run: |
          chmod +x scripts/publish_dashboard.sh || true
          bash scripts/publish_dashboard.sh

      - name: Show Pages URL
        if: steps.pages_gate.outputs.ready == 'yes'
        run: |
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/news-dir/"
          echo "https://SRoyaltyy.github.io/fullscan/dashboard/jev-train/"
