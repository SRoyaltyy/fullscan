name: Publish strategy tickets

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "YYYY-MM-DD (empty = today ET)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ['01_daily/**', 'data/join/**', 'data/peers/**', 'data/ab_checklist/**', 'data/factor_mine/panel.json']
  schedule:
    - cron: '3,18,33,48 12-20 * * 1-5'
  workflow_run:
    workflows:
      - "Stock Book ALL (one-shot)"
      - "Pre-Open ALL (predictive one-shot)"
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-strategy-tickets
  cancel-in-progress: false

jobs:
  tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pandas pyarrow openpyxl requests
      - name: Required inputs, independent of previous outputs
        id: readiness
        env:
          RUN_DATE: ${{ github.event.inputs.run_date }}
        run: |
          set -euo pipefail
          DATE="${RUN_DATE:-$(TZ=America/New_York date +%F)}"
          set +e
          python -m src.decision_ready --date "$DATE"
          CODE=$?
          set -e
          if [ "$CODE" -eq 3 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            exit "$CODE"
          fi
      - name: Write tickets
        if: steps.readiness.outputs.ready == 'true'
        env:
          FINVIZ_EMAIL: ${{ secrets.FINVIZ_EMAIL }}
          FINVIZ_PASSWORD: ${{ secrets.FINVIZ_PASSWORD }}
          FINVIZ_AUTH: ${{ secrets.FINVIZ_AUTH }}
          AUTH_TOKEN_FINVIZ: ${{ secrets.AUTH_TOKEN_FINVIZ }}
          FINVIZ_EXPORT: ${{ secrets.FINVIZ_EXPORT }}
        run: |
          DATE="${{ github.event.inputs.run_date }}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          set -euo pipefail
          python3 -m src.decision_ready --date "$DATE" --publish
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/day_board/today_strategies.json")
          d = json.loads(p.read_text()) if p.exists() else {}
          print("date", d.get("date"), "n", d.get("n"), "ok", d.get("n_ok"))
          st = d.get("strategies") or {}
          for name in list(st)[:20]:
              s = st[name]
              print(f"  {name:28} {str(s.get('status')):12} buy={s.get('buy')} sell={s.get('sell')}")
          print("total strategies", len(st))
          PY
          test -s data/day_board/today_strategies.json
          test -s dashboard/factor-mine/strategy_tickets.json
      - name: Push tickets
        if: steps.readiness.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE="${{ github.event.inputs.run_date }}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          bash scripts/safe_git_push.sh \
            "auto: strategy tickets $(TZ=America/New_York date +%F)" \
            "data/day_board/${DATE}_strategy_tickets.json" \
            dashboard/factor-mine/index.html \
            data/day_board/strategy_tickets.json \
            data/day_board/today_strategies.json \
            data/day_board/today.json \
            data/factor_mine/strategy_tickets.json \
            dashboard/factor-mine/strategy_tickets.json \
            dashboard/factor-mine/today_strategies.json \
            dashboard/today_strategies.json \
            dashboard/factor-mine/today.json \
            data/day_board/hold_live_px.json \
            dashboard/factor-mine/hold_live_px.json \
            dashboard/sleeve-merge/index.html \
            dashboard/strategy-board/index.html \
            dashboard/index.html \
            "data/stock_book/" \
            "01_daily/${DATE}_stock_book.md"
          chmod +x scripts/publish_dashboard.sh || true
          bash scripts/publish_dashboard.sh
      - name: Restamp GitHub Pages
        if: steps.readiness.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-dashboard.yml --ref main
