name: Publish strategy tickets

# workflow_run (successful main runs only) plus push plus dispatch.
# The gate skips a run whose input hash already matches the landed
# ticket, and that skip does not cancel an in-flight publish.
# A newer hash still cancels the older publish job: latest inputs win.
# This workflow never places a Webull order. A ticket republish and a
# stock-book rebuild (workflow_run from Stock Book ALL or Pre-Open ALL)
# only write tickets. The sealed h1 paper send is webull_paper.yml before
# 09:30 ET, with the ECS backstop as the other sender. A missed send
# stays missed.
on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "YYYY-MM-DD (empty = today ET)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ['01_daily/**', 'data/join/**', 'data/peers/**', 'data/ab_checklist/**', 'data/factor_mine/panel.json']
  workflow_run:
    workflows:
      - "Stock Book ALL (one-shot)"
      - "Pre-Open ALL (predictive one-shot)"
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

# Concurrency sits on the publish job, not the whole workflow. A duplicate
# trigger whose input hash already matches the landed ticket never joins
# the group, so it does not cancel the run that is writing that ticket.
# A new hash still cancels the older publish: latest inputs win.
jobs:
  gate:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.fingerprint.outputs.publish }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pandas pyarrow openpyxl requests
      - name: Skip when the landed ticket already has this input hash
        id: fingerprint
        env:
          RUN_DATE: ${{ github.event.inputs.run_date }}
          FULLSCAN_REQUIRE_MAIN: "1"
        run: |
          set -euo pipefail
          DATE="${RUN_DATE:-$(TZ=America/New_York date +%F)}"
          python -m src.decision_ready --date "$DATE" --gate | tee /tmp/gate.txt
          publish=$(awk -F= '/^publish=/{print $2}' /tmp/gate.txt | tail -1)
          fp=$(awk -F= '/^fingerprint=/{print $2}' /tmp/gate.txt | tail -1)
          echo "publish=${publish:-false}" >> "$GITHUB_OUTPUT"
          echo "fingerprint=${fp}" >> "$GITHUB_OUTPUT"
          echo "gate publish=${publish:-false} fingerprint=${fp}"

  tickets:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    concurrency:
      group: publish-strategy-tickets
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # morning_look proves commit times; a shallow clone refuses.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pandas pyarrow openpyxl requests
      - name: Required inputs, independent of previous outputs
        id: readiness
        env:
          RUN_DATE: ${{ github.event.inputs.run_date }}
        run: |
          set -euo pipefail
          DATE="${RUN_DATE:-$(TZ=America/New_York date +%F)}"
          set +e
          python -m src.decision_ready --date "$DATE"
          CODE=$?
          set -e
          if [ "$CODE" -eq 3 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            exit "$CODE"
          fi
      - name: Write tickets
        if: steps.readiness.outputs.ready == 'true'
        env:
          FINVIZ_EMAIL: ${{ secrets.FINVIZ_EMAIL }}
          FINVIZ_PASSWORD: ${{ secrets.FINVIZ_PASSWORD }}
          FINVIZ_AUTH: ${{ secrets.FINVIZ_AUTH }}
          AUTH_TOKEN_FINVIZ: ${{ secrets.AUTH_TOKEN_FINVIZ }}
          FINVIZ_EXPORT: ${{ secrets.FINVIZ_EXPORT }}
        run: |
          DATE="${{ github.event.inputs.run_date }}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          set -euo pipefail
          python3 -m src.morning_look decision_ready --date "$DATE" --publish
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/day_board/today_strategies.json")
          d = json.loads(p.read_text()) if p.exists() else {}
          print("date", d.get("date"), "n", d.get("n"), "ok", d.get("n_ok"))
          st = d.get("strategies") or {}
          for name in list(st)[:20]:
              s = st[name]
              print(f"  {name:28} {str(s.get('status')):12} buy={s.get('buy')} sell={s.get('sell')}")
          print("total strategies", len(st))
          PY
          test -s data/day_board/today_strategies.json
          test -s dashboard/factor-mine/strategy_tickets.json
      - name: Push tickets
        if: always() && steps.readiness.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE="${{ github.event.inputs.run_date }}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          bash scripts/safe_git_push.sh \
            "auto: strategy tickets $(TZ=America/New_York date +%F)" \
            "data/day_board/${DATE}_strategy_tickets.json" \
            "data/day_board/${DATE}_strategy_tickets_draft.json" \
            "data/factor_mine/send_inputs/${DATE}.json" \
            "data/factor_mine/morning_look/${DATE}.json" \
            dashboard/factor-mine/index.html \
            data/day_board/strategy_tickets.json \
            data/day_board/today_strategies.json \
            data/day_board/today.json \
            data/factor_mine/strategy_tickets.json \
            dashboard/factor-mine/strategy_tickets.json \
            dashboard/factor-mine/today_strategies.json \
            dashboard/today_strategies.json \
            dashboard/factor-mine/today.json \
            data/day_board/hold_live_px.json \
            dashboard/factor-mine/hold_live_px.json \
            dashboard/sleeve-merge/index.html \
            dashboard/strategy-board/index.html \
            dashboard/index.html \
            data/past_day_lock/ \
            "data/stock_book/" \
            "01_daily/${DATE}_stock_book.md"
          chmod +x scripts/publish_dashboard.sh || true
          bash scripts/publish_dashboard.sh
      - name: Restamp GitHub Pages
        if: always() && steps.readiness.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-dashboard.yml --ref main
