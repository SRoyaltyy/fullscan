name: Weekly Lesson Consolidation

on:
  schedule:
    # Sunday 11:00 AM ET (15:00 UTC EDT)
    - cron: '0 15 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests openai ddgs
      - name: Promote repeated candidate lessons to active rules
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python -m src.promote_lessons
      - name: Commit
        run: |
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "auto: weekly lesson promotion [$(date -u +%F)]" || echo "No changes"
          git pull --rebase origin main || true
          git push origin main
