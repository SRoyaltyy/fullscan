name: Stock Book readiness

# Board for the workflows that feed the ranker, the buy/sell names the
# ranker wrote, and whether those names reached the .io dashboard.
# Historical dates (from the 2026-08-13 dashboard onward) use the input
# contract and ranker that were live that day. Missing later-era files
# (Judge, digest, AB, peers, map-heat) are era-skip, not a refusal.
# If a session has join but no book, the job replays the as-of ranker
# in-workspace only — it does not push or heal main.
# FAIL = empty / truncated / QC fail.
# PARTIAL = some required outputs are good, others are not.
#
# Code comes from the ref that triggered this run. Daily artifacts are
# overlaid from main so the board matches the live packet.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Session YYYY-MM-DD (empty = today ET)"
        required: false
        default: ""
  schedule:
    # 08:50 ET — after Pre-Open ALL should have written the book
    - cron: "50 12 * * 1-5"

permissions:
  contents: read
  actions: read

concurrency:
  group: stock-book-diag
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Overlay live daily files from main
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- 01_daily data 03_scoreboard dashboard \
            || echo "overlay skipped (already on main or paths missing)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (gainer as-of walk needs pandas)
        run: pip install pandas pyarrow

      - name: Diagnose Stock Book upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          DATE="${{ github.event.inputs.date }}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          echo "DATE=$DATE"
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          python -m src.stock_book_diag --date "$DATE" --write --as-of --rebuild-if-missing || true
          # Board is the product. Red rows / a python crash are not a job fail.
          exit 0

      - name: Show today's actions
        if: always()
        run: |
          D="${DATE:-$(TZ=America/New_York date +%F)}"
          echo "======== $D ACTIONS ========"
          MD="01_daily/${D}_stock_book_diag.md"
          if [ -f "$MD" ]; then
            awk '/^## Today.s actions/,/^## Dashboard|^## Why the ranker|^## Post-close/' "$MD"
          else
            echo "NO REPORT — diagnostic did not write a board"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-book-diag-${{ env.DATE }}
          path: |
            01_daily/${{ env.DATE }}_stock_book_diag.md
            01_daily/${{ env.DATE }}_stock_book_diag.json
          if-no-files-found: warn
