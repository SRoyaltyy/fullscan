name: Holdup append-only forward

# Weekdays after Pre-Open ALL (09:55 UTC) has had time to land the
# morning files, and before the US cash open.
# 13:05 UTC = 9:05 AM ET during EDT (UTC-4) and 8:05 AM ET during EST
# (UTC-5). Hong Kong Time is 9:05 PM year-round (UTC+8, no DST).
# The cash open is 9:30 AM ET, which is 1:30 PM UTC / 9:30 PM HKT in
# EDT and 2:30 PM UTC / 10:30 PM HKT in EST.
# This run seals a PLAN for session D only: ranked picks, planned sells,
# and excluded names. It does not read D's prices. The fill is a separate
# post-close workflow. If the morning score is missing, the log is not
# touched and the reason is written to skips.jsonl.
# From 2026-09-29 the Finviz universe is theme-radar
# data/snapshots/<previous session>.csv at the last commit before 09:30 ET.
# A missing file or a commit that is not before the open skips Finviz names
# and fills no new buy, the same as 2026-08-28. It does not skip the day.
# workflow_dispatch session_date seals that session when it is the next one.
# The run refuses at or after 09:30 ET on that session and writes nothing.
# The page is published by deploy-dashboard.yml on the same overlay route
# as dashboard/factor-mine (copy from main, then the site-root mirror).

on:
  schedule:
    - cron: "5 13 * * 1-5"
  workflow_dispatch:
    inputs:
      session_date:
        description: "Session D (YYYY-MM-DD). Empty seals the next session. Refuses at or after 09:30 ET."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: holdup-forward
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bar dependencies
        run: pip install numpy pandas pyarrow yfinance
      - name: Theme Radar history for the pre-open panel
        run: |
          set -euo pipefail
          if ! git clone --filter=blob:none --no-checkout \
              https://github.com/SRoyaltyy/theme-radar.git vendor/theme-radar; then
            echo "theme-radar clone failed; the forward step will log the missing panel"
            exit 0
          fi
          git -C vendor/theme-radar sparse-checkout init --cone
          git -C vendor/theme-radar sparse-checkout set research/lever_panel data/snapshots
          git -C vendor/theme-radar checkout main \
            || echo "theme-radar checkout failed"
      - name: Refresh forward prices
        id: prices
        run: PYTHONHASHSEED=0 python3 research/hot_n4_clean_v4/forward/prices.py
      - name: Seal the pre-open plan
        id: plan
        if: success()
        env:
          HOLDUP_GIT_REF: origin/main
          HOLDUP_MODE: plan
          PLAN_SESSION: ${{ github.event.inputs.session_date }}
        run: PYTHONHASHSEED=0 python3 research/hot_n4_clean_v4/forward/forward.py
      - name: Commit the append
        if: always()
        run: |
          set -euo pipefail
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          files=(
            research/hot_n4_clean_v4/forward/holdup_log.jsonl
            research/hot_n4_clean_v4/forward/LEDGER.jsonl
            research/hot_n4_clean_v4/forward/skips.jsonl
            research/hot_n4_clean_v4/forward/prices.jsonl
            research/hot_n4_clean_v4/forward/PRICE_LEDGER.jsonl
            research/hot_n4_clean_v4/forward/price_revisions.jsonl
            dashboard/holdup/log.json
            dashboard/holdup/status.json
          )
          for path in "${files[@]}"; do
            if [ -f "$path" ]; then
              git add -- "$path"
            fi
          done
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Seal the next holdup plan."
          # Another job can push between our rebase and push. Retry a
          # non-conflicting race up to 5 times. A rebase conflict means a record
          # file changed on main under this run: abort and fail, never force.
          pushed=false
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              if [ -d "$(git rev-parse --git-path rebase-merge)" ] \
                 || [ -d "$(git rev-parse --git-path rebase-apply)" ]; then
                git rebase --abort || true
                echo "::error::rebase conflict on attempt ${attempt}; not retrying"
                exit 1
              fi
              echo "pull failed on attempt ${attempt}"
            elif git push origin HEAD:main; then
              pushed=true
              break
            else
              echo "push rejected on attempt ${attempt}"
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep $(( 2 * attempt + RANDOM % 5 ))
            fi
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::push failed after 5 attempts"
            exit 1
          fi
      - name: Fail the job when the book halted
        if: steps.prices.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: exit 1
