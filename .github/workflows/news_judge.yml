name: News Judge (LLM priority)

# NO schedule cron: Pre-Open ALL (06:00 ET) owns the morning judge.
# Dispatch-only — orchestrator last-chance fallback after 08:00 ET.
on:
  workflow_dispatch:
    inputs:
      llm_provider:
        description: "deepseek = api.deepseek.com · openrouter-glm = OpenRouter z-ai/glm-5.3 (top tier)"
        required: false
        default: "deepseek"
        type: choice
        options:
          - deepseek
          - openrouter-glm
          - openrouter-sonnet
          - zhipu-glm
          - tokenhub-glm
          - zhipu-glm-flash
      run_date:
        description: "YYYY-MM-DD of mechanical parse to judge (blank = latest)"
        required: false
        default: ""
      dry_run:
        description: "true = test only: no git push, no DB, no land (judge printed in log)"
        required: false
        default: "false"
      force:
        description: "Ignore 09:25 ET cutoff and skip-if-good"
        required: false
        default: "false"

permissions:
  actions: write
  contents: write

concurrency:
  group: news-judge
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  judge:
    # Dispatch-only last-chance heal. ubuntu/DeepSeek must actually start
    # when ECS is offline (09-08 standalone judge sat in the ECS queue).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FULLSCAN_LAND: "1"
      FULLSCAN_HOME: "/home/runner"
      HOME: "/home/runner"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary openai requests || true
      - name: Skip if past 09:25 ET
        if: github.event_name == 'schedule'
        run: |
          ET_HM=$((10#$(TZ=America/New_York date +%H%M)))
          echo "ET_HM=$ET_HM"
          if [ "$ET_HM" -ge 925 ]; then
            echo "past 09:25 ET — skip news_judge (would overwrite a pre-open copy)"
            echo "skip=yes" >> "$GITHUB_ENV"
          fi
      - name: Run news judge
        if: env.skip != 'yes'
        env:
          DEEPSEEK_API_KEY: ${{ (github.event.inputs.llm_provider == 'zhipu-glm-flash') && secrets.ZHIPU_API_KEY || (github.event.inputs.llm_provider == 'tokenhub-glm') && secrets.TOKENHUB_API_KEY || (github.event.inputs.llm_provider == 'zhipu-glm') && secrets.ZHIPU_API_KEY || startsWith(github.event.inputs.llm_provider, 'openrouter') && secrets.OPENROUTER_API_KEY || secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ (github.event.inputs.llm_provider == 'zhipu-glm-flash') && 'https://open.bigmodel.cn/api/paas/v4' || (github.event.inputs.llm_provider == 'tokenhub-glm') && secrets.TOKENHUB_BASE_URL || (github.event.inputs.llm_provider == 'zhipu-glm') && 'https://open.bigmodel.cn/api/paas/v4' || startsWith(github.event.inputs.llm_provider, 'openrouter') && 'https://openrouter.ai/api/v1' || 'https://api.deepseek.com' }}
          LLM_MODEL_OVERRIDE: ${{ (github.event.inputs.llm_provider == 'zhipu-glm-flash') && 'glm-5.3-flash' || (github.event.inputs.llm_provider == 'tokenhub-glm') && 'glm-5.3' || (github.event.inputs.llm_provider == 'zhipu-glm') && 'glm-5.3' || (github.event.inputs.llm_provider == 'openrouter-glm') && 'z-ai/glm-5.3' || (github.event.inputs.llm_provider == 'openrouter-sonnet') && 'anthropic/claude-sonnet-4.6' || '' }}
          LLM_FALLBACK_API_KEY: ${{ (github.event.inputs.llm_provider == 'zhipu-glm-flash') && secrets.TOKENHUB_API_KEY || '' }}
          LLM_FALLBACK_BASE_URL: ${{ (github.event.inputs.llm_provider == 'zhipu-glm-flash') && secrets.TOKENHUB_BASE_URL || '' }}
          LLM_FALLBACK_MODEL: ${{ github.event.inputs.llm_provider == 'zhipu-glm-flash' && 'glm-5.3' || '' }}
          LLM_READ_TIMEOUT_S: "300"
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_TIMEOUT: "10800"
          DATABASE_URL: ${{ github.event.inputs.dry_run != 'true' && secrets.DATABASE_URL || '' }}
          FULLSCAN_LAND_NOPUSH: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -e
          DATE="${{ github.event.inputs.run_date }}"
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          python -m src.run_news_judge "${ARGS[@]}"
      - name: Show B1 inject
        if: always()
        run: |
          ls -la 01_daily/news/*judge* 2>/dev/null || true
          latest=$(ls -1t 01_daily/news/*_judge.md 2>/dev/null | head -1)
          if [ -n "$latest" ]; then
            echo "===== $latest ====="
            head -120 "$latest"
          fi
      - name: Commit
        if: env.skip != 'yes' && github.event.inputs.dry_run != 'true'
        run: |
          bash scripts/safe_git_push.sh "auto: news judge" \
            01_daily/news/ 01_daily/_transcripts/
