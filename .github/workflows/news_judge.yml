name: News Judge (LLM priority)

on:
  # After mechanical news_parse cron slots (those fire at :15 past 10/12 UTC)
  # Dropped 14 UTC (10:00 ET) — that slot overwrote the pre-open copy after the bell.
  schedule:
    - cron: "25 10,12 * * 1-5"
  workflow_dispatch:
    inputs:
      run_date:
        description: "YYYY-MM-DD of mechanical parse to judge (blank = latest)"
        required: false
        default: ""
      force:
        description: "Ignore 09:25 ET cutoff and skip-if-good"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: news-judge
  cancel-in-progress: true

jobs:
  judge:
    runs-on: [self-hosted, ecs]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary openai requests || true
      - name: Skip if past 09:25 ET
        if: github.event_name == 'schedule'
        run: |
          ET_HM=$((10#$(TZ=America/New_York date +%H%M)))
          echo "ET_HM=$ET_HM"
          if [ "$ET_HM" -ge 925 ]; then
            echo "past 09:25 ET — skip news_judge (would overwrite a pre-open copy)"
            echo "skip=yes" >> "$GITHUB_ENV"
          fi
      - name: Run news judge
        if: env.skip != 'yes'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -e
          DATE="${{ github.event.inputs.run_date }}"
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          python -m src.run_news_judge "${ARGS[@]}"
      - name: Show B1 inject
        if: always()
        run: |
          ls -la 01_daily/news/*judge* 2>/dev/null || true
          latest=$(ls -1t 01_daily/news/*_judge.md 2>/dev/null | head -1)
          if [ -n "$latest" ]; then
            echo "===== $latest ====="
            head -120 "$latest"
          fi
      - name: Commit
        if: env.skip != 'yes'
        run: |
          bash scripts/safe_git_push.sh "auto: news judge" \
            01_daily/news/ 01_daily/_transcripts/
