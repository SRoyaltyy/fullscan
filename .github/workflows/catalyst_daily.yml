name: Catalyst daily (bounded dossiers)

# Production hook for collectors/catalyst_analysis.py.
# Picks ≤8 names from OVERRIDE captains, map-heat opportunities,
# mega-cap earnings, and news-action conflicts. Writes dossiers,
# merges net_signal into that day's news actions (dashboard path).
#
# Primary run is INSIDE Pre-Open ALL, after map-heat + news actions
# and before predicts, so dossiers land before 09:30 ET.
# This workflow is last-chance (08:15 ET) plus afternoon skip-if-good
# so Stock Book ALL can still merge if morning burned the clock.
# Analysis is Grok-only (OpenClaw / Grok 4.6). Same prompts.
# Search is Grok native web/X — no SearXNG.

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "YYYY-MM-DD (empty = today ET)"
        required: false
        default: ""
      max_tickers:
        description: "Max dossiers this run"
        required: false
        default: "8"
      tickers:
        description: "Optional extra tickers (comma-separated)"
        required: false
        default: ""
      force:
        description: "true = ignore skip-if-good"
        required: false
        default: "false"
  # schedule disabled 2026-08-29 — not in live pipeline
  # schedule:
  #   # 08:15 ET last-chance if Pre-Open ALL finished without dossiers
  #   - cron: "15 12 * * 1-5"
  #   # 10:30 ET skip-if-good catch-up for the book path
  #   - cron: "30 14 * * 1-5"

permissions:
  contents: write

concurrency:
  group: catalyst-daily
  cancel-in-progress: false

jobs:
  dossiers:
    runs-on: [self-hosted, ecs]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary pandas openai aiohttp yfinance || true

      - name: Run catalyst daily
        env:
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_BACKEND_MODEL: xai/grok-4.6
          OPENCLAW_TIMEOUT: "3600"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINVIZ_AUTH: ${{ secrets.FINVIZ_AUTH }}
          FINVIZ_EMAIL: ${{ secrets.FINVIZ_EMAIL }}
          FINVIZ_PASSWORD: ${{ secrets.FINVIZ_PASSWORD }}
          GROK_ONLY: "1"
        run: |
          set -euo pipefail
          DATE="${{ github.event.inputs.run_date }}"
          MAX="${{ github.event.inputs.max_tickers }}"
          TICKERS="${{ github.event.inputs.tickers }}"
          FORCE="${{ github.event.inputs.force }}"
          MAX="${MAX:-8}"
          FORCE="${FORCE:-false}"
          ARGS=(--max "$MAX")
          [ -n "${DATE:-}" ] && ARGS+=(--date "$DATE")
          [ -n "${TICKERS:-}" ] && ARGS+=(--tickers "$TICKERS")
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          echo "CMD: python -m src.catalyst_daily ${ARGS[*]}"
          python -m src.catalyst_daily "${ARGS[@]}"

      - name: Preview
        if: always()
        run: |
          latest=$(ls -1t 01_daily/catalyst/*_dossiers.md 2>/dev/null | head -1 || true)
          if [ -n "${latest:-}" ]; then head -80 "$latest"; fi

      - name: Commit
        if: always()
        run: |
          bash scripts/safe_git_push.sh "auto: catalyst daily dossiers" \
            01_daily/catalyst/ 01_daily/news/ data/catalyst/ || true
