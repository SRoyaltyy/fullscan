name: Lever search append-only
on:
  pull_request:
permissions:
  contents: read
jobs:
  append-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The suggestions.csv hash guard reads the
          # preregistration blob with git show, not the live daily file.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the PR base
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
      - name: Append-only unit tests
        run: PYTHONHASHSEED=0 python3 -m src.test_lever_search_append
      - name: Prereg panel tests
        run: PYTHONHASHSEED=0 python3 -m src.test_lever_search_panel
      - name: Same-day bar and proof-day tests
        run: PYTHONHASHSEED=0 python3 -m src.test_lever_search_bars
      - name: Install Group 3 score test dependencies
        run: pip install pandas numpy
      - name: Group 3 score unit tests
        run: PYTHONHASHSEED=0 python3 -m src.test_lever_search_score
      - name: Fail if an earlier factor_mine_seq session changed
        run: python3 -m src.lever_search_append --check-against "${{ github.event.pull_request.base.sha }}"
