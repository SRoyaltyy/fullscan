name: Webull sandbox reconcile to h1 book (one-shot)
# Manual only. Default is a dry run (re-reads live sandbox positions, lists
# the orders, appends one add-only note per order). submit=true places the
# orders only 09:40-15:50 ET on a weekday (enforced again in the script).
on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Place the orders (sandbox only)"
        type: boolean
        default: false
      no_buys:
        description: "Only sell excess; skip shortfall buys"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: webull-paper-seal
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Book-write window
        run: |
          ET_HM=$((10#$(TZ=America/New_York date +%H%M)))
          if [ "$ET_HM" -ge 300 ] && [ "$ET_HM" -lt 940 ]; then echo "::error::03:00-09:40 ET closed"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /00_grounding/
            /research/hot_n4_clean_v4/forward_h1/
            /data/paper_open/
            /scripts/safe_git_push.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install webull-openapi-python-sdk pandas numpy pyarrow yfinance requests
      - name: Reconcile
        env:
          WEBULL_APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
          WEBULL_ACCOUNT_ID: ${{ secrets.WEBULL_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ARGS=""
          [ "${{ inputs.submit }}" = "true" ] && ARGS="$ARGS --submit"
          [ "${{ inputs.no_buys }}" = "true" ] && ARGS="$ARGS --no-buys"
          python3 -m src.webull_reconcile $ARGS
      - name: Land notes
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/safe_git_push.sh "auto: webull sandbox reconcile notes" data/paper_open/reconcile_log.jsonl
