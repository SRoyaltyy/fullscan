name: Refresh scanner test page
on:
  push:
    branches: [main]
    paths:
      - 'src/correlation.py'
      - 'src/evidence_matcher.py'
      - 'src/stock_evidence.py'
      - 'src/filing*.py'
      - 'src/names.py'
      - 'src/aliases.py'
      - 'src/linguistics.py'
      - 'src/semantic_lookup.py'
      - 'src/synonyms.py'
      - 'src/places.py'
      - 'src/spelling.py'
      - 'src/profile_cache.py'
      - 'src/link_correlation.py'
      - 'src/scanner_backtest.py'
      - 'src/data/**'
      - 'scripts/*backtest*'
      - 'scripts/publish_scanner_snapshot.py'
      - 'scripts/materialize_filing_texts.py'
      - 'scripts/bootstrap_semantics.py'
      - 'scripts/build_semantic_resources.py'
      - 'dashboard/scanner-backtest/index.html'
      - 'excel_bot/data/finviz_with_descriptions.csv'
      - 'data/news_intake/2026-10-17/documents.json'
      - '.github/workflows/scanner-backtest-publish.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: scanner-backtest-refresh
  cancel-in-progress: false
jobs:
  filings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        include:
          - {ticker: LUV, artifact: 12109470523}
          - {ticker: SPCX, artifact: 12109515304}
          - {ticker: LLY, artifact: 12109515304}
          - {ticker: FUN, artifact: 12109470523}
          - {ticker: META, artifact: 12108763000}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        id: texts
        with:
          path: full-text-source
          key: filing-text-probe-v1-${{ matrix.artifact }}-${{ matrix.ticker }}
      - name: Read verified whole filing texts, not capped sections
        if: steps.texts.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT: ${{ matrix.artifact }}
          SOURCE_TICKER: ${{ matrix.ticker }}
        run: >-
          python scripts/materialize_filing_texts.py
          --repository "$GITHUB_REPOSITORY" --artifact-id "$SOURCE_ARTIFACT"
          --ticker "$SOURCE_TICKER" --as-of 2026-10-19 --out full-text-source
      - uses: actions/upload-artifact@v4
        with:
          name: page-filing-${{ matrix.ticker }}
          path: full-text-source/objects/
          retention-days: 7
  build:
    needs: filings
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src
            scripts
            eval
            dashboard/scanner-backtest
            excel_bot/data/finviz_with_descriptions.csv
            data/news_intake/2026-10-17/documents.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap pinned resources before offline scoring
        run: |
          python -m pip install PyYAML==6.0.3
          python -m scripts.bootstrap_semantics
      - uses: actions/download-artifact@v4
        with:
          pattern: page-filing-*
          path: filing-objects
          merge-multiple: true
      - name: Regressions must pass before replacing the public snapshot
        run: >-
          python -I -S scripts/offline_evidence_checks.py --unittest
          src.test_correlation src.test_eval_harness src.test_evidence_matcher
          src.test_scanner_backtest scripts.test_materialize_filing_texts
          scripts.test_scan_validation_batches scripts.test_export_backtest_static
          scripts.test_publish_scanner_snapshot
      - name: Score full intake through the current headline evidence engine
        env:
          SCANNER_SOURCE_SHA: ${{ github.sha }}
        run: >-
          python -I -S scripts/offline_evidence_checks.py --backtest-export
          --identity-filings filing-objects --as-of 2026-10-19
          --workers 2 --shard-size 200 --out-dir generated-scanner
      - name: Verify and retain the snapshot on main without touching other files
        env:
          SCANNER_SOURCE_SHA: ${{ github.sha }}
        run: |
          python scripts/publish_scanner_snapshot.py --directory generated-scanner --source-sha "$SCANNER_SOURCE_SHA"
          cp dashboard/scanner-backtest/index.html generated-scanner/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-test-page
          path: generated-scanner/
          retention-days: 30
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pages: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: scanner-test-page
          path: ${{ runner.temp }}/scanner-test-page
      - name: Update only the parser test page and its root alias
        env:
          SNAPSHOT_DIRECTORY: ${{ runner.temp }}/scanner-test-page
        run: |
          set -euo pipefail
          mkdir -p dashboard/scanner-backtest scanner-backtest
          for file in index.html articles.json results.jsonl profiles.json ticker-index.json meta.json; do
            cp "$SNAPSHOT_DIRECTORY/$file" "dashboard/scanner-backtest/$file"
            cp "$SNAPSHOT_DIRECTORY/$file" "scanner-backtest/$file"
          done
          git config user.name 'Scanner page publisher'
          git config user.email 'bot@users.noreply.github.com'
          git add dashboard/scanner-backtest scanner-backtest
          if ! git diff --cached --quiet; then
            git commit -m "Publish scanner test page for $GITHUB_SHA"
            git push origin HEAD:gh-pages
          fi
      - name: Request the normal GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
      - name: Verify the deployed snapshot, not just the Git commit
        env:
          SNAPSHOT_DIRECTORY: ${{ runner.temp }}/scanner-test-page
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          expected=json.loads((Path(os.environ['SNAPSHOT_DIRECTORY'])/'meta.json').read_text())['snapshot']['snapshot_id']
          url='https://sroyaltyy.github.io/fullscan/dashboard/scanner-backtest/meta.json'
          for attempt in range(36):
              try:
                  req=urllib.request.Request(url+'?snapshot='+expected,headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as response: actual=json.load(response)
                  if actual.get('snapshot',{}).get('snapshot_id')==expected:
                      print('Verified deployed scanner snapshot '+expected)
                      break
              except (OSError,ValueError): pass
              time.sleep(10)
          else: raise SystemExit('Pages did not serve the expected snapshot; publication is not verified')
          PY
