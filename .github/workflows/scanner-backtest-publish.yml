name: Refresh scanner test page
on:
  push:
    branches: [main]
    paths:
      - 'src/correlation.py'
      - 'src/evidence_matcher.py'
      - 'src/stock_evidence.py'
      - 'src/filing*.py'
      - 'src/deep_profile_store.py'
      - 'scripts/build_filing_profiles.py'
      - 'src/names.py'
      - 'src/aliases.py'
      - 'src/linguistics.py'
      - 'src/semantic_lookup.py'
      - 'src/synonyms.py'
      - 'src/places.py'
      - 'src/spelling.py'
      - 'src/profile_cache.py'
      - 'src/link_correlation.py'
      - 'src/scanner_backtest.py'
      - 'src/data/**'
      - 'scripts/*backtest*'
      - 'scripts/publish_scanner_snapshot.py'
      - 'scripts/materialize_filing_texts.py'
      - 'scripts/bootstrap_semantics.py'
      - 'scripts/build_semantic_resources.py'
      - 'dashboard/scanner-backtest/index.html'
      - 'excel_bot/data/finviz_with_descriptions.csv'
      - 'data/news_intake/2026-10-17/documents.json'
      - '.github/workflows/scanner-backtest-publish.yml'
  workflow_run:
    workflows: [Deep SEC filing profiles]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: scanner-backtest-refresh
  cancel-in-progress: true
jobs:
  source:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.profiles.outputs.ready }}
      run: ${{ steps.profiles.outputs.run }}
    steps:
      - name: Resolve the latest complete archived filing profile set
        id: profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=deep-filing-profiles-complete&per_page=50" > artifacts.json
          python - <<'PY'
          import json, os
          data = json.load(open('artifacts.json'))
          candidates = [a for a in data['artifacts'] if not a['expired'] and a.get('workflow_run', {}).get('head_branch') == 'main']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              if candidates:
                  selected = max(candidates, key=lambda a: a['created_at'])
                  stream.write('ready=true\nrun='+str(selected['workflow_run']['id'])+'\n')
              else:
                  stream.write('ready=false\n')
                  print('Keep the current page until the complete whole-archive profile set is available.')
          PY
  build:
    needs: source
    if: needs.source.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src
            scripts
            eval
            dashboard/scanner-backtest
            excel_bot/data/finviz_with_descriptions.csv
            data/news_intake/2026-10-17/documents.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap pinned resources before offline scoring
        run: |
          python -m pip install PyYAML==6.0.3
          python -m scripts.bootstrap_semantics
      - uses: actions/download-artifact@v4
        with:
          name: deep-filing-profiles-complete
          path: filing-profiles
          run-id: ${{ needs.source.outputs.run }}
          github-token: ${{ github.token }}
      - name: Require complete profiles from the current extraction source
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          index = json.loads(Path('filing-profiles/index.json').read_text())
          expected = hashlib.sha256(Path('src/filing_relationships.py').read_bytes()).hexdigest()
          assert index['complete'] and index['compiler_sha256'] == expected, 'Current parser profiles are still compiling; refusing an older set'
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('FILING_AS_OF='+index['as_of']+'\n')
          PY
      - name: Regressions must pass before replacing the public snapshot
        run: >-
          python -I -S scripts/offline_evidence_checks.py --unittest
          src.test_correlation src.test_eval_harness src.test_evidence_matcher
          src.test_scanner_backtest src.test_deep_profile_store scripts.test_materialize_filing_texts
          scripts.test_scan_validation_batches scripts.test_export_backtest_static
          scripts.test_publish_scanner_snapshot
      - name: Score full intake through the current headline evidence engine
        env:
          SCANNER_SOURCE_SHA: ${{ github.sha }}
        run: >-
          python -I -S scripts/offline_evidence_checks.py --backtest-export
          --filing-profiles filing-profiles --as-of "$FILING_AS_OF"
          --workers 1 --shard-size 200 --out-dir generated-scanner
      - name: Stage the complete page before publication
        run: cp dashboard/scanner-backtest/index.html generated-scanner/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-test-page
          path: generated-scanner/
          retention-days: 30
      - name: Verify and retain the snapshot on main without touching other files
        timeout-minutes: 20
        env:
          SCANNER_SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -u scripts/publish_scanner_snapshot.py --directory generated-scanner
          --source-sha "$SCANNER_SOURCE_SHA"
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      pages: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: scanner-test-page
          path: ${{ runner.temp }}/scanner-test-page
      - name: Update only the parser test page and its root alias
        env:
          SNAPSHOT_DIRECTORY: ${{ runner.temp }}/scanner-test-page
        run: |
          set -euo pipefail
          mkdir -p dashboard/scanner-backtest scanner-backtest
          cp -a "$SNAPSHOT_DIRECTORY/." dashboard/scanner-backtest/
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=../dashboard/scanner-backtest/"><a href="../dashboard/scanner-backtest/">Open the SEC parser test page</a>' > scanner-backtest/index.html
          git config user.name 'Scanner page publisher'
          git config user.email 'bot@users.noreply.github.com'
          git add dashboard/scanner-backtest scanner-backtest
          if ! git diff --cached --quiet; then
            git commit -m "Publish scanner test page for $GITHUB_SHA"
            git push origin HEAD:gh-pages
          fi
      - name: Request the normal GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
      - name: Verify the deployed snapshot, not just the Git commit
        env:
          SNAPSHOT_DIRECTORY: ${{ runner.temp }}/scanner-test-page
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          expected=json.loads((Path(os.environ['SNAPSHOT_DIRECTORY'])/'meta.json').read_text())['snapshot']['snapshot_id']
          url='https://sroyaltyy.github.io/fullscan/dashboard/scanner-backtest/meta.json'
          for attempt in range(36):
              try:
                  req=urllib.request.Request(url+'?snapshot='+expected,headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as response: actual=json.load(response)
                  if actual.get('snapshot',{}).get('snapshot_id')==expected:
                      print('Verified deployed scanner snapshot '+expected)
                      break
              except (OSError,ValueError): pass
              time.sleep(10)
          else: raise SystemExit('Pages did not serve the expected snapshot; publication is not verified')
          PY

