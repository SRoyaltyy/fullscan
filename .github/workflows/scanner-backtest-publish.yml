name: Refresh scanner test page
on:
  push:
    branches: [main]
    paths:
      - 'src/correlation.py'
      - 'src/evidence_matcher.py'
      - 'src/stock_evidence.py'
      - 'src/stock_keywords.py'
      - 'src/stock_keyword_store.py'
      - 'src/entity_resolution.py'
      - 'src/term_inventory.py'
      - 'src/relationship_frames.py'
      - 'src/stock_evidence_graph.py'
      - 'src/stock_document_context.py'
      - 'src/specific_filing_records.py'
      - 'scripts/annotate_article_entities.py'
      - 'scripts/publish_filing_objects.py'
      - 'src/filing*.py'
      - 'src/deep_profile_store.py'
      - 'src/completed_profile_store.py'
      - 'scripts/materialize_completed_profiles.py'
      - 'scripts/select_parser_profiles.py'
      - 'scripts/build_filing_profiles.py'
      - 'src/names.py'
      - 'src/aliases.py'
      - 'src/linguistics.py'
      - 'src/semantic_lookup.py'
      - 'src/synonyms.py'
      - 'src/places.py'
      - 'src/spelling.py'
      - 'src/profile_cache.py'
      - 'src/link_correlation.py'
      - 'src/scanner_backtest.py'
      - 'src/data/**'
      - 'scripts/*backtest*'
      - 'scripts/publish_scanner_snapshot.py'
      - 'scripts/materialize_filing_texts.py'
      - 'scripts/bootstrap_semantics.py'
      - 'scripts/build_semantic_resources.py'
      - 'dashboard/scanner-backtest/index.html'
      - 'excel_bot/data/finviz_with_descriptions.csv'
      - 'data/news_intake/2026-10-17/documents.json'
      - '.github/workflows/scanner-backtest-publish.yml'
  workflow_run:
    workflows: [Deep SEC filing profiles, Recover deep SEC filing profiles, Publish existing completed stock parser]
    types: [completed]
  workflow_dispatch:
    inputs:
      allow_development_sample:
        description: Explicitly publish a one-issuer development sample
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: scanner-backtest-refresh-${{ github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion != 'success' || github.event.workflow_run.head_branch != 'main' || github.event.workflow_run.event == 'pull_request') && github.run_id || 'main' }}
  cancel-in-progress: true
jobs:
  source:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      ready: ${{ steps.profiles.outputs.ready }}
      run: ${{ steps.profiles.outputs.run }}
      artifact: ${{ steps.profiles.outputs.artifact }}
      scope: ${{ steps.profiles.outputs.scope }}
      profile_assets: ${{ steps.profiles.outputs.profile_assets }}
      input_kind: ${{ steps.profiles.outputs.input_kind }}
      manifest_url: ${{ steps.profiles.outputs.manifest_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            scripts
            requirements-filing-parser.txt
      - name: Resolve the latest complete archived filing profile set
        id: profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=deep-filing-profiles-complete&per_page=50" > artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=deep-filing-real-source-check&per_page=50" > samples.json
          pages_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/gh-pages" --jq '.object.sha')
          if ! gh api "repos/$GITHUB_REPOSITORY/contents/dashboard/scanner-backtest/completed/manifest.json?ref=$pages_sha" --jq '.content' | base64 --decode > completed.json; then
            printf '{}\n' > completed.json
          fi
          args=()
          if [ '${{ inputs.allow_development_sample }}' = 'true' ]; then args+=(--allow-development-sample); fi
          python -m scripts.select_parser_profiles --repository "$GITHUB_REPOSITORY" --full artifacts.json --samples samples.json --completed completed.json --manifest-url "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$pages_sha/dashboard/scanner-backtest/completed/manifest.json" "${args[@]}"
  build:
    needs: source
    if: needs.source.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      commit: ${{ steps.retain.outputs.commit }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src
            scripts
            eval
            requirements-filing-parser.txt
            dashboard/scanner-backtest
            excel_bot/data/finviz_with_descriptions.csv
            data/news_intake/2026-10-17/documents.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap pinned resources before offline scoring
        run: |
          python -m pip install PyYAML==6.0.3
          python -m scripts.bootstrap_semantics
      - name: Require cumulative and fresh-issuer methodology validation
        run: python -m scripts.check_scanner_methodology --out cumulative-validation.json --require-pass
      - uses: actions/download-artifact@v4
        if: needs.source.outputs.input_kind == 'grammar_archive'
        with:
          name: ${{ needs.source.outputs.artifact }}
          path: filing-profiles
          run-id: ${{ needs.source.outputs.run }}
          github-token: ${{ github.token }}
      - name: Reuse the complete archived universe with the current disclosure methodology
        if: needs.source.outputs.input_kind == 'completed_review'
        run: >-
          python -u -m scripts.materialize_completed_profiles
          --manifest-url "${{ needs.source.outputs.manifest_url }}" --out filing-profiles
      - name: Require complete profiles from the current extraction source
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          index = json.loads(Path('filing-profiles/index.json').read_text())
          from src.deep_profile_store import read_index
          _, index, _ = read_index('filing-profiles')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('FILING_AS_OF='+index['as_of']+'\n')
              stream.write('PROFILE_PUBLIC_BASE_URL='+index.get('asset_base_url','')+'\n')
          PY
      - name: Check optional durable archive storage without exposing credentials
        if: needs.source.outputs.input_kind == 'grammar_archive'
        id: storage
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL || vars.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          python -m scripts.publish_filing_objects --preflight
          if [ -n "$R2_ENDPOINT_URL" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_BUCKET" ] && [ -n "$R2_PUBLIC_BASE_URL" ]; then
            python -m pip install boto3==1.35.99
            python -m scripts.publish_filing_objects --directory filing-profiles
          else
            echo 'Full graphs remain in the GitHub archive; publishing complete compact keywords and evidence to Pages.'
          fi
      - name: Regressions must pass before replacing the public snapshot
        run: >-
          python -I -S scripts/offline_evidence_checks.py --unittest
          src.test_correlation src.test_eval_harness src.test_evidence_matcher
          src.test_scanner_backtest src.test_deep_profile_store scripts.test_materialize_filing_texts
          src.test_stock_keywords scripts.test_publish_filing_objects
          src.test_entity_resolution
          scripts.test_scan_validation_batches scripts.test_export_backtest_static
          scripts.test_publish_scanner_snapshot
          scripts.test_select_parser_profiles
          scripts.test_materialize_completed_profiles src.test_completed_profile_store
      - name: Parse the exact article headlines with the pinned grammar engine
        run: |
          python -m pip install --only-binary=:all: --index-url https://pypi.org/simple -r requirements-filing-parser.txt
          python -m scripts.annotate_article_entities --news data/news_intake/2026-10-17/documents.json --out article-entities.json
      - name: Score full intake through the current headline evidence engine
        env:
          SCANNER_SOURCE_SHA: ${{ github.sha }}
        run: >-
          python -I -S scripts/offline_evidence_checks.py --backtest-export
          --filing-profiles filing-profiles --as-of "$FILING_AS_OF"
          --article-entities article-entities.json --keyword-comparisons browser_preview
          --profile-assets "${{ needs.source.outputs.profile_assets }}"
          --dataset-scope "${{ needs.source.outputs.scope }}"
          --profile-archive-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/${{ needs.source.outputs.run }}"
          --profile-base-url "${PROFILE_PUBLIC_BASE_URL:-}"
          --workers 1 --shard-size 200 --out-dir generated-scanner
      - name: Check the complete snapshot budget before touching the public page
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.publish_scanner_snapshot import validate_budget
          print('Compact snapshot bytes:',validate_budget(Path('generated-scanner')))
          PY
      - name: Stage the complete page before publication
        run: |
          cp dashboard/scanner-backtest/index.html generated-scanner/index.html
          cp scripts/publish_scanner_snapshot.py generated-scanner/publication-helper.py
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-test-page
          path: generated-scanner/
          retention-days: 30
      - name: Verify and retain the snapshot on main without touching other files
        id: retain
        timeout-minutes: 360
        env:
          SCANNER_SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u scripts/publish_scanner_snapshot.py --directory generated-scanner --source-sha "$SCANNER_SOURCE_SHA" > publication-result.json
          python - <<'PY'
          import json,os
          result=json.load(open('publication-result.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('commit='+result['published_commit']+'\n')
          print('Retained scanner snapshot '+result['published_commit'])
          PY
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
      pages: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: scanner-test-page
          path: ${{ runner.temp }}/scanner-test-page
      - name: Update only the parser test page and its root alias
        env:
          SNAPSHOT_DIRECTORY: ${{ runner.temp }}/scanner-test-page
          SNAPSHOT_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p dashboard/scanner-backtest scanner-backtest
          git rm -r --ignore-unmatch dashboard/scanner-backtest/scoring-profiles dashboard/scanner-backtest/filing-profiles dashboard/scanner-backtest/keyword-index
          python - <<'PY'
          from pathlib import Path
          import os,runpy
          source=Path(os.environ['SNAPSHOT_DIRECTORY'])
          outside=sum(p.stat().st_size for p in Path('.').rglob('*') if p.is_file()
              and '.git' not in p.parts and not p.is_relative_to(Path('dashboard/scanner-backtest'))
              and not p.is_relative_to(Path('scanner-backtest')))
          stage=runpy.run_path(str(source/'publication-helper.py'))['stage_page']
          print(stage(source,Path('dashboard/scanner-backtest'),snapshot_commit=os.environ['SNAPSHOT_COMMIT'],outside_bytes=outside))
          PY
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=../dashboard/scanner-backtest/"><a href="../dashboard/scanner-backtest/">Open the SEC parser test page</a>' > scanner-backtest/index.html
          git config user.name 'Scanner page publisher'
          git config user.email 'bot@users.noreply.github.com'
          git add dashboard/scanner-backtest scanner-backtest
          if ! git diff --cached --quiet; then
            git commit -m "Publish scanner test page for $GITHUB_SHA"
            git push origin HEAD:gh-pages
          fi
      - name: Request the normal GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
      - name: Verify the deployed snapshot, not just the Git commit
        env:
          SNAPSHOT_DIRECTORY: ${{ runner.temp }}/scanner-test-page
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          expected=json.loads((Path(os.environ['SNAPSHOT_DIRECTORY'])/'meta.json').read_text())['snapshot']['snapshot_id']
          url='https://sroyaltyy.github.io/fullscan/dashboard/scanner-backtest/meta.json'
          for attempt in range(36):
              try:
                  req=urllib.request.Request(url+'?snapshot='+expected,headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as response: actual=json.load(response)
                  if actual.get('snapshot',{}).get('snapshot_id')==expected:
                      print('Verified deployed scanner snapshot '+expected)
                      break
              except (OSError,ValueError): pass
              time.sleep(10)
          else: raise SystemExit('Pages did not serve the expected snapshot; publication is not verified')
          PY


