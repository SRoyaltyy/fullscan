          - "Utilities - Renewable"
          - "Waste Management"
      as_of:
        description: "As-of date as YYYY-MM-DD only (e.g. 2026-06-01). Required for backtest."
        required: false
        default: ""
      lookback_days:
        description: "Predict only — days of news before as-of"
        required: false
        default: "7"
      horizon_days:
        description: "Backtest only — sessions after as-of"
        required: false
        default: "5"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pyarrow psycopg2-binary
      - name: Predict
        if: ${{ inputs.mode == 'predict' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -e
          AS_OF="${{ inputs.as_of }}"
          # GitHub UI sometimes mangles 2026-06-01 → 2026+06-01
          AS_OF="${AS_OF//+/-}"
          ARGS=(--industry "${{ inputs.industry }}" --lookback-days "${{ inputs.lookback_days }}")
          if [ -n "$AS_OF" ]; then
            ARGS+=(--as-of "$AS_OF")
          fi
          echo "as_of=$AS_OF"
          python -m src.industry_predict "${ARGS[@]}"
      - name: Backtest only
        if: ${{ inputs.mode == 'backtest' }}
        run: |
          set -e
          AS_OF="${{ inputs.as_of }}"
          AS_OF="${AS_OF//+/-}"
          if [ -z "$AS_OF" ]; then
            echo "backtest requires as_of (YYYY-MM-DD)"
            exit 1
          fi
          echo "as_of=$AS_OF"
          python -m src.industry_backtest --industry "${{ inputs.industry }}" --as-of "$AS_OF" --horizon-days "${{ inputs.horizon_days }}"
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: industry-run
          path: 01_daily/industry/
          if-no-files-found: warn
      - name: Commit reports
        if: always()
        run: |
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add -f 01_daily/industry/ || true
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "chore: industry ${{ inputs.mode }} ${{ inputs.industry }}"
            git push origin HEAD:main || true
          fi
