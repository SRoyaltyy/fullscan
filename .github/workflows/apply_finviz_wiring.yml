name: Apply Finviz wiring (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch industry_predict.py (prefer Daily Digest)
        run: |
          python3 << 'PY'
          from pathlib import Path
          import textwrap
          p = Path("src/industry_predict.py")
          src = p.read_text()
          old = textwrap.dedent('''
          def _finviz_news_for_industry(industry: str, as_of: str | None) -> list[dict]:
              m = members(industry, as_of)
              if m.empty:
                  return []
              rows = []
              for _, r in m.iterrows():
                  title = r.get("News Title")
                  if title is None or (isinstance(title, float) and np.isnan(title)):
                      continue
                  title = str(title).strip()
                  if not title or title.lower() in ("nan", "none"):
                      continue
                  rows.append({
                      "source": f"finviz_export:{r.get('_export', '')}",
                      "title": title,
                      "url": str(r.get("News URL") or "") if pd.notna(r.get("News URL")) else "",
                      "published_at": str(r.get("News Time") or "") if pd.notna(r.get("News Time")) else "",
                      "origin": "finviz_export",
                      "ticker": r["Ticker"],
                  })
              return rows
          ''').strip()
          new = textwrap.dedent('''
          def _finviz_news_for_industry(industry: str, as_of: str | None) -> list[dict]:
              """Prefer Daily Digest (AI catalyst summary) over raw News Title."""
              m = members(industry, as_of)
              if m.empty:
                  return []
              rows = []
              for _, r in m.iterrows():
                  digest = r.get("Daily Digest")
                  title = r.get("News Title")
                  text = None
                  origin_field = "news_title"
                  if digest is not None and not (isinstance(digest, float) and np.isnan(digest)):
                      d = str(digest).strip()
                      if d and d.lower() not in ("nan", "none"):
                          text = d
                          origin_field = "daily_digest"
                  if text is None:
                      if title is None or (isinstance(title, float) and np.isnan(title)):
                          continue
                      text = str(title).strip()
                      if not text or text.lower() in ("nan", "none"):
                          continue
                  rows.append({
                      "source": f"finviz_export:{r.get('_export', '')}",
                      "title": text,
                      "url": str(r.get("News URL") or "") if pd.notna(r.get("News URL")) else "",
                      "published_at": str(r.get("News Time") or "") if pd.notna(r.get("News Time")) else "",
                      "origin": "finviz_export",
                      "origin_field": origin_field,
                      "ticker": r["Ticker"],
                  })
              return rows
          ''').strip()
          if old not in src:
              idx = src.find("_finviz_news_for_industry")
              print("EXACT old block not found")
              print(repr(src[idx:idx+500]))
              raise SystemExit("patch target not found")
          p.write_text(src.replace(old, new, 1))
          print("industry_predict.py patched")
          PY
      - name: Patch run_news_judge.py (inject Finviz digest)
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/run_news_judge.py")
          src = p.read_text()

          old_imp = "from . import config, deepseek_client, memory"
          new_imp = (
              "from . import config, deepseek_client, memory\n"
              "try:\n"
              "    from .finviz_digest import inject_block as finviz_digest_block\n"
              "except Exception:  # module may not exist on very old checkouts\n"
              "    def finviz_digest_block(*_a, **_k):\n"
              "        return \"\""
          )
          if "finviz_digest_block" not in src:
              if old_imp not in src:
                  raise SystemExit("import not found")
              src = src.replace(old_imp, new_imp, 1)
              print("import added")
          else:
              print("import already present")

          if "fv_section" not in src:
              old_ret = (
                  '    return (\n'
                  '        f"TODAY: {date_str}\\n\\n"\n'
                  '        f"=== MECHANICAL PARSE SUMMARY ===\\n"'
              )
              new_ret = (
                  '    fv = finviz_digest_block(date_str) or finviz_digest_block()\n'
                  '    fv_section = f"{fv}\\n" if fv else ""\n'
                  '\n'
                  '    return (\n'
                  '        f"TODAY: {date_str}\\n\\n"\n'
                  '        f"{fv_section}"\n'
                  '        f"=== MECHANICAL PARSE SUMMARY ===\\n"'
              )
              if old_ret not in src:
                  idx = src.find("TODAY: {date_str}")
                  print("nearby:", repr(src[max(0,idx-80):idx+150]))
                  raise SystemExit("return block not found")
              src = src.replace(old_ret, new_ret, 1)
              print("fv_section injected")
          else:
              print("fv_section already present")

          if "FINVIZ DAILY DIGEST is present" not in src:
              old_exec = (
                  '        "Execute the judge. Rank IMPORTANT NEWS first, then framework-score,\\n"\n'
                  '        "then reclassify audit, then B1_INJECT. End with NEWS_PARSE_BEGIN block."\n'
                  '    )'
              )
              new_exec = (
                  '        "Execute the judge. Rank IMPORTANT NEWS first, then framework-score,\\n"\n'
                  '        "then reclassify audit, then B1_INJECT. End with NEWS_PARSE_BEGIN block.\\n"\n'
                  '        "When FINVIZ DAILY DIGEST is present, treat its index narratives and\\n"\n'
                  '        "high-signal ticker digests as elevated, pre-validated themes — prefer\\n"\n'
                  '        "them over raw mechanical headlines when they conflict or when the\\n"\n'
                  '        "mechanical set is thin."\n'
                  '    )'
              )
              if old_exec not in src:
                  raise SystemExit("exec instruction not found")
              src = src.replace(old_exec, new_exec, 1)
              print("instruction updated")
          else:
              print("instruction already present")

          p.write_text(src)
          print("run_news_judge.py patched")
          PY
      - name: Verify
        run: |
          python3 -m py_compile src/industry_predict.py src/run_news_judge.py src/finviz_digest.py src/run_predict.py
          grep -n "Daily Digest\|origin_field\|finviz_digest\|fv_section\|FINVIZ DAILY" src/industry_predict.py src/run_news_judge.py src/run_predict.py | head -40
      - name: Commit
        run: |
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add src/industry_predict.py src/run_news_judge.py
          git status
          git commit -m "feat: wire Finviz Daily Digest into news_judge + industry_predict" || echo "No changes"
          git pull --rebase origin main || true
          git push origin main
