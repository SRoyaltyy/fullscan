name: AB Full Scan (all-in-one)

# ticker blank → full universe; ticker set → fast single-name path via src.ab_one
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Optional single ticker (e.g. AAPL). Blank = full liquid universe"
        required: false
        default: ""
      date:
        description: "As-of YYYY-MM-DD (blank = latest export / today ET)"
        required: false
        default: ""
      color_top:
        description: "Top N for quote colors (full mode only)"
        required: false
        default: "80"
      form4_top:
        description: "Top N Form4 refresh (full mode); 0=skip"
        required: false
        default: "40"
      form4_months:
        description: "Form4 lookback months"
        required: false
        default: "18"
      skip_form4_fetch:
        description: "Skip Form4 fetch (full mode)"
        type: boolean
        default: false
      skip_colors:
        description: "Skip quote colors (full mode)"
        type: boolean
        default: false
  schedule:
    # After AB Full Market's 360-min window (22:30–04:30 UTC).
    # Tue–Sat 05:00 UTC = 01:00 ET after each Mon–Fri session.
    # Do not share 22:30 UTC with ab_full_market or hit_board (git race on main).
    - cron: "0 5 * * 2-6"

permissions:
  contents: write

concurrency:
  group: ab-full-scan
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install beautifulsoup4 lxml edgartools pyarrow

      - name: Resolve as-of + ticker
        id: meta
        run: |
          set -euo pipefail
          D="${{ inputs.date }}"
          D="${D//+/-}"
          if [ -z "$D" ]; then
            LATEST=$(ls -1 data/exports/finviz_????-??-??.csv 2>/dev/null | sort | tail -1 || true)
            if [ -n "$LATEST" ]; then
              D=$(basename "$LATEST" | sed 's/finviz_//;s/.csv//')
            else
              D=$(TZ=America/New_York date +%F)
            fi
          fi
          T="${{ inputs.ticker }}"
          T=$(echo "$T" | tr '[:lower:]' '[:upper:]' | tr -d ' ')
          echo "asof=$D" >> "$GITHUB_OUTPUT"
          echo "ticker=$T" >> "$GITHUB_OUTPUT"
          echo "Using asof=$D ticker=${T:-ALL}"

      # ── FAST PATH: one ticker ───────────────────────────────────
      - name: Single-ticker path (ab_one)
        if: ${{ steps.meta.outputs.ticker != '' }}
        env:
          FINVIZ_AUTH: ${{ secrets.FINVIZ_AUTH }}
          AUTH_TOKEN_FINVIZ: ${{ secrets.AUTH_TOKEN_FINVIZ }}
          SEC_IDENTITY: ${{ secrets.SEC_IDENTITY }}
          EDGAR_IDENTITY: ${{ secrets.EDGAR_IDENTITY }}
        run: |
          set -euo pipefail
          ASOF="${{ steps.meta.outputs.asof }}"
          T="${{ steps.meta.outputs.ticker }}"
          MONTHS="${{ inputs.form4_months }}"
          MONTHS="${MONTHS:-18}"
          ARGS=("$T" --date "$ASOF" --merge --with-colors --with-form4 --months "$MONTHS")
          if [ "${{ inputs.skip_colors }}" = "true" ]; then
            ARGS=("$T" --date "$ASOF" --merge)
            if [ "${{ inputs.skip_form4_fetch }}" != "true" ]; then
              ARGS+=(--with-form4 --months "$MONTHS")
            fi
          elif [ "${{ inputs.skip_form4_fetch }}" = "true" ]; then
            ARGS=("$T" --date "$ASOF" --merge --with-colors)
          fi
          echo "CMD: python -m src.ab_one ${ARGS[*]}"
          python -m src.ab_one "${ARGS[@]}"

      # ── FULL PATH ───────────────────────────────────────────────
      - name: 1) Part A + B1 checklist (universe)
        if: ${{ steps.meta.outputs.ticker == '' }}
        run: |
          set -euo pipefail
          ASOF="${{ steps.meta.outputs.asof }}"
          echo "=== ab_checklist --date $ASOF ==="
          python -m src.ab_checklist --date "$ASOF" --top 20
          ls -la "data/ab_checklist/${ASOF}_ab_checklist.csv"

      - name: 2) Quote colors (universe top)
        if: ${{ steps.meta.outputs.ticker == '' && (github.event_name == 'schedule' || inputs.skip_colors == false) }}
        env:
          FINVIZ_AUTH: ${{ secrets.FINVIZ_AUTH }}
          AUTH_TOKEN_FINVIZ: ${{ secrets.AUTH_TOKEN_FINVIZ }}
        run: |
          set -euo pipefail
          ASOF="${{ steps.meta.outputs.asof }}"
          TOP="${{ inputs.color_top }}"
          TOP="${TOP:-80}"
          python -m src.quote_colors --from-ab --top "$TOP" --date "$ASOF"

      - name: 3) Form4 (universe top)
        if: ${{ steps.meta.outputs.ticker == '' && (github.event_name == 'schedule' || inputs.skip_form4_fetch == false) }}
        env:
          SEC_IDENTITY: ${{ secrets.SEC_IDENTITY }}
          EDGAR_IDENTITY: ${{ secrets.EDGAR_IDENTITY }}
        run: |
          set -euo pipefail
          ASOF="${{ steps.meta.outputs.asof }}"
          N="${{ inputs.form4_top }}"
          N="${N:-40}"
          MONTHS="${{ inputs.form4_months }}"
          MONTHS="${MONTHS:-18}"
          if [ "$N" = "0" ]; then echo skip; exit 0; fi
          CSV="data/ab_checklist/${ASOF}_ab_checklist.csv"
          TICKERS=$(python -c "import pandas as pd; df=pd.read_csv(r'$CSV'); df=df.sort_values('score', ascending=False); print(','.join(df['Ticker'].astype(str).str.upper().head(int('$N')).tolist()))")
          python -m src.insider_history --tickers "$TICKERS" --months "$MONTHS" --resume

      - name: 4) Merge (universe)
        if: ${{ steps.meta.outputs.ticker == '' }}
        run: |
          set -euo pipefail
          ASOF="${{ steps.meta.outputs.asof }}"
          python -m src.ab_merge_extras --date "$ASOF"
          head -12 "data/ab_checklist/${ASOF}_ab_checklist_merged.md" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-full-scan-${{ steps.meta.outputs.asof }}
          path: |
            data/ab_checklist/
            data/quote_colors/
            data/insider/history/
          if-no-files-found: warn

      - name: Commit
        if: always()
        run: |
          set -euo pipefail
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/ab_checklist/ data/quote_colors/ data/insider/history/ || true
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          T="${{ steps.meta.outputs.ticker }}"
          MSG="chore: AB full scan ${{ steps.meta.outputs.asof }}"
          [ -n "$T" ] && MSG="$MSG ($T only)"
          git commit -m "$MSG"
          git pull --rebase origin main || true
          git push origin HEAD:main
