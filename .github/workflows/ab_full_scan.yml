name: AB Full Scan (all-in-one)

# One button: Part A/B1 checklist → quote colors → Form4 insider → merge
# Set `ticker` to run a single name only (fast smoke check).
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Optional single ticker (e.g. AAPL). Blank = full liquid universe"
        required: false
        default: ""
      date:
        description: "As-of YYYY-MM-DD (blank = latest export / today ET)"
        required: false
        default: ""
      color_top:
        description: "How many top ab_checklist names get quote-page colors (ignored if ticker set)"
        required: false
        default: "80"
      form4_top:
        description: "How many top names get Form4 refresh; 0=skip fetch (ignored if ticker set)"
        required: false
        default: "40"
      form4_months:
        description: "Form4 lookback months when refreshing"
        required: false
        default: "18"
      skip_form4_fetch:
        description: "Skip Form4 network fetch (use existing monthly_panel only)"
        type: boolean
        default: false
      skip_colors:
        description: "Skip Finviz quote color scrape"
        type: boolean
        default: false
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install beautifulsoup4 lxml edgartools pyarrow

      - name: Resolve as-of date + ticker
        id: meta
        run: |
          set -euo pipefail
          D="${{ inputs.date }}"
          D="${D//+/-}"
          if [ -z "$D" ]; then
            LATEST=$(ls -1 data/exports/finviz_????-??-??.csv 2>/dev/null | sort | tail -1 || true)
            if [ -n "$LATEST" ]; then
              D=$(basename "$LATEST" | sed 's/finviz_//;s/.csv//')
            else
              D=$(TZ=America/New_York date +%F)
            fi
          fi
          T="${{ inputs.ticker }}"
          T=$(echo "$T" | tr '[:lower:]' '[:upper:]' | tr -d ' ')
          echo "asof=$D" >> "$GITHUB_OUTPUT"
          echo "ticker=$T" >> "$GITHUB_OUTPUT"
          echo "Using asof=$D ticker=${T:-ALL}"

      - name: 1) Part A + B1 checklist
        run: |
          set -euo pipefail
          ASOF="${{ steps.meta.outputs.asof }}"
          T="${{ steps.meta.outputs.ticker }}"
          ARGS=(--date "$ASOF" --top 20)
          if [ -n "$T" ]; then
            ARGS+=(--ticker "$T")
            echo "=== SINGLE TICKER MODE: $T ==="
          fi
          echo "=== ab_checklist ${ARGS[*]} ==="
          python -m src.ab_checklist "${ARGS[@]}"
          ls -la "data/ab_checklist/${ASOF}_ab_checklist.csv"

      - name: 2) Quote snapshot colors
        if: ${{ github.event_name == 'schedule' || inputs.skip_colors == false }}
        env:
          FINVIZ_AUTH: ${{ secrets.FINVIZ_AUTH }}
          AUTH_TOKEN_FINVIZ: ${{ secrets.AUTH_TOKEN_FINVIZ }}
        run: |
          set -euo pipefail
          ASOF="${{ steps.meta.outputs.asof }}"
          T="${{ steps.meta.outputs.ticker }}"
          if [ -n "$T" ]; then
            echo "=== quote_colors --tickers $T --date $ASOF ==="
            python -m src.quote_colors --tickers "$T" --date "$ASOF"
          else
            TOP="${{ inputs.color_top }}"
            TOP="${TOP:-80}"
            echo "=== quote_colors --from-ab --top $TOP --date $ASOF ==="
            python -m src.quote_colors --from-ab --top "$TOP" --date "$ASOF"
          fi
          ls -la "data/quote_colors/${ASOF}_quote_colors.csv" || ls -la data/quote_colors/ | tail

      - name: 3) Form4 insider history
        if: ${{ github.event_name == 'schedule' || inputs.skip_form4_fetch == false }}
        env:
          SEC_IDENTITY: ${{ secrets.SEC_IDENTITY }}
          EDGAR_IDENTITY: ${{ secrets.EDGAR_IDENTITY }}
        run: |
          set -euo pipefail
          ASOF="${{ steps.meta.outputs.asof }}"
          T="${{ steps.meta.outputs.ticker }}"
          MONTHS="${{ inputs.form4_months }}"
          MONTHS="${MONTHS:-18}"
          if [ -n "$T" ]; then
            echo "=== insider_history --tickers $T --months $MONTHS ==="
            python -m src.insider_history --tickers "$T" --months "$MONTHS" --resume
            exit 0
          fi
          N="${{ inputs.form4_top }}"
          N="${N:-40}"
          if [ "$N" = "0" ]; then
            echo "form4_top=0 → skip fetch"
            exit 0
          fi
          CSV="data/ab_checklist/${ASOF}_ab_checklist.csv"
          if [ ! -f "$CSV" ]; then
            echo "Missing $CSV"
            exit 1
          fi
          TICKERS=$(python -c "import pandas as pd; df=pd.read_csv(r'$CSV'); df=df.sort_values('score', ascending=False); print(','.join(df['Ticker'].astype(str).str.upper().head(int('$N')).tolist()))")
          echo "=== insider_history --tickers ($N) --months $MONTHS --resume ==="
          echo "tickers=$TICKERS"
          python -m src.insider_history --tickers "$TICKERS" --months "$MONTHS" --resume
          ls -la data/insider/history/ | tail

      - name: 4) Merge B15 Form4 + B16 colors + B19 analyst
        run: |
          set -euo pipefail
          ASOF="${{ steps.meta.outputs.asof }}"
          T="${{ steps.meta.outputs.ticker }}"
          echo "=== ab_merge_extras --date $ASOF ==="
          python -m src.ab_merge_extras --date "$ASOF"
          ls -la "data/ab_checklist/${ASOF}_ab_checklist_merged.csv"
          if [ -n "$T" ]; then
            echo "-------- single ticker $T --------"
            python -c "import pandas as pd; df=pd.read_csv('data/ab_checklist/${ASOF}_ab_checklist_merged.csv'); r=df[df['Ticker'].str.upper()=='$T']; print(r.T.to_string() if len(r) else 'NOT FOUND')"
          else
            head -12 "data/ab_checklist/${ASOF}_ab_checklist_merged.md" || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-full-scan-${{ steps.meta.outputs.asof }}
          path: |
            data/ab_checklist/
            data/quote_colors/
            data/insider/history/
          if-no-files-found: warn

      - name: Commit all outputs
        if: always()
        run: |
          set -euo pipefail
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/ab_checklist/ data/quote_colors/ data/insider/history/ || true
          git status
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          T="${{ steps.meta.outputs.ticker }}"
          MSG="chore: AB full scan ${{ steps.meta.outputs.asof }}"
          [ -n "$T" ] && MSG="$MSG ($T only)"
          git commit -m "$MSG"
          git pull --rebase origin main || true
          git push origin HEAD:main
