name: Install persistent paper opening clock
on:
  push:
    branches: [main]
    paths:
      - scripts/install_paper_open.sh
      - scripts/check_paper_clock.sh
      - scripts/systemd/fullscan-paper-open.service
      - scripts/systemd/fullscan-paper-open.timer
      - src/paper_open.py
      - src/webull_exec.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: install-paper-open
  cancel-in-progress: false
jobs:
  install:
    runs-on: [self-hosted, ecs]
    defaults:
      run:
        working-directory: .ecs-sparse/paper-open
    timeout-minutes: 20
    steps:
      - name: Clear stale git index.lock (shared ECS workspace)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          # A job killed mid-checkout leaves .git/index.lock; the next checkout then hangs.
          # One ECS runner, so a lock older than 1 minute before checkout is stale.
          W="${GITHUB_WORKSPACE:-.}"
          for L in "$W/.git/index.lock" "$W/.git/shallow.lock" "$W/.git/HEAD.lock"; do
            if [ -n "$(find "$L" -mmin +1 2>/dev/null)" ]; then echo "removing stale $L"; rm -f "$L" || sudo -n rm -f "$L" || true; fi
          done
          if [ "$(git -C "$W" config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::shared ECS workspace is sparse; this checkout re-materializes the full tree"
          fi
      - uses: actions/checkout@v4
        with:
          # Own sub-path: the sparse set never touches the shared full-tree
          # ECS workspace (a sparse workspace makes the next full checkout
          # re-materialize the whole tree; 2026-10-16 10-min hang).
          path: .ecs-sparse/paper-open
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            src
            scripts
            .github
            00_grounding
      - name: Provision dedicated sandbox environment without printing credentials
        env:
          WEBULL_APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
          WEBULL_ACCOUNT_ID: ${{ secrets.WEBULL_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          TMP_ENV=$(mktemp)
          trap 'rm -f "$TMP_ENV"' EXIT
          python3 - "$TMP_ENV" <<'PY'
          import json, os, sys
          keys = ('WEBULL_APP_KEY', 'WEBULL_APP_SECRET', 'WEBULL_ACCOUNT_ID')
          if not all(os.environ.get(k) for k in keys[:2]):
              raise SystemExit('Missing sandbox credentials')
          with open(sys.argv[1], 'w') as f:
              for key in keys:
                  if os.environ.get(key):
                      f.write(key + '=' + json.dumps(os.environ[key]) + '\n')
          PY
          sudo -n install -o gha -g gha -m 0600 "$TMP_ENV" /home/gha/.fullscan-paper.env
          sudo -n bash scripts/install_paper_open.sh
      - name: Verify broker connection before switching automatic ownership
        run: |
          sudo -n -u gha /home/gha/fullscan-paper-open/.venv/bin/python - <<'PY'
          import sys
          sys.path.insert(0, '/home/gha/fullscan-paper-open')
          from src.webull_exec import PaperAPI, discover_and_persist_account_id
          # Keys alone are enough. An empty WEBULL_ACCOUNT_ID secret is
          # discovered from the sandbox account list and written into the
          # env file. The id and the secrets are not printed.
          try:
              status = discover_and_persist_account_id('/home/gha/.fullscan-paper.env')
          except RuntimeError as exc:
              raise SystemExit(str(exc))
          api = PaperAPI('paper')
          if not api.connect():
              raise SystemExit(api.err or 'not connected')
          snap = api.snapshot()
          if not snap.connected:
              raise SystemExit(snap.error or 'not connected')
          if snap.cash <= 0:
              raise SystemExit('Sandbox has no spendable cash; fund/reset the paper account before activation')
          print('Sandbox preflight passed; account id ' + status + '; spendable cash is positive. No orders submitted.')
          PY
      - name: Keep Actions as automatic owner (ECS timer must skip)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rec = json.loads(Path('00_grounding/paper_open_owner.json').read_text())
          if rec.get('owner') != 'actions':
              raise SystemExit('owner must remain actions; ECS --owner ecs must no-op via owner_enabled')
          print('owner=actions; ECS timer stays installed but skips automatic send')
          PY
