name: Verify live stock parser comparison
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-stock-parser.yml'
      - 'scripts/verify_live_stock_parser.mjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: live-stock-parser-verification
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/verify_live_stock_parser.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise authenticated Enter through the actual served page
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_UI_REVISION: 8fe3100e327ffeaeed899a7056bb0e5d428f2b5a
        run: node scripts/verify_live_stock_parser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-stock-parser-browser-verification
          path: artifacts/
          retention-days: 30
