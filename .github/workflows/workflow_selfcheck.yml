name: Workflow self-check

# Never-again for #242: over-escaped fromJSON('[\"self-hosted\",\"ecs\"]')
# is invalid JSON, so runner=ecs never spawned the predictive preopen job.
# This job parses workflow YAML locally. No Actions API. No secrets.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "src/test_workflow_fromjson.py"
      - "src/test_lane_news_scan.py"
      - "src/test_openclaw_models.py"
      - "src/openclaw_models.py"
      - "src/lane_route.py"
      - "src/lane_news_scan.py"
      - "src/test_jev_gate.py"
      - "src/jev_gate.py"
      - "02_lessons/lane/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "src/test_workflow_fromjson.py"
      - "src/test_lane_news_scan.py"
      - "src/test_openclaw_models.py"
      - "src/openclaw_models.py"
      - "src/lane_route.py"
      - "src/lane_news_scan.py"
      - "src/test_jev_gate.py"
      - "src/jev_gate.py"
      - "02_lessons/lane/**"

permissions:
  contents: read

jobs:
  fromjson:
    name: fromJSON + preopen job
    runs-on: ubuntu-latest
    # Checkout of this repo plus the contract tests overruns five minutes,
    # and GitHub then cancels a job whose steps already passed.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fromJSON + preopen contract
        run: |
          PYTHONPATH=. python3 -m src.test_workflow_fromjson
          PYTHONPATH=. python3 -m src.test_lane_news_scan
          PYTHONPATH=. python3 -m src.test_openclaw_models
          PYTHONPATH=. python3 -m src.test_jev_bits
