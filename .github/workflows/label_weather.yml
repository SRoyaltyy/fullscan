name: "Label + Weather (daily)"

# Phase A + B of the label → regime → join design.
#   src/segments.py — labels every stock in the Finviz Elite export
#                     ("what is it?") into data/universe/
#   src/weather.py  — scores today's regime for every label family
#                     ("is today good for that kind of thing?") into
#                     01_daily/weather/, the daily backtestable record.
# Healed inside Pre-Open ALL's book chain. This workflow is dispatch-only.

on:
  # schedule disabled 2026-08-29 — not in live pipeline
  # schedule:
  #   - cron: "17 15 * * 1-5"   # weekdays 15:17 UTC
  workflow_dispatch:
    inputs:
      run_date:
        description: "YYYY-MM-DD (empty = today ET)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  label-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch fresh Finviz Elite export
        continue-on-error: true
        env:
          DATABASE_URL:    ${{ secrets.DATABASE_URL }}
          FINVIZ_EMAIL:    ${{ secrets.FINVIZ_EMAIL }}
          FINVIZ_PASSWORD: ${{ secrets.FINVIZ_PASSWORD }}
          FULLSCAN_DB_OPTIONAL: "1"
        run: python -m collectors.finviz_financials

      - name: Label the universe (Step A)
        continue-on-error: true
        run: |
          DATE="${{ github.event.inputs.run_date }}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          python -m src.segments --date "$DATE"

      - name: Score the weather (Step B)
        continue-on-error: true
        run: |
          DATE="${{ github.event.inputs.run_date }}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          python -m src.weather --date "$DATE"

      - name: Match stocks to weather (Step C)
        continue-on-error: true
        run: |
          DATE="${{ github.event.inputs.run_date }}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          python -m src.join --date "$DATE"

      - name: Commit outputs
        if: always()
        run: |
          export HOME="${HOME:-/home/gha}"
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          cd "${GITHUB_WORKSPACE:-.}"
          bash scripts/safe_git_push.sh \
            "auto: universe labels + weather + match [$(date -u +%F)]" \
            data/universe data/exports data/join 01_daily/weather \
            01_daily/
