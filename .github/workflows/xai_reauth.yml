name: xAI device reauth

# Phone Claw tab + clock. Starts a device-code waiter on this box,
# publishes 01_daily/_xai_reauth.json. The dedicated job stays in the
# foreground so GitHub Actions does not reap openclaw before a code is pushed.
# --check is a no-op when models status is already ok.
# The published grok.me app has no GitHub token and cannot dispatch.
# After every pass we snapshot runtime doors for the phone.

on:
  schedule:
    # every 20 min; --check exits immediately if auth is still good
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "true = start a device login even if models status looks ok"
        required: false
        default: "false"

permissions:
  contents: write
  actions: read

concurrency:
  group: xai-reauth
  cancel-in-progress: false

jobs:
  reauth:
    runs-on: [self-hosted, ecs]
    timeout-minutes: 16
    env:
      HOME: /home/gha
      FULLSCAN_HOME: /home/gha
      GROK_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0

      - name: Start or refresh xAI device login
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -uo pipefail
          export HOME=/home/gha
          mkdir -p /home/gha/fullscan-logs
          chmod +x scripts/xai_device_reauth.py scripts/runtime_status.py scripts/safe_git_push.sh || true
          FORCE="${{ github.event.inputs.force }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            FORCE="false"
          fi
          if [ "$FORCE" = "true" ]; then
            # Foreground: GHA kills setsid orphans on job exit, which
            # previously murdered openclaw before a user_code was pushed.
            python3 scripts/xai_device_reauth.py --daemon --force
          else
            python3 scripts/xai_device_reauth.py --check
          fi
          python3 scripts/runtime_status.py --write || true
          echo "======== _xai_reauth.json ========"
          cat 01_daily/_xai_reauth.json 2>/dev/null || echo "(missing)"
          echo "======== _runtime.json ========"
          cat 01_daily/_runtime.json 2>/dev/null || echo "(missing)"
