name: xAI device reauth

# Phone Claw tab + clock. In-process device-code waiter on ecs-openclaw
# (GitHub Actions reaps a detached waiter when the job exits).
#
# scripts/xai_device_reauth.py writes 01_daily/_xai_reauth.json and
# Contents-API publishes status=waiting + user_code + verification_uri
# BEFORE wait_pid (~12 min). Git push from this box is not that path
# (invalid credentials). The publish_reauth.py step below only refreshes
# the terminal ok / needs_reauth file after the waiter returns.
#
# Dispatch only. A 20-minute ECS cron queued behind Grok and burned the runner.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "true = start a device login even if models status looks ok"
        required: false
        default: "false"

permissions:
  contents: write
  actions: read

concurrency:
  group: xai-reauth
  cancel-in-progress: false

jobs:
  reauth:
    runs-on: [self-hosted, ecs]
    timeout-minutes: 16
    env:
      HOME: /home/gha
      FULLSCAN_HOME: /home/gha
      GROK_ONLY: "1"
    steps:
      - name: Skip if Grok already owns the box
        run: |
          set +e
          if pgrep -af 'src.map_heat_postclose|src.run_preopen_all|ecs_preopen|ecs_map_postclose|-m src.map_heat' \
               | grep -v pgrep | grep -v runtime_status >/dev/null; then
            echo "Grok is talking — not occupying the runner for a clock snapshot"
            echo "skip=yes" >> "$GITHUB_ENV"
          fi
          exit 0
      # GITHUB_WORKSPACE on ecs-openclaw is an empty sparse shell (only .git);
      # git fetch to it times out. Run from the on-box clone used by systemd.
      - name: Start or refresh xAI device login (on-box clone)
        if: env.skip != 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -uo pipefail
          export HOME=/home/gha
          ROOT=/home/gha/fullscan
          mkdir -p /home/gha/fullscan-logs "$ROOT/scripts" "$ROOT/01_daily"
          if [ ! -d "$ROOT/.git" ] && [ -d /home/gha/fullscan.bak/.git ]; then
            echo "restoring fullscan.bak → fullscan"
            mv /home/gha/fullscan.bak "$ROOT"
            mkdir -p "$ROOT/scripts" "$ROOT/01_daily"
          fi
          RAW=https://raw.githubusercontent.com/SRoyaltyy/fullscan/main
          for f in scripts/xai_device_reauth.py scripts/safe_git_push.sh \
                   scripts/runtime_status.py scripts/enable_openclaw_chat.sh \
                   scripts/ensure_openclaw_timeouts.sh; do
            timeout 30 curl -fsSL -o "$ROOT/$f" "$RAW/$f" \
              || echo "WARN: curl $f failed"
          done
          test -f "$ROOT/scripts/xai_device_reauth.py" || { echo "FATAL: no reauth script"; exit 1; }
          chmod +x "$ROOT"/scripts/*.py "$ROOT"/scripts/*.sh 2>/dev/null || true
          cd "$ROOT"
          git config --global --add safe.directory "$ROOT" || true
          rm -f .git/index.lock .git/shallow.lock .git/HEAD.lock 2>/dev/null || true
          if [ -d .git ]; then
            git remote set-url origin https://github.com/SRoyaltyy/fullscan.git || true
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              git config --local http.https://github.com/.extraheader \
                "AUTHORIZATION: bearer ${GITHUB_TOKEN}"
            fi
            timeout 45 git fetch --depth=1 origin main \
              && timeout 20 git reset --hard origin/main \
              || echo "WARN: tip sync skipped (git flaky)"
            for f in scripts/xai_device_reauth.py scripts/safe_git_push.sh; do
              test -f "$f" || timeout 30 curl -fsSL -o "$f" "$RAW/$f" || true
            done
          fi
          echo "OK root=$ROOT"
          ls -la scripts/xai_device_reauth.py
          cat > /home/gha/fullscan-logs/publish_reauth.py <<'PY'
          import json, os, urllib.request, base64, sys
          path = "01_daily/_xai_reauth.json"
          if not os.path.isfile(path):
              print("[publish] missing", path); sys.exit(0)
          body = open(path, "rb").read()
          d = json.loads(body)
          print("[publish]", d.get("status"), d.get("user_code"))
          token = os.environ.get("GITHUB_TOKEN") or ""
          if not token:
              print("[publish] no token"); sys.exit(0)
          api = "https://api.github.com/repos/SRoyaltyy/fullscan/contents/" + path
          req = urllib.request.Request(api, headers={
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "User-Agent": "fullscan-xai-reauth",
          })
          sha = None
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  sha = json.load(r).get("sha")
          except Exception as e:
              print("[publish] get sha:", e)
          data = {
              "message": "chore: xai reauth status (API publish)",
              "content": base64.b64encode(body).decode(),
              "branch": "main",
          }
          if sha:
              data["sha"] = sha
          req2 = urllib.request.Request(
              api, data=json.dumps(data).encode(), method="PUT",
              headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "User-Agent": "fullscan-xai-reauth",
              },
          )
          try:
              with urllib.request.urlopen(req2, timeout=45) as r:
                  print("[publish] ok", r.status)
          except Exception as e:
              print("[publish] put failed:", e)
          PY
          # strip accidental YAML indent from heredoc body
          sed -i 's/^          //' /home/gha/fullscan-logs/publish_reauth.py
          FORCE="${{ github.event.inputs.force }}"
          FORCE="${FORCE:-false}"
          # --daemon / --check block in wait_pid only AFTER the script has
          # Contents-API published the waiting user_code. This trailing
          # publish is the terminal status (ok or needs_reauth), not the
          # first time GitHub sees the code.
          if [ "$FORCE" = "true" ]; then
            python3 scripts/xai_device_reauth.py --daemon --force || true
          else
            python3 scripts/xai_device_reauth.py --check || true
          fi
          echo "======== local _xai_reauth.json ========"
          cat 01_daily/_xai_reauth.json 2>/dev/null || echo "(missing)"
          python3 /home/gha/fullscan-logs/publish_reauth.py || true
          exit 0

      - name: Snapshot runtime doors for the phone
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
        run: |
          set -uo pipefail
          export HOME=/home/gha
          ROOT=/home/gha/fullscan
          if [ -f "$ROOT/scripts/runtime_status.py" ]; then
            cd "$ROOT"
            python3 scripts/runtime_status.py --write || true
            echo "======== _runtime.json ========"
            cat 01_daily/_runtime.json 2>/dev/null || echo "(missing)"
          else
            echo "(no on-box clone for runtime snapshot)"
          fi
