name: xAI device reauth

# Phone Claw tab + clock. Starts a DETACHED device-code waiter on this box,
# publishes 01_daily/_xai_reauth.json, then exits so the ECS runner is not
# held for 15 minutes.
#
# Dispatch only. A 20-minute ECS cron queued behind Grok and burned the runner.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "true = start a device login even if models status looks ok"
        required: false
        default: "false"

permissions:
  contents: write
  actions: read

concurrency:
  group: xai-reauth
  cancel-in-progress: false

jobs:
  reauth:
    runs-on: [self-hosted, ecs]
    timeout-minutes: 16
    env:
      HOME: /home/gha
      FULLSCAN_HOME: /home/gha
      GROK_ONLY: "1"
    steps:
      - name: Skip if Grok already owns the box
        run: |
          set +e
          if pgrep -af 'src.map_heat_postclose|src.run_preopen_all|ecs_preopen|ecs_map_postclose|-m src.map_heat' \
               | grep -v pgrep | grep -v runtime_status >/dev/null; then
            echo "Grok is talking — not occupying the runner for a clock snapshot"
            echo "skip=yes" >> "$GITHUB_ENV"
          fi
          exit 0
      # actions/checkout@v4 with fetch-depth:0 hung ~8min on ecs-openclaw
      # (2026-10-14). Sync the shared workdir with a hard timeout instead.
      - name: Sync shared ECS workdir (timeout-safe)
        if: env.skip != 'yes'
        run: |
          set -euo pipefail
          git sparse-checkout disable || true
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          # Drop leftover locks from the failed Pre-Open that left checkout wedged.
          rm -f .git/index.lock .git/shallow.lock .git/HEAD.lock 2>/dev/null || true
          # Shallow tip only — do not walk full history.
          timeout 90 git fetch --depth=1 origin main || {
            echo "WARN: git fetch timed out/failed — using existing workdir tip"
          }
          timeout 30 git checkout -f FETCH_HEAD 2>/dev/null \
            || timeout 30 git checkout -f origin/main 2>/dev/null \
            || timeout 30 git reset --hard origin/main 2>/dev/null \
            || true
          if [ ! -f requirements.txt ] || [ ! -f scripts/xai_device_reauth.py ]; then
            echo "ERROR: workdir missing scripts after sync"
            ls -la
            exit 1
          fi
          echo "OK tip=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"

      - name: Start or refresh xAI device login
        if: env.skip != 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -uo pipefail
          export HOME=/home/gha
          mkdir -p /home/gha/fullscan-logs
          chmod +x scripts/xai_device_reauth.py scripts/safe_git_push.sh \
            scripts/runtime_status.py scripts/enable_openclaw_chat.sh \
            scripts/ensure_openclaw_timeouts.sh || true
          FORCE="${{ github.event.inputs.force }}"
          FORCE="${FORCE:-false}"
          if [ "$FORCE" = "true" ]; then
            python3 scripts/xai_device_reauth.py --daemon --force || true
          else
            python3 scripts/xai_device_reauth.py --check || true
          fi
          echo "======== _xai_reauth.json ========"
          cat 01_daily/_xai_reauth.json 2>/dev/null || echo "(missing)"
          exit 0

      - name: Snapshot runtime doors for the phone
        if: always() && env.skip != 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
        run: |
          set -uo pipefail
          export HOME=/home/gha
          python3 scripts/runtime_status.py --write || true
          echo "======== _runtime.json ========"
          cat 01_daily/_runtime.json 2>/dev/null || echo "(missing)"
