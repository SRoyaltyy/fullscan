name: xAI device reauth

# Phone Claw tab + clock. Starts a DETACHED device-code waiter on this box,
# publishes 01_daily/_xai_reauth.json, then exits so the ECS runner is not
# held for 15 minutes.
#
# --check is a no-op when models status is already ok, so a 20-minute clock
# is cheap. After the auth check, snapshot every runtime door (timeout 1800,
# 64-char token, 401/403, dead process behind systemd active) so the phone
# board is not a stale "everything is up".
# The published grok.me app has no GitHub token and cannot dispatch.

on:
  schedule:
    # every 20 min; --check exits immediately if auth is still good
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "true = start a device login even if models status looks ok"
        required: false
        default: "false"

permissions:
  contents: write
  actions: read

concurrency:
  group: xai-reauth
  cancel-in-progress: false

jobs:
  reauth:
    runs-on: [self-hosted, ecs]
    timeout-minutes: 16
    env:
      HOME: /home/gha
      FULLSCAN_HOME: /home/gha
      GROK_ONLY: "1"
    steps:
      - name: Skip if Grok already owns the box
        run: |
          set +e
          if pgrep -af 'src.map_heat_postclose|src.run_preopen_all|ecs_preopen|ecs_map_postclose|-m src.map_heat' \
               | grep -v pgrep | grep -v runtime_status >/dev/null; then
            echo "Grok is talking — not occupying the runner for a clock snapshot"
            echo "skip=yes" >> "$GITHUB_ENV"
          fi
          exit 0
      - uses: actions/checkout@v4
        if: env.skip != 'yes'
        with:
          clean: false
          fetch-depth: 0

      - name: Start or refresh xAI device login
        if: env.skip != 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -uo pipefail
          export HOME=/home/gha
          mkdir -p /home/gha/fullscan-logs
          chmod +x scripts/xai_device_reauth.py scripts/safe_git_push.sh \
            scripts/runtime_status.py scripts/enable_openclaw_chat.sh \
            scripts/ensure_openclaw_timeouts.sh || true
          FORCE="${{ github.event.inputs.force }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            FORCE="false"
          fi
          if [ "$FORCE" = "true" ]; then
            # Foreground: GHA kills setsid orphans on job exit, which
            # previously murdered openclaw before a user_code was pushed.
            python3 scripts/xai_device_reauth.py --daemon --force
          else
            python3 scripts/xai_device_reauth.py --check
          fi
          echo "======== _xai_reauth.json ========"
          cat 01_daily/_xai_reauth.json 2>/dev/null || echo "(missing)"

      - name: Snapshot runtime doors for the phone
        if: always() && env.skip != 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
        run: |
          set -uo pipefail
          export HOME=/home/gha
          python3 scripts/runtime_status.py --write || true
          echo "======== _runtime.json ========"
          cat 01_daily/_runtime.json 2>/dev/null || echo "(missing)"
