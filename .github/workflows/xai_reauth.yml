name: xAI device reauth

# Phone Claw tab + clock. Starts a DETACHED device-code waiter on this box,
# publishes 01_daily/_xai_reauth.json, then exits so the ECS runner is not
# held for 15 minutes.
#
# Dispatch only. A 20-minute ECS cron queued behind Grok and burned the runner.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "true = start a device login even if models status looks ok"
        required: false
        default: "false"

permissions:
  contents: write
  actions: read

concurrency:
  group: xai-reauth
  cancel-in-progress: false

jobs:
  reauth:
    runs-on: [self-hosted, ecs]
    timeout-minutes: 16
    env:
      HOME: /home/gha
      FULLSCAN_HOME: /home/gha
      GROK_ONLY: "1"
    steps:
      - name: Skip if Grok already owns the box
        run: |
          set +e
          if pgrep -af 'src.map_heat_postclose|src.run_preopen_all|ecs_preopen|ecs_map_postclose|-m src.map_heat' \
               | grep -v pgrep | grep -v runtime_status >/dev/null; then
            echo "Grok is talking — not occupying the runner for a clock snapshot"
            echo "skip=yes" >> "$GITHUB_ENV"
          fi
          exit 0
      # GITHUB_WORKSPACE on ecs-openclaw is an empty sparse shell (only .git);
      # git fetch to it times out. Run from the on-box clone used by systemd.
      - name: Start or refresh xAI device login (on-box clone)
        if: env.skip != 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -uo pipefail
          export HOME=/home/gha
          ROOT=/home/gha/fullscan
          mkdir -p /home/gha/fullscan-logs
          TOKEN="${GITHUB_TOKEN:-}"
          AUTH_URL="https://x-access-token:${TOKEN}@github.com/SRoyaltyy/fullscan.git"
          ensure_tree() {
            if [ ! -d "$ROOT/.git" ]; then
              echo "cloning fresh $ROOT"
              timeout 180 git clone --depth=1 "$AUTH_URL" "$ROOT" || return 1
              return 0
            fi
            cd "$ROOT"
            git config --global --add safe.directory "$ROOT" || true
            rm -f .git/index.lock .git/shallow.lock .git/HEAD.lock 2>/dev/null || true
            git sparse-checkout disable || true
            if [ -n "$TOKEN" ]; then
              git config --local http.https://github.com/.extraheader \
                "AUTHORIZATION: bearer ${TOKEN}"
              git remote set-url origin "$AUTH_URL" || true
            fi
            timeout 90 git fetch --depth=1 origin main \
              && timeout 30 git reset --hard origin/main \
              || echo "WARN: tip sync failed"
            if [ ! -f scripts/xai_device_reauth.py ]; then
              echo "on-box tree stale/missing script — recloning"
              cd /home/gha
              rm -rf fullscan.bak
              mv fullscan fullscan.bak 2>/dev/null || rm -rf fullscan
              timeout 180 git clone --depth=1 "$AUTH_URL" "$ROOT" || return 1
            fi
            return 0
          }
          ensure_tree || { echo "FATAL: cannot materialize $ROOT"; exit 1; }
          cd "$ROOT"
          if [ ! -f scripts/xai_device_reauth.py ]; then
            echo "ERROR: still missing scripts/xai_device_reauth.py"; ls -la scripts | head; exit 1
          fi
          chmod +x scripts/xai_device_reauth.py scripts/safe_git_push.sh \
            scripts/runtime_status.py scripts/enable_openclaw_chat.sh \
            scripts/ensure_openclaw_timeouts.sh || true
          if [ -n "$TOKEN" ]; then
            git config --local http.https://github.com/.extraheader \
              "AUTHORIZATION: bearer ${TOKEN}"
          fi
          echo "OK tip=$(git rev-parse --short HEAD 2>/dev/null) root=$ROOT"
          ls scripts/xai_device_reauth.py
          FORCE="${{ github.event.inputs.force }}"
          FORCE="${FORCE:-false}"
          if [ "$FORCE" = "true" ]; then
            python3 scripts/xai_device_reauth.py --daemon --force || true
          else
            python3 scripts/xai_device_reauth.py --check || true
          fi
          echo "======== _xai_reauth.json ========"
          cat 01_daily/_xai_reauth.json 2>/dev/null || echo "(missing)"
          exit 0

      - name: Snapshot runtime doors for the phone
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
        run: |
          set -uo pipefail
          export HOME=/home/gha
          ROOT=/home/gha/fullscan
          if [ -f "$ROOT/scripts/runtime_status.py" ]; then
            cd "$ROOT"
            python3 scripts/runtime_status.py --write || true
            echo "======== _runtime.json ========"
            cat 01_daily/_runtime.json 2>/dev/null || echo "(missing)"
          else
            echo "(no on-box clone for runtime snapshot)"
          fi
