name: Holdup post-close fill

# Weekdays after the US cash close and after Yahoo has session D's daily bar.
# 21:30 UTC = 5:30 PM ET during EDT (UTC-4) and 4:30 PM ET during EST
# (UTC-5). Hong Kong Time is 5:30 AM the next calendar day (UTC+8, no DST).
# The cash close is 4:00 PM ET, which is 20:00 UTC in EDT and 21:00 UTC in EST.
# A bar is treated as final only at or after 21:15 UTC on that session, so
# this run is past the close in both EDT and EST. The job is retry-safe:
# a second run of a sealed fill does nothing, and a missing bar appends nothing.
# The fill is written only when a sealed plan for D exists, and it does not
# edit that plan.

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: holdup-forward
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bar dependencies
        run: pip install numpy pandas pyarrow yfinance
      - name: Theme Radar history for the frozen panel
        run: |
          set -euo pipefail
          if ! git clone --filter=blob:none --no-checkout \
              https://github.com/SRoyaltyy/theme-radar.git vendor/theme-radar; then
            echo "theme-radar clone failed; the price refresh will fetch held names and IWM only"
            exit 0
          fi
          git -C vendor/theme-radar sparse-checkout init --cone
          git -C vendor/theme-radar sparse-checkout set research/lever_panel
          git -C vendor/theme-radar checkout main \
            || echo "theme-radar checkout failed"
      - name: Refresh forward prices
        id: prices
        run: PYTHONHASHSEED=0 python3 research/hot_n4_clean_v4/forward/prices.py
      - name: Seal the post-close fill
        id: fill
        if: success()
        env:
          HOLDUP_GIT_REF: origin/main
          HOLDUP_MODE: fill
        run: PYTHONHASHSEED=0 python3 research/hot_n4_clean_v4/forward/forward.py
      - name: Commit the append
        if: always()
        run: |
          set -euo pipefail
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          files=(
            research/hot_n4_clean_v4/forward/holdup_log.jsonl
            research/hot_n4_clean_v4/forward/LEDGER.jsonl
            research/hot_n4_clean_v4/forward/skips.jsonl
            research/hot_n4_clean_v4/forward/prices.jsonl
            research/hot_n4_clean_v4/forward/PRICE_LEDGER.jsonl
            research/hot_n4_clean_v4/forward/price_revisions.jsonl
            dashboard/holdup/log.json
            dashboard/holdup/status.json
          )
          for path in "${files[@]}"; do
            if [ -f "$path" ]; then
              git add -- "$path"
            fi
          done
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Seal the holdup fill."
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail the job when the book halted
        if: steps.prices.outcome == 'failure' || steps.fill.outcome == 'failure'
        run: exit 1
