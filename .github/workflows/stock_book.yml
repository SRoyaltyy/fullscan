name: Stock Book (unified)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Join date YYYY-MM-DD (empty = latest)"
        required: false
        default: ""
      top:
        description: "Top N buys/sells per horizon"
        required: false
        default: "25"
  schedule:
    - cron: "45 16 * * 1-5"

permissions:
  contents: write

jobs:
  stock-book:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Build stock book (1d 3d 1w 2w 1m)
        run: |
          set -e
          DATE="${{ github.event.inputs.date }}"
          TOP="${{ github.event.inputs.top }}"
          TOP="${TOP:-25}"
          if [ -n "$DATE" ]; then
            python -m src.stock_book --date "$DATE" --top "$TOP"
          else
            python -m src.stock_book --top "$TOP"
          fi
          head -80 01_daily/*_stock_book.md 2>/dev/null | tail -80 || true
      - name: Commit book
        run: |
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add 01_daily/*_stock_book.md data/stock_book/ || true
          git commit -m "auto: stock book (1d/3d/1w/2w/1m)" || echo "No changes"
          git pull --rebase origin main || true
          git push origin main
