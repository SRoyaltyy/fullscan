name: Boring Winners Backtest

# Overlay 1d BUY with FEATURE_MINE stacks (keep / drop fade / add gated extras)
# and publish the as-of painted MD pack: scoreboard, per-day books, today's latest.
# Also merge dashboard/boring-winners onto gh-pages without wiping the paper book.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Full Feature Mine", "Stock Book ALL (one-shot)"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: boring-winners
  cancel-in-progress: true

jobs:
  seat:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pandas pyarrow

      - name: Tests
        run: |
          python -m src.test_boring_winners_backtest
          python -m src.test_boring_winners_lab

      - name: Seat
        run: |
          set -euo pipefail
          test -s 03_scoreboard/feature_asof_panel.parquet
          python -m src.boring_winners_backtest
          python -m src.boring_winners_lab
          test -s 03_scoreboard/BORING_WINNERS.md
          test -s 03_scoreboard/latest_boring_winners.md
          test -s 03_scoreboard/boring_winners_picks.csv
          test -s 03_scoreboard/boring_winners_daily.csv
          test -s 03_scoreboard/BORING_WINNERS_LAB.md
          test -s 03_scoreboard/boring_winners_lab.json
          test -s dashboard/boring-winners/index.html
          test -d 03_scoreboard/boring_winners
          test -n "$(ls 03_scoreboard/boring_winners/*.md)"
          test -s 01_daily/latest_boring_winners.md

      - name: Publish
        run: |
          set -euo pipefail
          mapfile -t FILES < <(
            printf '%s\n' \
              03_scoreboard/BORING_WINNERS.md \
              03_scoreboard/latest_boring_winners.md \
              03_scoreboard/boring_winners.json \
              03_scoreboard/boring_winners_picks.csv \
              03_scoreboard/boring_winners_daily.csv \
              03_scoreboard/boring_winners/*.md \
              03_scoreboard/BORING_WINNERS_LAB.md \
              03_scoreboard/boring_winners_lab.json \
              03_scoreboard/boring_winners_lab_daily.csv \
              dashboard/boring-winners/index.html \
              01_daily/*_boring_winners.md \
              01_daily/latest_boring_winners.md
          )
          bash scripts/safe_git_push.sh \
            "chore: boring winners book×mine overlay" \
            "${FILES[@]}"

      - name: Merge boring-winners onto gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -s dashboard/boring-winners/index.html
          TMP=$(mktemp -d)
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$TMP" || {
              echo "WARN: gh-pages clone failed — Pages not updated this run"
              exit 0
            }
          mkdir -p "$TMP/dashboard/boring-winners"
          cp -a dashboard/boring-winners/. "$TMP/dashboard/boring-winners/"
          touch "$TMP/.nojekyll"
          git -C "$TMP" config user.name "Market-Bot-Automaton"
          git -C "$TMP" config user.email "bot@users.noreply.github.com"
          git -C "$TMP" add dashboard/boring-winners .nojekyll
          if git -C "$TMP" diff --cached --quiet; then
            echo "gh-pages already has current boring-winners"
            exit 0
          fi
          git -C "$TMP" commit -m "deploy boring-winners dashboard ${GITHUB_SHA}"
          git -C "$TMP" push origin gh-pages
          echo "Published https://SRoyaltyy.github.io/fullscan/dashboard/boring-winners/"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Boring winners"
            echo
            echo "Pages: https://SRoyaltyy.github.io/fullscan/dashboard/boring-winners/"
            echo
            if [ -f 03_scoreboard/BORING_WINNERS.md ]; then
              awk '/^## Daily book returns/,/^## Daily short book/' 03_scoreboard/BORING_WINNERS.md
            fi
            echo
            if [ -f 03_scoreboard/BORING_WINNERS_LAB.md ]; then
              echo "### Scenario lab"
              echo
              awk '/^## Leaderboard/,/^## Daily overlay/' 03_scoreboard/BORING_WINNERS_LAB.md
            fi
            echo
            if [ -f 03_scoreboard/latest_boring_winners.md ]; then
              echo "### Latest book"
              echo
              cat 03_scoreboard/latest_boring_winners.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
