name: Jev triage paired validation
on:
  push:
    branches: [codex/jev-news-triage]
    paths:
      - 'src/jev_triage*.py'
      - 'src/jev_gate.py'
      - '00_grounding/jev_triage_validation.json'
      - '.github/workflows/jev_triage_validation.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jev-triage-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            00_grounding
            validation
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: |
          python -m src.test_jev_triage
          python -m src.test_jev_bits
          python -m src.test_jev_sixbit_stop
      - name: Paired model evaluation
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          JEV_MODEL: jev-1.13.0
        run: python -m src.jev_triage_eval --output validation/jev_triage_report.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-triage-validation
          path: validation/jev_triage_report.json
          if-no-files-found: warn
      - name: Save reviewable results to candidate branch only
        if: always() && github.ref == 'refs/heads/codex/jev-news-triage'
        run: |
          if [ ! -f validation/jev_triage_report.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/jev_triage_report.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record paired JEV validation results [skip ci]'
          git push origin HEAD:codex/jev-news-triage
