name: Sector Daily (auto)

# PREDICT must finish BEFORE 09:30 ET (21:30 HKT). Sequential 11-sector
# loop is ~70 min on the single ECS runner, so we start ~07:10 ET.
# Hour gate + src.preopen refuse writes after 09:25 ET.
# OUTCOME+REFLECT stay in the post-close window (not predictive).

on:
  schedule:
    # NO predict cron: Pre-Open ALL (06:00 ET) owns the 11 morning sector
    # predicts. Predict here is dispatch-only (orchestrator fallback
    # after 08:00 ET if ALL is not quality-ok).
    - cron: "10 22 * * 1-5"   # ~18:10 ET outcome+reflect
  workflow_dispatch:
    inputs:
      stage:
        description: "predict | outcome_reflect | all"
        required: true
        default: "predict"
      run_date:
        description: "YYYY-MM-DD (default today ET)"
        required: false
        default: ""
      sectors:
        description: "Comma-separated or empty = all 11"
        required: false
        default: ""
      force:
        description: "Ignore 09:25 ET cutoff and skip-if-good"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: sector-daily
  cancel-in-progress: false

jobs:
  sector-daily:
    runs-on: [self-hosted, ecs]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install yfinance pandas requests ddgs openai || true

      - name: Decide stage
        id: stage
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            PLAN="none"
            UTC_HOUR=$(date -u +%H)
            HOUR=$((10#$UTC_HOUR))
            ET_HM=$((10#$(TZ=America/New_York date +%H%M)))
            DOW=$(TZ=America/New_York date +%u)
            # GitHub cron jitter is routinely +15–70 min. Exact-hour match
            # (UTC_HOUR == 12 / 22) is why 08-19 printed green in ~1 min
            # with 0/11 essays (ran 13:28 UTC, PLAN=none).
            if [ "$HOUR" -ge 18 ]; then
              PLAN="outcome_reflect"
            elif [ "$ET_HM" -ge 600 ] && [ "$ET_HM" -lt 925 ]; then
              PLAN="predict"
            fi
            if [ "$PLAN" = "predict" ] && [ "$DOW" -ge 6 ]; then
              PLAN="none"
              echo "Weekend — sector predict skipped."
            fi
            echo "UTC_HOUR=$UTC_HOUR ET_HM=$ET_HM PLAN=$PLAN"
            echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          else
            echo "plan=${{ github.event.inputs.stage }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Sector PREDICT (sequential, skip-if-good, QC+retry)
        if: steps.stage.outputs.plan == 'predict' || steps.stage.outputs.plan == 'all'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_TIMEOUT: "10800"
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATE: ${{ github.event.inputs.run_date }}
          SECTORS: ${{ github.event.inputs.sectors }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -e
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ -n "$SECTORS" ] && ARGS+=(--sectors "$SECTORS")
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          python -m src.run_sector_predict "${ARGS[@]}"

      - name: Sector board (after predict)
        if: steps.stage.outputs.plan == 'predict' || steps.stage.outputs.plan == 'all'
        env:
          DATE: ${{ github.event.inputs.run_date }}
        run: |
          python -m src.sector_board ${DATE:+--date "$DATE"}

      - name: Sector OUTCOME (sequential)
        if: steps.stage.outputs.plan == 'outcome_reflect' || steps.stage.outputs.plan == 'all'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_TIMEOUT: "10800"
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          DATE: ${{ github.event.inputs.run_date }}
          SECTORS: ${{ github.event.inputs.sectors }}
        run: |
          set -e
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ -n "$SECTORS" ] && ARGS+=(--sectors "$SECTORS")
          python -m src.run_sector_outcome "${ARGS[@]}"

      - name: Sector REFLECT (sequential)
        if: steps.stage.outputs.plan == 'outcome_reflect' || steps.stage.outputs.plan == 'all'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_TIMEOUT: "10800"
          DATE: ${{ github.event.inputs.run_date }}
          SECTORS: ${{ github.event.inputs.sectors }}
        run: |
          set -e
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ -n "$SECTORS" ] && ARGS+=(--sectors "$SECTORS")
          python -m src.run_sector_reflect "${ARGS[@]}"

      - name: Sector board (after outcome)
        if: steps.stage.outputs.plan == 'outcome_reflect' || steps.stage.outputs.plan == 'all'
        env:
          DATE: ${{ github.event.inputs.run_date }}
        run: |
          python -m src.sector_board ${DATE:+--date "$DATE"}

      - name: Horizon grader (grade matured sector horizon calls)
        if: steps.stage.outputs.plan == 'outcome_reflect' || steps.stage.outputs.plan == 'all'
        env:
          DATE: ${{ github.event.inputs.run_date }}
        run: |
          python -m src.horizon_grade ${DATE:+--date "$DATE"}

      - name: Commit
        if: steps.stage.outputs.plan != 'none'
        run: |
          bash scripts/safe_git_push.sh \
            "auto: sector daily ${{ steps.stage.outputs.plan }}" \
            01_daily/sectors/ 01_daily/_transcripts/ 02_lessons/ 03_scoreboard/ \
            01_daily/*_preopen_qc.json
