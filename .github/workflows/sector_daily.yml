name: Sector Daily (auto)

# Mirrors general daily_pipeline timing (HKT-aware):
#   PREDICT  ~ evening HKT before US open window (skip Sat/Sun predict)
#   OUTCOME+REFLECT ~ early HKT morning after US session graded
# Each sector = independent LLM run (sequential).
# After predict and after outcome: birds-eye _BOARD.md

on:
  schedule:
    - cron: "40 12 * * 1-5"
    - cron: "10 22 * * 1-5"
  workflow_dispatch:
    inputs:
      stage:
        description: "predict | outcome_reflect | all"
        required: true
        default: "predict"
      run_date:
        description: "YYYY-MM-DD (default today ET)"
        required: false
        default: ""
      sectors:
        description: "Comma-separated or empty = all 11"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sector-daily
  cancel-in-progress: false

jobs:
  sector-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install yfinance pandas requests ddgs openai || true

      - name: Decide stage
        id: stage
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            PLAN="none"
            UTC_HOUR=$(date -u +%H)
            HOUR=$((10#$UTC_HOUR))
            DOW=$(TZ=Asia/Hong_Kong date +%u)
            # GitHub cron jitter is routinely +15–70 min. Exact-hour match
            # (UTC_HOUR == 12 / 22) is why 08-19 printed green in ~1 min
            # with 0/11 essays (ran 13:28 UTC, PLAN=none).
            if [ "$HOUR" -ge 18 ]; then
              PLAN="outcome_reflect"
            elif [ "$HOUR" -ge 11 ]; then
              PLAN="predict"
            fi
            if [ "$PLAN" = "predict" ] && [ "$DOW" -ge 6 ]; then
              PLAN="none"
              echo "Weekend — sector predict skipped."
            fi
            echo "UTC_HOUR=$UTC_HOUR PLAN=$PLAN"
            echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          else
            echo "plan=${{ github.event.inputs.stage }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Sector PREDICT (sequential)
        if: steps.stage.outputs.plan == 'predict' || steps.stage.outputs.plan == 'all'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATE: ${{ github.event.inputs.run_date }}
          SECTORS: ${{ github.event.inputs.sectors }}
        run: |
          set -e
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ -n "$SECTORS" ] && ARGS+=(--sectors "$SECTORS")
          python -m src.run_sector_predict "${ARGS[@]}"

      - name: Sector board (after predict)
        if: steps.stage.outputs.plan == 'predict' || steps.stage.outputs.plan == 'all'
        env:
          DATE: ${{ github.event.inputs.run_date }}
        run: |
          python -m src.sector_board ${DATE:+--date "$DATE"}

      - name: Sector OUTCOME (sequential)
        if: steps.stage.outputs.plan == 'outcome_reflect' || steps.stage.outputs.plan == 'all'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          DATE: ${{ github.event.inputs.run_date }}
          SECTORS: ${{ github.event.inputs.sectors }}
        run: |
          set -e
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ -n "$SECTORS" ] && ARGS+=(--sectors "$SECTORS")
          python -m src.run_sector_outcome "${ARGS[@]}"

      - name: Sector REFLECT (sequential)
        if: steps.stage.outputs.plan == 'outcome_reflect' || steps.stage.outputs.plan == 'all'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DATE: ${{ github.event.inputs.run_date }}
          SECTORS: ${{ github.event.inputs.sectors }}
        run: |
          set -e
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ -n "$SECTORS" ] && ARGS+=(--sectors "$SECTORS")
          python -m src.run_sector_reflect "${ARGS[@]}"

      - name: Sector board (after outcome)
        if: steps.stage.outputs.plan == 'outcome_reflect' || steps.stage.outputs.plan == 'all'
        env:
          DATE: ${{ github.event.inputs.run_date }}
        run: |
          python -m src.sector_board ${DATE:+--date "$DATE"}

      - name: Horizon grader (grade matured sector horizon calls)
        if: steps.stage.outputs.plan == 'outcome_reflect' || steps.stage.outputs.plan == 'all'
        env:
          DATE: ${{ github.event.inputs.run_date }}
        run: |
          python -m src.horizon_grade ${DATE:+--date "$DATE"}

      - name: Commit
        if: steps.stage.outputs.plan != 'none'
        run: |
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add 01_daily/sectors/ 01_daily/_transcripts/ 02_lessons/ 03_scoreboard/ || true
          git commit -m "auto: sector daily ${{ steps.stage.outputs.plan }}" || echo "No changes"
          git pull --rebase origin main || true
          git push origin main
