name: Sector Daily (auto)

# Mirrors general daily_pipeline timing (HKT-aware):
#   PREDICT  ~ evening HKT before US open window (skip Sat/Sun predict)
#   OUTCOME+REFLECT ~ early HKT morning after US session graded
# Each sector = independent LLM run (sequential).

on:
  schedule:
    # Predict: ~20:40 HKT = 12:40 UTC (weekdays only enforced in job)
    - cron: "40 12 * * 1-5"
    # Outcome+reflect: ~06:10 HKT = 22:10 UTC previous calendar day → fires Tue–Sat UTC
    # covering Mon–Fri US sessions
    - cron: "10 22 * * 1-5"
  workflow_dispatch:
    inputs:
      stage:
        description: "predict | outcome_reflect | all"
        required: true
        default: "predict"
      run_date:
        description: "YYYY-MM-DD (default today ET)"
        required: false
        default: ""
      sectors:
        description: "Comma-separated or empty = all 11"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sector-daily
  cancel-in-progress: false

jobs:
  sector-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install yfinance pandas requests ddgs openai || true

      - name: Decide stage
        id: stage
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HKT_HOUR=$(TZ=Asia/Hong_Kong date +%H)
            DOW=$(TZ=Asia/Hong_Kong date +%u)  # 1=Mon..7=Sun
            PLAN="none"
            if [ "$HKT_HOUR" -ge 19 ] && [ "$HKT_HOUR" -lt 24 ]; then
              PLAN="predict"
            elif [ "$HKT_HOUR" -ge 5 ] && [ "$HKT_HOUR" -lt 12 ]; then
              PLAN="outcome_reflect"
            elif [ "$HKT_HOUR" -ge 0 ] && [ "$HKT_HOUR" -lt 5 ]; then
              # late-night UTC slot for outcome (22 UTC = 06 HKT)
              PLAN="outcome_reflect"
            fi
            # Also treat 22 UTC window as outcome (hour in HKT is morning)
            UTC_HOUR=$(date -u +%H)
            if [ "$UTC_HOUR" = "22" ]; then
              PLAN="outcome_reflect"
            fi
            if [ "$UTC_HOUR" = "12" ]; then
              PLAN="predict"
            fi
            if [ "$PLAN" = "predict" ] && [ "$DOW" -ge 6 ]; then
              PLAN="none"
              echo "Weekend — sector predict skipped."
            fi
            echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          else
            echo "plan=${{ github.event.inputs.stage }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Decided plan=$(cat $GITHUB_OUTPUT | grep plan)"

      - name: Heartbeat
        if: steps.stage.outputs.plan == 'none'
        run: echo "Sector daily idle at $(TZ=Asia/Hong_Kong date)"

      - name: Sector PREDICT (sequential)
        if: steps.stage.outputs.plan == 'predict' || steps.stage.outputs.plan == 'all'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATE: ${{ github.event.inputs.run_date }}
          SECTORS: ${{ github.event.inputs.sectors }}
        run: |
          set -e
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ -n "$SECTORS" ] && ARGS+=(--sectors "$SECTORS")
          python -m src.run_sector_predict "${ARGS[@]}"

      - name: Sector OUTCOME (sequential)
        if: steps.stage.outputs.plan == 'outcome_reflect' || steps.stage.outputs.plan == 'all'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          DATE: ${{ github.event.inputs.run_date }}
          SECTORS: ${{ github.event.inputs.sectors }}
        run: |
          set -e
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ -n "$SECTORS" ] && ARGS+=(--sectors "$SECTORS")
          python -m src.run_sector_outcome "${ARGS[@]}"

      - name: Sector REFLECT (sequential)
        if: steps.stage.outputs.plan == 'outcome_reflect' || steps.stage.outputs.plan == 'all'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DATE: ${{ github.event.inputs.run_date }}
          SECTORS: ${{ github.event.inputs.sectors }}
        run: |
          set -e
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ -n "$SECTORS" ] && ARGS+=(--sectors "$SECTORS")
          python -m src.run_sector_reflect "${ARGS[@]}"

      - name: Commit
        if: steps.stage.outputs.plan != 'none'
        run: |
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add 01_daily/sectors/ 01_daily/_transcripts/ 02_lessons/ 03_scoreboard/ || true
          git commit -m "auto: sector daily ${{ steps.stage.outputs.plan }}" || echo "No changes"
          git pull --rebase origin main || true
          git push origin main
