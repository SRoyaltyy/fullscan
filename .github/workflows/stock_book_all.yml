name: Stock Book ALL (one-shot)

# Single entrypoint:
#   check prereqs → run missing → stock book → backtest → paper dashboard
#   then publish dashboard/ to GitHub Pages (fixed Chrome URL).
#
# LLM stages (predict / 11 sectors / events / news judge / book-reflect)
# hit Grok 4.6 via OpenClaw on the ECS. DeepSeek automatically takes over
# when Grok is unavailable, rate-limited, or out of credits.
# Must run on [self-hosted, ecs]: ubuntu-latest cannot reach the
# loopback gateway and used to fall back to DeepSeek every weekday.
# One ECS runner — a 6h book run will queue other ECS jobs.
# Catalyst daily is invoked inside src.run_stock_book_all before ranking
# so dossiers merge into news actions and land on the .io paper book.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "ecs (OpenClaw) or ubuntu (GitHub-hosted). ubuntu cannot reach Grok."
        required: false
        default: "ecs"
        type: choice
        options:
          - ecs
          - ubuntu
      run_date:
        description: "YYYY-MM-DD (empty = today ET)"
        required: false
        default: ""
      top:
        description: "Top N buy/sell per horizon"
        required: false
        default: "25"
      force:
        description: "true = re-run all prereqs even if files exist"
        required: false
        default: "false"
      skip_llm:
        description: "true = skip general + sector LLM (faster)"
        required: false
        default: "false"
      force_sectors:
        description: "true = always run all 11 sector predicts"
        required: false
        default: "false"
  # Clock retired 2026-09-04 — Pre-Open ALL writes the book before 09:30.
  # Keep dispatch for a manual re-rank. Do not add a cron back.
  # schedule:
  #   - cron: "0 17 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-book-all
  cancel-in-progress: false

jobs:
  all:
    runs-on: ${{ github.event.inputs.runner == 'ubuntu' && 'ubuntu-latest' || fromJSON('["self-hosted","ecs"]') }}
    timeout-minutes: 360
    env:
      FULLSCAN_HOME: "/home/gha"
      HOME: "/home/gha"
      FINVIZ_SKIP_LIVE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary yfinance pandas requests openai ddgs || true

      - name: Run Stock Book ALL
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_TIMEOUT: "10800"
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_KEY: ${{ secrets.DATABASE_KEY }}
          FINVIZ_EMAIL: ${{ secrets.FINVIZ_EMAIL }}
          FINVIZ_PASSWORD: ${{ secrets.FINVIZ_PASSWORD }}
          FINVIZ_EXPORT: ${{ secrets.FINVIZ_EXPORT }}
          GROK_ONLY: "0"
          FINVIZ_SKIP_LIVE: "1"
        run: |
          set -e
          DATE="${{ github.event.inputs.run_date }}"
          TOP="${{ github.event.inputs.top }}"
          FORCE="${{ github.event.inputs.force }}"
          SKIP="${{ github.event.inputs.skip_llm }}"
          FSEC="${{ github.event.inputs.force_sectors }}"
          TOP="${TOP:-25}"
          FORCE="${FORCE:-false}"
          SKIP="${SKIP:-false}"
          FSEC="${FSEC:-false}"

          ARGS=(--top "$TOP")
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          [ "$SKIP" = "true" ] && ARGS+=(--skip-llm)
          [ "$FSEC" = "true" ] && ARGS+=(--force-sectors)

          echo "CMD: python -m src.run_stock_book_all ${ARGS[*]}"
          python -m src.run_stock_book_all "${ARGS[@]}"

      - name: Show outputs
        if: always()
        run: |
          echo "======== stock book ========"
          f=$(ls -1t 01_daily/*_stock_book.md 2>/dev/null | head -1)
          [ -n "$f" ] && head -80 "$f" || true
          echo "======== catalyst ========"
          ls -1t 01_daily/catalyst/*_dossiers.md 2>/dev/null | head -3 || true
          echo "======== paper ========"
          head -40 03_scoreboard/PAPER_TRADING.md 2>/dev/null || true
          ls -la dashboard/ 2>/dev/null || true

      - name: Upload book + dashboard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-book-all
          path: |
            data/stock_book/
            data/peers/
            data/catalyst/
            01_daily/*_stock_book.md
            01_daily/*_peer_rs.md
            01_daily/catalyst/
            03_scoreboard/
            dashboard/
          if-no-files-found: warn

      - name: Commit everything (incl. dashboard + paper)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          export HOME="${HOME:-${FULLSCAN_HOME:-/home/gha}}"
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          cd "${GITHUB_WORKSPACE:-.}"
          git checkout -- data/prices 2>/dev/null || true
          git clean -fd data/prices 2>/dev/null || true
          bash scripts/safe_git_push.sh \
            "auto: stock book ALL + paper dashboard" \
            data/universe data/exports data/join data/stock_book data/paper \
            data/sleeve_merge \
            data/peers data/checklist data/ab_checklist data/catalyst \
            01_daily/ 03_scoreboard/ 00_grounding/mutable_policy.md \
            00_grounding/book_policy.json 02_lessons/ dashboard/

      - name: Deploy dashboard to GitHub Pages (gh-pages)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/publish_dashboard.sh || true
          bash scripts/publish_dashboard.sh

      - name: Print fixed dashboard URL
        if: always()
        run: |
          echo "=============================================="
          echo "Fixed Chrome links (after Pages is enabled):"
          echo "  https://SRoyaltyy.github.io/fullscan/dashboard/"
          echo "  https://SRoyaltyy.github.io/fullscan/dashboard/sleeve-merge/"
          echo "  https://SRoyaltyy.github.io/fullscan/dashboard/sleeve-combine/"
          echo "  https://SRoyaltyy.github.io/fullscan/dashboard/mover-paper/"
          echo "  https://SRoyaltyy.github.io/fullscan/dashboard/boring-winners/"
          echo "  https://SRoyaltyy.github.io/fullscan/"
          echo "If 404: Repo Settings → Pages → Source = Deploy from branch → gh-pages / (root)"
          echo "=============================================="
