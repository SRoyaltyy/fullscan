name: Stock Book ALL (one-shot)

# Single entrypoint:
#   check prereqs → run missing → stock book → backtest → paper dashboard
#   then publish dashboard/ to GitHub Pages (fixed Chrome URL).
#
# LLM stages (predict / 11 sectors / events / news judge / book-reflect)
# hit Grok 4.6 via OpenClaw on the ECS. DeepSeek automatically takes over
# when Grok is unavailable, rate-limited, or out of credits.
# Must run on [self-hosted, ecs]: ubuntu-latest cannot reach the
# loopback gateway and used to fall back to DeepSeek every weekday.
# One ECS runner — a 6h book run will queue other ECS jobs.
# Catalyst daily is invoked inside src.run_stock_book_all before ranking
# so dossiers merge into news actions and land on the .io paper book.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "ecs (OpenClaw) or ubuntu (GitHub-hosted). ubuntu cannot reach Grok."
        required: false
        default: "ubuntu"
        type: choice
        options:
          - ecs
          - ubuntu
      run_date:
        description: "YYYY-MM-DD (empty = today ET)"
        required: false
        default: ""
      top:
        description: "Top N buy/sell per horizon"
        required: false
        default: "25"
      force:
        description: "true = re-run all prereqs even if files exist"
        required: false
        default: "false"
      skip_llm:
        description: "true = skip general + sector LLM (faster)"
        required: false
        default: "false"
      skip_extras:
        description: "true = stop after book + green.json (no paper/sleeve/catalyst)"
        required: false
        default: "false"
      force_sectors:
        description: "true = always run all 11 sector predicts"
        required: false
        default: "false"
  # ubuntu-only. ECS systemd 05:55 never starts GH land_book (that job
  # lives on preopen_all.yml, which has no schedule). A 17:00 UTC ECS
  # cron used to steal the box and miss 09:30. Schedule MUST force
  # ubuntu + skip_llm + skip_extras — inputs are empty on cron.
  schedule:
    - cron: "10 11 * * 1-5"   # ~06:10 ET — after 05:40 scrape
    - cron: "15 14 * * 1-5"   # ~09:15 ET — last chance before the bell
    # Hosted cron dropped the two shots above and the book landed after
    # webull_paper's 09:25 ET cutoff (2026-11-04 tickets at 15:02Z).
    # Every 10 min 12:00-14:50 UTC. The gate no-ops this cron once today's
    # book and tickets are on main, and at or after 09:25 ET. It does not
    # submit an order. skip-if-good still guards the 11:10 and 14:15 runs.
    - cron: "*/10 12-14 * * 1-5"
  # Merge of ranker/heal code must not wait for a newly-registered cron.
  # Do not match data/stock_book commits (GITHUB_TOKEN already will not
  # retrigger; a PAT still must not start a second rank). Pre-Open ALL
  # completion is covered by workflow_run. skip-if-good no-ops when
  # 1d is already all-green. h1 seal is the second event: it proves
  # today's predict is on main, which is the input the book ranks from.
  push:
    branches: [main]
    paths:
      - "src/stock_book.py"
      - "src/green_pile.py"
      - "src/skip_if_good.py"
      - "src/run_stock_book_all.py"
      - "src/weather.py"
      - ".github/workflows/stock_book_all.yml"
  workflow_run:
    workflows: ["Pre-Open ALL (predictive one-shot)", "h1 append-only forward"]
    types: [completed]

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  # Ubuntu heal must not queue behind a 6h ECS Grok book.
  # 2026-11-04: cancel-in-progress on ubuntu killed the morning book when
  # the next cron or workflow_run arrived, so the tickets missed 09:25 ET.
  # Twins queue. skip-if-good makes the waiter a no-op once the book is
  # green. ECS Grok stays in its own group and is not cancelled either.
  group: ${{ (github.event.inputs.runner != 'ecs') && 'stock-book-all-ubuntu' || 'stock-book-all-ecs' }}
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  gate:
    name: Clock gate (merge poke is not a 01:00 book)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        run: |
          ET_HM=$((10#$(TZ=America/New_York date +%H%M)))
          FORCE="${{ github.event.inputs.force }}"
          echo "ET_HM=$ET_HM event=${{ github.event_name }} force=$FORCE"
          # Push AND workflow_run (Pre-Open gated success) must not rank
          # a hollow book at 01:00. Only an explicit dispatch may run early.
          # 2026-10-16: cancelled Pre-Opens fired this via workflow_run and
          # landed weather + book before the predict existed. A workflow_run
          # only builds when that Pre-Open succeeded or today's predict is on main.
          if [ "${{ github.event_name }}" = "workflow_run" ] \
             && [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            D=$(TZ=America/New_York date +%F)
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/contents/01_daily/general/${D}_predict.md?ref=main" || echo 000)
            if [ "$CODE" != "200" ]; then
              echo "Pre-Open ${{ github.event.workflow_run.conclusion }} and no ${D} predict on main (HTTP $CODE) — no book/weather"
              echo "go=no" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Pre-Open ${{ github.event.workflow_run.conclusion }} but ${D} predict is on main — build"
          fi
          # Frequent fallback only. The 11:10 and 14:15 crons still run the
          # full skip-if-good check. This one must not checkout the tree
          # once today's book and the dated tickets file are already on
          # main, and it must not start a rank at or after 09:25 ET.
          if [ "${{ github.event_name }}" = "schedule" ] \
             && [ "${{ github.event.schedule }}" = "*/10 12-14 * * 1-5" ]; then
            if [ "$ET_HM" -ge 925 ]; then
              echo "frequent stock-book cron at or after 09:25 ET — no catch-up rank"
              echo "go=no" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            D=$(TZ=America/New_York date +%F)
            book_code=$(curl -sI -L -o /dev/null -w '%{http_code}' --max-time 20 \
              "https://raw.githubusercontent.com/${{ github.repository }}/main/data/stock_book/${D}_stock_book.json" || true)
            ticket_code=$(curl -sI -L -o /dev/null -w '%{http_code}' --max-time 20 \
              "https://raw.githubusercontent.com/${{ github.repository }}/main/data/day_board/${D}_strategy_tickets.json" || true)
            book_code=${book_code:-000}
            ticket_code=${ticket_code:-000}
            echo "frequent cron book=$book_code tickets=$ticket_code"
            if [ "$book_code" = "200" ] && [ "$ticket_code" = "200" ]; then
              echo "book and tickets for ${D} already on main — frequent cron is a no-op"
              echo "go=no" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "$ET_HM" -lt 535 ] && [ "$FORCE" != "true" ] \
             && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            # Run 41815073906: Pre-Open succeeded at 10:34Z (05:34 ET).
            # `all` was skipped, so no paper render and no dashboard artifact.
            # EST pre-open (09:55 UTC) finishes before 05:35 every winter.
            # A successful Pre-Open is not the 01:00 hollow-book case.
            if [ "${{ github.event_name }}" = "workflow_run" ] \
               && [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
              echo "successful Pre-Open before 05:35 ET — book and paper dashboard still run"
              echo "go=yes" >> "$GITHUB_OUTPUT"
            else
              echo "before 05:35 ET — ${{ github.event_name }} is not a book. 06:10 schedule + 05:40 scrape own the clock."
              echo "go=no" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

  all:
    needs: gate
    if: needs.gate.outputs.go == 'yes'
    runs-on: ${{ (github.event.inputs.runner == 'ecs') && fromJSON('["self-hosted","ecs"]') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (github.event.inputs.runner != 'ecs') && 90 || 360 }}
    env:
      # ECS persist / OpenClaw live under /home/gha. ubuntu-latest
      # (schedule / push / workflow_run / explicit ubuntu) must keep
      # the runner home or pip/git write to a missing directory.
      FULLSCAN_HOME: ${{ (github.event.inputs.runner != 'ecs') && '/home/runner' || '/home/gha' }}
      HOME: ${{ (github.event.inputs.runner != 'ecs') && '/home/runner' || '/home/gha' }}
      FINVIZ_SKIP_LIVE: "1"
      FULLSCAN_LAND: "1"
    steps:
      - name: Clear stale git index.lock (shared ECS workspace)
        shell: bash
        run: |
          # A job killed mid-checkout leaves .git/index.lock; the next checkout then hangs.
          # One ECS runner, so a lock older than 1 minute before checkout is stale.
          W="${GITHUB_WORKSPACE:-.}"
          for L in "$W/.git/index.lock" "$W/.git/shallow.lock" "$W/.git/HEAD.lock"; do
            if [ -n "$(find "$L" -mmin +1 2>/dev/null)" ]; then echo "removing stale $L"; rm -f "$L" || sudo -n rm -f "$L" || true; fi
          done
          if [ "$(git -C "$W" config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::shared ECS workspace is sparse; this checkout re-materializes the full tree"
          fi
      # 2026-11-03: checkout of the ~6.9 GB tree timed out / was cancelled.
      # Same lighter checkout as #730/#738: free unused toolchains, then depth 1.
      - name: Free runner disk (github-hosted only)
        if: runner.environment == 'github-hosted'
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1  # safe_git_push builds from origin/main's tree; no history needed
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull scrape + ranker inputs from main
        run: |
          git fetch origin main
          git checkout origin/main -- \
            01_daily/news/ 01_daily/map_heat/ data/exports/ \
            data/universe/ data/join/ data/ab_checklist/ data/peers/ \
            data/stock_book/ 01_daily/weather/ || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skip if book already satisfies the gate
        if: ${{ github.event.inputs.force != 'true' }}
        run: |
          DATE="${{ github.event.inputs.run_date }}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          if python3 -m src.skip_if_good --job stock_book_all --date "$DATE"; then
            echo "Book + green already all-green — no ranker"
            echo "skip=yes" >> "$GITHUB_ENV"
          fi

      - name: Open-pack tickets (even if book already good)
        if: env.skip == 'yes'
        env:
          FINVIZ_EMAIL: ${{ secrets.FINVIZ_EMAIL }}
          FINVIZ_PASSWORD: ${{ secrets.FINVIZ_PASSWORD }}
          FINVIZ_AUTH: ${{ secrets.FINVIZ_AUTH }}
          AUTH_TOKEN_FINVIZ: ${{ secrets.AUTH_TOKEN_FINVIZ }}
          FINVIZ_EXPORT: ${{ secrets.FINVIZ_EXPORT }}
          FINVIZ_SKIP_LIVE: ""
        run: |
          DATE="${{ github.event.inputs.run_date }}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          pip install pandas pyarrow openpyxl || pip install pandas || true
          chmod +x scripts/publish_open_pack.sh
          bash scripts/publish_open_pack.sh "$DATE"

      - name: Deploy Pages if day-board required files are present
        if: env.skip == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ github.event.inputs.run_date }}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          # Skip path: book_ok may be False / ranker not rerun, but tickets +
          # factor-mine today.json on main are enough. Deploy checks out main.
          if python3 -m src.pages_publish_gate --date "$DATE"; then
            gh workflow run deploy-dashboard.yml --ref main || true
          else
            echo "skip deploy — day-board required roles not OK yet (catalyst FAIL is ignored)"
          fi

      - name: Install
        if: env.skip != 'yes'
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary yfinance pandas requests openai ddgs || true

      - name: Run Stock Book ALL
        if: env.skip != 'yes'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_TIMEOUT: "10800"
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_KEY: ${{ secrets.DATABASE_KEY }}
          FINVIZ_EMAIL: ${{ secrets.FINVIZ_EMAIL }}
          FINVIZ_PASSWORD: ${{ secrets.FINVIZ_PASSWORD }}
          FINVIZ_EXPORT: ${{ secrets.FINVIZ_EXPORT }}
          GROK_ONLY: "0"
          FINVIZ_SKIP_LIVE: "1"
        run: |
          set -e
          DATE="${{ github.event.inputs.run_date }}"
          TOP="${{ github.event.inputs.top }}"
          FORCE="${{ github.event.inputs.force }}"
          SKIP="${{ github.event.inputs.skip_llm }}"
          SKIP_EXTRAS="${{ github.event.inputs.skip_extras }}"
          FSEC="${{ github.event.inputs.force_sectors }}"
          TOP="${TOP:-25}"
          FORCE="${FORCE:-false}"
          SKIP="${SKIP:-false}"
          SKIP_EXTRAS="${SKIP_EXTRAS:-false}"
          FSEC="${FSEC:-false}"
          if [ "${{ github.event_name }}" = "schedule" ] \
             || [ "${{ github.event_name }}" = "push" ] \
             || [ "${{ github.event_name }}" = "workflow_run" ]; then
            SKIP=true
            SKIP_EXTRAS=true
            echo "ubuntu land-book (${{ github.event_name }}) — skip LLM + extras (do not take ECS)"
          fi
          ET_HM=$((10#$(TZ=America/New_York date +%H%M)))
          if [ "$FORCE" != "true" ] && [ "$ET_HM" -ge 925 ]; then
            SKIP=true
            SKIP_EXTRAS=true
            echo "past 09:25 ET — skip LLM + extras so the book can still land"
          fi

          ARGS=(--top "$TOP")
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          [ "$SKIP" = "true" ] && ARGS+=(--skip-llm)
          [ "$SKIP_EXTRAS" = "true" ] && ARGS+=(--skip-extras)
          [ "$FSEC" = "true" ] && ARGS+=(--force-sectors)

          echo "CMD: python -m src.run_stock_book_all ${ARGS[*]}"
          python -m src.run_stock_book_all "${ARGS[@]}"

      - name: Show outputs
        if: always()
        run: |
          echo "======== stock book ========"
          f=$(ls -1t 01_daily/*_stock_book.md 2>/dev/null | head -1)
          [ -n "$f" ] && head -80 "$f" || true
          echo "======== catalyst ========"
          ls -1t 01_daily/catalyst/*_dossiers.md 2>/dev/null | head -3 || true
          echo "======== paper ========"
          head -40 03_scoreboard/PAPER_TRADING.md 2>/dev/null || true
          ls -la dashboard/ 2>/dev/null || true

      - name: Upload book + dashboard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-book-all
          path: |
            data/stock_book/
            data/peers/
            data/catalyst/
            01_daily/*_stock_book.md
            01_daily/*_peer_rs.md
            01_daily/catalyst/
            03_scoreboard/
            dashboard/
          if-no-files-found: warn

      - name: Upload dashboard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          # index.html alone left updown out of the artifact. Deploy then
          # published /dashboard/updown/ from the main overlay and never
          # copied the site-root alias, so /updown/ stayed 404.
          path: |
            dashboard/index.html
            dashboard/updown/
          if-no-files-found: warn

      - name: Commit everything (incl. dashboard + paper)
        if: always() && env.skip != 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          export HOME="${HOME:-${FULLSCAN_HOME:-/home/gha}}"
          mkdir -p "$HOME" 2>/dev/null || true
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          cd "${GITHUB_WORKSPACE:-.}"
          git checkout -- data/prices 2>/dev/null || true
          git clean -fd data/prices 2>/dev/null || true
          # Leftover sweep. Book / weather / join already landed per-file.
          bash scripts/safe_git_push.sh \
            "auto: stock book leftover sweep" \
            data/universe data/exports data/join data/stock_book data/paper \
            data/past_day_lock/ \
            data/sleeve_merge data/day_board \
            data/peers data/checklist data/ab_checklist data/catalyst \
            01_daily/ 03_scoreboard/ 00_grounding/mutable_policy.md \
            00_grounding/book_policy.json 02_lessons/ dashboard/ \
            || echo "[book] leftover sweep failed — lands already on main"

      - name: Deploy dashboard to GitHub Pages (gh-pages)
        if: always() && env.skip != 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/publish_dashboard.sh || true
          bash scripts/publish_dashboard.sh

      - name: Print fixed dashboard URL
        if: always()
        run: |
          echo "=============================================="
          echo "Fixed Chrome links (after Pages is enabled):"
          echo "  https://SRoyaltyy.github.io/fullscan/dashboard/"
          echo "  https://SRoyaltyy.github.io/fullscan/dashboard/sleeve-merge/"
          echo "  https://SRoyaltyy.github.io/fullscan/sleeve-merge/"
          echo "  https://SRoyaltyy.github.io/fullscan/dashboard/sleeve-combine/"
          echo "  https://SRoyaltyy.github.io/fullscan/dashboard/mover-paper/"
          echo "  https://SRoyaltyy.github.io/fullscan/dashboard/boring-winners/"
          echo "  https://SRoyaltyy.github.io/fullscan/"
          echo "If 404: Repo Settings → Pages → Source = Deploy from branch → gh-pages / (root)"
          echo "=============================================="
