name: Stock Book ALL (one-shot)

# Single entrypoint:
#   check prereqs → run missing → stock book → backtest → paper dashboard
#   then publish dashboard/ to GitHub Pages (fixed Chrome URL).
#
# LLM stages (predict / 11 sectors / events / news judge / book-reflect)
# hit Grok 4.6 via OpenClaw on the ECS. DeepSeek automatically takes over
# when Grok is unavailable, rate-limited, or out of credits.
# Must run on [self-hosted, ecs]: ubuntu-latest cannot reach the
# loopback gateway and used to fall back to DeepSeek every weekday.
# One ECS runner — a 6h book run will queue other ECS jobs.
# Catalyst daily is invoked inside src.run_stock_book_all before ranking
# so dossiers merge into news actions and land on the .io paper book.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "ecs (OpenClaw) or ubuntu (GitHub-hosted). ubuntu cannot reach Grok."
        required: false
        default: "ecs"
        type: choice
        options:
          - ecs
          - ubuntu
      run_date:
        description: "YYYY-MM-DD (empty = today ET)"
        required: false
        default: ""
      top:
        description: "Top N buy/sell per horizon"
        required: false
        default: "25"
      force:
        description: "true = re-run all prereqs even if files exist"
        required: false
        default: "false"
      skip_llm:
        description: "true = skip general + sector LLM (faster)"
        required: false
        default: "false"
      force_sectors:
        description: "true = always run all 11 sector predicts"
        required: false
        default: "false"
  # Clock retired 2026-09-04 — Pre-Open ALL writes the book before 09:30.
  # Keep dispatch for a manual re-rank. Do not add a cron back.
  # schedule:
  #   - cron: "0 17 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-book-all
  cancel-in-progress: false

jobs:
  all:
    runs-on: ${{ github.event.inputs.runner == 'ubuntu' && 'ubuntu-latest' || fromJSON('["self-hosted","ecs"]') }}
    timeout-minutes: 360
    env:
      FULLSCAN_HOME: "/home/gha"
      HOME: "/home/gha"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary yfinance pandas requests openai ddgs || true

      - name: Run Stock Book ALL
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_TIMEOUT: "10800"
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_KEY: ${{ secrets.DATABASE_KEY }}
          FINVIZ_EMAIL: ${{ secrets.FINVIZ_EMAIL }}
          FINVIZ_PASSWORD: ${{ secrets.FINVIZ_PASSWORD }}
          FINVIZ_EXPORT: ${{ secrets.FINVIZ_EXPORT }}
          GROK_ONLY: "0"
        run: |
          set -e
          DATE="${{ github.event.inputs.run_date }}"
          TOP="${{ github.event.inputs.top }}"
          FORCE="${{ github.event.inputs.force }}"
          SKIP="${{ github.event.inputs.skip_llm }}"
          FSEC="${{ github.event.inputs.force_sectors }}"
          TOP="${TOP:-25}"
          FORCE="${FORCE:-false}"
          SKIP="${SKIP:-false}"
          FSEC="${FSEC:-false}"

          ARGS=(--top "$TOP")
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          [ "$SKIP" = "true" ] && ARGS+=(--skip-llm)
          [ "$FSEC" = "true" ] && ARGS+=(--force-sectors)

          echo "CMD: python -m src.run_stock_book_all ${ARGS[*]}"
          python -m src.run_stock_book_all "${ARGS[@]}"

      - name: Show outputs
        if: always()
        run: |
          echo "======== stock book ========"
          f=$(ls -1t 01_daily/*_stock_book.md 2>/dev/null | head -1)
          [ -n "$f" ] && head -80 "$f" || true
          echo "======== catalyst ========"
          ls -1t 01_daily/catalyst/*_dossiers.md 2>/dev/null | head -3 || true
          echo "======== paper ========"
          head -40 03_scoreboard/PAPER_TRADING.md 2>/dev/null || true
          ls -la dashboard/ 2>/dev/null || true

      - name: Upload book + dashboard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-book-all
          path: |
            data/stock_book/
            data/peers/
            data/catalyst/
            01_daily/*_stock_book.md
            01_daily/*_peer_rs.md
            01_daily/catalyst/
            03_scoreboard/
            dashboard/
          if-no-files-found: warn

      - name: Commit everything (incl. dashboard + paper)
        if: always()
        run: |
          set -uo pipefail
          unset GIT_DIR GIT_WORK_TREE || true
          cd "${GITHUB_WORKSPACE:-.}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE:-$(pwd)}" || true
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"

          git checkout -- data/prices 2>/dev/null || true
          git clean -fd data/prices 2>/dev/null || true

          git add \
            data/universe data/exports data/join data/stock_book data/paper \
            data/peers data/checklist data/ab_checklist data/catalyst \
            01_daily/weather 01_daily/news 01_daily/catalyst 01_daily/general 01_daily/sectors \
            01_daily/events 01_daily/_transcripts 01_daily/_channel1 \
            01_daily/*_universe.md 01_daily/*_match.md \
            01_daily/*_stock_book.md 01_daily/*_stock_book_backtest.md \
            01_daily/*_peer_rs.md \
            03_scoreboard/STOCK_BOOK_BACKTEST.md \
            03_scoreboard/stock_book_backtest.json \
            03_scoreboard/scoreboard.json \
            03_scoreboard/PAPER_TRADING.md \
            03_scoreboard/BOOK_LEARN.md \
            03_scoreboard/BOOK_GAPS.md \
            00_grounding/mutable_policy.md \
            00_grounding/book_policy.json \
            02_lessons/ \
            dashboard/ || true

          git stash push --keep-index --include-untracked -m "all-unstaged" || true

          git status
          BOOK_PENDING=0
          if git diff --cached --name-only | grep -E 'stock_book|peer_rs' >/dev/null; then
            BOOK_PENDING=1
          fi
          if git status --porcelain -- data/stock_book data/peers 01_daily | grep -E 'stock_book|peer_rs' >/dev/null; then
            BOOK_PENDING=1
          fi

          if git diff --staged --quiet; then
            echo "Nothing staged — outputs may already be on main"
            git stash pop || true
            exit 0
          fi
          git commit -m "auto: stock book ALL + paper dashboard" || {
            echo "[warn] commit failed"
            git stash pop || true
            if [ "$BOOK_PENDING" = "1" ]; then
              echo "FATAL: book/peer_rs exists locally but commit failed"
              exit 1
            fi
            exit 0
          }

          PUSH_OK=0
          if ! git pull --rebase origin main; then
            echo "[warn] pull --rebase failed; trying pull --no-rebase"
            git pull origin main || true
          fi
          if git push origin HEAD:main; then
            PUSH_OK=1
            echo "Pushed stock book ALL outputs to main"
          else
            echo "[warn] first push rejected — rebase and retry"
            git pull --rebase origin main || git pull origin main || true
            if git push origin HEAD:main; then
              PUSH_OK=1
              echo "Pushed stock book ALL outputs to main (retry)"
            fi
          fi
          git stash pop || true

          if [ "$PUSH_OK" != "1" ]; then
            PENDING=$(git log origin/main..HEAD --name-only --pretty=format: 2>/dev/null | grep -E 'stock_book|peer_rs' || true)
            UNSTAGED=$(git status --porcelain -- data/stock_book data/peers 01_daily | grep -E 'stock_book|peer_rs' || true)
            if [ "$BOOK_PENDING" = "1" ] || [ -n "$PENDING" ] || [ -n "$UNSTAGED" ]; then
              echo "FATAL: book/peer_rs produced but push failed. Artifact is the safety net."
              echo "$PENDING"
              echo "$UNSTAGED"
              exit 1
            fi
            echo "[warn] push failed but no local book to lose"
          fi

      - name: Prepare Pages publish dir
        if: always()
        run: |
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE || true
          cd "${GITHUB_WORKSPACE:-.}"
          mkdir -p pages_out/dashboard
          touch pages_out/.nojekyll
          if [ -f dashboard/index.html ]; then
            cp -a dashboard/. pages_out/dashboard/
            cp dashboard/index.html pages_out/index.html
            echo "Prepared pages_out with dashboard"
          else
            echo "WARN: dashboard/index.html missing — Pages deploy may be empty"
          fi
          if [ -f dashboard/boring-winners/index.html ]; then
            mkdir -p pages_out/dashboard/boring-winners
            cp -a dashboard/boring-winners/. pages_out/dashboard/boring-winners/
            echo "Kept dashboard/boring-winners"
          fi
          if [ -f dashboard/ticker-lookback/index.html ]; then
            mkdir -p pages_out/dashboard/ticker-lookback
            cp -a dashboard/ticker-lookback/. pages_out/dashboard/ticker-lookback/
            echo "Kept dashboard/ticker-lookback"
          fi
          ls -la pages_out pages_out/dashboard
          ls -la pages_out/dashboard/boring-winners 2>/dev/null || echo "WARN: boring-winners missing from pages_out"

      - name: Deploy dashboard to GitHub Pages (gh-pages)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE || true
          cd "${GITHUB_WORKSPACE:-.}"
          if [ ! -f pages_out/index.html ]; then
            echo "WARN: pages_out/index.html missing — not touching gh-pages"
            exit 0
          fi
          test -f pages_out/dashboard/index.html
          TMP=$(mktemp -d)
          cp -a pages_out/. "$TMP/"
          touch "$TMP/.nojekyll"
          git -C "$TMP" init
          git -C "$TMP" checkout -b gh-pages
          git -C "$TMP" config user.name "Market-Bot-Automaton"
          git -C "$TMP" config user.email "bot@users.noreply.github.com"
          git -C "$TMP" add -A
          git -C "$TMP" commit -m "deploy dashboard ${GITHUB_SHA}"
          git -C "$TMP" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$TMP" push --force origin gh-pages
          echo "Published https://SRoyaltyy.github.io/fullscan/dashboard/"
          echo "Published https://SRoyaltyy.github.io/fullscan/dashboard/boring-winners/"
          echo "Published https://SRoyaltyy.github.io/fullscan/"

      - name: Print fixed dashboard URL
        if: always()
        run: |
          echo "=============================================="
          echo "Fixed Chrome links (after Pages is enabled):"
          echo "  https://SRoyaltyy.github.io/fullscan/dashboard/"
          echo "  https://SRoyaltyy.github.io/fullscan/dashboard/boring-winners/"
          echo "  https://SRoyaltyy.github.io/fullscan/"
          echo "If 404: Repo Settings → Pages → Source = Deploy from branch → gh-pages / (root)"
          echo "=============================================="
