name: Restore ab_backfill MD colors

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore base from last good commit + patch MD
        run: |
          set -euo pipefail
          GOOD=d1feedb21738eba35b87fd9cfb274fdd265cb2d3
          git show "$GOOD:src/ab_backfill.py" > src/ab_backfill.py
          wc -c src/ab_backfill.py
          head -5 src/ab_backfill.py
          python3 scripts/patch_ab_backfill_md_colors.py
          grep -n "Sector source footnote\|P01\|Peer lead\|_label_colored" src/ab_backfill.py | head
          # remove broken payload leftovers if any
          rm -f src/_ab_backfill.b64 src/_ab_backfill.b64.p0 src/_ab_backfill.b64.p1 src/_ab_backfill.b64.p2 src/_ab_backfill.b64.p3 || true

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add src/ab_backfill.py scripts/patch_ab_backfill_md_colors.py
          git add -u src/_ab_backfill.b64* 2>/dev/null || true
          git status
          git commit -m "fix: ab_backfill colored scores/labels, P01-P04 legend, sector footnotes"
          git pull --rebase origin main || true
          git push origin HEAD:main
