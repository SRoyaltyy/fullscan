name: News Actions Grader

# Backtests every buy/sell suggestion from the News Actions stage.
# Entry = open of the first trading day at/after the signal timestamp inside
# each actions JSON; tracks up to 14 trading days; a buy is profitable if
# any High > entry, a sell if any Low < entry. Recomputes the full board
# every run, so partially-elapsed windows keep updating until complete.

on:
  # schedule disabled 2026-08-29 — not in live pipeline
  # schedule:
  #   - cron: "45 21 * * 1-6"   # 21:45 UTC Mon–Sat (~17:45 ET, after close)
  workflow_dispatch:
    inputs:
      max_days:
        description: "Only grade newest N signal dates (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: news-grader
  cancel-in-progress: true

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install yfinance pandas
      - name: Grade news actions
        env:
          MAX_DAYS: ${{ github.event.inputs.max_days }}
        run: python -m src.news_grade ${MAX_DAYS:+--max-days "$MAX_DAYS"} || true
      - name: Preview report
        if: always()
        run: head -80 03_scoreboard/news_actions_report.md || true
      - name: Commit
        if: always()
        run: |
          export HOME="${HOME:-/home/gha}"
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          cd "${GITHUB_WORKSPACE:-.}"
          bash scripts/safe_git_push.sh \
            "auto: news actions grades [$(date -u +%F)]" \
            01_daily/news/grades \
            03_scoreboard/news_actions_scoreboard.json \
            03_scoreboard/news_actions_report.md
