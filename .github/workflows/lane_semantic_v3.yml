name: Lane semantic v3 catalog and batched 100
on:
  push:
    branches: [codex/lane-semantic-v3-20261013]
    paths:
      - 'src/news_impact/semantic_headlines.py'
      - 'scripts/run_semantic_headlines.py'
      - 'tests/fixtures/semantic_acceptance/batch_02.json'
      - '.github/workflows/lane_semantic_v3.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: 'First N frozen title-only inputs; reference is not loaded'
        default: '20'
        type: string
permissions:
  contents: read
concurrency:
  group: lane-semantic-pilot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /tests/fixtures/
            /data/exports/finviz_latest.csv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate semantic client contracts
        run: PYTHONPATH=.:scripts python -m unittest discover -s scripts -p 'test_semantic*.py'
      - name: Classify using existing provider secrets and classification floor
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
          MODELSCOPE_SDK_TOKEN: ${{ secrets.MODELSCOPE_SDK_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TOKENHUB_API_KEY: ${{ secrets.TOKENHUB_API_KEY }}
          TENCENT_API_KEY: ${{ secrets.TENCENT_API_KEY }}
          HUNYUAN_API_KEY: ${{ secrets.HUNYUAN_API_KEY }}
          TOKENHUB_BASE_URL: ${{ secrets.TOKENHUB_BASE_URL }}
          TENCENT_BASE_URL: ${{ secrets.TENCENT_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          LANE_ALLOW_PAID_DEEPSEEK: ${{ vars.LANE_ALLOW_PAID_DEEPSEEK }}
          PILOT_LIMIT: ${{ inputs.limit || '20' }}
        run: |
          PYTHONPATH=. python scripts/run_semantic_headlines.py \
            --input tests/fixtures/semantic_acceptance/batch_02.json \
            --output semantic_results/program_outputs.json \
            --limit 100 --budget-seconds 2400 --headline-timeout 300 \
            --batch-size 10 --batch-interval-seconds 45 --require-catalog \
            --providers gemini \
            --models gemini-3.5-flash-lite,gemini-3.5-flash,gemini-3.6-flash,gemini-3.7-flash,gemini-3.8-flash
      - name: Preserve outputs even on timeout or provider failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-semantic-v3-fresh-100
          path: semantic_results/
          if-no-files-found: warn


