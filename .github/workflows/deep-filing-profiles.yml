name: Deep SEC filing profiles
on:
  pull_request:
    paths:
      - 'src/filing_relationships.py'
      - 'src/relationship_frames.py'
      - 'src/stock_evidence_graph.py'
      - 'src/stock_document_context.py'
      - 'src/term_inventory.py'
      - 'src/specific_filing_records.py'
      - 'src/test_term_inventory.py'
      - 'src/filing_evidence.py'
      - 'src/test_filing_relationships.py'
      - 'src/deep_profile_store.py'
      - 'scripts/build_filing_profiles.py'
      - 'scripts/audit_filing_profiles.py'
      - 'scripts/materialize_filing_texts.py'
      - 'requirements-filing-parser.txt'
      - '.github/workflows/deep-filing-profiles.yml'
  push:
    branches: [main]
    paths:
      - 'src/filing_relationships.py'
      - 'src/relationship_frames.py'
      - 'src/stock_evidence_graph.py'
      - 'src/stock_document_context.py'
      - 'src/term_inventory.py'
      - 'src/specific_filing_records.py'
      - 'src/test_term_inventory.py'
      - 'src/filing_evidence.py'
      - 'src/test_filing_relationships.py'
      - 'src/deep_profile_store.py'
      - 'scripts/build_filing_profiles.py'
      - 'scripts/audit_filing_profiles.py'
      - 'scripts/materialize_filing_texts.py'
      - 'data/company_filings_full_release.json'
      - 'requirements-filing-parser.txt'
      # Publication-only workflow edits keep the current full rebuild running.
      # Parser/source changes above still rebuild; workflow_dispatch is available.
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: deep-filing-profiles-${{ github.ref }}
  cancel-in-progress: true
env:
  PIP_CONFIG_FILE: /dev/null
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  DO_NOT_TRACK: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
jobs:
  controls:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    timeout-minutes: 40
    outputs:
      shards: ${{ steps.release.outputs.shards }}
      issuers: ${{ steps.release.outputs.issuers }}
      filings: ${{ steps.release.outputs.filings }}
      asof: ${{ steps.release.outputs.asof }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            scripts
            requirements-filing-parser.txt
            excel_bot/data/finviz_with_descriptions.csv
            data/company_filings_full_release.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve every shard in the verified archive release
        id: release
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          release = json.loads(Path('data/company_filings_full_release.json').read_text())
          assert release['complete']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('shards='+json.dumps([{'shard': s['shard']} for s in release['source_artifacts']])+'\n')
              stream.write('issuers='+str(release['coverage']['expected_issuers'])+'\n')
              stream.write('filings='+str(release['coverage']['expected_filings'])+'\n')
              stream.write('asof='+datetime.now(timezone.utc).date().isoformat()+'\n')
          PY
      - name: Install prebuilt grammar dependencies from PyPI, no package build scripts
        run: >-
          python -m pip install --only-binary=:all: --index-url https://pypi.org/simple
          -r requirements-filing-parser.txt
      - name: Grammar, provenance, uncertainty, direction and offline controls
        run: python -m unittest src.test_filing_relationships src.test_term_inventory -v
      - name: Read all ten archived Backblaze filings for a real source check
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/materialize_filing_texts.py --repository "$GITHUB_REPOSITORY"
          --artifact-id 12109086101 --ticker BLZE --as-of 2026-10-20 --out real-source
      - name: Compile real Backblaze relationships
        run: >-
          python -u -m scripts.build_filing_profiles --objects real-source/objects
          --as-of 2026-10-20 --descriptions excel_bot/data/finviz_with_descriptions.csv --out real-profiles
      - name: Audit exact real-source quotations and report extraction coverage
        run: python -m scripts.audit_filing_profiles --profiles real-profiles --objects real-source/objects
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-filing-real-source-check
          path: real-profiles/
          retention-days: 30
      - name: Publish the current real-filing sample while all-issuer compilation continues
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scanner-backtest-publish.yml --ref main
  compile:
    needs: controls
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.controls.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            scripts
            data/company_filings_full_release.json
            excel_bot/data/finviz_with_descriptions.csv
            requirements-filing-parser.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install prebuilt, pinned grammar engine
        run: >-
          python -m pip install --only-binary=:all: --index-url https://pypi.org/simple
          -r requirements-filing-parser.txt
      - name: Resolve the verified full archive shard
        env:
          SOURCE_SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('data/company_filings_full_release.json').read_text())
          for shard in release['source_artifacts']:
              if int(shard['shard']) == int(os.environ['SOURCE_SHARD']):
                  with open(os.environ['GITHUB_ENV'], 'a') as stream:
                      stream.write('SOURCE_ARTIFACT='+str(shard['id'])+'\n')
                  break
          else: raise SystemExit('Source shard is absent from verified release')
          PY
      - uses: actions/cache@v4
        with:
          path: full-text-source
          key: whole-filing-texts-${{ env.SOURCE_ARTIFACT }}
      - name: Materialize EVERY issuer and filing in this source shard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f full-text-source/text-materialization-report.json ]; then
            python scripts/materialize_filing_texts.py --repository "$GITHUB_REPOSITORY" --artifact-id "$SOURCE_ARTIFACT" --out full-text-source
          fi
      - name: Set the explicit filing cutoff
        run: echo "FILING_AS_OF=${{ needs.controls.outputs.asof }}" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: compiled-profiles
          key: deep-profiles-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: deep-profiles-${{ matrix.shard }}-
      - name: Compile all dated full-text sources, with per-issuer checkpoints
        run: >-
          python -u -m scripts.build_filing_profiles --objects full-text-source/objects
          --as-of "$FILING_AS_OF" --descriptions excel_bot/data/finviz_with_descriptions.csv
          --out compiled-profiles
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-filing-profiles-${{ matrix.shard }}
          path: compiled-profiles/
          retention-days: 90
  combine:
    needs: [controls, compile]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: deep-filing-profiles-*
          path: shards
      - name: Require complete archived issuer and filing coverage
        run: >-
          python -m scripts.build_filing_profiles --merge shards --out filing-profiles
          --expected-companies ${{ needs.controls.outputs.issuers }} --expected-filings ${{ needs.controls.outputs.filings }}
      - uses: actions/upload-artifact@v4
        with:
          name: deep-filing-profiles-complete
          path: filing-profiles/
          retention-days: 90
