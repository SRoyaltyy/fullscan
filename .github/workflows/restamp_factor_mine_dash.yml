name: Restamp factor-mine dash

# Rebuild dashboard/factor-mine/index.html from src/factor_mine_dash.html
# using the already-baked payload. No remine.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/factor_mine_dash.html"
      - ".github/workflows/restamp_factor_mine_dash.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: restamp-factor-mine-dash
  cancel-in-progress: true

jobs:
  restamp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pandas pyarrow
      - name: Restamp Pages HTML from template
        run: |
          set -euo pipefail
          python - <<'PY'
          from src.factor_mine import (
              load_dash_payload, write_dash_html, ticket_session_date,
          )
          payload = load_dash_payload()
          print("ticket", ticket_session_date(),
                "dates", (payload.get("dates") or [])[-3:],
                "to", payload.get("to_date"))
          dest = write_dash_html(payload)
          baked = load_dash_payload()
          print("wrote", dest, "recipes", baked.get("n_recipes"),
                "to", baked.get("to_date"),
                "dates", (baked.get("dates") or [])[-3:])
          PY
          test -s dashboard/factor-mine/index.html
          echo "--- template markers ---"
          grep -c "function chartPool" src/factor_mine_dash.html || true
          grep -c "height:168px" src/factor_mine_dash.html || true
          grep -c "slice(0,8)" src/factor_mine_dash.html || true
          echo "--- baked markers ---"
          grep -c "function chartPool" dashboard/factor-mine/index.html || true
          grep -c "height:168px" dashboard/factor-mine/index.html || true
      - name: Publish restamped dash
        run: |
          bash scripts/safe_git_push.sh \
            "fix: factor-mine chart size and sleeve toggles" \
            dashboard/factor-mine/index.html \
            src/factor_mine_dash.html
      - name: Refresh GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-dashboard.yml --ref main || true
