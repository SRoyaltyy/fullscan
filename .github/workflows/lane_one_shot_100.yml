name: Lane one-shot 100

# Research only. Gate0 rejects junk, then Lane classifies, confirms the
# Finviz hit list, and writes the family action. Never publishes a
# deterministic classify.py board. Does not touch flatten / Webull /
# live factor-mine / Supabase.
#
# A full run shares the one ecs-openclaw runner with the cash pipeline.
# It has the overnight window only: after the evening post-close pack
# (about 18:30 ET) and before Pre-Open (~04:00 ET). Default budget is
# 540 minutes, hard stop 03:30 ET. Gold and merge are reserved, and the
# five shards split what is left. Each shard stops and uploads before
# its slice ends. Merge still builds a board from partial shards.
#
# Snapshots already live in data/theme_radar_snapshots. Do not
# sparse-checkout the theme-radar repo.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: gold runs the fixtures only. full draws 100 after gold passes.
        required: true
        default: gold
        type: choice
        options:
          - gold
          - full
      target_per_shard:
        description: Usable rows to keep in each shard
        required: false
        default: "20"
        type: string
      max_draws_per_shard:
        description: Stop redrawing a shard after this many draws
        required: false
        default: "150"
        type: string
      runner:
        description: ecs (OpenClaw) or ubuntu (GitHub-hosted). ubuntu cannot reach Grok.
        required: false
        default: ecs
        type: choice
        options:
          - ecs
          - ubuntu
      llm_backend:
        description: grok classifies on OpenClaw first. auto still tries Grok first.
        required: false
        default: grok
        type: choice
        options:
          - grok
          - auto
      run_budget_minutes:
        description: >
          Total wall-clock minutes for gold, five serial shards, and merge.
          Default 540 is a dispatch at 18:30 ET through the 03:30 ET deadline.
        required: false
        default: "540"
        type: string
      deadline_et:
        description: >
          Hard stop in America/New_York (HH:MM). Default 03:30, before Pre-Open (~04:00 ET).
          The run ends at the earlier of this clock and now plus run_budget_minutes.
        required: false
        default: "03:30"
        type: string
      gold_budget_minutes:
        description: >
          Minutes reserved for the gold gate. Run 35929449213 took 54; default 75 leaves slack.
        required: false
        default: "75"
        type: string
      merge_budget_minutes:
        description: >
          Minutes reserved so merge still finishes before the deadline. Default 20.
        required: false
        default: "20"
        type: string
  # Push starts the gold gate only. The 100-draw is workflow_dispatch mode=full
  # after that gate is green. inputs.mode is empty on push, so shard stays off.
  push:
    paths:
      - ".github/workflows/lane_one_shot_100.yml"
      - "src/lane_one_shot.py"
      - "src/lane_route.py"
      - "src/news_impact/one_shot_stack.py"
      - "src/news_impact/prompts.py"
      - "src/test_lane_one_shot.py"

# Separate group from the older lane-one-shot-100 runs so a gold gate is
# not queued behind a Ministral classify draw.
concurrency:
  group: lane-one-shot-floor-${{ github.ref }}-${{ github.event.inputs.mode || 'gold' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gold:
    needs: budget
    # A push whose message contains [skip gold] does not call providers.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip gold]') }}
    # Gold is ECS only. A GitHub-hosted gold job cannot reach OpenClaw.
    runs-on: [self-hosted, ecs]
    # Lane JSON only. Pre-Open's OPENCLAW_TIMEOUT is 10800s for a tool turn.
    # 300s still returns on a hang so the free hopper runs.
    # The cap is the gold slice of the overnight window, not 120 minutes.
    timeout-minutes: ${{ fromJSON(needs.budget.outputs.gold_timeout_minutes) }}
    steps:
      # Persistent ECS workspace. A bare checkout detaches whatever commit
      # the last job left behind before it fetches. Pin the dispatched SHA
      # and fail the job if HEAD is still that stale tree.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true

      - name: Confirm checkout tip
        run: |
          # checkout@v4 marks safe.directory only inside a temp HOME.
          # The next step inherits the runner HOME, and this ECS workspace
          # is a different owner, so a bare rev-parse exits 128.
          head=$(git -c safe.directory="${GITHUB_WORKSPACE}" rev-parse HEAD)
          echo "HEAD=${head}"
          echo "expected=${{ github.sha }}"
          test "${head}" = "${{ github.sha }}"

      - name: Install
        run: |
          python3 --version
          PYTHONPATH=. python3 -c "import src.lane_one_shot, src.lane_route, src.news_impact.one_shot_stack"

      - name: Env check
        env:
          LANE_URL: ${{ vars.LANE_URL }}
          LANE_ALLOW_PAID_DEEPSEEK: ${{ vars.LANE_ALLOW_PAID_DEEPSEEK }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL || vars.OLLAMA_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
          MODELSCOPE_SDK_TOKEN: ${{ secrets.MODELSCOPE_SDK_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TOKENHUB_API_KEY: ${{ secrets.TOKENHUB_API_KEY }}
          TENCENT_API_KEY: ${{ secrets.TENCENT_API_KEY }}
          HUNYUAN_API_KEY: ${{ secrets.HUNYUAN_API_KEY }}
          TOKENHUB_BASE_URL: ${{ secrets.TOKENHUB_BASE_URL }}
          TENCENT_BASE_URL: ${{ secrets.TENCENT_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_BACKEND_MODEL: xai/grok-4.6
          OPENCLAW_LANE_TIMEOUT: "300"
          LLM_BACKEND: ${{ github.event.inputs.llm_backend || 'grok' }}
        run: PYTHONPATH=. python3 -m src.lane_one_shot --env-check

      - name: Gold fixtures only
        env:
          LANE_URL: ${{ vars.LANE_URL }}
          LANE_ALLOW_PAID_DEEPSEEK: ${{ vars.LANE_ALLOW_PAID_DEEPSEEK }}
          # OR :free already 429'd this hour. Do not burn the rest of the cap on gold.
          LANE_SKIP_OPENROUTER: "1"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL || vars.OLLAMA_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
          MODELSCOPE_SDK_TOKEN: ${{ secrets.MODELSCOPE_SDK_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TOKENHUB_API_KEY: ${{ secrets.TOKENHUB_API_KEY }}
          TENCENT_API_KEY: ${{ secrets.TENCENT_API_KEY }}
          HUNYUAN_API_KEY: ${{ secrets.HUNYUAN_API_KEY }}
          TOKENHUB_BASE_URL: ${{ secrets.TOKENHUB_BASE_URL }}
          TENCENT_BASE_URL: ${{ secrets.TENCENT_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_BACKEND_MODEL: xai/grok-4.6
          OPENCLAW_LANE_TIMEOUT: "300"
          LLM_BACKEND: ${{ github.event.inputs.llm_backend || 'grok' }}
          PYTHONUNBUFFERED: "1"
        run: |
          PYTHONPATH=. python3 -m src.lane_one_shot --gold-only \
            --budget-seconds "${{ needs.budget.outputs.gold_budget_seconds }}" \
            --deadline-epoch "${{ needs.budget.outputs.deadline_epoch }}" \
            --merge-reserve-seconds "${{ needs.budget.outputs.merge_reserve_seconds }}"

      - name: Upload gold report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-one-shot-gold
          path: |
            03_scoreboard/LANE_ONE_SHOT_GOLD.md
            02_lessons/lane/one_shot_100
          if-no-files-found: warn

  shard:
    needs: [gold, budget]
    if: ${{ github.event.inputs.mode == 'full' }}
    runs-on: ${{ (github.event_name == 'push' || github.event.inputs.runner == 'ubuntu') && 'ubuntu-latest' || fromJSON('["self-hosted","ecs"]') }}
    # One slice of (window - gold - merge) / 5.
    # The draw loop stops earlier so Upload shard still runs.
    timeout-minutes: ${{ fromJSON(needs.budget.outputs.shard_job_timeout_minutes) }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          python3 --version
          # Hopper client is stdlib urllib. Do not install playwright or cloakbrowser.
          PYTHONPATH=. python3 -c "import src.lane_one_shot, src.lane_route, src.news_impact.finviz_linker, src.news_impact.one_shot_stack"

      - name: Env check
        env:
          LANE_URL: ${{ vars.LANE_URL }}
          LANE_ALLOW_PAID_DEEPSEEK: ${{ vars.LANE_ALLOW_PAID_DEEPSEEK }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL || vars.OLLAMA_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
          MODELSCOPE_SDK_TOKEN: ${{ secrets.MODELSCOPE_SDK_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TOKENHUB_API_KEY: ${{ secrets.TOKENHUB_API_KEY }}
          TENCENT_API_KEY: ${{ secrets.TENCENT_API_KEY }}
          HUNYUAN_API_KEY: ${{ secrets.HUNYUAN_API_KEY }}
          TOKENHUB_BASE_URL: ${{ secrets.TOKENHUB_BASE_URL }}
          TENCENT_BASE_URL: ${{ secrets.TENCENT_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_BACKEND_MODEL: xai/grok-4.6
          OPENCLAW_LANE_TIMEOUT: "300"
          LLM_BACKEND: ${{ github.event.inputs.llm_backend || 'grok' }}
        run: PYTHONPATH=. python3 -m src.lane_one_shot --env-check

      - name: Draw, Lane, validate
        env:
          LANE_URL: ${{ vars.LANE_URL }}
          LANE_ALLOW_PAID_DEEPSEEK: ${{ vars.LANE_ALLOW_PAID_DEEPSEEK }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL || vars.OLLAMA_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
          MODELSCOPE_SDK_TOKEN: ${{ secrets.MODELSCOPE_SDK_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TOKENHUB_API_KEY: ${{ secrets.TOKENHUB_API_KEY }}
          TENCENT_API_KEY: ${{ secrets.TENCENT_API_KEY }}
          HUNYUAN_API_KEY: ${{ secrets.HUNYUAN_API_KEY }}
          TOKENHUB_BASE_URL: ${{ secrets.TOKENHUB_BASE_URL }}
          TENCENT_BASE_URL: ${{ secrets.TENCENT_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_BACKEND_MODEL: xai/grok-4.6
          OPENCLAW_LANE_TIMEOUT: "300"
          LLM_BACKEND: ${{ github.event.inputs.llm_backend || 'grok' }}
          PYTHONUNBUFFERED: "1"
        run: |
          PYTHONPATH=. python3 -m src.lane_one_shot \
            --shard "${{ matrix.shard }}" \
            --shards 5 \
            --target "${{ github.event.inputs.target_per_shard || '20' }}" \
            --max-draws "${{ github.event.inputs.max_draws_per_shard || '150' }}" \
            --budget-seconds "${{ needs.budget.outputs.shard_budget_seconds }}" \
            --deadline-epoch "${{ needs.budget.outputs.deadline_epoch }}" \
            --merge-reserve-seconds "${{ needs.budget.outputs.merge_reserve_seconds }}"

      - name: Upload shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-one-shot-shard-${{ matrix.shard }}
          path: 02_lessons/lane/one_shot_100
          if-no-files-found: warn

  merge:
    needs: [gold, shard, budget]
    # A timed-out shard is "cancelled". always() lets merge run from
    # whatever shard files were uploaded. A user-cancelled workflow
    # still skips this job. Gold must have passed.
    if: ${{ always() && github.event.inputs.mode == 'full' && needs.gold.result == 'success' && needs.shard.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.budget.outputs.merge_timeout_minutes) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download shards
        uses: actions/download-artifact@v4
        with:
          pattern: lane-one-shot-shard-*
          merge-multiple: true
          path: one_shot_artifacts

      - name: Merge board
        id: merge
        run: |
          PYTHONPATH=. python3 -m src.lane_one_shot \
            --merge one_shot_artifacts --expect 100 --shard-count 5

      - name: Report full-board check
        if: steps.merge.outcome == 'success'
        continue-on-error: true
        run: PYTHONPATH=. python3 -m src.lane_one_shot --check-board 03_scoreboard/LANE_ONE_SHOT_100.md

      - name: Upload merged board
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-one-shot-board
          path: 03_scoreboard/LANE_ONE_SHOT_100.md
          if-no-files-found: warn

      - name: Commit board to this branch
        if: steps.merge.outcome == 'success'
        run: |
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add 03_scoreboard/LANE_ONE_SHOT_100.md 02_lessons/lane/one_shot_100 || true
          if git diff --staged --quiet; then
            echo "No Lane board to commit"
            exit 0
          fi
          git commit -m "auto: lane one-shot 100 board"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  budget:
    # Ubuntu, not the ECS runner. Gold and every shard read this plan.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deadline_epoch: ${{ steps.plan.outputs.deadline_epoch }}
      gold_timeout_minutes: ${{ steps.plan.outputs.gold_timeout_minutes }}
      gold_budget_seconds: ${{ steps.plan.outputs.gold_budget_seconds }}
      merge_timeout_minutes: ${{ steps.plan.outputs.merge_timeout_minutes }}
      merge_reserve_seconds: ${{ steps.plan.outputs.merge_reserve_seconds }}
      shard_job_timeout_minutes: ${{ steps.plan.outputs.shard_job_timeout_minutes }}
      shard_budget_seconds: ${{ steps.plan.outputs.shard_budget_seconds }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan overnight window
        id: plan
        run: |
          PYTHONPATH=. python3 -m src.lane_one_shot --print-budgets \
            --shards 5 \
            --run-budget-minutes "${{ github.event.inputs.run_budget_minutes || '540' }}" \
            --deadline-et "${{ github.event.inputs.deadline_et || '03:30' }}" \
            --gold-budget-minutes "${{ github.event.inputs.gold_budget_minutes || '75' }}" \
            --merge-budget-minutes "${{ github.event.inputs.merge_budget_minutes || '20' }}"
