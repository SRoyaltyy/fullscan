name: Pre-Open ALL (predictive one-shot)

# CLOCK: ECS systemd timer 05:55 America/New_York only.
# No GitHub cron. Orchestrator does not re-dispatch this job.
# Skip-if-good is file QC only (src.skip_if_good) — no Grok/DeepSeek.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "ecs (OpenClaw) or ubuntu (GitHub-hosted). ubuntu cannot reach Grok."
        required: false
        default: "ecs"
        type: choice
        options:
          - ecs
          - ubuntu
      run_date:
        description: "YYYY-MM-DD (empty = today ET)"
        required: false
        default: ""
      force:
        description: "true = ignore 09:25 ET cutoff and skip-if-good"
        required: false
        default: "false"

permissions:
  contents: write
  actions: read

concurrency:
  group: preopen-all
  cancel-in-progress: true

jobs:
  preopen:
    runs-on: ${{ github.event.inputs.runner == 'ubuntu' && 'ubuntu-latest' || fromJSON('["self-hosted","ecs"]') }}
    timeout-minutes: 360
    env:
      OPENCLAW_TIMEOUT: "10800"
      FULLSCAN_PERSIST: "/home/gha/fullscan-persist"
      FULLSCAN_HOME: "/home/gha"
      HOME: "/home/gha"
      FINVIZ_SKIP_LIVE: "1"
    steps:
      - name: Wait if ECS systemd pre-open owns the box
        run: |
          echo "waited_for_lock=no" >> "$GITHUB_ENV"
          exec 9>/tmp/fullscan-preopen.lock
          if flock -n 9; then
            echo "lock is free"
            flock -u 9 || true
          else
            echo "ECS systemd job holds the lock — backing off"
            echo "skip=yes" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.skip != 'yes'
        with:
          clean: false

      - name: Skip if morning packet already on disk (no LLM)
        if: env.skip != 'yes' && github.event.inputs.force != 'true'
        run: |
          DATE="${{ github.event.inputs.run_date }}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          if python3 -m src.skip_if_good --job preopen_all --date "$DATE"; then
            echo "Morning packet already on disk — no Grok/DeepSeek"
            echo "skip_python=yes" >> "$GITHUB_ENV"
          fi

      - name: Raise OpenClaw timeouts + enable 05:55 timer if missing
        if: env.skip != 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export HOME="${FULLSCAN_HOME:-/home/gha}"
          chmod +x scripts/ensure_openclaw_timeouts.sh scripts/ensure_ecs_clock.sh \
            scripts/install_ecs_preopen.sh scripts/ecs_preopen.sh \
            scripts/ecs_map_postclose.sh scripts/safe_git_push.sh || true
          bash scripts/ensure_ecs_clock.sh

      - name: Gate — weekend / past cutoff
        if: env.skip != 'yes' && github.event.inputs.force != 'true'
        run: |
          DOW=$(TZ=America/New_York date +%u)
          ET_HM=$((10#$(TZ=America/New_York date +%H%M)))
          echo "DOW=$DOW ET_HM=$ET_HM"
          if [ "$DOW" -ge 6 ]; then
            echo "Weekend — pre-open ALL skipped."
            echo "skip=yes" >> "$GITHUB_ENV"
          elif [ "$ET_HM" -ge 925 ]; then
            echo "past 09:25 ET — skip python"
            echo "skip_python=yes" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: env.skip != 'yes' && env.skip_python != 'yes'
        with:
          python-version: "3.10"

      - name: Install
        if: env.skip != 'yes' && env.skip_python != 'yes'
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary yfinance pandas requests openai ddgs || true

      - name: Pre-Open ALL (predictive + QC + workflow check)
        if: env.skip != 'yes' && env.skip_python != 'yes'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_KEY: ${{ secrets.DATABASE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCLAW_TIMEOUT: "10800"
          GROK_ONLY: "0"
          FINVIZ_SKIP_LIVE: "1"
        run: |
          set -e
          export HOME="${FULLSCAN_HOME:-/home/gha}"
          exec 9>/tmp/fullscan-preopen.lock
          if ! flock -n 9; then
            echo "ECS systemd job grabbed the lock — backing off"
            exit 0
          fi
          DATE="${{ github.event.inputs.run_date }}"
          FORCE="${{ github.event.inputs.force }}"
          FORCE="${FORCE:-false}"
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          echo "CMD: python -m src.run_preopen_all ${ARGS[*]}"
          python -m src.run_preopen_all "${ARGS[@]}"

      - name: Show QC
        if: always() && env.skip != 'yes' && env.skip_python != 'yes'
        run: |
          D="${{ github.event.inputs.run_date }}"
          D="${D:-$(TZ=America/New_York date +%F)}"
          python -m src.output_qc --date "$D" --preopen || true
          cat "01_daily/${D}_preopen_status.md" 2>/dev/null || true

      - name: Commit predictive artifacts
        if: always() && env.skip != 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export HOME="${FULLSCAN_HOME:-/home/gha}"
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          cd "${GITHUB_WORKSPACE:-.}"
          PATHS=(01_daily/_ecs_clock.md)
          if [ "${skip_python:-}" != "yes" ]; then
            PATHS+=(01_daily/general/ 01_daily/sectors/ 01_daily/events
              01_daily/news/ 01_daily/map_heat/ 01_daily/catalyst/
              data/catalyst/ 01_daily/_transcripts/ 01_daily/_channel1/
              01_daily/*_preopen_qc.json 01_daily/*_preopen_status.json
              01_daily/*_preopen_status.md
              01_daily/*_grok_review.json 01_daily/*_grok_review.md
              02_lessons/ 03_scoreboard/)
          fi
          bash scripts/safe_git_push.sh \
            "auto: pre-open ALL [$(date -u +%F_%H%M)]" \
            "${PATHS[@]}"
