name: Pre-Open ALL (predictive one-shot)

# One morning button: GH scrape (ubuntu) → book+green (ubuntu, no Grok)
#   → packet (ECS). The ubuntu ranker does not wait on the ECS box —
#   a 3h Grok hang must not leave BUY/SELL empty at 09:30.
# CLOCK: ECS systemd 05:55 ET still owns the unattended start.
# Skip-if-good: each file already quality-ok is not rewritten (no LLM).

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "ecs (OpenClaw) or ubuntu (GitHub-hosted). ubuntu cannot reach Grok."
        required: false
        default: "ecs"
        type: choice
        options:
          - ecs
          - ubuntu
      run_date:
        description: "YYYY-MM-DD (empty = today ET)"
        required: false
        default: ""
      force:
        description: "true = ignore 09:25 ET cutoff and skip-if-good"
        required: false
        default: "false"
      llm_backend:
        description: "auto = Grok then DeepSeek · grok = Grok only · deepseek = no Grok"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - grok
          - deepseek
      with_book:
        description: "true = also write stock book + .io paper dashboard"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  actions: write
  pages: write

concurrency:
  group: preopen-all
  cancel-in-progress: false

jobs:
  scrape:
    name: Finviz scrape (ubuntu — ECS 403s)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skip if digest + overlay already on disk
        if: github.event.inputs.force != 'true'
        run: |
          DATE="${{ github.event.inputs.run_date }}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          if python3 -m src.skip_if_good --job finviz_preopen_scrape --date "$DATE"; then
            echo "skip=yes" >> "$GITHUB_ENV"
          fi
      - name: Install
        if: env.skip != 'yes'
        run: pip install -r requirements.txt && pip install pandas requests beautifulsoup4 lxml psycopg2-binary || true
      - name: Digest + morning overlay
        if: env.skip != 'yes'
        env:
          FINVIZ_EMAIL: ${{ secrets.FINVIZ_EMAIL }}
          FINVIZ_PASSWORD: ${{ secrets.FINVIZ_PASSWORD }}
          FINVIZ_AUTH: ${{ secrets.FINVIZ_AUTH }}
          AUTH_TOKEN_FINVIZ: ${{ secrets.AUTH_TOKEN_FINVIZ }}
          FINVIZ_EXPORT: ${{ secrets.FINVIZ_EXPORT }}
        run: |
          set -euo pipefail
          DATE="${{ github.event.inputs.run_date }}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          python -m src.finviz_digest --date "$DATE"
          ARGS=(--date "$DATE" --overlay)
          [ "${{ github.event.inputs.force }}" = "true" ] && ARGS+=(--force)
          python -m src.map_heat "${ARGS[@]}"
          echo "CMD: python -m collectors.finviz_financials (elite CSV for the book)"
          FULLSCAN_DB_OPTIONAL=1 python -m collectors.finviz_financials || echo "[warn] elite export soft-failed"
      - name: Commit scrape
        if: always() && env.skip != 'yes'
        run: |
          bash scripts/safe_git_push.sh \
            "auto: finviz preopen scrape (via Pre-Open ALL) [$(date -u +%F_%H%M)]" \
            01_daily/news/ 01_daily/map_heat/ data/exports/

  land_book:
    name: Land book + green (ubuntu — no Grok, no ECS)
    needs: scrape
    if: ${{ always() && github.event.inputs.with_book != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FINVIZ_SKIP_LIVE: "1"
      FULLSCAN_DB_OPTIONAL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pull scrape + export from main (this run's SHA predates the scrape commit)
        run: |
          git fetch origin main
          git checkout origin/main -- \
            01_daily/news/ 01_daily/map_heat/ data/exports/ \
            data/universe/ data/join/ data/ab_checklist/ data/peers/ \
            data/stock_book/ 01_daily/weather/ || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skip if book + green already on disk
        run: |
          DATE="${{ github.event.inputs.run_date }}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          FORCE="${{ github.event.inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            echo "force=true — rank even if a book is on disk"
          elif python3 -m src.skip_if_good --job stock_book_all --date "$DATE"; then
            echo "Book + green already on disk — no ranker"
            echo "skip=yes" >> "$GITHUB_ENV"
          fi
      - name: Install
        if: env.skip != 'yes'
        run: |
          pip install -r requirements.txt
          pip install pandas yfinance requests || true
      - name: Rank book + green pile (skip LLM / extras)
        if: env.skip != 'yes'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_KEY: ${{ secrets.DATABASE_KEY }}
          FINVIZ_EMAIL: ${{ secrets.FINVIZ_EMAIL }}
          FINVIZ_PASSWORD: ${{ secrets.FINVIZ_PASSWORD }}
          FINVIZ_EXPORT: ${{ secrets.FINVIZ_EXPORT }}
          FINVIZ_SKIP_LIVE: "1"
          FULLSCAN_DB_OPTIONAL: "1"
        run: |
          set -e
          DATE="${{ github.event.inputs.run_date }}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          FORCE="${{ github.event.inputs.force }}"
          ARGS=(--date "$DATE" --skip-llm --skip-extras --top 25)
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          echo "CMD: python -m src.run_stock_book_all ${ARGS[*]}"
          python -m src.run_stock_book_all "${ARGS[@]}"
      - name: Commit book layer
        if: always() && env.skip != 'yes'
        run: |
          DATE="${{ github.event.inputs.run_date }}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          bash scripts/safe_git_push.sh \
            "auto: stock book layer (ubuntu land) [${DATE}]" \
            data/stock_book/ data/join/ data/universe/ data/ab_checklist/ \
            data/peers/ data/exports/ 01_daily/weather/ \
            "01_daily/${DATE}_stock_book.md"

  preopen:
    needs: scrape
    if: always()
    runs-on: ${{ github.event.inputs.runner == 'ubuntu' && 'ubuntu-latest' || fromJSON('["self-hosted","ecs"]') }}
    timeout-minutes: 360
    env:
      OPENCLAW_TIMEOUT: "10800"
      FULLSCAN_PERSIST: "/home/gha/fullscan-persist"
      FULLSCAN_HOME: "/home/gha"
      HOME: "/home/gha"
      FINVIZ_SKIP_LIVE: "1"
      PREOPEN_LOCK: "/home/gha/fullscan-persist/locks/preopen.lock"
    steps:
      - name: Wait if ECS systemd pre-open owns the box
        run: |
          echo "waited_for_lock=no" >> "$GITHUB_ENV"
          mkdir -p "$(dirname "$PREOPEN_LOCK")"
          exec 9>"$PREOPEN_LOCK"
          if flock -n 9; then
            echo "lock is free"
            flock -u 9 || true
          else
            echo "ECS systemd job holds the lock — backing off"
            echo "skip=yes" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.skip != 'yes'
        with:
          clean: false

      - name: Skip if packet AND stock book already on disk (no LLM)
        if: env.skip != 'yes' && github.event.inputs.force != 'true'
        run: |
          DATE="${{ github.event.inputs.run_date }}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          if python3 -m src.skip_if_good --job preopen_full --date "$DATE"; then
            echo "Packet + stock book already on disk — no Grok/DeepSeek"
            echo "skip_python=yes" >> "$GITHUB_ENV"
          fi

      - name: Raise OpenClaw timeouts + enable 05:55 timer if missing
        if: env.skip != 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export HOME="${FULLSCAN_HOME:-/home/gha}"
          chmod +x scripts/ensure_openclaw_timeouts.sh scripts/ensure_ecs_clock.sh \
            scripts/install_ecs_preopen.sh scripts/ecs_preopen.sh \
            scripts/ecs_map_postclose.sh scripts/safe_git_push.sh || true
          bash scripts/ensure_ecs_clock.sh

      - name: Gate — weekend
        if: env.skip != 'yes' && github.event.inputs.force != 'true'
        run: |
          DOW=$(TZ=America/New_York date +%u)
          ET_HM=$((10#$(TZ=America/New_York date +%H%M)))
          echo "DOW=$DOW ET_HM=$ET_HM"
          if [ "$DOW" -ge 6 ]; then
            echo "Weekend — pre-open ALL skipped."
            echo "skip=yes" >> "$GITHUB_ENV"
          fi
          # 09:25 is enforced in src.run_preopen_all (essays only).
          # Weather / join / AB / the book still run so BUY/SELL can land.

      - uses: actions/setup-python@v5
        if: env.skip != 'yes' && env.skip_python != 'yes'
        with:
          python-version: "3.10"

      - name: Install
        if: env.skip != 'yes' && env.skip_python != 'yes'
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary yfinance pandas requests openai ddgs || true

      - name: Pre-Open ALL (predictive + QC + workflow check)
        if: env.skip != 'yes' && env.skip_python != 'yes'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_KEY: ${{ secrets.DATABASE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCLAW_TIMEOUT: "10800"
          GROK_ONLY: "0"
          LLM_BACKEND: ${{ github.event.inputs.llm_backend || 'auto' }}
          FINVIZ_SKIP_LIVE: "1"
        run: |
          set -e
          export HOME="${FULLSCAN_HOME:-/home/gha}"
          mkdir -p "$(dirname "${PREOPEN_LOCK:-/tmp/fullscan-preopen.lock}")"
          exec 9>"${PREOPEN_LOCK:-/tmp/fullscan-preopen.lock}"
          if ! flock -n 9; then
            echo "ECS systemd job grabbed the lock — backing off"
            exit 0
          fi
          DATE="${{ github.event.inputs.run_date }}"
          FORCE="${{ github.event.inputs.force }}"
          FORCE="${FORCE:-false}"
          BOOK="${{ github.event.inputs.with_book }}"
          BOOK="${BOOK:-true}"
          BACKEND="${LLM_BACKEND:-auto}"
          ARGS=(--llm-backend "$BACKEND")
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          [ "$BOOK" = "false" ] && ARGS+=(--no-book)
          echo "CMD: python -m src.run_preopen_all ${ARGS[*]}"
          python -m src.run_preopen_all "${ARGS[@]}"

      - name: Show QC
        if: always() && env.skip != 'yes' && env.skip_python != 'yes'
        run: |
          D="${{ github.event.inputs.run_date }}"
          D="${D:-$(TZ=America/New_York date +%F)}"
          python -m src.output_qc --date "$D" --preopen || true
          cat "01_daily/${D}_preopen_status.md" 2>/dev/null || true

      - name: Commit predictive artifacts
        if: always() && env.skip != 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export HOME="${FULLSCAN_HOME:-/home/gha}"
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          cd "${GITHUB_WORKSPACE:-.}"
          PATHS=(01_daily/_ecs_clock.md)
          if [ "${skip_python:-}" != "yes" ]; then
            PATHS+=(01_daily/general/ 01_daily/sectors/ 01_daily/events
              01_daily/news/ 01_daily/map_heat/ 01_daily/catalyst/
              01_daily/weather/ 01_daily/_transcripts/ 01_daily/_channel1/
              01_daily/*_preopen_qc.json 01_daily/*_preopen_status.json
              01_daily/*_preopen_status.md
              01_daily/*_grok_review.json 01_daily/*_grok_review.md
              01_daily/*_stock_book.md
              data/catalyst/ data/stock_book/ data/paper/ data/join/
              data/universe/ data/ab_checklist/ data/peers/ data/checklist/
              dashboard/ 03_scoreboard/ 02_lessons/)
          fi
          bash scripts/safe_git_push.sh \
            "auto: pre-open ALL [$(date -u +%F_%H%M)]" \
            "${PATHS[@]}"

      - name: Upload dashboard artifact
        if: always() && env.skip != 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dashboard/
          if-no-files-found: warn

      - name: Publish buy/sell dashboard to GitHub Pages
        if: always() && env.skip != 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/publish_dashboard.sh || true
          bash scripts/publish_dashboard.sh

      - name: Refresh GitHub Pages workflow (backup)
        if: always() && env.skip != 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-dashboard.yml --ref main || true
