name: Holdup open fill

# Weekdays about five minutes after the US cash open during EDT.
# 13:35 UTC = 09:35 ET during EDT (UTC-4, through 2026-11-01) and 08:35 ET
# during EST (UTC-5, from 2026-11-01). Hong Kong Time is 9:35 PM the same
# calendar day (UTC+8, no DST). GitHub cron is UTC and does not follow DST.
# During EST this run is before the 09:30 ET open. If a buy or sell leg's
# bar is missing or dated another session, the job writes nothing and
# exits non-zero. The 21:30 UTC fill writes the trades.
# The job reads the plan sealed at 13:05 UTC for today's session and appends
# open-fill lines at the Yahoo split-adjusted daily Open. It does not edit
# the plan. No plan for today appends nothing. A second run appends nothing.
# P&L stays pending until the close bar is saved.

on:
  schedule:
    - cron: "35 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: holdup-forward
  cancel-in-progress: false

jobs:
  open-fill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bar dependencies
        run: pip install numpy pandas pyarrow yfinance
      - name: Theme Radar history for the frozen panel
        run: |
          set -euo pipefail
          if ! git clone --filter=blob:none --no-checkout \
              https://github.com/SRoyaltyy/theme-radar.git vendor/theme-radar; then
            echo "theme-radar clone failed; the price refresh will fetch held names and IWM only"
            exit 0
          fi
          git -C vendor/theme-radar sparse-checkout init --cone
          git -C vendor/theme-radar sparse-checkout set research/lever_panel
          git -C vendor/theme-radar checkout main \
            || echo "theme-radar checkout failed"
      - name: Refresh forward prices
        id: prices
        run: PYTHONHASHSEED=0 python3 research/hot_n4_clean_v4/forward/prices.py
      - name: Seal the open fill
        id: open_fill
        if: success()
        env:
          HOLDUP_GIT_REF: origin/main
          HOLDUP_MODE: open_fill
        run: PYTHONHASHSEED=0 python3 research/hot_n4_clean_v4/forward/forward.py
      - name: Commit the append
        if: always()
        run: |
          set -euo pipefail
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          files=(
            research/hot_n4_clean_v4/forward/holdup_log.jsonl
            research/hot_n4_clean_v4/forward/LEDGER.jsonl
            research/hot_n4_clean_v4/forward/skips.jsonl
            research/hot_n4_clean_v4/forward/prices.jsonl
            research/hot_n4_clean_v4/forward/PRICE_LEDGER.jsonl
            research/hot_n4_clean_v4/forward/price_revisions.jsonl
            dashboard/holdup/log.json
            dashboard/holdup/status.json
          )
          for path in "${files[@]}"; do
            if [ -f "$path" ]; then
              git add -- "$path"
            fi
          done
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Seal the holdup open fill."
          # Another job can push between our rebase and push. Retry a
          # non-conflicting race up to 5 times. A rebase conflict means a record
          # file changed on main under this run: abort and fail, never force.
          pushed=false
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              if [ -d "$(git rev-parse --git-path rebase-merge)" ] \
                 || [ -d "$(git rev-parse --git-path rebase-apply)" ]; then
                git rebase --abort || true
                echo "::error::rebase conflict on attempt ${attempt}; not retrying"
                exit 1
              fi
              echo "pull failed on attempt ${attempt}"
            elif git push origin HEAD:main; then
              pushed=true
              break
            else
              echo "push rejected on attempt ${attempt}"
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep $(( 2 * attempt + RANDOM % 5 ))
            fi
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::push failed after 5 attempts"
            exit 1
          fi
      - name: Fail the job when the book halted
        if: steps.prices.outcome == 'failure' || steps.open_fill.outcome == 'failure'
        run: exit 1
