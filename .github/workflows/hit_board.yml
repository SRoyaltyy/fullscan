name: HIT Board (all dates)

# Birds-eye HIT% for general market + all sector scanners across every
# graded date in 03_scoreboard/scoreboard.json.

on:
  workflow_dispatch:
  # schedule disabled 2026-08-29 — not in live pipeline
  # schedule:
  #   # After typical US session grade window (early HKT morning weekdays)
  #   - cron: "30 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: hit-board
  cancel-in-progress: false

jobs:
  hit-board:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || pip install pandas

      - name: Build HIT board
        run: |
          set -e
          python -m src.hit_board
          echo "======== 03_scoreboard/HIT_BOARD.md ========"
          cat 03_scoreboard/HIT_BOARD.md

      - name: Commit
        run: |
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add 03_scoreboard/HIT_BOARD.md 03_scoreboard/hit_board.json || true
          git commit -m "auto: HIT board (general + sectors, all dates)" || echo "No changes"
          git pull --rebase origin main || true
          git push origin main
