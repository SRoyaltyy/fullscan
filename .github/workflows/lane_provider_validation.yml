name: Lane batched semantic development comparison
on:
  push:
    branches: [codex/lane-provider-repair-20261014]
    paths:
      - '.github/workflows/lane_provider_validation.yml'
      - 'src/lane_route.py'
      - 'src/predict_grok_heal.py'
      - 'scripts/diagnose_openclaw_lane.py'
      - 'src/news_impact/semantic_headlines.py'
      - 'src/news_impact/semantic_ontology.py'
      - 'scripts/run_semantic_headlines.py'
      - 'src/news_impact/sector_batch_review.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lane-provider-validation-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[grok-only]') && 'grok' || 'glm' }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /tests/fixtures/
            /data/exports/finviz_latest.csv
            /data/exports/wikidata_companies.json.gz
            /data/exports/wikidata_companies_provenance.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate contracts and regression repairs before model calls
        run: PYTHONPATH=.:scripts python -m unittest discover -s scripts -p 'test_semantic*.py' && PYTHONPATH=.:scripts python -m unittest discover -s scripts -p 'test_provider_repairs.py'
  glm:
    needs: contracts
    if: ${{ !contains(github.event.head_commit.message, '[grok-only]') && !contains(github.event.head_commit.message, '[skip provider validation]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /tests/fixtures/
            /data/exports/finviz_latest.csv
            /data/exports/wikidata_companies.json.gz
            /data/exports/wikidata_companies_provenance.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Program-only GLM development 100-title replay
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
          MODELSCOPE_SDK_TOKEN: ${{ secrets.MODELSCOPE_SDK_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TOKENHUB_API_KEY: ${{ secrets.TOKENHUB_API_KEY }}
          TENCENT_API_KEY: ${{ secrets.TENCENT_API_KEY }}
          HUNYUAN_API_KEY: ${{ secrets.HUNYUAN_API_KEY }}
          TOKENHUB_BASE_URL: ${{ secrets.TOKENHUB_BASE_URL }}
          TENCENT_BASE_URL: ${{ secrets.TENCENT_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          LANE_ALLOW_PAID_DEEPSEEK: ${{ vars.LANE_ALLOW_PAID_DEEPSEEK }}
        run: |
          run_started=$SECONDS
          for attempt in 1 2 3; do
            task_budget=$((3600 - (SECONDS - run_started)))
            if [ "$task_budget" -le 0 ]; then break; fi
            PYTHONPATH=. python scripts/run_semantic_headlines.py \
              --input tests/fixtures/semantic_frozen_20261014/batch_02.json \
              --output provider_results/glm_program_outputs.json \
              --limit 100 --budget-seconds "$task_budget" --headline-timeout 450 \
              --batch-size 10 --batch-interval-seconds 30 --require-catalog --no-review --sector-review --action-review --sector-roles --resume \
              --providers zhipu --models glm-5.3-flash,glm-4.7-flash
            stop_reason=$(python -c "import json; print(json.load(open('provider_results/glm_program_outputs.json')).get('stop_reason','complete'))")
            if [ "$stop_reason" != "rate_limited" ]; then break; fi
            if [ "$attempt" = "3" ]; then
              echo "Rate limit persists; resumable checkpoint saved."
              break
            fi
            echo "Rate limited; preserving completed rows and retrying after 60 seconds."
            sleep 60
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-glm-provider-100
          path: provider_results/
  grok:
    needs: contracts
    if: ${{ contains(github.event.head_commit.message, '[grok-only]') && !contains(github.event.head_commit.message, '[skip provider validation]') }}
    runs-on: [self-hosted, ecs]
    timeout-minutes: 75
    env:
      FULLSCAN_HOME: /home/gha
      OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
      OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
      OPENCLAW_BACKEND_MODEL: xai/grok-4.3
      OPENCLAW_GUARD_CALL_TIMEOUT: '60'
      OPENCLAW_LANE_TIMEOUT: '300'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: lane_grok_${{ github.run_id }}_${{ github.run_attempt }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /tests/fixtures/
            /data/exports/finviz_latest.csv
            /data/exports/wikidata_companies.json.gz
            /data/exports/wikidata_companies_provenance.json
            /requirements.txt
      - name: Diagnose timer, OAuth and both Grok model paths
        id: diagnose
        working-directory: lane_grok_${{ github.run_id }}_${{ github.run_attempt }}
        run: PYTHONPATH=.:scripts python3 scripts/diagnose_openclaw_lane.py --output provider_results/grok_diagnostic.json --model xai/grok-4.3
      - name: Program-only Grok development 100-title replay when healthy and idle
        if: steps.diagnose.outputs.ready == 'true'
        working-directory: lane_grok_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          PYTHONPATH=. python3 scripts/run_semantic_headlines.py \
            --input tests/fixtures/semantic_frozen_20261014/batch_02.json \
            --output provider_results/grok_program_outputs.json \
            --limit 100 --budget-seconds 3600 --headline-timeout 650 \
            --batch-size 10 --batch-interval-seconds 30 --require-catalog --no-review --sector-review --action-review --sector-roles --resume \
            --providers openclaw --models xai/grok-4.3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-grok-diagnosis-and-100
          path: lane_grok_${{ github.run_id }}_${{ github.run_attempt }}/provider_results/




  grade_development:
    needs: glm
    if: ${{ always() && needs.glm.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/evaluate_semantic_acceptance.py
            /docs/benchmarks/references_20261014/
            /tests/fixtures/semantic_frozen_20261014/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: lane-glm-provider-100
          path: scored_outputs
      - name: Offline development comparison; no model or classifier calls
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json,pathlib,hashlib
          from evaluate_semantic_acceptance import compare
          ip=pathlib.Path('tests/fixtures/semantic_frozen_20261014/batch_02.json')
          rp=pathlib.Path('docs/benchmarks/references_20261014/batch_02.json')
          raw=json.loads(next(pathlib.Path('scored_outputs').rglob('glm_program_outputs.json')).read_text())
          ref=json.loads(rp.read_text())
          assert raw['input_sha256']==ref['input_sha256']==hashlib.sha256(ip.read_bytes()).hexdigest()
          report=compare(json.loads(ip.read_text()),ref,raw)
          report.update(acceptance_eligible=False,scope='Development replay after second holdout failed; never increments acceptance streak',best_consecutive_passes=0,candidate={'runtime':raw['runtime_sha256'],'configuration':raw['configuration'],'catalog':raw['catalog']})
          pathlib.Path('scores').mkdir()
          pathlib.Path('scores/comparison.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k not in ('samples','candidate')}))
          for key in ('action','lane','sectors'):
              print(key.upper()+'_MISSES='+json.dumps([(r['n'],r['title'],r['program'],r['reference']) for r in report['samples'] if not r['checks'][key]],ensure_ascii=False))
          failures={r['n'] for r in report['samples'] if not r['checks']['action']}
          print('RAW_ACTION_MISSES='+json.dumps([(r['n'],(r['program_output'].get('analysis_output') or r['program_output'].get('model_output') or {}).get('actions')) for r in raw['outputs'] if r['n'] in failures],ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-semantic-development-score
          path: scores/

  grade_grok:
    needs: grok
    if: ${{ always() && needs.grok.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/evaluate_semantic_acceptance.py
            /docs/benchmarks/references_20261014/
            /tests/fixtures/semantic_frozen_20261014/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: lane-grok-diagnosis-and-100
          path: scored_outputs
      - name: Offline development comparison; no model or classifier calls
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json,pathlib,hashlib
          from evaluate_semantic_acceptance import compare
          ip=pathlib.Path('tests/fixtures/semantic_frozen_20261014/batch_02.json')
          rp=pathlib.Path('docs/benchmarks/references_20261014/batch_02.json')
          files=list(pathlib.Path('scored_outputs').rglob('grok_program_outputs.json'))
          if not files:
              report={'status':'provider_not_ready_or_busy','acceptance_eligible':False,'best_consecutive_passes':0}
              pathlib.Path('scores').mkdir()
              pathlib.Path('scores/comparison.json').write_text(json.dumps(report))
              print(json.dumps(report))
              raise SystemExit(0)
          raw=json.loads(files[0].read_text())
          ref=json.loads(rp.read_text())
          assert raw['input_sha256']==ref['input_sha256']==hashlib.sha256(ip.read_bytes()).hexdigest()
          report=compare(json.loads(ip.read_text()),ref,raw)
          report.update(acceptance_eligible=False,scope='Development replay after second holdout failed; never increments acceptance streak',best_consecutive_passes=0,candidate={'runtime':raw['runtime_sha256'],'configuration':raw['configuration'],'catalog':raw['catalog']})
          pathlib.Path('scores').mkdir()
          pathlib.Path('scores/comparison.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k not in ('samples','candidate')}))
          for key in ('action','lane','sectors'):
              print(key.upper()+'_MISSES='+json.dumps([(r['n'],r['title'],r['program'],r['reference']) for r in report['samples'] if not r['checks'][key]],ensure_ascii=False))
          failures={r['n'] for r in report['samples'] if not r['checks']['action']}
          print('RAW_ACTION_MISSES='+json.dumps([(r['n'],(r['program_output'].get('analysis_output') or r['program_output'].get('model_output') or {}).get('actions')) for r in raw['outputs'] if r['n'] in failures],ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-grok-semantic-development-score
          path: scores/
