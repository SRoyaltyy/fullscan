name: Excel Deep Corr Mine

# Whole-sheet Excel-emulator statistical mine (A..JL).
# Universe: Finviz mcap > $50M and average volume > 100k shares.
# χ2 + mutual info + Benjamini-Hochberg FDR, then Apriori pairs.
# Clock: rows above T + 09:30-knowable atoms. H/I are labels only.
#
# Grids: excel-deep-grids is gone (404). excel-state/state/rows.tar.gz is
# OHLC only (no fills). Restore that price cache, then rebuild camera
# grids through the Excel-replica engine (same path as daily_run).

on:
  workflow_dispatch:
    inputs:
      grids:
        description: "Grid folder (grids_deep or grids)"
        required: false
        default: "grids_deep"
        type: string
      limit:
        description: "Cap tickers (0 = all that pass 50M/100k)"
        required: false
        default: "0"
        type: string
      min_disc:
        description: "Min discovery events"
        required: false
        default: "200"
        type: string
      min_hold:
        description: "Min holdout events"
        required: false
        default: "80"
        type: string
  schedule:
    - cron: "20 11 * * 6"

permissions:
  contents: write

concurrency:
  group: excel-deep-corr-mine
  cancel-in-progress: true

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Restore price-cache state (excel-state branch)
        run: |
          set -euo pipefail
          mkdir -p excel_bot/data/rows
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/excel-state/state/rows.tar.gz" -o /tmp/rows.tar.gz
          tar -xzf /tmp/rows.tar.gz -C excel_bot/data/rows
          echo "restored $(ls excel_bot/data/rows | wc -l) ticker caches"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install openpyxl pandas pyarrow

      - name: Unit tests
        run: |
          python excel_bot/engine/test_excel_deep_corr_mine.py
          python excel_bot/engine/test_excel_stat_mine.py
          python excel_bot/engine/test_region_corr_mine.py || true

      - name: Build emulator grids from price cache
        env:
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          set -euo pipefail
          cd excel_bot
          ARGS="--grids-only --from-cache --no-resume --workers 4"
          if [ -n "${LIMIT:-}" ] && [ "${LIMIT}" != "0" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi
          echo "CMD: python engine/backfill.py $ARGS"
          python engine/backfill.py $ARGS
          N=$(find grids_deep -name '*.json' ! -name '_*' 2>/dev/null | wc -l)
          echo "grids_deep: $N files"
          if [ "$N" -le 0 ]; then
            echo "NO GRID JSON after cache build — refusing empty mine"
            exit 1
          fi

      - name: Mine
        env:
          GRIDS: ${{ inputs.grids || 'grids_deep' }}
          LIMIT: ${{ inputs.limit || '0' }}
          MIN_DISC: ${{ inputs.min_disc || '200' }}
          MIN_HOLD: ${{ inputs.min_hold || '80' }}
        run: |
          set -euo pipefail
          GDIR=""
          for cand in "$GRIDS" excel_bot/grids_deep grids_deep excel_bot/grids grids; do
            if [ -n "$cand" ] && ls "$cand"/*.json >/dev/null 2>&1; then
              GDIR="$cand"
              break
            fi
          done
          if [ -z "$GDIR" ]; then
            echo "NO GRIDS after build — find_grids would see nothing"
            exit 1
          fi
          echo "using grids dir: $GDIR ($(ls "$GDIR"/*.json | wc -l) json)"
          LARGS=()
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then
            LARGS+=(--limit "$LIMIT")
          fi
          python excel_bot/engine/excel_stat_mine.py --grids "$GDIR" "${LARGS[@]}"
          python excel_bot/engine/excel_deep_corr_mine.py --grids "$GDIR" \
            --min-disc "$MIN_DISC" --min-hold "$MIN_HOLD" "${LARGS[@]}"
          test -s 03_scoreboard/EXCEL_STAT_MINE.md
          test -s 03_scoreboard/excel_stat_mine.json

      - name: Show board
        if: always()
        run: |
          echo "======== EXCEL STAT MINE ========"
          if [ -f 03_scoreboard/EXCEL_STAT_MINE.md ]; then
            head -n 80 03_scoreboard/EXCEL_STAT_MINE.md
          elif [ -f 03_scoreboard/EXCEL_DEEP_CORR_MINE.md ]; then
            head -n 80 03_scoreboard/EXCEL_DEEP_CORR_MINE.md
          else
            echo "NO BOARD"
          fi

      - name: Publish
        if: hashFiles('03_scoreboard/EXCEL_STAT_MINE.md') != '' || hashFiles('03_scoreboard/EXCEL_DEEP_CORR_MINE.md') != ''
        run: |
          bash scripts/safe_git_push.sh \
            "chore: excel whole-sheet stat mine" \
            03_scoreboard/EXCEL_STAT_MINE.md \
            03_scoreboard/excel_stat_mine.json \
            03_scoreboard/EXCEL_DEEP_CORR_MINE.md \
            03_scoreboard/excel_deep_corr_mine.json \
            03_scoreboard/excel_deep_corr_mine.csv

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excel-deep-corr-mine
          path: |
            03_scoreboard/EXCEL_STAT_MINE.md
            03_scoreboard/excel_stat_mine.json
            03_scoreboard/EXCEL_DEEP_CORR_MINE.md
            03_scoreboard/excel_deep_corr_mine.json
            03_scoreboard/excel_deep_corr_mine.csv

      - name: Summary
        if: always()
        run: |
          {
            echo "## Excel whole-sheet statistical mine"
            echo
            echo "A..JL. chi2 + FDR + Apriori. mcap > \$50M and avg vol > 100k."
            echo "Grids rebuilt from excel-state OHLC via the Excel-replica engine."
            echo
            if [ -f 03_scoreboard/EXCEL_STAT_MINE.md ]; then
              sed -n '1,60p' 03_scoreboard/EXCEL_STAT_MINE.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
