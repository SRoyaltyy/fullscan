name: Event markers (E earnings / R analyst)

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers (e.g. BB,AAPL)"
        required: true
        default: "BB"
      asof:
        description: "Optional PIT asof YYYY-MM-DD for snapshot print"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install yfinance pyarrow
      - name: Fetch markers
        run: |
          set -euo pipefail
          T="${{ inputs.tickers }}"
          ASOF="${{ inputs.asof }}"
          ASOF="${ASOF//+/-}"
          IFS=',' read -ra ARR <<< "$T"
          for x in "${ARR[@]}"; do
            x=$(echo "$x" | tr -d ' ' | tr '[:lower:]' '[:upper:]')
            [ -z "$x" ] && continue
            if [ -n "$ASOF" ]; then
              python -m src.event_markers "$x" --asof "$ASOF"
            else
              python -m src.event_markers "$x"
            fi
          done
          ls -la data/events/ || true
          head -40 data/events/*_events.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-markers
          path: data/events/
          if-no-files-found: warn
      - name: Commit
        if: always()
        run: |
          git config user.name "Market-Bot-Automaton"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/events/ || true
          if git diff --staged --quiet; then echo no-change; exit 0; fi
          git commit -m "chore: event markers E/R ${{ inputs.tickers }}"
          git pull --rebase origin main || true
          git push origin HEAD:main
