name: Install paper backstop timer

# Idempotent install of fullscan-paper-backstop.timer on the ECS box
# (self-hosted runner ecs-openclaw, /home/gha). Does not upgrade or
# restart the chat gateway. Does not start the paper send.
# Verify in this job's log: `systemctl list-timers` for
# fullscan-paper-backstop.timer (OnCalendar 09:12 America/New_York).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/install_paper_backstop.yml
      - scripts/install_paper_backstop.sh
      - scripts/ecs_paper_backstop.sh
      - scripts/systemd/fullscan-paper-backstop.service
      - scripts/systemd/fullscan-paper-backstop.timer
      - src/paper_backstop.py
  pull_request:
    paths:
      - .github/workflows/install_paper_backstop.yml
      - scripts/install_paper_backstop.sh
      - scripts/ecs_paper_backstop.sh
      - scripts/systemd/fullscan-paper-backstop.service
      - scripts/systemd/fullscan-paper-backstop.timer
      - src/paper_backstop.py

permissions:
  contents: read

concurrency:
  group: install-paper-backstop
  cancel-in-progress: false

jobs:
  install:
    runs-on: [self-hosted, ecs]
    defaults:
      run:
        working-directory: .ecs-sparse/paper-backstop
    timeout-minutes: 15
    steps:
      - name: Clear stale git index.lock (shared ECS workspace)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          # A job killed mid-checkout leaves .git/index.lock; the next checkout then hangs.
          # One ECS runner, so a lock older than 1 minute before checkout is stale.
          W="${GITHUB_WORKSPACE:-.}"
          for L in "$W/.git/index.lock" "$W/.git/shallow.lock" "$W/.git/HEAD.lock"; do
            if [ -n "$(find "$L" -mmin +1 2>/dev/null)" ]; then echo "removing stale $L"; rm -f "$L" || sudo -n rm -f "$L" || true; fi
          done
          if [ "$(git -C "$W" config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::shared ECS workspace is sparse; this checkout re-materializes the full tree"
          fi
      - uses: actions/checkout@v4
        with:
          # Own sub-path: the sparse set never touches the shared full-tree
          # ECS workspace (a sparse workspace makes the next full checkout
          # re-materialize the whole tree; 2026-10-16 10-min hang).
          path: .ecs-sparse/paper-backstop
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts
            src/paper_backstop.py
      - name: Enable 09:12 paper backstop timer if missing
        env:
          PAPER_BACKSTOP_STRICT: "1"
          FULLSCAN_ROOT: /home/gha/fullscan
        run: |
          set -euo pipefail
          chmod +x scripts/install_paper_backstop.sh scripts/ecs_paper_backstop.sh
          bash scripts/install_paper_backstop.sh
          echo "---- systemctl list-timers (verify) ----"
          systemctl list-timers --all fullscan-paper-backstop.timer --no-pager
