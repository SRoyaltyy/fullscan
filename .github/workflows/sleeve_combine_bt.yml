name: Sleeve combine backtest

# Matched-hold mover × .io fill sim (shared cash, Futubull fees, cash clock).
# Refuses to pair mover 1d with .io 2w. No network — bars come from the
# lookback payload + paper close cache.

on:
  workflow_run:
    # Runs after the nightly mover lookback refreshes its payload.
    workflows: ["Mover Lookback Action"]
    types: [completed]
  workflow_dispatch:
    inputs:
      hold:
        description: "Primary hold to blotter (1d/3d/1w)"
        required: false
        default: "3d"
      mode:
        description: "io_boost | overlay | dual | combine | mover_only | io_only"
        required: false
        default: "io_boost"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 30
    concurrency:
      group: sleeve-combine-bt
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install numpy pandas pyarrow
      - name: Integrity tests
        run: |
          python -m src.test_sleeve_combine_bt
          python -m src.test_sleeve_combine
      - name: Backtest
        run: |
          set -e
          HOLD="${{ github.event.inputs.hold }}"
          MODE="${{ github.event.inputs.mode }}"
          HOLD="${HOLD:-3d}"
          MODE="${MODE:-io_boost}"
          python -m src.sleeve_combine_bt --hold "$HOLD" --mode "$MODE"
          echo "======== blotter ========"
          head -80 03_scoreboard/SLEEVE_COMBINE_BT.md || true
          test -s dashboard/sleeve-combine/index.html
      - name: Replay lock (add-only day fingerprints)
        run: python scripts/replay_lock.py sleeve-combine data/sleeve_combine/bt_curve.csv data/sleeve_combine/bt_trades.csv
      - name: Commit
        run: |
          bash scripts/safe_git_push.sh \
            "auto: sleeve combine backtest" \
            03_scoreboard/SLEEVE_COMBINE_BT.md \
            data/sleeve_combine/bt.json \
            data/sleeve_combine/bt_primary.json \
            data/sleeve_combine/bt_trades.csv \
            data/sleeve_combine/bt_curve.csv \
            data/sleeve_combine/bt_fills.csv \
            dashboard/sleeve-combine/index.html \
            data/replay_locks/sleeve-combine.jsonl
