name: Deterministic evidence checks
on:
  pull_request:
    branches: [main, cursor/article-stock-correlation-9f4c]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /eval/
            /excel_bot/data/finviz_with_descriptions.csv
            /data/news_intake/2026-10-17/documents.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned public dictionary resources
        run: |
          python -m pip install PyYAML==6.0.3
          python -m scripts.bootstrap_semantics
      - name: Run legacy, evidence, and strict measurement regressions
        run: python -I -S scripts/offline_evidence_checks.py --unittest src.test_correlation src.test_eval_harness src.test_evidence_matcher
      - name: Export blind real scanner sample
        run: >-
          python scripts/export_validation_inputs.py
          --news data/news_intake/2026-10-17/documents.json
          --descriptions excel_bot/data/finviz_with_descriptions.csv
          --out validation-inputs --seed 19019 --budget 200
      - name: Equal-input Finviz-only frozen-corpus comparison
        run: |
          python -I -S scripts/offline_evidence_checks.py --engine legacy --cases eval/cases.jsonl --descriptions excel_bot/data/finviz_with_descriptions.csv --out validation-inputs/legacy-frozen.json --changelog "Existing public corpus and Finviz-only equal inputs; isolated Python with sockets denied"
          python -I -S scripts/offline_evidence_checks.py --engine evidence --cases eval/cases.jsonl --descriptions excel_bot/data/finviz_with_descriptions.csv --out validation-inputs/evidence-frozen.json --changelog "Existing public corpus and Finviz-only equal inputs; isolated Python with sockets denied"
          python scripts/summarize_evidence_checks.py validation-inputs/legacy-frozen.json validation-inputs/evidence-frozen.json
      - name: Export separate unseen headline inputs
        run: >-
          python scripts/export_validation_inputs.py
          --news data/news_intake/2026-10-17/documents.json
          --descriptions excel_bot/data/finviz_with_descriptions.csv
          --out validation-inputs/fresh --seed 19020 --budget 200
          --exclude-sample validation-inputs/news-sample.json
      - name: Reserve third unseen headline sample
        run: >-
          python scripts/export_validation_inputs.py
          --news data/news_intake/2026-10-17/documents.json
          --descriptions excel_bot/data/finviz_with_descriptions.csv
          --out validation-inputs/holdout --seed 19021 --budget 200
          --exclude-sample validation-inputs/news-sample.json
          --exclude-sample validation-inputs/fresh/news-sample.json
      - name: Infer primary headlines using public inputs only
        run: |
          python -I -S scripts/offline_evidence_checks.py --scan --engine evidence --headline-only --descriptions excel_bot/data/finviz_with_descriptions.csv --news validation-inputs/headline-sample.json --out validation-inputs/evidence-headline-links.json
          python -I -S scripts/offline_evidence_checks.py --scan --engine evidence --headline-only --descriptions excel_bot/data/finviz_with_descriptions.csv --news validation-inputs/fresh/headline-sample.json --out validation-inputs/fresh/evidence-headline-links.json
          python -I -S scripts/offline_evidence_checks.py --scan --engine evidence --headline-only --descriptions excel_bot/data/finviz_with_descriptions.csv --news validation-inputs/holdout/headline-sample.json --out validation-inputs/holdout/evidence-headline-links.json
          python -I -S scripts/offline_evidence_checks.py --scan --engine legacy --headline-only --descriptions excel_bot/data/finviz_with_descriptions.csv --news validation-inputs/holdout/headline-sample.json --out validation-inputs/holdout/legacy-headline-links.json
          python scripts/compact_headline_links.py validation-inputs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-validation-inputs
          path: validation-inputs/
          retention-days: 30
