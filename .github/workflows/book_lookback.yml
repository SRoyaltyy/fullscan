name: Book Lookback (ranker time machine)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "ecs (OpenClaw) or ubuntu (GitHub-hosted). ubuntu cannot reach Grok."
        required: false
        default: "ubuntu"
        type: choice
        options:
          - ecs
          - ubuntu
      date:
        description: "Trading day YYYY-MM-DD or DD/MM (default latest book CSV)"
        required: false
        default: ""
      tickers:
        description: "Optional comma-separated tickers to card (e.g. NVDA,AAPL)"
        required: false
        default: ""
      min_gain:
        description: "Winner threshold percent PER SESSION (default 5)"
        required: false
        default: "5"
      top:
        description: "How many winners to list per horizon"
        required: false
        default: "20"

permissions:
  contents: write

concurrency:
  group: book-lookback
  cancel-in-progress: false

jobs:
  lookback:
    runs-on: ${{ github.event.inputs.runner == 'ecs' && fromJSON('["self-hosted","ecs"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Look back at ranker inputs vs realized winners
        run: |
          set -euo pipefail
          DATE="${{ github.event.inputs.date }}"
          TICKERS="${{ github.event.inputs.tickers }}"
          GAIN="${{ github.event.inputs.min_gain }}"
          TOP="${{ github.event.inputs.top }}"
          GAIN="${GAIN:-5}"
          TOP="${TOP:-20}"
          ARGS=(--min-gain "$GAIN" --top "$TOP")
          [ -n "${DATE:-}" ] && ARGS+=(--date "$DATE")
          [ -n "${TICKERS:-}" ] && ARGS+=(--tickers "$TICKERS")
          python -m src.book_lookback "${ARGS[@]}"
          if [ -n "${DATE:-}" ]; then
            python -m src.lookback_picks --date "$DATE" || true
            python -m src.lookback_unweighted --date "$DATE" --top 15 || true
          else
            python -m src.lookback_picks || true
            python -m src.lookback_unweighted --top 15 || true
          fi
          python -m src.lookback_unweighted --all --top 15 || true
          python -m src.lookback_green --all --top 15
          echo "======== green pile ========"
          head -40 03_scoreboard/BOOK_GREEN.md || true
      - name: Commit report
        run: |
          bash scripts/safe_git_push.sh \
            "auto: book lookback [${{ github.event.inputs.date || 'latest' }}]" \
            03_scoreboard/BOOK_LOOKBACK.md \
            03_scoreboard/BOOK_UNWEIGHTED.md \
            03_scoreboard/BOOK_GREEN.md \
            data/stock_book/ \
            01_daily/
