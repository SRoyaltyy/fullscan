name: Pre-Open finish holes 2026-09-08

# One-shot writer for the EXISTING 2026-09-08 packet.
# Cyrus/New Bot override: SKIP catalyst (50m search sink + list.get).
# Priority: parse attempt → Technology + Utilities → paper dashboard stamp
# → judge/actions only if parse ok → general skip-if-good → QC + commit.
#
# Late heal: --force (preopen.refuse_if_late). No --bypass-cutoff CLI.
# Unique concurrency — do NOT share preopen-all / HALT groups.
# Do NOT edit or poke .github/workflows/preopen_all.yml (still HALTed).
# Do NOT touch harden PR #160 / #161.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preopen_finish_0908.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write

concurrency:
  group: preopen-finish-0908
  cancel-in-progress: true

jobs:
  finish:
    name: Fill 2026-09-08 holes (no catalyst)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FINVIZ_SKIP_LIVE: "1"
      FULLSCAN_DB_OPTIONAL: "1"
      LLM_BACKEND: deepseek
      GROK_ONLY: "0"
      DATE: "2026-09-08"
      FINISH_TAGS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary yfinance pandas requests openai ddgs || true

      - name: news_parse
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          DATE="${DATE}"
          mkdir -p 01_daily/news
          LOG=$(mktemp)
          echo "CMD: python -m src.news_parse --hours 48 --limit 400 --date ${DATE} --force"
          python -m src.news_parse --hours 48 --limit 400 --date "${DATE}" --force >"$LOG" 2>&1
          RC=$?
          cat "$LOG"
          QC_OK=0
          python -m src.output_qc --kind parse --path "01_daily/news/${DATE}_parsed.json" \
            && QC_OK=1 || true
          if [ "$RC" -eq 0 ] && [ "$QC_OK" -eq 1 ]; then
            echo "parse=ok" >> "$GITHUB_ENV"
            echo "FINISH_TAGS=${FINISH_TAGS}parse/" >> "$GITHUB_ENV"
            exit 0
          fi
          KIND="empty_parse"
          if grep -Eiq 'timed out|timeout|TimeoutExpired|canceling statement' "$LOG"; then
            KIND="timeout"
          elif grep -Eiq 'connect failed|could not connect|connection refused|connection reset|giving up — morning/collectors continue without Postgres|OperationalError|Network is unreachable' "$LOG"; then
            KIND="connect"
          elif grep -Eiq 'empty_parse|produced no quality-ok|QC FAIL' "$LOG"; then
            KIND="empty_parse"
          elif [ "$RC" -ne 0 ]; then
            KIND="timeout"
            grep -Eiq 'connect|postgres|DATABASE' "$LOG" && KIND="connect"
          fi
          {
            echo "# NEWS PARSE FAIL — ${DATE}"
            echo ""
            echo "LOUD FAIL. news_parse did not land a quality-ok \`01_daily/news/${DATE}_parsed.json\`."
            echo "Do **not** invent a parsed.json stub. news_judge and news_actions are skipped."
            echo ""
            echo "- classified_error: **${KIND}**"
            echo "- exit_code: ${RC}"
            echo "- qc_ok: ${QC_OK}"
            echo "- parsed.json exists: $([ -f \"01_daily/news/${DATE}_parsed.json\" ] && echo yes || echo no)"
            echo ""
            echo "## Exact error / last log"
            echo ""
            echo '```'
            tail -n 80 "$LOG"
            echo '```'
          } > "01_daily/news/${DATE}_parse_fail.md"
          echo "parse=fail:${KIND}" >> "$GITHUB_ENV"
          echo "Wrote 01_daily/news/${DATE}_parse_fail.md (${KIND})"
          if [ "$QC_OK" -ne 1 ] && [ -f "01_daily/news/${DATE}_parsed.json" ]; then
            python - <<'PY'
          from src import output_qc
          output_qc.reject(
              "01_daily/news/2026-09-08_parsed.json",
              "01_daily/news/2026-09-08_parsed.md",
          )
          PY
          fi
          exit 0

      - name: sector predicts (Technology, Utilities) FIRST
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_TIMEOUT: "1800"
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          DATE="${DATE}"
          NEED=()
          for pair in "Technology:technology" "Utilities:utilities"; do
            NAME="${pair%%:*}"
            SLUG="${pair##*:}"
            P="01_daily/sectors/${DATE}/${SLUG}_predict.md"
            if python -m src.output_qc --kind sector --path "$P"; then
              echo "skip-if-good ${NAME} already quality-ok"
              echo "${SLUG}=ok_existing" >> "$GITHUB_ENV"
            else
              echo "need ${NAME}"
              NEED+=("$NAME")
            fi
          done
          if [ "${#NEED[@]}" -eq 0 ]; then
            echo "Technology + Utilities already quality-ok — no LLM"
            exit 0
          fi
          SECTORS=$(IFS=,; echo "${NEED[*]}")
          echo "CMD: python -m src.run_sector_predict --date ${DATE} --sectors ${SECTORS} --force"
          python -m src.run_sector_predict --date "${DATE}" --sectors "${SECTORS}" --force
          python -m src.sector_board --date "${DATE}" || true
          TAGS="${FINISH_TAGS}"
          if python -m src.output_qc --kind sector --path "01_daily/sectors/${DATE}/technology_predict.md"; then
            echo "technology=ok" >> "$GITHUB_ENV"
            TAGS="${TAGS}tech/"
          else
            echo "technology=fail" >> "$GITHUB_ENV"
          fi
          if python -m src.output_qc --kind sector --path "01_daily/sectors/${DATE}/utilities_predict.md"; then
            echo "utilities=ok" >> "$GITHUB_ENV"
            TAGS="${TAGS}util/"
          else
            echo "utilities=fail" >> "$GITHUB_ENV"
          fi
          echo "FINISH_TAGS=${TAGS}" >> "$GITHUB_ENV"
          exit 0

      - name: paper dashboard stamp FIRST
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          DATE="${DATE}"
          LOG=$(mktemp)
          echo "CMD: python -m src.paper_trade --date ${DATE} --top 10"
          python -m src.paper_trade --date "${DATE}" --top 10 >"$LOG" 2>&1
          RC=$?
          cat "$LOG"
          python - <<'PY' || true
          import json, os, re, subprocess
          from pathlib import Path
          date = "2026-09-08"
          note = Path(f"01_daily/{date}_dashboard_stamp_note.md")
          html = Path("dashboard/index.html")
          landed = False
          why = []
          dates = []
          if html.exists():
              text = html.read_text(encoding="utf-8", errors="replace")
              m = re.search(r'"dates":\s*(\[[^\]]*\])', text)
              if m:
                  try:
                      dates = json.loads(m.group(1))
                  except json.JSONDecodeError:
                      dates = []
              landed = date in dates
          else:
              why.append("dashboard/index.html missing after paper_trade")
          if not landed:
              book = subprocess.run(
                  ["python", "-m", "src.skip_if_good", "--job", "stock_book_all",
                   "--date", date],
                  capture_output=True, text=True)
              book_out = (book.stdout or "") + (book.stderr or "")
              if book.returncode != 0:
                  why.append(
                      "skip_if_good stock_book_all is RUN (book not honestly "
                      f"all-green / complete): {book_out.strip() or book.returncode}"
                  )
              if date not in dates:
                  why.append(
                      f"paper dates end at {dates[-1] if dates else '[]'} — "
                      f"{date} not in dashboard stamp (do not fake it). "
                      "Usual cause: yfinance has no signal-day close yet, or "
                      "paper_trade exited before writing the curve."
                  )
              note.parent.mkdir(parents=True, exist_ok=True)
              note.write_text(
                  f"# Dashboard stamp note — {date}\n\n"
                  "Scoreboard / paper inputs cannot honestly advance "
                  f"`dashboard/index.html` to include **{date}**. "
                  "Not faking the session stamp.\n\n"
                  + "\n".join(f"- {w}" for w in why) + "\n",
                  encoding="utf-8",
              )
              print(f"DASH_STAMP=blocked wrote {note}")
          else:
              print(f"DASH_STAMP=ok dates[-1]={dates[-1] if dates else '?'}")
          Path("/tmp/dash_stamp").write_text("ok" if landed else "blocked")
          PY
          echo "PAPER_RC=$RC" >> "$GITHUB_ENV"
          STAMP=$(cat /tmp/dash_stamp 2>/dev/null || echo blocked)
          echo "dashboard=${STAMP}" >> "$GITHUB_ENV"
          if [ "$STAMP" = "ok" ]; then
            echo "FINISH_TAGS=${FINISH_TAGS}dashboard/" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: news_judge
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_TIMEOUT: "1800"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          DATE="${DATE}"
          if ! python -m src.output_qc --kind parse --path "01_daily/news/${DATE}_parsed.json"; then
            echo "SKIP news_judge — no quality-ok ${DATE}_parsed.json"
            echo "judge=skip_no_parse" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "CMD: python -m src.run_news_judge --date ${DATE} --force"
          python -m src.run_news_judge --date "${DATE}" --force
          RC=$?
          if python -m src.output_qc --kind judge --path "01_daily/news/${DATE}_judge.md"; then
            echo "judge=ok" >> "$GITHUB_ENV"
            echo "FINISH_TAGS=${FINISH_TAGS}judge/" >> "$GITHUB_ENV"
          else
            echo "judge=fail:${RC}" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: news_actions
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINVIZ_EXPORT: ${{ secrets.FINVIZ_EXPORT }}
        run: |
          set +e
          DATE="${DATE}"
          if ! python -m src.output_qc --kind parse --path "01_daily/news/${DATE}_parsed.json"; then
            echo "SKIP news_actions — parse failed loud / no usable ${DATE}_parsed.json"
            echo "actions=skip_no_parse" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "CMD: python -m src.news_actions --hours 48 --limit 400 --date ${DATE} --force"
          python -m src.news_actions --hours 48 --limit 400 --date "${DATE}" --force
          RC=$?
          if python -m src.output_qc --kind actions --path "01_daily/news/${DATE}_actions.json"; then
            echo "actions=ok" >> "$GITHUB_ENV"
            echo "FINISH_TAGS=${FINISH_TAGS}actions/" >> "$GITHUB_ENV"
          else
            echo "actions=fail:${RC}" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: general predict (skip-if-good)
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_TIMEOUT: "1800"
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          DATE="${DATE}"
          P="01_daily/general/${DATE}_predict.md"
          if python -m src.output_qc --kind general --path "$P"; then
            echo "skip-if-good general predict already quality-ok"
            echo "general=ok_existing" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "CMD: python -m src.run_predict --date ${DATE} --force"
          python -m src.run_predict --date "${DATE}" --force
          RC=$?
          if python -m src.output_qc --kind general --path "$P"; then
            echo "general=ok" >> "$GITHUB_ENV"
            echo "FINISH_TAGS=${FINISH_TAGS}general/" >> "$GITHUB_ENV"
          else
            echo "general=fail:${RC}" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: catalyst SKIPPED (Cyrus/New Bot override)
        run: |
          DATE="${DATE}"
          mkdir -p 01_daily/catalyst
          {
            echo "# Catalyst finish note — ${DATE}"
            echo ""
            echo "**SKIPPED** by Cyrus / New Bot override."
            echo "Hung finish writer on `timeout 50m python -m src.catalyst_daily`"
            echo "(known 30–50m search sink + list.get flake)."
            echo "Priority this finish: tech + utilities + dashboard stamp only."
            echo ""
            echo "- reason: **skipped_override**"
            echo "- superseded_run: 34252251010"
          } > "01_daily/catalyst/${DATE}_finish_note.md"
          echo "catalyst=skipped_override" >> "$GITHUB_ENV"
          echo "Wrote 01_daily/catalyst/${DATE}_finish_note.md"

      - name: Refresh QC / status
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          DATE="${DATE}"
          python -m src.output_qc --date "${DATE}" --preopen --write || true
          {
            echo "# Finish holes stub — ${DATE}"
            echo ""
            echo "| hole | status |"
            echo "|---|---|"
            echo "| parse | ${parse:-unknown} |"
            echo "| judge | ${judge:-unknown} |"
            echo "| actions | ${actions:-unknown} |"
            echo "| general | ${general:-unknown} |"
            echo "| tech | ${technology:-unknown} |"
            echo "| utilities | ${utilities:-unknown} |"
            echo "| catalyst | ${catalyst:-unknown} |"
            echo "| dashboard | ${dashboard:-unknown} |"
          } > "01_daily/${DATE}_finish_holes.md"
          echo "Wrote 01_daily/${DATE}_finish_holes.md"
          exit 0

      - name: Commit finished holes
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          DATE="${DATE}"
          export HOME="${HOME:-${FULLSCAN_HOME:-/home/runner}}"
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          cd "${GITHUB_WORKSPACE:-.}"
          TAGS="${FINISH_TAGS:-}"
          TAGS="${TAGS%/}"
          [ -z "$TAGS" ] && TAGS="notes"
          MSG="auto: finish 2026-09-08 holes [${TAGS}]"
          echo "COMMIT: $MSG"
          bash scripts/safe_git_push.sh "$MSG" \
            "01_daily/news/" \
            "01_daily/general/" \
            "01_daily/sectors/${DATE}/" \
            "01_daily/catalyst/" \
            "01_daily/${DATE}_preopen_qc.json" \
            "01_daily/${DATE}_preopen_status.json" \
            "01_daily/${DATE}_preopen_status.md" \
            "01_daily/${DATE}_finish_holes.md" \
            "01_daily/${DATE}_dashboard_stamp_note.md" \
            "01_daily/_transcripts/" \
            "01_daily/_channel1/" \
            "dashboard/" \
            "03_scoreboard/" \
            "data/paper/" \
            "data/catalyst/" \
            "data/stock_book/" || true

      - name: Publish dashboard (optional)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/publish_dashboard.sh || true
          bash scripts/publish_dashboard.sh || true
