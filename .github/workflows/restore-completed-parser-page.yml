name: Restore packaged stock parser page
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-completed-parser-page.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: write
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/materialize_filing_texts.py
            dashboard/scanner-backtest/completed/index.html
          sparse-checkout-cone-mode: false
      - name: Read only the already verified package manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,re,zipfile
          from pathlib import Path
          from scripts.materialize_filing_texts import RangeReader,http_fetcher,signed_artifact_url
          destination=Path(os.environ['RUNNER_TEMP'])/'completed-view'
          destination.mkdir()
          reader=RangeReader(http_fetcher(signed_artifact_url('SRoyaltyy/fullscan',12364762059)))
          with reader,zipfile.ZipFile(reader) as archive:
              manifest=json.loads(archive.read('manifest.json'))
          assert manifest['complete'] and manifest['schema']=='completed-parser-review-1'
          assert manifest['source_run_id']==39522456843 and manifest['artifact_id']==12321883294
          assert manifest['published']['tickers']==len(manifest['profiles'])==2032
          assert manifest['published']['issuers']==2026 and manifest['published']['relationships']==754258
          assert len({entry['cik'] for entry in manifest['profiles'].values()})==2026
          for entry in manifest['profiles'].values():
              assert re.fullmatch(r'profiles/\d{10}\.json\.gz',entry['path'])
              assert re.fullmatch(r'[a-f0-9]{64}',entry['sha256'])
          manifest['asset_base_url']='https://raw.githubusercontent.com/SRoyaltyy/fullscan/8fef2051875b690a61004c22b3241489900e33dc/'
          data=json.dumps(manifest,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          assert len(data)<5_000_000
          (destination/'manifest.json').write_bytes(data)
          (destination/'index.html').write_bytes(Path('dashboard/scanner-backtest/completed/index.html').read_bytes())
          print(json.dumps({'published':manifest['published'],'transferred_bytes':reader.bytes_received}))
          PY
      - name: Publish the small viewer beside the existing article tests
        run: |
          git fetch --depth=1 origin gh-pages
          git sparse-checkout set --no-cone /dashboard/scanner-backtest/index.html /scanner-backtest/index.html /dashboard/scanner-backtest/completed/ /scanner-backtest/completed/
          git checkout -f -B gh-pages FETCH_HEAD
          python - <<'PY'
          import os,shutil
          from pathlib import Path
          incoming=Path(os.environ['RUNNER_TEMP'])/'completed-view'
          for parent in ('dashboard/scanner-backtest','scanner-backtest'):
              index=Path(parent)/'index.html'
              if not index.is_file():continue
              target=index.parent/'completed'
              target.mkdir(parents=True,exist_ok=True)
              for name in ('index.html','manifest.json'):shutil.copyfile(incoming/name,target/name)
              html=index.read_text()
              if 'id="completed-stock-results"' not in html:
                  title='<h1>Scanner backtest</h1>'
                  assert title in html
                  link='<p id="completed-stock-results"><a href="completed/">Browse the completed 2,032-stock extraction — 754,258 saved relationships with source paragraphs</a></p>'
                  index.write_text(html.replace(title,title+'\n'+link,1))
          PY
          git config user.name 'Completed parser page publisher'
          git config user.email 'bot@users.noreply.github.com'
          git add dashboard/scanner-backtest/index.html dashboard/scanner-backtest/completed scanner-backtest/index.html scanner-backtest/completed
          if ! git diff --cached --quiet; then
            git commit -m 'Publish the verified completed 2,032-stock review'
            git push origin HEAD:gh-pages
          fi
      - name: Request and verify Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
          python - <<'PY'
          import json,time,urllib.request
          base='https://sroyaltyy.github.io/fullscan/dashboard/scanner-backtest/'
          for attempt in range(36):
              try:
                  with urllib.request.urlopen(base+'completed/manifest.json?package=12364762059',timeout=20) as response:manifest=json.load(response)
                  with urllib.request.urlopen(base+'?package=12364762059',timeout=20) as response:page=response.read().decode()
                  if manifest['complete'] and manifest['published']['tickers']==2032 and manifest['published']['relationships']==754258 and 'id="completed-stock-results"' in page:
                      print('Verified complete saved stock results and navigation on the served page');break
              except (OSError,ValueError,KeyError):pass
              time.sleep(10)
          else:raise SystemExit('All-stock page has not been verified live')
          PY
