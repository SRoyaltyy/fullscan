name: Sleeve merge live card

# Today's flatten_hard_red tickets from leftover cash + open lots.
# Does not run the 25-policy sweep. Must not sit in front of the 09:30 book.

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "YYYY-MM-DD (empty = today ET)"
        required: false
        default: ""
  schedule:
    # Never inside the 03:00-09:40 ET input freeze (09:25 ET wrote
    # today.json into the freeze on 10-14 and 10-15). 13:45Z = 09:45 EDT;
    # 14:45Z = 09:45 EST. The off-season slot is gated or a harmless re-card.
    - cron: "45 13 * * 1-5"
    - cron: "45 14 * * 1-5"
  workflow_run:
    # Stock Book ALL is the later parent. Listening to Pre-Open AND the
    # book job canceled the first card mid-write (cancel-in-progress).
    workflows:
      - "Stock Book ALL (one-shot)"
    types: [completed]

permissions:
  contents: write
  pages: write

concurrency:
  group: sleeve-merge-live
  cancel-in-progress: false

jobs:
  card:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Freeze gate (no write 03:00-09:40 ET, any trigger)
        env:
          RUN_DATE: ${{ github.event.inputs.run_date }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sparse fetch of the gate only; the full clone happens after.
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/${GITHUB_REPOSITORY}/contents/src/sleeve_card_freeze.py?ref=${GITHUB_SHA}" \
            > /tmp/sleeve_card_freeze.py || true
          # Fail closed: if the gate cannot run or says nothing, do not write.
          OUT=$(python3 /tmp/sleeve_card_freeze.py --event "$EVENT" --date "${RUN_DATE:-}" || true)
          case "$OUT" in skip=no) ;; *) OUT="skip=yes" ;; esac
          echo "$OUT" >> "$GITHUB_ENV"
          tail -1 "$GITHUB_ENV"

      - uses: actions/checkout@v4
        if: env.skip != 'yes'
        with:
          fetch-depth: 0

      - name: Skip if today's book is missing
        if: env.skip != 'yes'
        run: |
          DATE="${{ github.event.inputs.run_date }}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          echo "DATE=$DATE"
          if [ ! -f "data/stock_book/${DATE}_stock_book.json" ]; then
            echo "no ${DATE} book — skip hollow flatten card"
            echo "skip=yes" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: env.skip != 'yes'
        with:
          python-version: "3.12"

      - name: Install
        if: env.skip != 'yes'
        run: pip install pandas numpy yfinance

      - name: Write today's card
        if: env.skip != 'yes'
        env:
          RUN_DATE: ${{ github.event.inputs.run_date }}
        run: |
          set -euo pipefail
          DATE="${RUN_DATE:-}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          python -m src.sleeve_merge --card --date "$DATE" --write-card
          python -m src.past_day_lock --check
          test -s "data/sleeve_merge/today.json"
          test -s "data/sleeve_merge/positions.json"
          test -s "01_daily/${DATE}_flatten_card.md"
          test -s dashboard/sleeve-merge/index.html
          grep -q "TODAY_BEGIN" dashboard/sleeve-merge/index.html
          echo "======== card ========"
          head -40 "01_daily/${DATE}_flatten_card.md"

      - name: Publish card to main
        if: env.skip != 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ github.event.inputs.run_date }}"
          DATE="${DATE:-$(TZ=America/New_York date +%F)}"
          bash scripts/safe_git_push.sh \
            "auto: flatten_hard_red card ${DATE}" \
            "01_daily/${DATE}_flatten_card.md" \
            data/sleeve_merge/today.json \
            data/sleeve_merge/positions.json \
            dashboard/sleeve-merge/ \
            data/past_day_lock/

      - name: Overlay Pages
        if: env.skip != 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/publish_dashboard.sh || true
          bash scripts/publish_dashboard.sh

      - name: Summary
        run: |
          echo "https://sroyaltyy.github.io/fullscan/dashboard/sleeve-merge/"
          echo "https://github.com/${GITHUB_REPOSITORY}/blob/main/01_daily/${{ github.event.inputs.run_date || '' }}_flatten_card.md"
