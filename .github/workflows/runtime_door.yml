name: Runtime door

# Phone Claw tab. Snapshot + optional OpenClaw door heal on the ECS box.
# Does not occupy the runner for a 3-hour pipeline health pass.
# Does not start xAI device login (that's xai_reauth.yml).
# Does not PONG while a Grok job is already talking.

on:
  workflow_dispatch:
    inputs:
      heal:
        description: "true = restart gateway/timers / patch 1800s timeouts if a door is down"
        required: false
        default: "true"

permissions:
  contents: write
  actions: read

concurrency:
  group: runtime-door
  cancel-in-progress: false

jobs:
  door:
    runs-on: [self-hosted, ecs]
    timeout-minutes: 8
    env:
      HOME: /home/gha
      FULLSCAN_HOME: /home/gha
      GROK_ONLY: "1"
    steps:
      - name: Clear stale git index.lock (shared ECS workspace)
        shell: bash
        run: |
          # A job killed mid-checkout leaves .git/index.lock; the next checkout then hangs.
          # One ECS runner, so a lock older than 1 minute before checkout is stale.
          W="${GITHUB_WORKSPACE:-.}"
          for L in "$W/.git/index.lock" "$W/.git/shallow.lock" "$W/.git/HEAD.lock"; do
            if [ -n "$(find "$L" -mmin +1 2>/dev/null)" ]; then echo "removing stale $L"; rm -f "$L" || sudo -n rm -f "$L" || true; fi
          done
          if [ "$(git -C "$W" config --get core.sparseCheckout 2>/dev/null)" = "true" ]; then
            echo "::warning::shared ECS workspace is sparse; this checkout re-materializes the full tree"
          fi
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0

      - name: Full tree after leftover sparse-checkout
        run: |
          # Shared ECS work dir keeps a prior job's sparse-checkout.
          git sparse-checkout disable || true
          test -f requirements.txt || {
            echo "ERROR: requirements.txt missing. A prior job left git sparse-checkout enabled on this self-hosted runner."
            exit 1
          }

      - name: Snapshot or heal runtime doors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
        run: |
          set -uo pipefail
          export HOME=/home/gha
          mkdir -p /home/gha/fullscan-logs
          chmod +x scripts/runtime_status.py scripts/safe_git_push.sh \
            scripts/enable_openclaw_chat.sh scripts/ensure_openclaw_timeouts.sh || true
          HEAL="${{ github.event.inputs.heal }}"
          DATE=$(TZ=America/New_York date +%F)
          python3 -m src.workflow_progress beat --workflow runtime_door --date "$DATE" --stages snapshot --stage snapshot >> /tmp/progress_beat.log 2>&1 &
          echo $! > /tmp/progress_beat.pid
          trap 'kill "$(cat /tmp/progress_beat.pid)" 2>/dev/null || true' EXIT
          if [ "$HEAL" = "true" ]; then
            python3 scripts/runtime_status.py --heal || true
          else
            python3 scripts/runtime_status.py --write || true
          fi
          echo "======== _runtime.json ========"
          cat 01_daily/_runtime.json 2>/dev/null || echo "(missing)"
          python3 -m src.workflow_progress touch --workflow runtime_door --date "$DATE" --stage snapshot --state ok || true
