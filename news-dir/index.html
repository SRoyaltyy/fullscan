<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News directory</title>
<style>
:root { color-scheme: light; }
body { margin: 0; background: #f4f1ea; color: #1c1915; font: 17px/1.45 Georgia, "Iowan Old Style", Palatino, serif; }
header { max-width: 1100px; margin: 0 auto; padding: 28px 20px 0; }
h1 { font-size: 32px; margin: 0 0 8px; }
.lede { color: #4a453c; margin: 0 0 18px; }
form { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; background: #fff; border: 1px solid #e4ddd0; padding: 14px; }
label { display: flex; flex-direction: column; gap: 4px; font: 13px/1.2 ui-sans-serif, system-ui, sans-serif; color: #4a453c; }
label.check { flex-direction: row; align-items: center; gap: 8px; padding-bottom: 8px; }
input[type=text], input[type=date], input[type=password] { font: 16px/1.3 ui-sans-serif, system-ui, sans-serif; color: #1c1915; background: #fff; border: 1px solid #c8bfb0; padding: 8px 10px; min-width: 11em; }
button { font: 16px/1.2 ui-sans-serif, system-ui, sans-serif; background: #1c1915; color: #f4f1ea; border: 0; padding: 10px 16px; cursor: pointer; }
button.secondary { background: #1d6b3a; }
button:disabled { opacity: 0.45; cursor: wait; }
#status { font: 15px/1.4 ui-sans-serif, system-ui, sans-serif; margin: 16px 0; }
.hit { color: #1d6b3a; font-weight: 650; }
.miss { color: #9b2c2c; font-weight: 650; }
.layout { max-width: 1100px; margin: 0 auto; padding: 0 20px 40px; display: grid; grid-template-columns: 1fr; gap: 16px; }
.layout.on { grid-template-columns: minmax(0, 1fr) 340px; }
.keepbox { background: #fff; border: 1px solid #c9dfc4; padding: 14px; position: sticky; top: 12px; max-height: 80vh; overflow: auto; display: none; }
.layout.on .keepbox { display: block; }
.keepbox h3 { margin: 0 0 8px; font: 15px/1.3 ui-sans-serif, system-ui, sans-serif; color: #1d6b3a; }
.keepbox ol { margin: 0; padding-left: 18px; }
.keepbox li { margin: 0 0 10px; font-size: 15px; }
article { background: #fff; border: 1px solid #e4ddd0; padding: 14px 16px; margin: 0 0 10px; }
article.drop { border-color: #e7c8c8; }
.theme { border-color: #d7c7a2; }
.meta { font: 13px/1.3 ui-sans-serif, system-ui, sans-serif; color: #4a453c; margin-bottom: 6px; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 99px; font-weight: 650; }
.parsed { background: #e7f0e4; color: #1d6b3a; }
.published { background: #e7eef8; color: #1d4e89; }
.keep { background: #e7f0e4; color: #1d6b3a; }
.drop { background: #f8e7e7; color: #9b2c2c; }
.unscored { background: #eeeae3; color: #4a453c; }
.themechip { background: #f4ead2; color: #6b5420; }
h2 { font-size: 18px; margin: 0; font-weight: 650; }
h2 a, .rel a { color: #1d4e89; text-decoration: none; }
h2 a:hover, .rel a:hover { text-decoration: underline; }
.source, .why { margin: 6px 0 0; color: #4a453c; font: 14px/1.3 ui-sans-serif, system-ui, sans-serif; }
.rel { list-style: none; margin: 10px 0 0; padding: 0; border-top: 1px solid #e4ddd0; }
.rel li { padding: 8px 0; border-bottom: 1px solid #f0ebe3; font-size: 16px; }
@media (max-width: 800px) { .layout.on { grid-template-columns: 1fr; } .keepbox { position: static; max-height: none; } }
</style>
</head>
<body>
<header>
<h1>News directory</h1>
<p class="lede">Search by date or term. JEV evaluate scores the current result with the frozen evidence/context rubric: misses stay on the left, keeps move to the right. A token is only needed when this result has no published score yet.</p>
<form id="f">
<label>Parse date<input id="parse" type="date"></label>
<label>Published date<input id="pub" type="date"></label>
<label>Term or ticker<input id="q" type="text" placeholder="Micron, MU, Hormuz"></label>
<label class="check"><input id="themes" type="checkbox"> Themes</label>
<label>GitHub token<input id="token" type="password" autocomplete="off" placeholder="only to call JEV"></label>
<button type="submit">Search</button>
<button type="button" class="secondary" id="eval">JEV evaluate</button>
</form>
<p id="status"></p>
</header>
<div class="layout" id="layout">
<div id="rows"></div>
<aside class="keepbox" id="keepbox">
<h3>Keep</h3>
<ol id="keeps"></ol>
</aside>
</div>
<script>
const REPO = "SRoyaltyy/fullscan";
const RAW = "https://raw.githubusercontent.com/" + REPO + "/main/";
const WORKFLOW = "news_dir_jev.yml";
const $ = (id) => document.getElementById(id);
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const STOP = new Set("the a an of to and in for on as with after before from by at is are was were be its it that this says said just more new over into about how why what will could would their his her has have had not but or if than then also today yesterday week after update live news stock stocks market markets shares share price prices".split(" "));
const ENT = {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"};
const state = { rows: [], missing: [], scored: false };

function norm(s){ return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
function words(title){ return [...new Set(norm(title).split(" ").filter(w => w.length > 2 && !STOP.has(w)))]; }
function day(v){
  const s = String(v || "");
  const iso = s.match(/(20\d{2}-\d{2}-\d{2})/);
  if (iso) return iso[1];
  const rfc = s.match(/(\d{1,2})\s+([A-Za-z]{3})\s+(20\d{2})/);
  if (!rfc) return "";
  const m = MONTHS.findIndex(x => x.toLowerCase() === rfc[2].toLowerCase());
  if (m < 0) return "";
  return rfc[3] + "-" + String(m + 1).padStart(2, "0") + "-" + String(Number(rfc[1])).padStart(2, "0");
}
function pretty(iso){
  if (!iso || iso.length < 10 || !/^\d{4}-\d{2}-\d{2}/.test(iso)) return "no published date";
  const [y, m, d] = iso.slice(0, 10).split("-");
  return Number(d) + " " + MONTHS[Number(m) - 1] + " " + y;
}
function tickers(title){ return (title.match(/\b[A-Z]{1,5}\b/g) || []).join(" "); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ENT[c]); }
function link(r){ return r.url ? `<a href="${esc(r.url)}">${esc(r.title)}</a>` : esc(r.title); }
function termHay(r){ return (r.title + " " + (r.source || "") + " " + (r.tick || "")).toLowerCase(); }
function matchTerm(rows, q){
  if (!q) return rows;
  return rows.filter(r => termHay(r).includes(q));
}
function themesOf(rows){
  const df = new Map();
  for (const r of rows) for (const w of words(r.title)) df.set(w, (df.get(w) || 0) + 1);
  const cap = Math.max(3, Math.floor(rows.length * 0.35));
  const groups = new Map();
  const loose = [];
  for (const r of rows){
    const keys = words(r.title).filter(w => { const n = df.get(w) || 0; return n >= 2 && n <= cap; });
    if (!keys.length){ loose.push(r); continue; }
    keys.sort((a, b) => df.get(a) - df.get(b) || a.localeCompare(b));
    const key = keys[0];
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  const clusters = [...groups.entries()].filter(([, rs]) => rs.length >= 2).sort((a, b) => b[1].length - a[1].length);
  return {clusters, loose};
}
function themeCard(key, rs){
  const lead = rs[0];
  const rest = rs.slice(1).map(r => `<li>${link(r)}<div class="source">${esc(r.source || "no source")}</div></li>`).join("");
  return `<article class="theme">
    <div class="meta"><span class="chip themechip">${esc(key)}</span> ${rs.length} headlines</div>
    <h2>${link(lead)}</h2>
    <p class="source">${esc(lead.source || "no source")}</p>
    <ul class="rel">${rest}</ul>
  </article>`;
}
function card(r){
  const scored = r.jev && (r.jev.jev === "KEEP" || r.jev.jev === "DROP");
  const tag = scored
    ? `<p class="why"><span class="chip ${r.jev.jev === "KEEP" ? "keep" : "drop"}">${r.jev.jev}</span> ${esc(r.jev.reason || "")}</p>`
    : (state.scored ? `<p class="why"><span class="chip unscored">not scored</span></p>` : "");
  return `<article class="${scored && r.jev.jev === "DROP" ? "drop" : ""}">
    <div class="meta"><span class="chip ${r.stage || "parsed"}">${r.stage || "parsed"}</span> parsed ${pretty(r.parse)} · published ${pretty(r.published)}</div>
    <h2>${link(r)}</h2>
    <p class="source">${esc(r.source || "no source")}</p>
    ${tag}
  </article>`;
}
function verdict(it){
  const raw = String(it.decision || it.jev || it.verdict || "").toUpperCase();
  if (raw === "KEEP" || raw === "DROP") return raw;
  if (it.keep === true) return "KEEP";
  if (it.drop === true) return "DROP";
  return "";
}
function walk(node, into){
  if (!node) return;
  if (Array.isArray(node)){ node.forEach(x => walk(x, into)); return; }
  if (typeof node !== "object") return;
  const title = node.title || node.headline || node.name;
  if (title && verdict(node)) into.push(Object.assign({title}, node));
  for (const k of ["items","rows","keeps","dropped","drops","decisions","all_items"]){
    if (Array.isArray(node[k])) walk(node[k], into);
  }
}
function rowsFrom(doc, parseDate, stage){
  const items = (doc && (doc.all_items || doc.items || doc.events || doc.actions)) || [];
  return items.map(it => ({
    parse: parseDate,
    published: day(it.published_at || it.known_at || it.date || ""),
    stage,
    title: it.title || it.event || it.name || "",
    source: it.source || "",
    url: it.url || "",
    tick: (it.ticker || "") + " " + tickers(it.title || "")
  })).filter(r => r.title);
}
async function getJson(urls){
  for (const url of urls){
    try {
      const res = await fetch(url, { cache: "no-store" });
      if (res.ok) return res.json();
    } catch (err) { /* next */ }
  }
  return null;
}
async function loadDay(date){
  const out = [];
  const missing = [];
  for (const [path, stage] of [
    [`01_daily/news/${date}_parsed.json`, "parsed"],
    [`01_daily/news/${date}_actions.json`, "published"],
    [`01_daily/events/${date}_events.json`, "parsed"]
  ]){
    const doc = await getJson([RAW + path]);
    if (!doc){ missing.push(path); continue; }
    out.push(...rowsFrom(doc, date, stage));
  }
  return {out, missing};
}
function enumerateDays(from, to){
  const out = [];
  const cur = new Date(from + "T12:00:00Z");
  const end = new Date(to + "T12:00:00Z");
  while (cur <= end){
    out.push(cur.toISOString().slice(0, 10));
    cur.setUTCDate(cur.getUTCDate() + 1);
  }
  return out;
}
async function loadDays(){
  const doc = await getJson(["days.json", RAW + "dashboard/news-dir/days.json"]);
  if (doc && Array.isArray(doc.days) && doc.days.length) return doc.days.map(d => d.date || d);
  return enumerateDays("2026-08-08", new Date().toISOString().slice(0, 10));
}
async function loadIndex(){
  return getJson(["index.json", RAW + "dashboard/news-dir/index.json"]);
}
async function loadByTerm(q){
  const idx = await loadIndex();
  if (idx && Array.isArray(idx.rows) && idx.rows.length) return {out: matchTerm(idx.rows, q), missing: []};
  const days = await loadDays();
  const missing = [];
  const out = [];
  const chunk = 8;
  for (let i = 0; i < days.length; i += chunk){
    $("status").textContent = "Looking " + Math.min(i + chunk, days.length) + "/" + days.length + " days";
    const part = await Promise.all(days.slice(i, i + chunk).map(loadDay));
    for (const loaded of part){
      out.push(...loaded.out);
      missing.push(...loaded.missing.filter(p => p.includes("_parsed.json")));
    }
  }
  return {out: matchTerm(out, q), missing: []};
}
async function loadScores(date){
  const map = new Map();
  const docs = [];
  for (const url of [
    `scores/${date}.json`,
    RAW + `dashboard/news-dir/scores/${date}.json`,
    RAW + `01_daily/news/${date}_jev_keep.json`
  ]){
    const doc = await getJson([url]);
    if (doc) docs.push(doc);
  }
  const found = [];
  for (const doc of docs) walk(doc, found);
  for (const it of found) map.set(norm(it.title), {jev: verdict(it), reason: it.reason || it.why || ""});
  return map;
}
function applyScores(rows, map){
  let n = 0;
  for (const r of rows){
    const hit = map.get(norm(r.title));
    if (hit){ r.jev = hit; n += 1; }
  }
  return n;
}
async function loadPublishedScores(dates){
  const manifest = await getJson(["scores/index.json", RAW + "dashboard/news-dir/scores/index.json"]);
  const extra = (manifest && Array.isArray(manifest.stamps)) ? manifest.stamps : [];
  const all = [...new Set(["latest", ...extra, ...dates])].slice(0, 24);
  const maps = await Promise.all(all.map(loadScores));
  const map = new Map();
  for (const part of maps) for (const [k, v] of part) map.set(k, v);
  return map;
}
async function putRequest(id, payload, token){
  const path = "dashboard/news-dir/scores/" + id + "-req.json";
  const res = await fetch("https://api.github.com/repos/" + REPO + "/contents/" + path, {
    method: "PUT",
    headers: {
      Authorization: "Bearer " + token,
      Accept: "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    },
    body: JSON.stringify({
      message: "news dir: JEV request " + id + " [skip ci]",
      content: b64(payload),
      branch: "main"
    })
  });
  return res.ok;
}
function render(rows, {themes, scored}){
  state.scored = scored;
  $("layout").classList.toggle("on", scored);
  const keeps = rows.filter(r => r.jev && r.jev.jev === "KEEP");
  if (themes){
    const {clusters, loose} = themesOf(rows);
    $("rows").innerHTML = clusters.map(([k, rs]) => themeCard(k, rs)).join("") + loose.slice(0, 30).map(card).join("");
    $("status").innerHTML = `<span class="hit">${clusters.length} themes</span> from ${rows.length} headlines`;
  } else {
    const left = scored ? rows.filter(r => !r.jev || r.jev.jev !== "KEEP") : rows;
    $("rows").innerHTML = left.slice(0, 200).map(card).join("");
    const dropN = rows.filter(r => r.jev && r.jev.jev === "DROP").length;
    const missN = scored ? left.length - dropN : 0;
    $("status").innerHTML = rows.length
      ? `<span class="hit">${rows.length} hits</span>` + (scored ? ` · <span class="hit">${keeps.length} keep</span> · <span class="miss">${dropN} drop</span>` + (missN ? ` · ${missN} not scored. Paste a GitHub token and evaluate again to call JEV.` : "") : "")
      : `<span class="miss">Not in the repo.</span>`;
  }
  $("keeps").innerHTML = keeps.map(r => `<li>${esc(r.title)}<div class="why">${esc(r.jev.reason || "")}</div></li>`).join("") || "<li>No keep in this result.</li>";
}
async function search(){
  const parse = $("parse").value;
  const pub = $("pub").value;
  const q = $("q").value.trim().toLowerCase();
  const themes = $("themes").checked;
  if (!parse && !q){ $("status").textContent = "Enter a term, or a date."; return []; }
  $("status").textContent = "Looking";
  let rows = [];
  let missing = [];
  if (parse){
    const loaded = await loadDay(parse);
    rows = matchTerm(loaded.out, q);
    missing = loaded.missing;
  } else {
    const loaded = await loadByTerm(q);
    rows = loaded.out;
    missing = loaded.missing;
  }
  if (pub) rows = rows.filter(r => r.published === pub);
  state.rows = rows;
  state.missing = missing;
  render(rows, {themes, scored: false});
  if (missing.length) $("status").innerHTML += " " + esc("Missing: " + missing.join(", "));
  return rows;
}
function stamp(){
  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  return now.getUTCFullYear() + "-" + pad(now.getUTCMonth() + 1) + "-" + pad(now.getUTCDate()) + "-" + pad(now.getUTCHours()) + pad(now.getUTCMinutes());
}
function b64(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
async function pollScores(id, token){
  const urls = [
    RAW + `dashboard/news-dir/scores/${id}.json`,
    `scores/${id}.json`
  ];
  for (let i = 0; i < 24; i++){
    const doc = await getJson(urls);
    if (doc && Array.isArray(doc.items) && doc.items.length) return doc;
    await new Promise(r => setTimeout(r, 5000));
  }
  if (token){
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/dashboard/news-dir/scores/${id}.json?ref=main`, {
      headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" }
    });
    if (res.ok){
      const meta = await res.json();
      if (meta.content) return JSON.parse(atob(meta.content.replace(/\n/g, "")));
    }
  }
  return null;
}
async function evaluate(){
  const themes = $("themes").checked;
  let rows = state.rows;
  if (!rows.length) rows = await search();
  if (!rows.length) return;
  $("eval").disabled = true;
  $("status").textContent = "Scoring";
  try {
    const dates = [...new Set(rows.map(r => r.parse).filter(Boolean))];
    applyScores(rows, await loadPublishedScores(dates));
    const open = rows.filter(r => !r.jev);
    const token = ($("token").value || "").trim();
    if (open.length && token){
      const id = stamp();
      const payload = {
        stamp: id,
        rows: open.slice(0, 200).map(r => ({title: r.title, source: r.source || "", parse: r.parse || ""}))
      };
      const stored = await putRequest(id, payload, token);
      const inputs = stored
        ? { stamp: id }
        : { stamp: id, titles_b64: b64({ stamp: id, rows: payload.rows.slice(0, 40) }) };
      const res = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW}/dispatches`, {
        method: "POST",
        headers: {
          Authorization: "Bearer " + token,
          Accept: "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28"
        },
        body: JSON.stringify({ ref: "main", inputs })
      });
      if (!res.ok){
        const err = await res.text();
        $("status").innerHTML = `<span class="miss">JEV dispatch failed (${res.status}).</span> ${esc(err.slice(0, 180))}`;
        render(rows, {themes, scored: true});
        return;
      }
      const n = stored ? payload.rows.length : Math.min(40, open.length);
      $("status").textContent = "JEV is scoring " + n + " headlines";
      const doc = await pollScores(id, token);
      if (doc){
        const live = new Map();
        for (const it of doc.items || []) live.set(norm(it.title), {jev: verdict(it), reason: it.reason || ""});
        applyScores(rows, live);
      } else {
        $("status").innerHTML = `<span class="miss">JEV ran but the score file is not up yet. Search again in a minute.</span>`;
      }
    } else if (open.length && !token){
      $("status").innerHTML = `<span class="miss">${open.length} headlines have no published score.</span> Paste a GitHub token to call JEV on this result.`;
    }
    render(rows, {themes, scored: true});
  } finally {
    $("eval").disabled = false;
  }
}
$("f").onsubmit = async (ev) => { ev.preventDefault(); await search(); };
$("eval").onclick = () => evaluate();
</script>
</body>
</html>
