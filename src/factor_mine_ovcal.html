<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overnight vs session calendar</title>
<style>
 :root{--bg:#0f1420;--card:#171e2e;--line:#262f45;--fg:#dfe6f2;--mut:#8b96ab;--dim:#66708a;--pos:#4ade80;--neg:#f87171;--gold:#fbbf24}
 *{box-sizing:border-box}
 html,body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
 .wrap{padding:10px 10px 28px}
 h1{font-size:18px;margin:0 0 4px}
 .sub{color:var(--mut);font-size:12px;margin:0 0 8px}
 a{color:#93c5fd}
 .leg{display:flex;flex-wrap:wrap;gap:8px;color:var(--mut);font-size:11.5px;margin:0 0 10px}
 .leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
 .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:8px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;min-width:0}
 .card.on{border-color:var(--gold)}
 .nm{font:650 11.5px/1.2 ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere;margin:0 0 4px}
 .tot{display:flex;flex-wrap:wrap;gap:6px 10px;font:11px/1.2 ui-monospace,Menlo,Consolas,monospace;margin:0 0 5px;color:var(--mut)}
 .wk{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
 .dow{color:var(--dim);font:10px/1.2 sans-serif;text-align:center}
 .cell{border-radius:4px;overflow:hidden;background:#121826;border:1px solid #1f2937;min-height:28px}
 .cell.empty{opacity:.25}
 .cell .d{display:block;font:700 9px/1.1 ui-monospace,Menlo,monospace;text-align:center;padding:1px 0 0;color:#cbd5e1}
 .half{height:8px}
 .pos{color:var(--pos)}.neg{color:var(--neg)}
 .tip{margin:8px 0 0;font:12px/1.35 ui-monospace,Menlo,monospace;min-height:1.3em}
 .bar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
 button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
 button.on{border-color:var(--gold);color:var(--gold)}
</style></head><body><div class="wrap">
<h1>Overnight vs session</h1>
<div class="sub"><a href="./">factor mine</a> · top half = overnight (prior close → 09:30) · bottom = session (09:30 → 16:00)</div>
<div class="sub" id="stamp">loading pack…</div>
<div class="leg">
 <span><i style="background:#4ade80"></i>overnight +</span>
 <span><i style="background:#f87171"></i>overnight −</span>
 <span><i style="background:#86efac"></i>session +</span>
 <span><i style="background:#fca5a5"></i>session −</span>
</div>
<div class="bar" id="bar"></div>
<div class="grid" id="grid"></div>
<div class="tip" id="tip"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script>
function b64ToBytes(s){
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmt(v){ if(v==null||!isFinite(v)) return '—'; return (v>0?'+':'')+v.toFixed(0); }
function heat(v, scale){
  if(v==null || !isFinite(v) || Math.abs(v)<0.5) return 'rgba(148,163,184,.12)';
  const a = Math.min(1, Math.abs(v)/scale);
  const pos = v>0;
  const r = pos?74:248, g=pos?222:113, b=pos?128:113;
  return 'rgba('+r+','+g+','+b+','+(0.22+0.78*a)+')';
}
function splitDays(days){
  const rows=[]; let prev=null;
  for(const d of (days||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)))){
    const oe=Number(d.open_equity), eq=Number(d.equity);
    rows.push({date:d.date, ov: prev==null?null:oe-prev, sess:eq-oe, bought:d.bought||[], sold:d.sold||[]});
    prev=eq;
  }
  return rows;
}
function scaleOf(rows){
  const xs=[];
  for(const r of rows){ if(r.ov!=null) xs.push(Math.abs(r.ov)); xs.push(Math.abs(r.sess||0)); }
  xs.sort((a,b)=>a-b);
  const p = xs.length ? xs[Math.floor(xs.length*0.9)] : 200;
  return Math.max(180, p||200);
}
function weeksOf(rows){
  if(!rows.length) return [];
  const by={}; for(const r of rows) by[r.date]=r;
  const a=rows[0].date, b=rows[rows.length-1].date;
  const start=new Date(a+'T12:00:00');
  const end=new Date(b+'T12:00:00');
  const dow0=start.getDay();
  start.setDate(start.getDate()-(dow0===0?6:dow0-1));
  const weeks=[]; let week=[];
  for(let t=new Date(start); t<=end || week.length; t.setDate(t.getDate()+1)){
    const dow=t.getDay();
    if(dow===0||dow===6){ if(dow===6 && week.length){ weeks.push(week); week=[]; } if(t>end && !week.length) break; continue; }
    const iso=t.toISOString().slice(0,10);
    week.push(by[iso]||{date:iso,empty:true});
    if(week.length===5){ weeks.push(week); week=[]; }
    if(t>end && !week.length) break;
  }
  if(week.length) weeks.push(week);
  return weeks;
}
let D=null, pick='all';
function cardHtml(name){
  const rows=splitDays((D.daily||{})[name]);
  if(!rows.length) return '<div class="card"><div class="nm">'+esc(name)+'</div><div class="sub">no daily book</div></div>';
  const scale=scaleOf(rows);
  let ovS=0,seS=0,ovN=0,ovG=0,seG=0;
  for(const r of rows){ if(r.ov!=null){ ovS+=r.ov; ovN++; if(r.ov>0) ovG++; } seS+=r.sess||0; if((r.sess||0)>0) seG++; }
  let h='<div class="card'+(pick===name?' on':'')+'" data-name="'+esc(name)+'">';
  h+='<div class="nm">'+esc(name)+'</div>';
  h+='<div class="tot"><span class="'+(ovS>=0?'pos':'neg')+'">ov '+fmt(ovS)+'</span>';
  h+='<span class="'+(seS>=0?'pos':'neg')+'">sess '+fmt(seS)+'</span>';
  h+='<span>ov+ '+(ovN?ovG+'/'+ovN:'—')+' · sess+ '+seG+'/'+rows.length+'</span></div>';
  h+='<div class="wk">';
  for(const d of ['M','T','W','T','F']) h+='<div class="dow">'+d+'</div>';
  for(const w of weeksOf(rows)){
    for(const cell of w){
      if(cell.empty){ h+='<div class="cell empty"></div>'; continue; }
      const dayn=String(cell.date).slice(8,10).replace(/^0/,'');
      const tip=cell.date+'  ov '+fmt(cell.ov)+'  sess '+fmt(cell.sess)+(cell.bought&&cell.bought.length?'  B '+cell.bought.join(','):'');
      h+='<div class="cell" data-tip="'+esc(tip)+'" title="'+esc(tip)+'">';
      h+='<span class="d">'+esc(dayn)+'</span>';
      h+='<div class="half" style="background:'+heat(cell.ov,scale)+'"></div>';
      h+='<div class="half" style="background:'+heat(cell.sess,scale)+'"></div></div>';
    }
  }
  return h+'</div></div>';
}
function render(){
  const names=(D.stats||[]).map(s=>s.name).filter(n=>D.daily && D.daily[n]);
  const show = pick==='all' ? names : names.filter(n=>n===pick);
  document.getElementById('grid').innerHTML = show.map(cardHtml).join('');
  const bar=document.getElementById('bar');
  bar.innerHTML = '<button data-name="all" class="'+(pick==='all'?'on':'')+'">all</button>' +
    names.map(n=>'<button data-name="'+esc(n)+'" class="'+(pick===n?'on':'')+'">'+esc(n)+'</button>').join('');
}
document.getElementById('grid').onclick=function(ev){
  const cell=ev.target.closest('.cell[data-tip]');
  if(cell){ document.getElementById('tip').textContent=cell.getAttribute('data-tip'); return; }
  const card=ev.target.closest('.card[data-name]');
  if(card){ pick=card.getAttribute('data-name'); render(); }
};
document.getElementById('bar').onclick=function(ev){
  const b=ev.target.closest('button[data-name]');
  if(!b) return;
  pick=b.getAttribute('data-name');
  render();
};
(async function(){
  const res = await fetch('./index.html', {cache:'no-store'});
  const text = await res.text();
  const m = text.match(/const B64 = "([A-Za-z0-9+/=]+)"/);
  if(!m){ document.getElementById('stamp').textContent='could not read pack from index.html'; return; }
  const bytes = b64ToBytes(m[1]);
  const json = new TextDecoder().decode(pako.ungzip(bytes));
  D = JSON.parse(json);
  document.getElementById('stamp').textContent =
    (D.n_recipes||'?')+' sleeves · '+(D.n_sessions||'?')+' sessions '+
    (D.from_date||'')+' → '+(D.to_date||'')+' · pack '+String(D.generated_at||'').slice(0,16).replace('T',' ');
  render();
})().catch(e=>{ document.getElementById('stamp').textContent='load failed: '+e; });
</script></body></html>
