  return 0;
}
function hCf(v){ if(v==null) return ""; if(v>0.05) return "h-mid"; if(v>0) return "h-pale"; if(v<-0.03) return "h-pink"; if(v<0) return "h-hot"; return ""; }
function iCf(v){ if(v==null) return ""; if(v>0.03) return "i-green"; if(v<-0.03) return "h-pink"; return ""; }
function dateCf(hn){ if(hn<=-1) return "hn-red"; if(hn>=4) return "hn-deep"; if(hn>=0) return "hn-pale"; return ""; }
function closeCf(hm){ if(hm<=0) return "hm-red"; if(hm>=3) return "hm-mid"; return ""; }
function volCf(cp){ if(cp>1) return "vol-deep"; if(cp>0) return "vol-pale"; if(cp<-1) return "vol-hard"; if(cp<0) return "vol-red"; return ""; }

function emptyBucket(){ return {n:0, ocMean:null, ocWin:null, nxMean:null, nxWin:null}; }
function bucketOf(rows, pred){
  const xs=rows.filter(r=>pred(r)&&!r.sit);
  const oc=xs.map(r=>r.oc).filter(v=>v!=null);
  const nx=xs.map(r=>r.nx).filter(v=>v!=null);
  const mean=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;
  const w=a=>a.length?a.filter(v=>v>0).length/a.length:null;
  return {n:xs.length, ocMean:mean(oc), ocWin:w(oc), nxMean:mean(nx), nxWin:w(nx)};
}

function parseInv(raw, ticker){
  const o=rec(raw); const rows=[];
  for(const item of (Array.isArray(o.rows)?o.rows:[])){
    const r=rec(item); if(!r.date) continue;
    const boxes={}; const b=rec(r.boxes);
    for(const [k,v] of Object.entries(b)){
      const t=String(v); boxes[k]=(t==="good"||t==="bad"||t==="neutral"||t==="missing")?t:"missing";
    }
    rows.push({date:String(r.date), s:n(r.s), hard_red:r.hard_red===true, on_list:r.on_list===true,
      reconstructed:r.reconstructed===true, n_pos:n(r.n_pos), n_neg:n(r.n_neg), boxes,
      open:n(r.open), close:n(r.close)});
  }
  const camShort={}; const cs=rec(o.cam_short); for(const [k,v] of Object.entries(cs)) camShort[k]=String(v);
  const camOrder=Array.isArray(o.cam_order)?o.cam_order.map(String):Object.keys(camShort);
  return {ticker:o.ticker||ticker, cam_order:camOrder, cam_short:camShort, rows};
}
function barsFromSeed(s){
  if(!s||!s.d) return [];
  const out=[];
  for(let i=0;i<s.d.length;i++){
    if(s.o[i]==null||s.c[i]==null) continue;
    out.push({date:s.d[i], open:s.o[i], high:s.h?s.h[i]:null, low:s.l?s.l[i]:null, close:s.c[i], volume:s.v?s.v[i]:null});
  }
  return out;
}
function parseYahoo(raw){
  const chart=rec(rec(raw).chart);
  const result=Array.isArray(chart.result)?rec(chart.result[0]):{};
  const ts=Array.isArray(result.timestamp)?result.timestamp:[];
  const q0=rec(Array.isArray(rec(result.indicators).quote)?rec(result.indicators).quote[0]:rec(result.indicators).quote);
  const opens=q0.open||[], highs=q0.high||[], lows=q0.low||[], closes=q0.close||[], vols=q0.volume||[];
  const bars=[];
  for(let i=0;i<ts.length;i++){
    const t=n(ts[i]), open=n(opens[i]), close=n(closes[i]);
    if(t==null||open==null||close==null) continue;
    const d=new Date(t*1000);
    const iso=`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
    bars.push({date:iso, open, high:n(highs[i]), low:n(lows[i]), close, volume:n(vols[i])});
  }
  return bars;
}

function buildSheet(ticker, bars, inv){
  const byDate=new Map((inv?.rows||[]).map(r=>[r.date,r]));
  const invRows=inv?.rows||[];
  const setupByDate=new Map();
  invRows.forEach((r,i)=>setupByDate.set(r.date, setupOf(invRows,i)));
  const highs=bars.map(b=>b.high), lows=bars.map(b=>b.low), vols=bars.map(b=>b.volume);
  const H=bars.map(b=>b.open?(b.close-b.open)/b.open:null);
  const I=bars.map((b,i)=>{ const p=i>0?bars[i-1].close:null; return p?(b.close-p)/p:null; });
  const J=bars.map((b,i)=>{ const p=i>0?bars[i-1].open:null; return p?(b.open-p)/p:null; });
  const K=bars.map(b=>b.high==null?null:(b.high-b.open)/(b.open+0.001));
  const M=bars.map(b=>b.low==null||!b.open?null:-(b.low-b.open)/b.open);
  const G=bars.map((b,i)=>{ const p=i>0?vols[i-1]:null; return b.volume!=null&&p?b.volume/p:null; });
  const CP=bars.map((b,i)=>cpOf(b.high,b.low,maxN(highs,i,20),minN(lows,i,20)));
  const CD=bars.map((b,i)=>{ const hi20=maxN(highs,i,20); const prev=i>0?maxN(highs,i-1,20):null; return b.high!=null&&hi20!=null&&b.high>=hi20&&(prev==null||prev<hi20); });
  const CE=bars.map((b,i)=>{ const lo20=minN(lows,i,20); const prev=i>0?minN(lows,i-1,20):null; return b.low!=null&&lo20!=null&&b.low<=lo20&&(prev==null||prev>lo20); });
  const HM=bars.map((_,i)=>{
    const h=i>0?H[i-1]:null, m=i>0?M[i-1]:null, u=i>0?K[i-1]:null;
    let s=2;
    if(h!=null&&m!=null&&u!=null){
      if(h<0.03&&m>=0.04&&u<0.05) s-=2;
      if(h>0&&m<0.05&&u>=0.05) s+=2;
      if(u>m&&u>0.05) s+=1;
      if(u<m&&m>=0.05) s-=1;
    }
    const e1=i>0?lows[i-1]:null, e2=i>1?lows[i-2]:null;
    if(e1!=null&&e2!=null&&e1>e2) s+=1;
    return s;
  });
  const HN=bars.map((_,i)=>{
    const hPrev=i>0?H[i-1]:null, cpPrev=i>0?CP[i-1]:0;
    let s=0;
    if(hPrev!=null&&hPrev>=0.05) s+=1;
    if(cpPrev>=1) s+=1;
    const win=H.slice(Math.max(0,i-8), i);
    if(win.length && win.every(x=>x==null||x>=-0.03)) s+=1;
    if(hPrev!=null&&hPrev<=-0.04) s-=1;
    if(cpPrev<0) s-=1;
    if(HM[i]>=3) s+=2;
    if(hPrev!=null&&hPrev>0) s+=1;
    if(hPrev!=null&&hPrev<0) s-=1;
    return s;
  });
  const chrono=bars.map((b,i)=>{
    const invRow=byDate.get(b.date);
    const g=G[i], q=g!=null&&g>2.5;
    const nxt=i+1<bars.length?bars[i+1]:null;
    const oc=b.open?(b.close-b.open)/b.open:null;
    const nx=nxt&&b.close?(nxt.close-b.close)/b.close:null;
    const excel=[
      {text:dmy(b.date), cf:dateCf(HN[i]), title:`HN ${HN[i]}`},
      {text:`$ ${fmtPx(b.close)}`, cf:closeCf(HM[i]), title:`HM ${HM[i]}`},
      {text:fmtPx(b.open), cf:""},
      {text:b.high==null?"":fmtPx(b.high), cf:CD[i]?"hi-peach":""},
      {text:b.low==null?"":fmtPx(b.low), cf:CE[i]?"lo-blue":""},
      {text:fmtVol(b.volume), cf:volCf(CP[i]), title:`CP ${CP[i]}`},
      {text:g==null?"":fmtDec(g), cf:q?"hn-deep":(g!=null&&g>1?"vol-pale":"")},
      {text:fmtDec(H[i]), cf:hCf(H[i])},
      {text:fmtDec(I[i]), cf:iCf(I[i])},
      {text:fmtDec(J[i]), cf:""},
      {text:fmtDec(K[i]), cf:K[i]!=null&&K[i]>=0.05?"h-mid":""},
      {text:fmtDec(M[i]), cf:M[i]!=null&&M[i]>=0.05?"h-pink":""},
      {text:q?"1":"0", cf:q?"q-on":""},
    ];
    return {
      date:b.date, hn:HN[i], q, oc, nx,
      fullscan:{
        nPos:invRow?invRow.n_pos:null, nNeg:invRow?invRow.n_neg:null,
        boxes:invRow?invRow.boxes:{}, setup:setupByDate.get(b.date)||null,
        s:invRow?invRow.s:null,
        list:invRow?(invRow.on_list?"list":invRow.reconstructed?"recon":null):null,
        hardRed:!!(invRow&&invRow.hard_red)
      },
      excel
    };
  });
  const tagged=chrono.map(r=>({a:r.excel[0].cf, q:r.q, sit:r.fullscan.hardRed, nPos:r.fullscan.nPos, nNeg:r.fullscan.nNeg, oc:r.oc, nx:r.nx}));
  const camPos=r=>r.nPos!=null&&r.nNeg!=null&&r.nPos>r.nNeg;
  const camNeg=r=>r.nPos!=null&&r.nNeg!=null&&r.nNeg>r.nPos;
  const m1Cam=tagged.filter(r=>r.q&&r.nPos!=null&&r.nNeg!=null);
  const audit={
    aDeep:bucketOf(tagged,r=>r.a==="hn-deep"),
    aPale:bucketOf(tagged,r=>r.a==="hn-pale"),
    aRed:bucketOf(tagged,r=>r.a==="hn-red"),
    m1:bucketOf(tagged,r=>r.q),
    m1CamN:m1Cam.length,
    m1Plus5Minus3:m1Cam.filter(r=>r.nPos===5&&r.nNeg===3).length,
    camPos:bucketOf(tagged,camPos),
    camPosDeep:bucketOf(tagged,r=>camPos(r)&&r.a==="hn-deep"),
    camPosRed:bucketOf(tagged,r=>camPos(r)&&r.a==="hn-red"),
    camNegRed:bucketOf(tagged,r=>camNeg(r)&&r.a==="hn-red"),
    plus5minus3:bucketOf(tagged,r=>r.nPos===5&&r.nNeg===3)
  };
  return {
    ticker, asOf: bars.length?bars[bars.length-1].date:null,
    camOrder: inv?.cam_order||[], excelHeads:HEADS, rows:chrono.slice().reverse(), audit,
    note:"Gold freeze = cameras @ 09:30. From 日期, fills are the workbook. SIT never paints Excel cells."
  };
}

async function getJson(url, ms){
  try{
    const ctrl=AbortSignal.timeout(ms||8000);
    const r=await fetch(url,{cache:"no-store", signal:ctrl});
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}
async function firstJson(urls, ms){
  for(const u of urls){ const j=await getJson(u, ms); if(j) return j; }
  return null;
}

async function loadInv(ticker){
  const t=encodeURIComponent(ticker);
  const bust="?t="+Date.now();
  return firstJson(HRE.map(b=>b+`t/${t}.json`+bust), 8000);
}
async function loadTickers(){
  const j=await firstJson(HRE.map(b=>b+"tickers.json?t="+Date.now()), 8000);
  const list=j && Array.isArray(j.tickers) ? j.tickers.map(x=>String(x).toUpperCase()) : [];
  return list.length?list:QUICK.slice();
}
async function loadBars(ticker, inv){
  if(SEED[ticker]) return {bars:barsFromSeed(SEED[ticker]), src:"seed"};
  const local=await firstJson([
    HERE+"bars/"+encodeURIComponent(ticker)+".json?t="+Date.now(),
    JSDELIVR_BARS+"bars/"+encodeURIComponent(ticker)+".json?t="+Date.now()
  ], 6000);
  if(local) return {bars:barsFromSeed(local), src:"baked"};
  const y=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1d&range=6mo`;
  const y2=`https://query2.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1d&range=6mo`;
  const yh=await firstJson([
    y, y2,
    "https://corsproxy.io/?"+encodeURIComponent(y),
    "https://api.allorigins.win/raw?url="+encodeURIComponent(y),
    "https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(y)
  ], 7000);
  if(yh){ const bars=parseYahoo(yh); if(bars.length) return {bars, src:"yahoo"}; }
  const fallback=(inv?.rows||[]).filter(r=>r.open!=null&&r.close!=null)
    .map(r=>({date:r.date, open:r.open, high:null, low:null, close:r.close, volume:null}));
  return {bars:fallback, src: fallback.length?"investigator open/close":"none"};
}

function cell(label,b,kind){
  const mean=kind==="oc"?b.ocMean:b.nxMean, w=kind==="oc"?b.ocWin:b.nxWin;
  return `<div><b>${label}</b> n=${b.n} <span class="${tone(mean)}">${pct(mean)} ${win(w)} up</span></div>`;
}
function renderAudit(pack){
  const a=pack.audit;
  document.getElementById("audit").innerHTML =
    `<div><b>${pack.ticker} col A</b><span class="muted"> 日期 HN, known at open. OC = same-day open→close. SIT out.</span>
      ${cell("deep green",a.aDeep,"oc")}${cell("pale green",a.aPale,"oc")}${cell("red",a.aRed,"oc")}</div>
     <div><b>col M = Q vol>2.5</b><span class="muted"> known at close — next day only. ${a.m1CamN} days had cameras; ${a.m1Plus5Minus3} were +5/−3.</span>
      ${cell("M=1 next",a.m1,"nx")}${cell("+5/−3 OC",a.plus5minus3,"oc")}</div>
     <div><b>cams × A</b><span class="muted"> cam+ at 09:30 AND zone. Disagreement often beats alignment — not a buy/short gate.</span>
      ${cell("cam+ & deep",a.camPosDeep,"oc")}${cell("cam+ & red",a.camPosRed,"oc")}
      ${cell("cam+ any",a.camPos,"oc")}${cell("cam− & red",a.camNegRed,"oc")}</div>`;
}
function renderGrid(pack){
  const start=pack.rows.length?pack.rows.length+1:2;
  let h1=`<tr class="col-letters"><th class="rn"></th>`;
  GOLD.forEach((_,i)=>h1+=`<th class="fr fr${i+1}"></th>`);
  pack.excelHeads.forEach((_,i)=>h1+=`<th class="${i===0?"date-fr":""}">${letters(i)}</th>`);
  h1+=`</tr><tr><th class="rn">1</th>`;
  GOLD.forEach((g,i)=>h1+=`<th class="fr fr${i+1}">${g}</th>`);
  pack.excelHeads.forEach((g,i)=>h1+=`<th class="${i===0?"date-fr":""}">${g}</th>`);
  h1+=`</tr>`;
  let body="";
  pack.rows.forEach((row,i)=>{
    const f=row.fullscan, sel=SEL===i?"sel":"";
    const setup=f.setup
      ? `<span class="setup ${f.setup.side}${f.setup.quality==="explore"?" explore":""}">${f.setup.side==="long"?"LONG":"SHORT"}${f.setup.quality==="explore"?" ?":""}</span>`
      : `<span class="mut">—</span>`;
    const dots=pack.camOrder.length
      ? pack.camOrder.map(k=>`<span class="dot ${f.boxes[k]||"missing"}" title="${k} ${f.boxes[k]||"missing"}"></span>`).join("")
      : `<span class="mut">—</span>`;
    const sit=f.hardRed?`<span class="sit">SIT</span>`:"";
    const list=f.list==="list"?"list":f.list==="recon"?`<span style="color:#9a7b00">recon</span>`:`<span class="mut">—</span>`;
    body+=`<tr class="${sel}" data-i="${i}">
      <td class="rn">${i+2}</td>
      <td class="fr fr1 num">${f.nPos==null?`<span class="mut">—</span>`:`<span class="pos">+${f.nPos}</span>`}</td>
      <td class="fr fr2 num">${f.nNeg==null?`<span class="mut">—</span>`:`<span class="neg">−${f.nNeg}</span>`}</td>
      <td class="fr fr3 cams">${dots}</td>
      <td class="fr fr4">${setup}</td>
      <td class="fr fr5 num">${f.s==null?`<span class="mut">—</span>`:f.s.toFixed(2)}</td>
      <td class="fr fr6">${sit}${list}</td>`;
    row.excel.forEach((c,ci)=>{
      body+=`<td class="num ${ci===0?"datecol date-fr":""} ${c.cf||""}" title="${c.title||""}">${c.text}</td>`;
    });
    body+=`</tr>`;
  });
  document.getElementById("sheet").innerHTML =
    `<table><thead>${h1}</thead><tbody>${body}</tbody></table>
     <p class="foot">${pack.ticker} · ${pack.rows.length} sessions · last ${pack.asOf||"—"} · gold freeze is fullscan @ 09:30 · from 日期 is the workbook · next blank row ${start} · ${pack.src||""}</p>`;
  document.querySelectorAll("#sheet tbody tr").forEach(tr=>{
    tr.addEventListener("click",()=>{ SEL=Number(tr.dataset.i); renderGrid(PACK); formula(); });
  });
}
function formula(){
  if(!PACK) return;
  const r=PACK.rows[SEL];
  const el=document.getElementById("fx");
  const cell=document.getElementById("cell");
  if(!r){ cell.textContent="A1"; el.textContent=PACK.note; return; }
  cell.textContent="A"+(SEL+2);
  const close=r.excel[1]?r.excel[1].text:"";
  const cams=`+${r.fullscan.nPos ?? "—"} −${r.fullscan.nNeg ?? "—"}`;
  el.textContent=`${PACK.ticker}  ${r.date}  ${close}  ${cams}  S=${r.fullscan.s ?? "—"}  ${r.fullscan.list ?? "no 09:30 card"}`;
}

async function load(ticker){
  ticker=String(ticker||"CRWD").trim().toUpperCase().replace(/[^A-Z0-9.\-]/g,"").slice(0,12)||"CRWD";
  document.getElementById("name").textContent=ticker;
  document.getElementById("ticker").value=ticker;
  document.getElementById("go").textContent="…";
  document.getElementById("fx").textContent="Loading "+ticker+"…";
  const qs=new URLSearchParams(location.search); qs.set("t", ticker);
  history.replaceState(null,"", location.pathname+"?"+qs.toString());
  document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("on", b.dataset.t===ticker));
  try{
    const invRaw=await loadInv(ticker);
    const inv=invRaw?parseInv(invRaw, ticker):null;
    const got=await loadBars(ticker, inv);
    if(!got.bars.length){
      document.getElementById("sheet").innerHTML=`<p class="foot">No daily bars for ${ticker}.</p>`;
      document.getElementById("audit").innerHTML="";
      document.getElementById("fx").textContent="No daily bars for "+ticker;
      return;
    }
    PACK=buildSheet(ticker, got.bars, inv);
    PACK.src=got.src;
    SEL=0;
    renderAudit(PACK);
    renderGrid(PACK);
    formula();
    document.getElementById("meta").textContent=`${got.src} · ${PACK.rows.length} sessions · last ${PACK.asOf||"—"}`;
  }catch(e){
    document.getElementById("fx").textContent=String(e&&e.message||e);
  }finally{
    document.getElementById("go").textContent="Load";
  }
}

function bootPicks(){
  const box=document.getElementById("picks");
  box.innerHTML=QUICK.map(t=>`<button type="button" class="chip${t==="CRWD"?" on":""}" data-t="${t}">${t}</button>`).join("");
  box.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>load(b.dataset.t)));
}
function wireSearch(){
  const input=document.getElementById("ticker");
  const sug=document.getElementById("suggest");
  document.getElementById("form").addEventListener("submit", e=>{ e.preventDefault(); load(input.value); sug.hidden=true; });
  input.addEventListener("input",()=>{
    const q=input.value.trim().toUpperCase();
    const hits=(q?TICKERS.filter(x=>x.startsWith(q)||x.includes(q)):QUICK).slice(0,12);
    if(!hits.length){ sug.hidden=true; return; }
    sug.innerHTML=hits.map(n=>`<li><button type="button" data-t="${n}">${n}</button></li>`).join("");
    sug.hidden=false;
    sug.querySelectorAll("button").forEach(b=>b.addEventListener("mousedown",e=>{ e.preventDefault(); load(b.dataset.t); sug.hidden=true; }));
  });
  input.addEventListener("blur",()=>setTimeout(()=>sug.hidden=true,180));
}

(async function boot(){
  bootPicks(); wireSearch();
  const start=(new URLSearchParams(location.search).get("t")||"CRWD").toUpperCase();
  const [seed, ticks]=await Promise.all([
    Promise.resolve(SEED),
    loadTickers()
  ]);
  if(seed) SEED=seed;
  if(ticks&&ticks.length){
    TICKERS=ticks;
    const dl=document.getElementById("tickers");
    dl.innerHTML=ticks.slice(0,800).map(t=>`<option value="${t}"></option>`).join("");
  }
  await load(start);
})();
</script>
