<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper Trading — Stock Book Simulation</title>
<style>
 :root{
  --bg:#0f1420; --card:#171e2e; --line:#262f45; --line2:#232c42;
  --fg:#dfe6f2; --mut:#8b96ab; --dim:#66708a; --pos:#4ade80; --neg:#f87171;
  --chip:#2a3450; --day:#121826; --gold:#fbbf24;
 }
 *{box-sizing:border-box}
 html,body{overflow-x:hidden}
 body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
 .wrap{max-width:1180px;margin:0 auto;padding:16px 16px 48px;width:100%}
 h1{font-size:20px;margin:0 0 4px}
 .sub{color:var(--mut);font-size:12px;margin:0 0 12px}
 .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px;margin:0 0 14px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
 .card b{display:block;font-size:17px;margin-top:2px;font-variant-numeric:tabular-nums}
 .pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--mut)}
 canvas{width:100%;height:280px;background:var(--card);border:1px solid var(--line);border-radius:10px}
 .legend{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
 .legend span{cursor:pointer;padding:2px 10px;border-radius:12px;border:1px solid #333;font-size:12px;user-select:none}
 table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:12.5px}
 th,td{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
 th{color:var(--mut);font-weight:600;text-align:right} td:first-child,th:first-child{text-align:left}
 h2{font-size:15px;margin:18px 0 6px;color:#aeb9cf}
 .note{color:var(--dim);font-size:11.5px;margin-top:8px}
 .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px}
 .bar input,.bar select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:13px/1.3 ui-monospace,Menlo,Consolas,monospace}
 .chip{cursor:pointer;padding:7px 12px;border-radius:999px;border:1px solid var(--chip);background:var(--card);color:#aeb9cf;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
 .chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
 td.side-buy{color:var(--pos);font-weight:700;text-align:left}
 td.side-sell{color:var(--neg);font-weight:700;text-align:left}
 td.tick,td.left{text-align:left}
 .how{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:16px 0 8px}
 .how h2{margin:0 0 8px}
 .how ol{margin:0;padding-left:18px}
 .how li{margin:0 0 6px}
 .how code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--gold)}
 h3.sleeve-head{font-size:13px;margin:18px 0 4px;color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace}
 details{margin:14px 0}
 details>summary{cursor:pointer;color:#aeb9cf;font-size:15px;font-weight:600}
 details.raw-fills summary,details.curve-box summary{font-size:15px}
 h3.pair-head{font-size:12px;margin:10px 0 4px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
 td.ctx,th.ctx{text-align:left;white-space:normal;max-width:220px;font-size:11px;color:var(--mut)}
 td.sector,th.sector{text-align:left}
 td.cash{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
 td.ab{font-family:ui-monospace,Menlo,Consolas,monospace}

 /* blotter layout */
 .tape{margin:8px 0 22px}
 .day{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 12px;overflow:hidden}
 .day-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;
   padding:8px 12px;background:var(--day);border-bottom:1px solid var(--line);font-size:12px;color:#aeb9cf;
   position:sticky;top:0;z-index:1}
 .day-h b{color:var(--fg);font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
 .cash-pill{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;color:var(--fg)}
 .fill{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:2px 12px;padding:10px 12px;
   border-bottom:1px solid var(--line2);align-items:start}
 .fill:last-child{border-bottom:0}
 .fill-side{font-weight:700;font-size:12px;letter-spacing:.04em;padding-top:2px}
 .fill-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
 .fill-top b{font-size:15px}
 .fill-sec{color:var(--mut);font-size:12px}
 .fill-meta{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
 .fill-ab{font-size:12px;margin-top:2px}
 .fill-ab .abn{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;margin-right:8px}
 .fill-cash{text-align:right;font-variant-numeric:tabular-nums}
 .fill-cash span{display:block;color:var(--dim);font-size:10px;letter-spacing:.04em;text-transform:uppercase}
 .fill-cash b{display:block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;font-weight:600}
 .sleeve-block{margin:0 0 18px}
 #stats,#pos{display:block;overflow-x:auto;max-width:100%}
 @media (max-width:640px){
   .fill{grid-template-columns:48px minmax(0,1fr);gap:4px 10px}
   .fill-cash{grid-column:2;text-align:left;margin-top:2px}
   .fill-cash span{display:inline;margin-right:6px}
   .fill-cash b{display:inline;font-size:14px}
   canvas{height:220px}
   .wrap{padding:12px 12px 40px}
   .bar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
   .chip,.bar input,.bar select{flex:0 0 auto}
   table{display:block;overflow-x:auto;max-width:100%}
 }
</style></head><body><div class="wrap">
<h1>Paper Trading — Stock Book Simulation</h1>
<div class="sub" id="gen"></div>
<div class="cards" id="cards"></div>
<div class="bar" id="sleeveBar"></div>

<section id="tapeSection">
<h2 id="tapeTitle">Order tape</h2>
<p class="mut" id="tapeHint" style="margin:0 0 8px"></p>
<div class="bar">
 <select id="sideMode" aria-label="Side">
  <option value="all">Buys + sells</option>
  <option value="buy">Buys only</option>
  <option value="sell">Sells only</option>
 </select>
 <input id="fillQ" placeholder="Ticker (e.g. CVX)" aria-label="Filter ticker">
 <span class="mut" id="fillCount"></span>
</div>
<div class="tape" id="tapeHost"></div>
</section>

<details class="curve-box" open>
<summary id="curveTitle">Equity curve</summary>
<canvas id="chart" height="280"></canvas>
<div class="legend" id="legend"></div>
</details>

<details>
<summary id="fillsTitle">Round-trips — closed vs still open</summary>
<p class="mut" id="fillsHint" style="margin:8px 0 6px"></p>
<div class="bar">
 <select id="pairMode" aria-label="Status">
  <option value="all">Closed + open</option>
  <option value="closed">Closed only (bought then sold)</option>
  <option value="open">Open only (bought, not sold)</option>
 </select>
</div>
<div id="fillsHost"></div>
</details>

<details>
<summary>How a buy / sell is decided</summary>
<section class="how" id="how" style="margin-top:8px"></section>
</details>

<h2>Sleeve statistics</h2>
<table id="stats"></table>
<h2>Open positions</h2>
<table id="pos"></table>
<div class="note" id="fees"></div>
</div>

  if(spyR!=null) cards.push(["SPY benchmark",{sleeve:"SPY",return_pct:+spyR.toFixed(2)}]);
  if(s){
    cards.push(["Realized P/L",{sleeve:(s.closed||0)+" closed",return_pct:s.realized,money:true}]);
    cards.push(["Unrealized P/L",{sleeve:(s.open||0)+" open",return_pct:s.unrealized,money:true}]);
    cards.push(["Closed win %",{sleeve:(s.closed_wins||0)+"/"+(s.closed||0),return_pct:s.win_rate}]);
  }
  cards.push(["Min hold",{sleeve:horizonOf(sleeveFilter),return_pct:minHold(sleeveFilter),hold:true}]);
  return cards;
}
function renderCards(){
  document.getElementById('cards').innerHTML=cardSet().map((c)=>{
    const val=c[1].return_pct;
    const isHold=c[1].hold || c[0]==="Min hold";
    const isMoney=!!c[1].money;
    const cls=isHold?'mut':(val>=0?'pos':'neg');
    let shown;
    if(isHold) shown = val+' session'+(val===1?'':'s');
    else if(isMoney) shown = money(val);
    else if(c[0].indexOf("win")>=0) shown = (val==null?'—':val+'%');
    else shown = val+'%';
    return `<div class="card"><span class="mut">${c[0]}</span><b>${c[1].sleeve}</b><span class="${cls}">${shown}</span></div>`;
  }).join('');
}

function renderSleeveBar(){
  const bar=document.getElementById('sleeveBar');
  const chips=[["all","All sleeves"], ...sleeveNames.map(s=>[s,s])];
  bar.innerHTML=chips.map(([id,label])=>{
    const on=sleeveFilter===id?'on':'';
    return `<button type="button" class="chip ${on}" data-sleeve="${id}">${label}</button>`;
  }).join('');
  bar.querySelectorAll('.chip').forEach(b=>{
    b.onclick=()=>{sleeveFilter=b.dataset.sleeve; renderAll();};
  });
}

function visibleKeys(){
  if(sleeveFilter==="all") return keys.filter(k=>!hidden.has(k));
  return keys.filter(k=>k===sleeveFilter || k.includes("SPY"));
}

function draw(){
 const cv=document.getElementById('chart'),ctx=cv.getContext('2d');
 const W=cv.width=cv.clientWidth*2,H=cv.height=560;ctx.scale(1,1);
 ctx.clearRect(0,0,W,H);
 const vis=visibleKeys();
 let lo=Infinity,hi=-Infinity;
 vis.forEach(k=>(D.series[k]||[]).forEach(v=>{if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v);}}));
 if(lo===Infinity)return;const pad=(hi-lo)*0.06||1;lo-=pad;hi+=pad;
 const X=i=>40+i/(Math.max(1,D.dates.length-1))*(W-70);
 const Y=v=>H-30-(v-lo)/(hi-lo)*(H-60);
 ctx.strokeStyle='#2a3450';ctx.fillStyle='#66708a';ctx.font='20px sans-serif';
 for(let g=0;g<=4;g++){const v=lo+(hi-lo)*g/4;ctx.beginPath();ctx.moveTo(40,Y(v));ctx.lineTo(W-30,Y(v));ctx.stroke();
  ctx.fillText('$'+(v/1000).toFixed(1)+'k',2,Y(v)+6);}
 D.dates.forEach((d,i)=>{if(i%Math.ceil(D.dates.length/6)===0)ctx.fillText(d.slice(5),X(i)-18,H-8);});
 vis.forEach((k)=>{const i=keys.indexOf(k);ctx.strokeStyle=COLORS[i%COLORS.length];
  ctx.lineWidth=k.includes('SPY')?2.5:1.8;ctx.setLineDash(k.includes('SPY')?[6,4]:[]);
  ctx.beginPath();let started=false;
  D.series[k].forEach((v,j)=>{if(v==null)return;started?ctx.lineTo(X(j),Y(v)):ctx.moveTo(X(j),Y(v));started=true;});
  ctx.stroke();ctx.setLineDash([]);});
}

function renderLegend(){
  const vis=sleeveFilter==="all"?keys:[sleeveFilter,"SPY (benchmark)"].filter(k=>D.series[k]);
  const leg=document.getElementById('legend');
  leg.innerHTML="";
  vis.forEach((k)=>{
    const i=keys.indexOf(k);
    const s=document.createElement('span');
    s.textContent=k;
    s.style.borderColor=COLORS[i%COLORS.length];
    s.style.color=COLORS[i%COLORS.length];
    if(sleeveFilter==="all"){
      s.style.opacity=hidden.has(k)?0.3:1;
      s.onclick=()=>{hidden.has(k)?hidden.delete(k):hidden.add(k);s.style.opacity=hidden.has(k)?0.3:1;draw();};
    }
    leg.appendChild(s);
  });
}

function renderHow(){
  const h=minHold(sleeveFilter==="all"?"1d_top":sleeveFilter);
  const sleeveBit=sleeveFilter==="all"
    ? "Each sleeve has its own $10k and its own book."
    : `<code>${sleeveFilter}</code> follows the <code>${horizonOf(sleeveFilter)}</code> book, min hold <code>${h}</code> session${h===1?'':'s'}.`;
  const holdLine=HOLD_ON
    ? `A name is <b>not</b> sold until it has been held for that horizon’s minimum sessions (1d=1, 3d=3, 1w=5, 2w=10, 1m=21), even if it already dropped off the book.`
    : `<b>Min-hold was not applied on this run</b> — every sleeve rebalanced every book day, which is why 1m looked like 1d. Next replay uses the session floors above.`;
  document.getElementById('how').innerHTML=`
    <h2>How a buy / sell is decided</h2>
    <p class="mut" style="margin:0 0 8px">${sleeveBit} Long-only. Fill = that book date’s close (or last close on/before it). Futubull fees on every order.</p>
    <ol>
      <li><b>Pick the list.</b> <code>_top</code> = first 10 BUY names on that horizon’s stock book. <code>_size</code> = top 3 from each bucket (large+ / mid / small-micro). Horizon is the forecast window of the ranking, not a calendar rebalance.</li>
      <li><b>Buy</b> when a name <em>enters</em> this sleeve’s list and we don’t already hold it. New names split leftover cash equally; whole shares only. Same-day round-trip of the same ticker does not happen — exits run first, then entries.</li>
      <li><b>Sell</b> when a name <em>drops off</em> the list. ${holdLine}</li>
      <li><b>Not 10 opens and 10 closes.</b> Fills are that book date’s close, not the open. A sleeve does <em>not</em> always trade 10 names — leftover cash after each fill is the usable cash still in the sleeve. Tiny leftovers skip the next name.</li>
      <li><b>Sector / AB</b> are as of that fill’s book date. AB is the day’s checklist score + LEAD/LAG context when the file exists; older dates before AB was wired show —.</li>
    </ol>`;
}

function pairRows(){
  const mode=document.getElementById('pairMode').value;
  const q=document.getElementById('fillQ').value.trim().toUpperCase();
  return (D.roundtrips||[]).filter(r=>{
    if(sleeveFilter!=='all' && r.sleeve!==sleeveFilter) return false;
    if(mode==='closed' && r.status!=='closed') return false;
    if(mode==='open' && r.status!=='open') return false;
    if(q && !(r.ticker||'').toUpperCase().includes(q)) return false;
    return true;
  });
}

function closedTable(rows){
  const list=rows.filter(r=>r.status==='closed')
    .sort((a,b)=>(b.sell_date||'').localeCompare(a.sell_date||'') || a.ticker.localeCompare(b.ticker));
  const head='<tr><th>Ticker</th><th class="sector">Sector</th><th>AB</th><th class="ctx">Context</th><th>Shares</th><th>Bought</th><th>Sold</th><th>Held</th><th>Realized P/L</th></tr>';
  if(!list.length){
    return '<p class="mut" style="margin:4px 0 10px">No closed round-trips in this view.</p>';
  }
  return '<table>'+head+list.map(r=>{
    const pnl=r.realized_pnl;
    return `<tr>
      <td class="tick"><b>${esc(r.ticker)}</b></td>
      <td class="sector">${esc(r.sector||'—')}</td>
      <td class="ab">${fmtAb(r.ab_score)}</td>
      <td class="ctx">${esc(r.ab_context||'—')}</td>
      <td>${r.shares}</td>
      <td class="left">${r.buy_date} @ ${px(r.buy_px)}</td>
      <td class="left">${r.sell_date} @ ${px(r.sell_px)}</td>
      <td>${r.held_cal_days!=null?r.held_cal_days+'d':'—'}</td>
      <td class="${pnl>=0?'pos':'neg'}">${money(pnl)}</td>
    </tr>`;
  }).join('')+'</table>';
}

function openTable(rows){
  const list=rows.filter(r=>r.status==='open')
    .sort((a,b)=>(b.buy_date||'').localeCompare(a.buy_date||'') || a.ticker.localeCompare(b.ticker));
  const head='<tr><th>Ticker</th><th class="sector">Sector</th><th>AB</th><th class="ctx">Context</th><th>Shares</th><th>Bought</th><th>Last</th><th>Unrealized P/L</th><th>Status</th></tr>';
  if(!list.length){
    return '<p class="mut" style="margin:4px 0 10px">No open lots in this view.</p>';
  }
  return '<table>'+head+list.map(r=>{
    const pnl=r.unrealized_pnl;
    return `<tr>
      <td class="tick"><b>${esc(r.ticker)}</b></td>
      <td class="sector">${esc(r.sector||'—')}</td>
      <td class="ab">${fmtAb(r.ab_score)}</td>
      <td class="ctx">${esc(r.ab_context||'—')}</td>
      <td>${r.shares}</td>
      <td class="left">${r.buy_date} @ ${px(r.buy_px)}</td>
      <td>${px(r.last)}</td>
      <td class="${pnl>=0?'pos':'neg'}">${money(pnl)}</td>
      <td class="mut">still holding</td>
    </tr>`;
  }).join('')+'</table>';
}

function sleevePairBlock(sleeve, rows){
  const closed=rows.filter(r=>r.status==='closed');
  const opened=rows.filter(r=>r.status==='open');
  const real=closed.reduce((a,r)=>a+(r.realized_pnl||0),0);
  const unrl=opened.reduce((a,r)=>a+(r.unrealized_pnl||0),0);
  const title=sleeve?`<h3 class="sleeve-head">${sleeve} · ${closed.length} closed · ${opened.length} open · realized ${money(real)} · unrealized ${money(unrl)}</h3>`:'';
  const mode=document.getElementById('pairMode').value;
  let body='';
  if(mode!=='open') body+=`<h3 class="pair-head">Closed — bought, then sold</h3>`+closedTable(rows);
  if(mode!=='closed') body+=`<h3 class="pair-head">Open — bought, not sold yet</h3>`+openTable(rows);
  return title+body;
}

function fillCard(t){
  const sideCls=t.side==='sell'?'neg':'pos';
  const side=t.side==='sell'?'SELL':'BUY';
  const ab=fmtAb(t.ab_score);
  const ctx=t.ab_context || (t.ab_score==null ? 'not scored that day' : '—');
  const ctxCls=(String(t.ab_context||'').indexOf('LEAD')>=0)?'pos':(String(t.ab_context||'').indexOf('LAG')>=0)?'neg':'mut';
  const pnl=t.realized_pnl;
  const pnlBit=(pnl==null||pnl==='')?'':` · P/L ${money(pnl)}`;
  return `<article class="fill">
    <div class="fill-side ${sideCls}">${side}</div>
    <div>
      <div class="fill-top"><b>${esc(t.ticker)}</b><span class="fill-sec">${esc(t.sector||'—')}</span></div>
      <div class="fill-meta">${t.shares} sh @ ${px(t.price)} · ${money(t.amount)}${pnlBit}</div>
      <div class="fill-ab"><span class="abn">${ab}</span><span class="${ctxCls}">${esc(ctx)}</span></div>
    </div>
    <div class="fill-cash"><span>cash left</span><b>${money(t.cash_after)}</b></div>
  </article>`;
}

function tapeBlock(rows){
  if(!rows.length) return '<p class="mut">No fills in this view.</p>';
  const days=[];
  let cur=null;
  for(const t of rows){
    if(!cur || cur.date!==t.date){
      cur={date:t.date, fills:[], start:t.cash_before, end:t.cash_after, buys:0, sells:0};
      days.push(cur);
    }
    cur.fills.push(t);
    cur.end=t.cash_after;
    if(t.side==='buy') cur.buys++; else cur.sells++;
  }
  return days.map(d=>`<div class="day">
    <div class="day-h">
      <b>${d.date}</b>
      <span class="mut">${d.sells} sell · ${d.buys} buy</span>
      <span class="cash-pill">${money(d.start)} → ${money(d.end)}</span>
    </div>
    ${d.fills.map(fillCard).join('')}
  </div>`).join('');
}

function matchedFills(sleeve){
  const q=document.getElementById('fillQ').value.trim().toUpperCase();
  const side=document.getElementById('sideMode').value;
  return (D.trades||[]).filter(t=>{
    if(sleeve && t.sleeve!==sleeve) return false;
    if(side!=='all' && t.side!==side) return false;
    if(q && !(t.ticker||'').toUpperCase().includes(q)) return false;
    return true;
  });
}

function renderTape(){
  const host=document.getElementById('tapeHost');
  document.getElementById('tapeTitle').textContent=
    sleeveFilter==='all' ? 'Order tape — leftover cash after each fill' : 'Order tape — '+sleeveFilter;
  document.getElementById('tapeHint').textContent=
    'Chronological. Sells free cash, then new names split whatever is left. Cash left is usable sleeve cash after that fill — not equity. Sector and AB are as of that book date.';
  if(sleeveFilter==='all'){
    host.innerHTML=sleeveNames.map(s=>{
      const rows=matchedFills(s);
      return `<div class="sleeve-block"><h3 class="sleeve-head">${s} · ${rows.length} fills</h3>${tapeBlock(rows)}</div>`;
    }).join('');
  } else {
    host.innerHTML=tapeBlock(matchedFills(sleeveFilter));
  }
  const n=sleeveFilter==='all'
    ? (D.trades||[]).filter(t=>{
        const q=document.getElementById('fillQ').value.trim().toUpperCase();
        const side=document.getElementById('sideMode').value;
        if(side!=='all' && t.side!==side) return false;
        if(q && !(t.ticker||'').toUpperCase().includes(q)) return false;
        return true;
      }).length
    : matchedFills(sleeveFilter).length;
  document.getElementById('fillCount').textContent=n+' fill'+(n===1?'':'s');
}

function renderFills(){
  const host=document.getElementById('fillsHost');
  document.getElementById('curveTitle').textContent=
    sleeveFilter==='all' ? 'Equity curves (all sleeves)' : 'Equity curve — '+sleeveFilter+' vs SPY';
  const rows=pairRows();
  const nC=rows.filter(r=>r.status==='closed').length;
  const nO=rows.filter(r=>r.status==='open').length;
  document.getElementById('fillsTitle').textContent=
    sleeveFilter==='all'
      ? 'Round-trips — each sleeve separately ('+nC+' closed · '+nO+' open)'
      : 'Round-trips — '+sleeveFilter+' ('+nC+' closed · '+nO+' open)';
  document.getElementById('fillsHint').textContent=
    'Closed = bought then sold the same lot (FIFO). Open = bought and still holding. Sector / AB are from the buy date.';
  if(sleeveFilter==='all'){
    host.innerHTML=sleeveNames.map(s=>{
      const sub=rows.filter(r=>r.sleeve===s);
      return sleevePairBlock(s, sub);
    }).join('');
    return;
  }
  host.innerHTML=sleevePairBlock('', rows);
}

function renderStats(){
  const rows=sleeveFilter==='all'?D.stats:D.stats.filter(s=>s.sleeve===sleeveFilter);
  document.getElementById('stats').innerHTML=
   "<tr><th>Sleeve</th><th>Equity</th><th>Return</th><th>Cash</th><th>Open</th><th>Trades</th><th>Fees</th><th>Realized P/L</th><th>Unrealized P/L</th><th>Closed win</th><th>Open win</th><th>Min hold</th></tr>"+
   rows.map(s=>`<tr><td>${s.sleeve}</td><td>$${s.equity.toLocaleString()}</td>
    <td class="${s.return_pct>=0?'pos':'neg'}">${s.return_pct}%</td><td>$${s.cash.toLocaleString()}</td>
    <td>${s.open}</td><td>${s.trades}</td><td>$${s.fees.toLocaleString()}</td>
    <td class="${s.realized>=0?'pos':'neg'}">${money(s.realized||0)}</td>
    <td class="${(s.unrealized||0)>=0?'pos':'neg'}">${money(s.unrealized||0)}</td>
    <td>${s.win_rate==null?'—':s.win_rate+'%'} <span class="mut">(${s.closed_wins||0}/${s.closed||0})</span></td>
    <td>${s.open_win_rate==null?'—':s.open_win_rate+'%'} <span class="mut">(${s.open_wins||0}/${s.open||0})</span></td>
    <td>${minHold(s.sleeve)}d</td></tr>`).join('');
}

function renderPos(){
  const hostId='pos';
  function tableFor(rows){
    return "<tr><th>Sleeve</th><th>Ticker</th><th>Shares</th><th>Entry date</th><th>Entry px</th><th>Last</th><th>Unrealized P/L</th><th>Status</th></tr>"+
     (rows.length?rows.map(p=>{
       const held=p.held_sessions!=null?p.held_sessions:sessionsBetween(p.entry_date, D.dates[D.dates.length-1]);
       const mh=p.min_hold!=null?p.min_hold:minHold(p.sleeve);
       let status='on book';
       if(p.on_book===false){
         status = (HOLD_ON && held!=null && held<mh) ? `min-hold lock ${held}/${mh}d` : 'dropped — waiting sell';
       } else if(held!=null){
         status = `on book · held ${held}d`;
       }
       const lock=status.indexOf('lock')>=0?'lock':'mut';
       return `<tr><td>${p.sleeve}</td><td><b>${p.ticker}</b></td><td>${p.shares}</td>
        <td>${p.entry_date}</td><td>$${p.entry_px}</td><td>$${p.last}</td>
        <td class="${p.unrealized>=0?'pos':'neg'}">$${Number(p.unrealized).toLocaleString()}</td>
        <td class="${lock}">${status}</td></tr>`;
     }).join('')
      :'<tr><td colspan="8" class="mut">No open positions in this sleeve.</td></tr>');
  }
  const all=(D.positions||[]);
  if(sleeveFilter==='all'){
    const order=sleeveNames;
    const sorted=[...all].sort((a,b)=>order.indexOf(a.sleeve)-order.indexOf(b.sleeve) || a.ticker.localeCompare(b.ticker));
    document.getElementById(hostId).innerHTML=tableFor(sorted);
    return;
  }
  document.getElementById(hostId).innerHTML=tableFor(all.filter(p=>p.sleeve===sleeveFilter));
}

function renderAll(){
  renderSleeveBar();
  renderCards();
  renderLegend();
  draw();
  renderHow();
  renderTape();
  renderFills();
  renderStats();
  renderPos();
}
document.getElementById('pairMode').onchange=renderFills;
document.getElementById('fillQ').oninput=function(){ renderTape(); renderFills(); };
document.getElementById('sideMode').onchange=renderTape;
addEventListener('resize',draw);
renderAll();
const F=D.fees||{};
document.getElementById('fees').textContent=
 `Fee model (Futubull US stocks): commission $${F.commission_per_share}/sh (min $${F.commission_min_per_order}, cap 0.5%) + platform $${F.platform_per_share}/sh (min $${F.platform_min_per_order}, cap 0.5%) + settlement $${F.settlement_per_share}/sh; sells add regulatory ${(F.regulatory_pct_of_amount_sell_only||0)*100}% of amount + TAF $${F.taf_per_share_sell_only}/sh (max $${F.taf_max_per_order}).`;
</script></body></html>
