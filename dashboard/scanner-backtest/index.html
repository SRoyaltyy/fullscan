<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scanner backtest</title>
<style>
:root{--bg:#0b1020;--card:#131b31;--line:#2b3552;--text:#edf2ff;--muted:#9cabc9;--good:#4ade80;--warn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}
main{max-width:920px;margin:auto;padding:20px 16px 48px}
h1{margin:0 0 6px;font-size:28px}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
button{background:#1d4ed8;color:white;border:0;border-radius:10px;padding:10px 16px;font:600 15px system-ui;cursor:pointer}
button.secondary{background:#243049}
button:disabled{opacity:.45;cursor:wait}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.article{white-space:pre-wrap;max-height:320px;overflow:auto;margin:10px 0 0}
a{color:#93c5fd}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.pass{color:var(--good);font-weight:700}
.quote{color:var(--muted);font-size:13px;margin:4px 0 0}
.empty{color:var(--warn)}
</style>
</head>
<body>
<main>
<h1>Scanner backtest</h1>
<p class="muted" id="status">Loading the stock board…</p>
<div class="row">
  <button type="button" id="another" class="secondary">Another article</button>
  <button type="button" id="test" disabled>Test</button>
</div>
<article class="card" id="article">
  <h2 id="title">Fetching an article…</h2>
  <p class="muted" id="meta"></p>
  <div class="article" id="body"></div>
</article>
<section class="card" id="results" hidden>
  <h2>Match results</h2>
  <p id="decision"></p>
  <div id="matches"></div>
</section>
</main>
<script>
let current = null;

function text(id, value) {
  document.getElementById(id).textContent = value;
}

function renderArticle(article) {
  current = article;
  text("title", article.title || "(untitled)");
  const bits = [article.source, article.published_at].filter(Boolean);
  const meta = document.getElementById("meta");
  meta.textContent = "";
  if (bits.length) {
    meta.append(bits.join(" · "));
  }
  if (article.url) {
    if (bits.length) meta.append(" · ");
    const link = document.createElement("a");
    link.href = article.url;
    link.target = "_blank";
    link.rel = "noreferrer";
    link.textContent = article.url;
    meta.append(link);
  }
  text("body", article.text || "");
  document.getElementById("results").hidden = true;
}

async function loadArticle() {
  const button = document.getElementById("another");
  button.disabled = true;
  try {
    const response = await fetch("/api/article");
    const article = await response.json();
    if (!response.ok) throw new Error(article.error || "could not fetch an article");
    renderArticle(article);
  } catch (err) {
    text("title", "Could not fetch an article");
    text("body", err.message);
  } finally {
    button.disabled = false;
  }
}

function renderMatches(result) {
  const box = document.getElementById("results");
  box.hidden = false;
  const decision = document.getElementById("decision");
  decision.textContent = `${result.decision || "scored"} · ${result.engine || "evidence"} · ${result.pass_count} pass${result.pass_count === 1 ? "" : "es"}`;
  const matches = document.getElementById("matches");
  matches.textContent = "";
  if (!result.passes || !result.passes.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "No stock passed.";
    matches.append(p);
    return;
  }
  const table = document.createElement("table");
  const head = document.createElement("tr");
  for (const label of ["Ticker", "Company", "Industry", "Tier", "Why"]) {
    const th = document.createElement("th");
    th.textContent = label;
    head.append(th);
  }
  const thead = document.createElement("thead");
  thead.append(head);
  table.append(thead);
  const body = document.createElement("tbody");
  for (const row of result.passes) {
    const tr = document.createElement("tr");
    const cells = [
      row.ticker,
      row.name,
      row.industry,
      row.tier == null ? "" : String(row.tier),
      (row.reasons || []).join(", "),
    ];
    cells.forEach((value, index) => {
      const td = document.createElement("td");
      td.textContent = value || "";
      if (index === 0) td.className = "pass";
      tr.append(td);
    });
    body.append(tr);
    const evidence = (row.evidence || [])[0];
    if (evidence && evidence.passage) {
      const quote = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 5;
      const p = document.createElement("p");
      p.className = "quote";
      const terms = (evidence.terms || []).join(", ");
      p.textContent = (evidence.channel ? evidence.channel + " — " : "") + evidence.passage + (terms ? " [" + terms + "]" : "");
      td.append(p);
      quote.append(td);
      body.append(quote);
    }
  }
  table.append(body);
  matches.append(table);
}

async function runTest() {
  if (!current || !current.id) return;
  const button = document.getElementById("test");
  button.disabled = true;
  button.textContent = "Running…";
  try {
    const response = await fetch("/api/test", {
      method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify({id: current.id}),
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "test failed");
    renderMatches(result);
  } catch (err) {
    const box = document.getElementById("results");
    box.hidden = false;
    text("decision", err.message);
    document.getElementById("matches").textContent = "";
  } finally {
    button.disabled = false;
    button.textContent = "Test";
  }
}

async function poll() {
  try {
    const status = await fetch("/api/status").then((r) => r.json());
    const line = document.getElementById("status");
    if (status.error) {
      line.textContent = status.error;
      return;
    }
    if (status.ready) {
      line.textContent = `Evidence engine · ${status.stocks} stocks · ${status.articles} articles`;
      document.getElementById("test").disabled = false;
      return;
    }
    line.textContent = `Loading the stock board… ${status.articles} articles ready`;
  } catch (err) {
    text("status", err.message);
  }
  setTimeout(poll, 500);
}

document.getElementById("another").addEventListener("click", loadArticle);
document.getElementById("test").addEventListener("click", runTest);
loadArticle();
poll();
</script>
</body>
</html>
