<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Day movers — gainers / losers</title>
<style>
  :root {
    --bg: #0b1020; --card: #141a2e; --line: #24304d; --txt: #e8eefc;
    --dim: #8b97b3; --gain: #3ddc97; --lose: #ff6b7a; --warn: #e6c36a;
    --chip: #1c2540; --gold: #fbbf24;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--txt); }
  a { color: #9db7ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { padding: 18px 22px 8px; }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 650; }
  .sub { color: var(--dim); font-size: 13px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 10px 22px; }
  button, .tog button { background: var(--chip); color: var(--txt); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .tog { display: flex; gap: 0; }
  .tog button { border-radius: 0; }
  .tog button:first-child { border-radius: 8px 0 0 8px; }
  .tog button:last-child { border-radius: 0 8px 8px 0; }
  .tog button.on { background: #2a3a66; border-color: #5b7ad4; }
  #date { min-width: 118px; text-align: center; font-variant-numeric: tabular-nums; }
  .banner { margin: 0 22px 10px; padding: 8px 12px; border-radius: 8px; background: #2a2410; color: var(--warn); border: 1px solid #4a3f18; display: none; }
  .banner.show { display: block; }
  .layout { display: grid; grid-template-columns: minmax(320px, 0.9fr) minmax(520px, 1.25fr); gap: 14px; padding: 0 22px 28px; align-items: start; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } .pane { position: static; max-height: none; } }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; }
  th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th { color: var(--dim); font-weight: 600; font-size: 12px; }
  tr { cursor: pointer; }
  tr:hover td { background: #1b2340; }
  tr.sel td { background: #243056; }
  .up, .pos { color: var(--gain); } .dn, .neg { color: var(--lose); } .mut { color: var(--dim); } .gold { color: var(--gold); }
  .pane { background: var(--card); border: 1px solid var(--line); border-radius: 12px; min-height: 640px; max-height: calc(100vh - 140px); overflow: auto; padding: 16px 18px 22px; position: sticky; top: 10px; }
  .pane h2 { margin: 0 0 6px; font-size: 22px; }
  .kv { display: grid; grid-template-columns: 128px 1fr; gap: 5px 10px; color: var(--dim); margin: 8px 0 12px; }
  .kv b { color: var(--txt); font-weight: 600; }
  .empty { color: var(--dim); padding-top: 80px; text-align: center; }
  .meta { color: var(--dim); font-size: 12px; padding: 0 22px 8px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin: 0 2px; vertical-align: middle; background: #3a445c; }
  .dot.good { background: #4ade80; } .dot.bad { background: #f87171; } .dot.neutral { background: #fbbf24; } .dot.missing { background: #3a445c; }
  .cam { display: inline-block; margin: 2px 3px 2px 0; padding: 1px 7px; border: 1px solid var(--line); border-radius: 999px; font-size: 11px; }
  .cam.pos { color: var(--gain); border-color: #2d6a4f; } .cam.neg { color: var(--lose); border-color: #7f1d1d; } .cam.neu { color: var(--gold); } .cam.miss { color: var(--dim); }
  .why { background: #101628; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  .why ul { margin: 6px 0 0; padding-left: 18px; }
  .caught { background: #101628; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 8px 0; white-space: pre-wrap; word-break: break-word; font: 13px/1.45 ui-monospace, Menlo, monospace; }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 12px; }
  @media (max-width: 700px) { .cmp { grid-template-columns: 1fr; } }
  .box { background: #101628; border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .box h3 { margin: 0 0 6px; font-size: 13px; color: var(--dim); font-weight: 650; }
</style>
</head>
<body>
<header>
  <h1>Day movers — gainers / losers</h1>
  <div class="sub">Investigator companion · click a name for the full 09:30 card ·
    <a href="../hard-red-exceptions/">investigator</a> ·
    <a href="../day-board/">day board</a> ·
    <a href="../factor-mine/">factor mine</a></div>
</header>
<div class="row">
  <button id="first">&lt;&lt;</button><button id="prev">&lt;</button>
  <strong id="date">—</strong>
  <button id="next">&gt;</button><button id="last">&gt;&gt;</button>
  <div class="tog" id="side">
    <button data-v="gainers" class="on">Gainers</button>
    <button data-v="losers">Losers</button>
  </div>
  <div class="tog" id="clock">
    <button data-v="interday" class="on">Interday</button>
    <button data-v="intraday">Intraday</button>
  </div>
</div>
<div class="meta" id="meta"></div>
<div class="banner" id="banner"></div>
<div class="layout">
  <table>
    <thead><tr><th>#</th><th>Ticker</th><th>Move</th><th>Open</th><th>Close</th><th>Prior</th><th>S</th><th>Cam</th><th>Idio</th></tr></thead>
    <tbody id="body"></tbody>
  </table>
  <aside class="pane" id="pane">
    <div class="empty">Click a name. The pane loads that morning’s full investigator card — cameras vs yesterday and whatever text was caught.</div>
  </aside>
</div>
<script>
const CAM_ORDER = ['join','sector','gen','news','digest','judge','ab','peer','heat','vol','catal','buy','yday'];
const CAM_SHORT = {join:'join',sector:'sect',gen:'gen',news:'news',digest:'dig',judge:'jdg',ab:'AB',peer:'peer',heat:'heat',vol:'vol',catal:'cat',buy:'buy',yday:'yd'};
const STATE = { dates: [], i: 0, side: 'gainers', clock: 'interday', sel: null, meta: null, day: null };
const $ = (id) => document.getElementById(id);
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pct(v) { if (v == null || !isFinite(v)) return '—'; const s = (v >= 0 ? '+' : '') + Number(v).toFixed(2) + '%'; return `<span class="${v>=0?'up':'dn'}">${s}</span>`; }
function num(v) { return v == null || !isFinite(Number(v)) ? '—' : v; }
function px(v) { return v == null || !isFinite(Number(v)) ? '—' : Number(v).toFixed(2); }
function dots(boxes) {
  return CAM_ORDER.map(k => { const t = String((boxes||{})[k] || 'missing'); return `<span class="dot ${esc(t)}" title="${esc(k)} ${esc(t)}"></span>`; }).join('');
}
function chips(boxes) {
  return CAM_ORDER.map(k => { const t = String((boxes||{})[k] || 'missing'); const cls = t==='good'?'pos':t==='bad'?'neg':t==='neutral'?'neu':'miss'; return `<span class="cam ${cls}">${esc(CAM_SHORT[k]||k)} ${esc(t)}</span>`; }).join('');
}
function litList(boxes, want) { return CAM_ORDER.filter(k => (boxes||{})[k] === want).map(k => CAM_SHORT[k]||k); }
function camDiff(today, yday) {
  const t = today || {}, y = yday || {}, changed = [];
  for (const k of CAM_ORDER) { const a = t[k] || 'missing', b = y[k] || 'missing'; if (a !== b) changed.push(`${CAM_SHORT[k]||k}: ${b} → ${a}`); }
  return changed;
}
function renderTable() {
  const d = STATE.meta, day = STATE.day || {};
  if (!d) return;
  const date = STATE.dates[STATE.i];
  $('date').textContent = date;
  const rows = (((day[STATE.side] || {})[STATE.clock]) || []);
  $('meta').textContent = `${d.n_tickers_scanned} histories · ${d.from_date} → ${d.to_date} · ${day.n || 0} names this morning · S=${day.s ?? '—'} · top ${d.top_n}`;
  const banner = $('banner');
  if (STATE.clock === 'intraday') { banner.className = 'banner show'; banner.textContent = 'Intraday = same-session open → close. Not knowable at 09:30. Autopsy only.'; }
  else if (!rows.length) { banner.className = 'banner show'; banner.textContent = 'Interday needs a prior close. First packed session has no gap rank.'; }
  else { banner.className = 'banner show'; banner.textContent = 'Interday = prior close → today’s 09:30 open. Legal at the bell.'; }
  const key = STATE.clock === 'intraday' ? 'intra' : 'inter';
  $('body').innerHTML = rows.map((r, i) => `
    <tr data-i="${i}" class="${STATE.sel===i?'sel':''}">
      <td>${i+1}</td><td><strong>${r.t}</strong></td><td>${pct(r[key])}</td>
      <td>${num(r.o)}</td><td>${num(r.c)}</td><td>${num(r.pc)}</td>
      <td>${num(r.s)}</td><td>${r.cams || ('+' + (r.np??'?') + ' −' + (r.nn??'?'))}</td><td>${num(r.idio)}</td>
    </tr>`).join('') || `<tr><td colspan="9">No ${STATE.clock} ${STATE.side} for ${date}.</td></tr>`;
  document.querySelectorAll('#body tr[data-i]').forEach(tr => {
    tr.onclick = () => { STATE.sel = +tr.dataset.i; renderTable(); loadPane(rows[STATE.sel]); };
  });
}
function sessionBlock(title, r) {
  if (!r) return `<div class="box"><h3>${esc(title)}</h3><div class="mut">No prior session in the pack.</div></div>`;
  const sit = r.hard_red || (typeof r.s === 'number' && r.s <= -3);
  return `<div class="box">
    <h3>${esc(title)} · ${esc(r.date)}${sit?' <span class="neg">SIT</span>':''}</h3>
    <div>${dots(r.boxes)}</div>
    <div style="margin-top:6px">${chips(r.boxes)}</div>
    <div class="mut" style="margin-top:6px">
      ${r.on_list?'list':(r.reconstructed?'recon':'—')}
      · cams ${esc(r.cams||('+'+(r.n_pos??'?')+' −'+(r.n_neg??'?')))}
      · idio ${num(r.idio)} · S ${num(r.s)}
      · open ${px(r.open)} → close ${px(r.close)} (${r.day_pct==null?'—':((r.day_pct>=0?'+':'')+Number(r.day_pct).toFixed(2)+'%')})
    </div></div>`;
}
function loadPane(listRow) {
  const date = STATE.dates[STATE.i];
  if (!listRow) return;
  $('pane').innerHTML = `<div class="empty">Loading ${esc(listRow.t)} ${esc(date)}…</div>`;
  fetch('../hard-red-exceptions/t/' + encodeURIComponent(listRow.t) + '.json').then(r => {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then(doc => {
    const rows = doc.rows || [];
    const idx = rows.findIndex(x => x.date === date);
    const r = idx >= 0 ? rows[idx] : null;
    const prev = idx > 0 ? rows[idx-1] : null;
    if (!r) { $('pane').innerHTML = `<div class="empty">No investigator row for ${esc(listRow.t)} on ${esc(date)}.</div>`; return; }
    const good = litList(r.boxes, 'good'), bad = litList(r.boxes, 'bad');
    const neu = litList(r.boxes, 'neutral'), miss = litList(r.boxes, 'missing');
    const changed = camDiff(r.boxes, prev && prev.boxes);
    const legal = STATE.clock === 'interday' && listRow.inter != null;
    const caught = r.news && String(r.news).trim();
    $('pane').innerHTML = `
      <h2>${esc(doc.ticker)} <span class="sub">${esc(date)} 09:30</span></h2>
      <div class="mut">${r.on_list?'on shopping list':'reconstructed — not on the lists'}
        · <a href="../hard-red-exceptions/#${encodeURIComponent(doc.ticker)}">full history</a></div>
      <div class="kv">
        <div>Move intra / inter</div><b>${listRow.intra==null?'—':((listRow.intra>=0?'+':'')+listRow.intra.toFixed(2)+'%')} / ${listRow.inter==null?'—':((listRow.inter>=0?'+':'')+listRow.inter.toFixed(2)+'%')}</b>
        <div>Open → close</div><b>${px(r.open)} → ${px(r.close)} (${r.day_pct==null?'—':((r.day_pct>=0?'+':'')+Number(r.day_pct).toFixed(2)+'%')})</b>
        <div>Prior close</div><b>${px(listRow.pc)}</b>
        <div>Weather S</div><b>${num(r.s)}${r.hard_red?' · SIT':''}</b>
        <div>Idio / lean</div><b>${num(r.idio)}</b>
        <div>H1 / H3 / H5</div><b>${r.h1==null?'—':((r.h1>=0?'+':'')+Number(r.h1).toFixed(2)+'%')} ${r.h1_px!=null?'@'+px(r.h1_px):''} · ${r.h3==null?'—':((r.h3>=0?'+':'')+Number(r.h3).toFixed(2)+'%')} · ${r.h5==null?'—':((r.h5>=0?'+':'')+Number(r.h5).toFixed(2)+'%')}</b>
        <div>E / R</div><b>${esc(r.e_label||r.e_pol||'—')} / ${esc(r.r_label||r.r_pol||'—')}</b>
        <div>RSI / MACD</div><b>${esc(r.rsi??'—')} / ${esc(r.macd_hist??'—')}</b>
        <div>Legal at 09:30?</div><b>${legal?'yes — interday gap':'no — close print or missing prior'}</b>
      </div>
      <div class="cmp">${sessionBlock('Today', r)}${sessionBlock('Yesterday', prev)}</div>
      <div class="why">
        <b>What lit today</b>
        <div>good: ${good.length?good.map(esc).join(', '):'—'}</div>
        <div>bad: ${bad.length?bad.map(esc).join(', '):'—'}</div>
        <div>neutral: ${neu.length?neu.map(esc).join(', '):'—'}</div>
        <div class="mut">missing: ${miss.length?miss.map(esc).join(', '):'—'}</div>
        <div style="margin-top:8px"><b>vs yesterday</b> ${changed.length?('<ul>'+changed.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'):'<div class="mut">no prior row, or every camera unchanged</div>'}</div>
      </div>
      <div class="caught"><b>Caught text</b> ${r.news_tone && r.news_tone!=='missing' ? '('+esc(r.news_tone)+')' : ''}<br>${caught?esc(caught):'<span class="mut">No headline / payload stored. News camera is '+(r.boxes&&r.boxes.news?esc(r.boxes.news):'missing')+'.</span>'}</div>
      <div class="why"><b>Why / files</b>
        <div class="mut">files: ${esc((r.files||[]).join(' · ')||'—')}</div>
        <div class="mut">sources: ${esc((r.sources||[]).join(', ')||'—')}</div>
        <ul>${(r.why||[]).map(x=>'<li>'+esc(x)+'</li>').join('')}</ul>
      </div>`;
  }).catch(err => {
    $('pane').innerHTML = `<div class="empty">Could not load investigator file for ${esc(listRow.t)}.<br>${esc(err)}</div>`;
  });
}
function bindTog(id, field) {
  $(id).querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
      $(id).querySelectorAll('button').forEach(b => b.classList.toggle('on', b===btn));
      STATE[field] = btn.dataset.v; STATE.sel = null;
      $('pane').innerHTML = '<div class="empty">Click a name.</div>';
      renderTable();
    };
  });
}
bindTog('side', 'side'); bindTog('clock', 'clock');
function loadDay() {
  const date = STATE.dates[STATE.i]; if (!date) return;
  fetch('./d/' + date + '.json').then(r => r.json()).then(day => {
    STATE.day = day; STATE.sel = null;
    $('pane').innerHTML = '<div class="empty">Click a name. The pane loads that morning’s full investigator card.</div>';
    renderTable();
  }).catch(err => { STATE.day = { n: 0, gainers: {}, losers: {} }; $('meta').textContent = 'Failed to load ' + date + ': ' + err; renderTable(); });
}
$('first').onclick = () => { STATE.i = 0; loadDay(); };
$('last').onclick = () => { STATE.i = STATE.dates.length-1; loadDay(); };
$('prev').onclick = () => { STATE.i = Math.max(0, STATE.i-1); loadDay(); };
$('next').onclick = () => { STATE.i = Math.min(STATE.dates.length-1, STATE.i+1); loadDay(); };
fetch('./index.json').then(r => r.json()).then(d => {
  STATE.meta = d; STATE.dates = d.dates || []; STATE.i = Math.max(0, STATE.dates.length-1); loadDay();
}).catch(err => { $('meta').textContent = 'Failed to load index.json: ' + err; });
</script>
</body>
</html>
